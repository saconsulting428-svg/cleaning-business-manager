<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05030c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Street Clash - Fighting Game</title>
<style>
html,body{margin:0;height:100%;background:#05030c;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#000}
#touch{position:fixed;left:0;right:0;bottom:0;height:46%;display:none;pointer-events:none;z-index:5}
#touch .b{position:absolute;pointer-events:auto;width:15vmin;height:15vmin;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);color:#fff;font:700 4.5vmin sans-serif;display:flex;align-items:center;justify-content:center;opacity:.85}
#touch .b.on{background:rgba(255,255,255,.4)}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="touch"></div>
<script src="chars.js"></script>
<script src="game.js"></script>
<script src="stages.js"></script>
<script>boot()</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
