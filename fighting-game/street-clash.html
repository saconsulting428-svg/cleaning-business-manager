function shade(c,k){
  let r,g,b;
  if(c[0]==='#'){const n=parseInt(c.slice(1),16);r=n>>16;g=n>>8&255;b=n&255}
  else{const m=c.match(/[\d.]+/g);r=+m[0];g=+m[1];b=+m[2]}
  if(k<1){r*=k;g*=k;b*=k}else{r+=(255-r)*(k-1);g+=(255-g)*(k-1);b+=(255-b)*(k-1)}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}

const FBTYPES={orb:{v:10,dmg:8,r:34,life:140},wave:{v:7,dmg:11,r:48,life:150},dart:{v:16,dmg:6,r:24,life:100}};

/* ---------- drawing helpers ---------- */
function tseg(a,b,w1,w2,col,fl){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;let nx=-dy/L,ny=dx/L;if(ny>0){nx=-nx;ny=-ny}
  const g=ctx.createLinearGradient(a.x+nx*w1/2,a.y+ny*w1/2,a.x-nx*w1/2,a.y-ny*w1/2);
  g.addColorStop(0,fl?'#fff':shade(col,1.2));g.addColorStop(.45,fl?'#fff':col);g.addColorStop(1,fl?'#e6e6e6':shade(col,.6));
  ctx.beginPath();ctx.moveTo(a.x+nx*w1/2,a.y+ny*w1/2);ctx.lineTo(b.x+nx*w2/2,b.y+ny*w2/2);ctx.lineTo(b.x-nx*w2/2,b.y-ny*w2/2);ctx.lineTo(a.x-nx*w1/2,a.y-ny*w1/2);ctx.closePath();
  ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.arc(b.x,b.y,w2/2,0,TAU);ctx.fillStyle=fl?'#fff':col;ctx.fill();
}
const lp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
function drawLeg(hip,knee,foot,back,d,fl){
  const w=d.w,sk=back?shade(d.sk,.78):d.sk,pc=back?shade(d.pc,.76):d.pc,sc=back?shade(d.sc,.76):d.sc;
  const gi=d.pt==='gi',sh=d.pt==='shorts',kw=gi?1.2:1;
  if(sh){
    tseg(hip,knee,21*w,15*w,sk,fl);tseg(knee,foot,15*w,10.5*w,sk,fl);
    tseg(hip,lp(hip,knee,.62),24*w,21*w,pc,fl);
  }else{
    tseg(hip,knee,21*w*kw,15.5*w*kw,pc,fl);tseg(knee,foot,15*w*kw,gi?13*w:10.5*w,pc,fl);
    if(d.pt==='cargo'){const p=lp(hip,knee,.45);ctx.fillStyle=fl?'#fff':shade(pc,.8);ctx.fillRect(p.x-5,p.y-4,11,10)}
    if(gi){ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1.5;ctx.beginPath();const p=lp(knee,foot,.5);ctx.moveTo(p.x-7,p.y);ctx.lineTo(p.x+6,p.y+3);ctx.stroke()}
  }
  const fx=foot.x,fy=foot.y;
  if(d.shoe==='bare'){ctx.beginPath();ctx.ellipse(fx+6,fy-3.5,12,6,0,0,TAU);ctx.fillStyle=fl?'#fff':sk;ctx.fill()}
  else{
    if(d.shoe==='boot')tseg(lp(knee,foot,.55),foot,13*w,12*w,sc,fl);
    ctx.beginPath();ctx.ellipse(fx+7,fy-4,14,7,0,0,TAU);ctx.fillStyle=fl?'#fff':sc;ctx.fill();
    ctx.fillStyle=fl?'#fff':(d.shoe==='sneaker'?'#f4f4f4':shade(sc,.55));ctx.fillRect(fx-6,fy-2,26,3);
  }
}
function drawArm(sh,m,e,back,d,fl){
  const w=d.w,sk=back?shade(d.sk,.78):d.sk,tc=back?shade(d.tc,.76):d.tc;
  let su=0,sf=0;
  switch(d.top){case'tee':su=.6;break;case'jacket':case'hoodie':su=1;sf=1;break;case'gi':su=1;sf=.5;break;case'armor':su=1;break}
  tseg(sh,m,13.5*w,10.5*w,sk,fl);tseg(m,e,10.5*w,8*w,sk,fl);
  if(d.tat&&!back){ctx.strokeStyle=d.tat;ctx.lineWidth=2;ctx.beginPath();const p=lp(sh,m,.4),q=lp(sh,m,.8);ctx.moveTo(p.x-5,p.y);ctx.lineTo(q.x+4,q.y+3);ctx.moveTo(p.x+4,p.y-2);ctx.lineTo(q.x-4,q.y+2);ctx.stroke()}
  if(su)tseg(sh,su>=1?m:lp(sh,m,su),16*w,su>=1?13*w:14*w,tc,fl);
  if(sf)tseg(m,lp(m,e,sf),12.5*w,sf>=1?11*w:14*w,tc,fl);
  if(d.ac==='gauntlets'||d.top==='armor'){tseg(lp(m,e,.25),lp(m,e,.95),12.5*w,11*w,back?'#6d727b':'#a4aab4',fl);ctx.fillStyle=fl?'#fff':d.fc;ctx.beginPath();const c=lp(m,e,.6);ctx.arc(c.x,c.y,2,0,TAU);ctx.fill()}
  if(d.gl==='wrap'){tseg(lp(m,e,.4),lp(m,e,.95),12*w,11*w,'#efe9d8',fl)}
  const glove=d.gl&&d.gl!=='wrap'?(back?shade(d.gl,.78):d.gl):null,r=glove?9.5:7.8;
  const gg=ctx.createRadialGradient(e.x-2,e.y-3,1,e.x,e.y,r+2);gg.addColorStop(0,fl?'#fff':shade(glove||sk,1.25));gg.addColorStop(1,fl?'#fff':shade(glove||sk,.72));
  ctx.beginPath();ctx.arc(e.x,e.y,r,0,TAU);ctx.fillStyle=gg;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.2;ctx.stroke();
}
function drawTorso(P,d,fl,f){
  const {sh,hip}=P,w=d.w,fem=d.g==='f',top=d.top;
  const sw=(fem?15.5:19)*w,ww=(fem?10.5:13.5)*w,hw=(fem?14:14)*w;
  const mid=lp(sh,hip,.55);
  const path=(ext)=>{ctx.beginPath();ctx.moveTo(sh.x-sw,sh.y+3);ctx.lineTo(sh.x+sw,sh.y+3);ctx.lineTo(mid.x+ww,mid.y);ctx.lineTo(hip.x+hw,hip.y+(ext||0));ctx.lineTo(hip.x-hw,hip.y+(ext||0));ctx.lineTo(mid.x-ww,mid.y);ctx.closePath()};
  const grad=(c,k)=>{const g=ctx.createLinearGradient(sh.x-sw,0,sh.x+sw,0);g.addColorStop(0,fl?'#fff':shade(c,.58));g.addColorStop(.5,fl?'#fff':c);g.addColorStop(1,fl?'#fff':shade(c,1.22));return g};
  const dark='rgba(0,0,0,.3)';
  const muscle=()=>{
    ctx.strokeStyle=dark;ctx.lineWidth=1.8;ctx.beginPath();
    ctx.moveTo(sh.x-sw*.7,sh.y+17);ctx.quadraticCurveTo(sh.x+sw*.1,sh.y+27,sh.x+sw*.95,sh.y+16);ctx.stroke();
    if(!fem){for(let i=0;i<3;i++){const y=lerp(sh.y+32,hip.y-8,i/2.6),x=lerp(sh.x,hip.x,(y-sh.y)/(hip.y-sh.y));ctx.beginPath();ctx.moveTo(x-5*w,y);ctx.lineTo(x+7*w,y);ctx.stroke()}
      ctx.beginPath();ctx.moveTo(sh.x+2,sh.y+30);ctx.lineTo(hip.x+2,hip.y-6);ctx.stroke()}
  };
  const tatt=()=>{if(d.tat){ctx.strokeStyle=d.tat;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(sh.x-sw*.6,sh.y+9);ctx.quadraticCurveTo(sh.x-sw*.2,sh.y+22,sh.x-sw*.5,sh.y+34);ctx.moveTo(sh.x-sw*.3,sh.y+8);ctx.lineTo(sh.x-sw*.7,sh.y+24);ctx.stroke()}};
  // skin base
  path();ctx.fillStyle=grad(d.sk);ctx.fill();
  if(top==='bare'||top==='vest'){muscle();tatt()}
  const cloth=(ext)=>{path(ext);ctx.fillStyle=grad(d.tc);ctx.fill()};
  switch(top){
    case'tank':case'tee':case'crop':{
      cloth();
      ctx.fillStyle=fl?'#fff':d.sk;ctx.beginPath();ctx.moveTo(sh.x+3,sh.y+3);ctx.lineTo(sh.x+11*w,sh.y+3);ctx.lineTo(sh.x+7,sh.y+15);ctx.closePath();ctx.fill();
      if(top==='crop'||fem&&top==='tank'&&false){const y=lerp(sh.y,hip.y,.62);ctx.beginPath();ctx.moveTo(mid.x-ww-1,y);ctx.lineTo(mid.x+ww+1,y);ctx.lineTo(hip.x+hw,hip.y);ctx.lineTo(hip.x-hw,hip.y);ctx.closePath();ctx.fillStyle=grad(d.sk);ctx.fill();ctx.fillStyle=dark;ctx.fillRect(hip.x-1,y+2,2,hip.y-y-6)}
      break}
    case'vest':{
      cloth();
      ctx.beginPath();ctx.moveTo(sh.x+1,sh.y+3);ctx.lineTo(sh.x+sw*.5,sh.y+3);ctx.lineTo(hip.x+hw*.2,hip.y);ctx.lineTo(hip.x-hw*.15,hip.y);ctx.closePath();ctx.fillStyle=grad(d.sk);ctx.fill();muscle();
      ctx.strokeStyle=fl?'#fff':shade(d.tc,.5);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sh.x+1,sh.y+3);ctx.lineTo(hip.x-hw*.15,hip.y);ctx.stroke();break}
    case'jacket':{
      cloth(5);
      ctx.strokeStyle=fl?'#fff':'rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sh.x+4,sh.y+4);ctx.lineTo(hip.x+3,hip.y+4);ctx.stroke();
      ctx.fillStyle=fl?'#fff':d.fc;ctx.globalAlpha=.8;ctx.fillRect(sh.x-sw+1,sh.y+3,3,hip.y-sh.y);ctx.globalAlpha=1;
      ctx.fillStyle=fl?'#fff':shade(d.tc,.7);ctx.beginPath();ctx.moveTo(sh.x-6,sh.y-1);ctx.lineTo(sh.x+10,sh.y-1);ctx.lineTo(sh.x+5,sh.y+10);ctx.lineTo(sh.x-4,sh.y+8);ctx.closePath();ctx.fill();
      ctx.fillStyle=fl?'#fff':d.sk;ctx.beginPath();ctx.moveTo(sh.x+4,sh.y+3);ctx.lineTo(sh.x+9,sh.y+3);ctx.lineTo(sh.x+6,sh.y+11);ctx.closePath();ctx.fill();break}
    case'gi':{
      cloth(3);
      ctx.fillStyle=fl?'#fff':d.sk;ctx.beginPath();ctx.moveTo(sh.x-3,sh.y+3);ctx.lineTo(sh.x+12,sh.y+3);ctx.lineTo(hip.x+5,mid.y+8);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sh.x-3,sh.y+3);ctx.lineTo(hip.x+5,mid.y+8);ctx.lineTo(sh.x+12,sh.y+3);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sh.x+12,sh.y+3);ctx.lineTo(hip.x-4,mid.y+14);ctx.stroke();break}

}

      case'jkick':fx=lerp(24,80,e);ffy=lerp(34,14,e);bfy=34;bx=-10;lean=-5;fh={x:14,y:-18};bh={x:-10,y:-6};break;

function resolveHits(){

function aiInput(f,o){
  const I={left:0,right:0,up:0,down:0,p:0,k:0,s:0,u:0,dashF:0,dashB:0};
  if(R.phase!=='fight')return I;
  const A=f.ai,L=aiLevel(),dx=o.x-f.x,dist=Math.abs(dx),tw=dx>0?1:-1;
  const fwd=tw>0?'right':'left',back=tw>0?'left':'right';
  A.t--;A.blockT--;A.cool--;
  const om=o.state==='attack'?MV[o.mv]:null;
  // react to a fresh attack
  if(om&&o.fr===1&&dist<190&&om.box&&Math.random()<L.block){A.blockT=18+((om.su+om.ac)|0);A.low=om.lvl==='l'}
  for(const p of PR){
    if(p.o!==f&&A.reactP<=0&&Math.abs(p.x-f.x)<230&&Math.sign(f.x-p.x)===Math.sign(p.vx)){
      A.reactP=50;
      if(Math.random()<L.block){A.blockT=24;A.low=false}else if(Math.random()<.5)A.plan='jump',A.t=25;
    }
  }
  A.reactP--;
  if(om&&om.box&&o.fr>om.su+om.ac+2&&dist<115&&Math.random()<L.punish*.25){A.blockT=0;I.p=1;if(Math.random()<.4){I.p=0;I.k=1}return I}
  if(A.blockT>0){I[back]=1;if(A.low)I.down=1;return I}
  if(f.state==='attack'){
    const m=MV[f.mv];
    if(m.next&&f.mvHit&&f.fr>=m.su+m.ac&&Math.random()<L.chain*.35){for(const k in m.next)I[k]=1}
    return I;
  }
  if(f.meter>=100&&dist<420&&Math.random()<.03){I.u=1;return I}
  if(f.y>0){if(A.plan==='jump'&&dist<170&&Math.random()<.4)I.k=1;return I}
  if(o.y>60&&dist<130&&Math.random()<.5){I.down=1;I.p=1;return I}
  if(A.t<=0){
    const r=Math.random();A.t=Math.round(rnd(10,26)/Math.sqrt(L.aggr));
    if(dist>330){A.plan=r<.45?'approach':r<.45+.18*L.fire?'fire':r<.75?'jump':r<.88?'dash':'wait'}
    else if(dist>150){A.plan=r<.45?'approach':r<.6?'poke':r<.7*L.aggr?'dash':r<.8?'fire':r<.9?'jump':'wait'}
    else{A.plan=r<.62*L.aggr/1.2?'atk':r<.78?'retreat':r<.9?'guard':'wait'}
  }
  switch(A.plan){
    case'approach':if(dist>100)I[fwd]=1;else A.t=0;break;
    case'retreat':I[back]=1;break;
    case'guard':I[back]=1;break;
    case'dash':I.dashF=1;A.plan='wait';break;
    case'jump':if(f.y<=0){I.up=1;I[fwd]=1}A.plan='wait';break;
    case'fire':I.s=1;A.plan='wait';break;
    case'poke':if(dist<135){const r=Math.random();if(r<.5)I.k=1;else if(r<.8){I.down=1;I.k=1}else I.p=1;A.plan='wait'}else I[fwd]=1;break;
    case'atk':{const r=Math.random();

function humanInput(f){

/* ---------------- fighter update ---------------- */
function updFighter(f,o){
  f.t++;
  const I=f.inp;
  for(const k in f.buf)if(f.buf[k]>0)f.buf[k]--;
  if(f.invuln>0)f.invuln--;if(f.flash>0)f.flash--;if(f.fireCool>0)f.fireCool--;
  const grounded=f.y<=0&&f.vy<=0,backHeld=f.facing>0?I.left:I.right;
  f.back=!!backHeld;
  if(f.state==='free'||f.state==='dash'){}else f.blocking=false;
  switch(f.state){
    case'free':
      if(grounded){
        f.airAtk=false;f.facing=o.x>=f.x?1:-1;f.crouch=!!I.down;f.blocking=!!backHeld;
        if(startAttack(f))break;
        const spd=f.def.spd;
        if(I.dashF||I.dashB){f.state='dash';f.st=13;f.vx=f.facing*(I.dashF?11:-9)*spd;dust(f.x,0,4);sfx('whoosh');f.crouch=false}
        else if(I.up&&!f.crouch){f.vy=16.5;f.vx=((I.right?1:0)-(I.left?1:0))*4.4*spd;f.y=.1;sfx('jump');dust(f.x,0,3)}
        else if(!f.crouch){const dir=(I.right?1:0)-(I.left?1:0);f.vx=dir*(dir===f.facing?4.4:3.4)*spd;f.walk+=f.vx*f.facing*.065}
        else f.vx*=.7;
      }else{
        f.crouch=false;f.blocking=false;
        if(!f.airAtk&&(f.buf.p||f.buf.k)){startMove(f,'jkick');f.airAtk=true}
      }
      break;
    case'dash':f.st--;if(f.st<6&&startAttack(f))break;if(f.st<=0){f.state='free';f.vx*=.3}break;
    case'attack':{
      const m=MV[f.mv];f.fr++;
      if(f.fr===1){if(m.step)f.vx=f.facing*m.step;if(f.mv!=='fire'&&f.mv!=='sup')sfx('whoosh');
        if(f.mv==='sup'){freeze=Math.max(freeze,34);flashT=34;sfx('sup')}}
      if(f.mv==='fire'&&f.fr===m.su){{const fb=FBTYPES[f.def.fb];PR.push({x:f.x+f.facing*50,y:f.y+95,vx:f.facing*fb.v,o:f,t:0,c:f.def.fc,ty:f.def.fb,r:fb.r,life:fb.life,dmg:fb.dmg})}f.fireCool=36;sfx('fire');spark(f.x+f.facing*50,-f.y-95,8,f.def.c2,6)}
      if(m.next&&f.mvHit&&f.fr>=m.su+m.ac){
        for(const k in m.next)if(f.buf[k]>0){startMove(f,m.next[k]);break}
      }
      if(f.state==='attack'&&f.fr>=m.su+m.ac+m.rc&&!m.air){f.state='free';f.mv=null;f.crouch=false}
      else if(f.state==='attack'&&m.air&&f.fr>=m.su+m.ac+m.rc&&grounded){f.state='free';f.mv=null}
      break}
    case'hit':
      if(!f.launched){f.st--;if(f.st<=0){f.state='free'}}
      break;
    case'block':f.st--;if(f.st<=0)f.state='free';break;
    case'down':
      if(!f.ko){f.st--;if(f.st<=0){f.state='wake';f.st=16;f.invuln=16}}
      break;
    case'wake':f.st--;if(f.st<=0)f.state='free';break;
    case'win':break;
  }
  if(f.state==='free'&&grounded)f.hitsTaken=0;
  // rotation target
  let tr=0,rate=.25;
  if(f.state==='hit')tr=f.launched?-1.3:-.18;
  else if(f.state==='down'){tr=-Math.PI/2;rate=.33}
  f.rot+=(tr-f.rot)*rate;if(Math.abs(f.rot)<.01)f.rot=0;
  // physics
  f.x+=f.vx;
  if(f.y>0||f.vy>0){
    f.vy-=GRAV;f.y+=f.vy;
    if(f.y<=0){f.y=0;f.vy=0;onLand(f)}
  }else{
    if(f.state!=='free'&&f.state!=='dash')f.vx*=.84;
  }
  f.x=clamp(f.x,70,WORLD-70);
  if(f.state==='win'||f.state==='wake'){}
}
function onLand(f){
  dust(f.x,0,5);sfx('land');
  if(f.launched){f.launched=false;f.state='down';f.st=f.ko?9999:42;f.vx*=.5;shake=Math.max(shake,7);dust(f.x,0,6)}
  else if(f.state==='attack'&&MV[f.mv].air){f.state='free';f.mv=null;f.vx*=.3}
  else if(f.state==='free')f.vx*=.3;
}
function updProjectiles(){
  for(let i=PR.length-1;i>=0;i--){
    const p=PR[i];p.x+=p.vx;p.t++;
    const d=F[1-p.o.i];let dead=p.x<20||p.x>WORLD-20||p.t>p.life;
    if(!dead){
      for(const q of PR)if(q!==p&&q.o!==p.o&&Math.abs(q.x-p.x)<34&&Math.abs(q.y-p.y)<34){
        q.t=999;dead=true;spark(p.x,-p.y,18,'#fff',10);ring(p.x,-p.y,50,'#fff',16);sfx('heavy');shake=Math.max(shake,5)}
    }
    if(!dead&&Math.abs(p.x-d.x)<p.r&&p.y>d.y-18&&p.y<d.y+hh(d)&&d.invuln<=0&&d.state!=='down'&&!d.ko){
      applyHit(p.o,d,Object.assign({},MV.proj,{dmg:p.dmg,kb:p.ty==='wave'?9:p.ty==='dart'?5:7}),p.x,-p.y);dead=true;
    }
    if(dead)PR.splice(i,1);
  }
}

/* ---------------- main update ---------------- */
function update(){
  G.f++;
  if(freeze>0){freeze--;updParts();updCam();return}
  const fighting=R.phase==='fight';
  R.pt++;
  for(const f of F){
    const o=F[1-f.i];
    let I;
    if(f.cpu){I=aiInput(f,o);if(fighting)for(const k of['p','k','s','u'])if(I[k])f.buf[k]=6}
    else if(fighting)I=humanInput(f);
    else{I={left:0,right:0,up:0,down:0,dashF:0,dashB:0};f.buf.p=f.buf.k=f.buf.s=f.buf.u=0}
    f.inp=I;
  }
  if(R.phase==='prelude'){if(R.pt>=150){R.phase='intro';R.pt=0}}
  else if(R.phase==='intro'){if(R.pt===1)sfx('round');if(R.pt===80)sfx('fight');if(R.pt>=130){R.phase='fight';R.pt=0}}
  else if(fighting){R.timer--;if(R.timer<=0){R.timer=0;endRound('time')}}
  else if(R.phase==='match'){if(G.mode===0&&R.winner!==0&&R.pt>700)toTitle()}
  else if(R.phase==='ko'){
    ts=R.pt<70?.35:1;
    if(R.pt>60){for(const f of F)if(f.state==='free'&&f.y<=0&&R.winner===f.i)f.state='win'}
    if(R.pt>=170){ts=1;nextRound()}
  }
  for(const f of F)updFighter(f,F[1-f.i]);
  resolveHits();
  updProjectiles();
  // push apart
  const [a,b]=F;
  if(a.y<90&&b.y<90&&a.state!=='down'&&b.state!=='down'){
    const gap=Math.abs(a.x-b.x);
    if(gap<48){const push=(48-gap)/2,s=a.x<=b.x?1:-1;a.x-=s*push;b.x+=s*push;
      if(a.x<=70){a.x=70;b.x=a.x+48}else if(a.x>=WORLD-70){a.x=WORLD-70;b.x=a.x-48}
      if(b.x<=70){b.x=70;a.x=b.x+48}else if(b.x>=WORLD-70){b.x=WORLD-70;a.x=b.x-48}}
  }
  const dd=Math.abs(a.x-b.x);
  if(dd>MAXD){const ex=(dd-MAXD)/2,s=a.x<b.x?1:-1;a.x+=s*ex;b.x-=s*ex}
  for(const f of F){f.trail=f.hp<f.trail?Math.max(f.hp,f.trail-.35):f.hp}
  for(let i=0;i<2;i++)if(combos[i]&&--combos[i].t<=0)combos[i]=null;
  shake*=.84;if(flashT>0)flashT--;
  updParts();updCam();
}
function updCam(){
  const [a,b]=F,mx=(a.x+b.x)/2,d=Math.abs(a.x-b.x);
  const tz=clamp(840/(d+340),.86,1.2);
  cam.z=lerp(cam.z,tz,.08);
  const lim=480/cam.z;
  cam.x=clamp(lerp(cam.x,mx,.14),lim,WORLD-lim);
}
function nextRound(){
  if(R.demo){startRound();return}
  if(R.wins[0]>=2||R.wins[1]>=2||R.n>=5){
    R.phase='match';R.pt=0;
    R.winner=R.wins[0]>R.wins[1]?0:R.wins[1]>R.wins[0]?1:-1;
    if(G.mode===0&&R.winner===0){saveBest(G.arc.level);if(G.arc.level>=10){startEnding();return}}
    return;
  }
  R.n++;startRound();
}
function startRound(first){
  R.phase=(first&&!R.demo&&G.mode===0)?'prelude':'intro';R.pt=0;R.timer=99*60;R.banner='';ts=1;
  if(!R.demo&&G.mode!==0)R.stage=(R.sbase+R.n-1)%10;
  PR=[];parts=[];combos=[null,null];
  resetFighter(F[0],WORLD/2-150,1);resetFighter(F[1],WORLD/2+150,-1);
  cam.x=WORLD/2;cam.z=1;
}
function startMatch(demo){
  const s=G.sel;let opp=s[1];
  if(!demo&&G.mode===0)opp=G.arc.opps[G.arc.level-1];
  F=[mkFighter(0,ROSTER[s[0]],!!demo),mkFighter(1,ROSTER[opp],!!demo||G.mode<2)];
  F[1].tkx=(!demo&&G.mode===0)?[1,1,1,1,1,.97,.94,.9,.86,.8][G.arc.level-1]:1;
  R.n=1;R.wins=[0,0];R.demo=!!demo;
  if(!demo){R.sbase=(Math.random()*10)|0;R.stage=G.mode===0?G.arc.level-1:R.sbase;initAudio()}
  startRound(true);
}
function toTitle(){G.scene='title';G.paused=false;const a=(Math.random()*30)|0;G.sel=[G.sel[0],G.sel[1]];
  const keep=G.sel.slice();G.sel=[a,(a+1+((Math.random()*28)|0))%30];startMatch(true);G.sel=keep;R.stage=(Math.random()*10)|0}

function para(x,y,w,h,flip){const k=14;ctx.beginPath();if(!flip){ctx.moveTo(x+k,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w-k,y+h);ctx.lineTo(x,y+h)}else{ctx.moveTo(x,y);ctx.lineTo(x+w-k,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x+k,y+h)}ctx.closePath()}
function drawBar(x,y,w,h,f,flip){
  ctx.save();para(x,y,w,h,flip);ctx.fillStyle='rgba(0,0,0,.65)';ctx.fill();ctx.clip();
  const fr=f.hp/100,tr=f.trail/100;

  const c=fr>.5?['#7dff7a','#1fb83a']:fr>.25?['#ffe45c','#e6a100']:['#ff7a6a','#d0152a'];
  g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);ctx.fillStyle=g;
  if(flip)ctx.fillRect(x,y,hw,h);else ctx.fillRect(x+w-hw,y,hw,h);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x,y,w,h*.35);

}

      const g=ctx.createRadialGradient(p.x,-p.y,1,p.x,-p.y,22);g.addColorStop(0,'#fff');g.addColorStop(.4,p.c);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,-p.y,22,0,TAU);ctx.fill();

      const tg=ctx.createLinearGradient(0,0,-dir*220,0);tg.addColorStop(0,p.c);tg.addColorStop(1,'transparent');ctx.fillStyle=tg;ctx.fillRect(Math.min(0,-dir*220),-24,220,48);ctx.restore();
    }else{

      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,-p.y,34,0,TAU);ctx.fill();
      const tg=ctx.createLinearGradient(p.x,0,p.x-dir*130,0);tg.addColorStop(0,p.c);tg.addColorStop(1,'transparent');
      ctx.fillStyle=tg;ctx.fillRect(Math.min(p.x,p.x-dir*130),-p.y-12,130,24);

    if(o.lava){g.save();g.strokeStyle='#ff6a1a';g.shadowColor='#ff6a1a';g.shadowBlur=12;g.lineWidth=2.5;for(let i=0;i<14;i++){let x=rn()*w,y=BASE-o.max*rn()*.6;g.beginPath();g.moveTo(x,y);for(let k=0;k<5;k++){x+=rn()*14-7;y+=10+rn()*14;g.lineTo(x,y)}g.stroke()}g.restore()}
  },
  bamboo(g,w,rn,o){
    for(let x=0;x<w;x+=o.gap*(.6+rn()*.8)){
      const t=o.thick*(.75+rn()*.5),gr=g.createLinearGradient(x-t/2,0,x+t/2,0);gr.addColorStop(0,shade(o.col,1.4));gr.addColorStop(.5,o.col);gr.addColorStop(1,shade(o.col,.55));
      g.fillStyle=gr;g.fillRect(x-t/2,0,t,BASE);
      for(let y=rn()*60;y<BASE;y+=55+rn()*45){g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x-t/2-1,y,t+2,2.5);
        if(rn()<.5){g.fillStyle=shade(o.col,1.15);g.beginPath();g.ellipse(x+(rn()<.5?-1:1)*(t+14),y+6,t*1.9+10,3.2,rn()*.8-.4,0,TAU);g.fill()}}
    }
  },
  shoji(g,w,rn,o){
    const pw=96,ph=150;g.fillStyle='#1a0c06';g.fillRect(0,0,w,BASE);
    for(let x=0;x<w;x+=pw)for(let y=60;y<60+ph*2;y+=ph){
      const gr=g.createLinearGradient(0,y,0,y+ph);gr.addColorStop(0,o.col);gr.addColorStop(1,shade(o.col,.7));g.fillStyle=gr;g.globalAlpha=.55;g.fillRect(x+5,y+5,pw-10,ph-10);g.globalAlpha=1;
      g.strokeStyle='#2a140a';g.lineWidth=5;g.strokeRect(x+3,y+3,pw-6,ph-6);g.lineWidth=2;g.beginPath();g.moveTo(x+pw/2,y);g.lineTo(x+pw/2,y+ph);g.moveTo(x,y+ph/2);g.lineTo(x+pw,y+ph/2);g.stroke()}
    g.fillStyle='#2a140a';g.fillRect(0,BASE-70,w,70);
  },
  lanterns(g,w,rn){
    for(let x=60;x<w;x+=170+rn()*80){
      const y=70+rn()*60;g.strokeStyle='#1a0a05';g.lineWidth=2;g.beginPath();g.moveTo(x,0);g.lineTo(x,y);g.stroke();
      const gr=g.createRadialGradient(x,y+26,2,x,y+26,60);gr.addColorStop(0,'rgba(255,170,60,.65)');gr.addColorStop(1,'transparent');g.fillStyle=gr;g.fillRect(x-60,y-34,120,120);
      g.fillStyle='#c8201a';g.beginPath();g.ellipse(x,y+26,17,24,0,0,TAU);g.fill();g.fillStyle='#ffd24a';g.fillRect(x-9,y,18,4);g.fillRect(x-9,y+48,18,4);
      g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1.5;for(let k=-1;k<=1;k++){g.beginPath();g.ellipse(x,y+26,17*Math.abs(k||.01),24,0,0,TAU);g.stroke()}
    }
    for(let x=300;x<w;x+=520){g.fillStyle='#8a1410';g.fillRect(x,0,56,200);g.fillStyle='#e8c24a';g.fillRect(x,0,56,8);g.fillRect(x,192,56,8);g.fillStyle='#e8c24a';g.fillRect(x+22,30,12,120)}
  },
  pillars(g,w,rn,o){
    for(let x=40;x<w;x+=420+rn()*120){
      const pw=o.gold?64:78,gr=g.createLinearGradient(x,0,x+pw,0);gr.addColorStop(0,shade(o.col,1.6));gr.addColorStop(.5,o.col);gr.addColorStop(1,shade(o.col,.5));
      g.fillStyle=gr;g.fillRect(x,0,pw,BASE+4);g.fillStyle=o.gold?'#d9a82a':'#7a1410';g.fillRect(x-6,0,pw+12,18);g.fillRect(x-6,BASE-60,pw+12,14);g.fillRect(x-6,150,pw+12,8);
    }
  },
  containers(g,w,rn){
    const cs=['#b8312a','#2a6ab8','#d89a1a','#2a8a5a','#7a3aa8','#c8c8c8'];let x=-10;
    while(x<w){const cw=88,n=1+((rn()*3)|0);for(let i=0;i<n;i++){const c=cs[(rn()*cs.length)|0],y=BASE-(i+1)*38;g.fillStyle=shade(c,.55);g.fillRect(x,y,cw,37);
      g.fillStyle='rgba(0,0,0,.25)';for(let k=6;k<cw;k+=9)g.fillRect(x+k,y+3,3,31);g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=2;g.strokeRect(x,y,cw,37)}
      x+=cw+4+rn()*30}
  },
  cranes(g,w,rn,o){
    for(let x=100;x<w;x+=520+rn()*200){
      g.strokeStyle=o.col;g.fillStyle=o.col;g.lineWidth=5;
      g.beginPath();g.moveTo(x,BASE);g.lineTo(x,40);g.moveTo(x+30,BASE);g.lineTo(x+30,40);g.stroke();
      g.lineWidth=2;for(let y=BASE;y>40;y-=26){g.beginPath();g.moveTo(x,y);g.lineTo(x+30,y-26);g.moveTo(x+30,y);g.lineTo(x,y-26);g.stroke()}
      g.lineWidth=7;g.beginPath();g.moveTo(x-140,60);g.lineTo(x+260,60);g.stroke();g.lineWidth=2;
      for(let k=-140;k<260;k+=26){g.beginPath();g.moveTo(x+k,60);g.lineTo(x+k+13,40);g.lineTo(x+k+26,60);g.stroke()}
      g.lineWidth=1.5;g.beginPath();g.moveTo(x+200,60);g.lineTo(x+200,170);g.stroke();g.fillRect(x+188,170,24,16);
      g.fillStyle='#ff3030';g.shadowColor='#f00';g.shadowBlur=10;g.beginPath();g.arc(x+15,36,4,0,TAU);g.fill();g.shadowBlur=0;
    }
  },
  dunes(g,w,rn,o){
    const ph=rn()*9;const gr=g.createLinearGradient(0,BASE-o.amp*2,0,BASE);gr.addColorStop(0,shade(o.col,1.3));gr.addColorStop(1,shade(o.col,.65));
    g.fillStyle=gr;g.beginPath();g.moveTo(0,BASE);for(let x=0;x<=w;x+=12)g.lineTo(x,BASE-o.amp*(.55+.45*Math.sin(x*.0045+ph))-o.amp*.3*Math.sin(x*.013+ph*2));g.lineTo(w,BASE);g.fill();
  },
  ruins(g,w,rn,o){
    for(let x=30;x<w;x+=150+rn()*160){
      const h=90+rn()*190,cw=36+rn()*16,gr=g.createLinearGradient(x,0,x+cw,0);gr.addColorStop(0,shade(o.col,1.4));gr.addColorStop(1,shade(o.col,.6));
      g.fillStyle=gr;g.beginPath();g.moveTo(x,BASE);g.lineTo(x,BASE-h);g.lineTo(x+cw*.3,BASE-h-6);g.lineTo(x+cw*.6,BASE-h+4);g.lineTo(x+cw,BASE-h-3);g.lineTo(x+cw,BASE);g.fill();
      g.fillStyle=shade(o.col,.8);g.fillRect(x-6,BASE-14,cw+12,14);
      g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=1.5;for(let k=6;k<cw;k+=9){g.beginPath();g.moveTo(x+k,BASE-h+8);g.lineTo(x+k,BASE-14);g.stroke()}
      if(rn()<.5){g.fillStyle=o.col;g.beginPath();g.arc(x+cw+60,BASE-h*.7,60,Math.PI,0);g.lineTo(x+cw+120,BASE);g.lineTo(x+cw+110,BASE);g.lineTo(x+cw+110,BASE-h*.7);g.arc(x+cw+60,BASE-h*.7,50,0,Math.PI,true);g.lineTo(x+cw+10,BASE);g.lineTo(x+cw,BASE);g.fill()}
    }
  },
  pines(g,w,rn,o){
    for(let x=-20;x<w;x+=50+rn()*70){
      const h=120+rn()*180,tw=34+rn()*28;g.fillStyle=o.col;
      for(let k=0;k<5;k++){const y=BASE-h*(k/5.2),ww=tw*(1-k/5.6);g.beginPath();g.moveTo(x-ww,y);g.lineTo(x,y-h/4.2);g.lineTo(x+ww,y);g.fill()}
      g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.moveTo(x-8,BASE-h*.8);g.lineTo(x,BASE-h-6);g.lineTo(x+8,BASE-h*.8);g.fill();g.fillStyle=o.col;g.fillRect(x-4,BASE-10,8,14);
    }
  },
  volcano(g,w,rn,o){
    for(let x=300;x<w;x+=900+rn()*300){
      g.fillStyle=o.col;g.beginPath();g.moveTo(x-330,BASE);g.lineTo(x-60,BASE-260);g.lineTo(x+60,BASE-260);g.lineTo(x+330,BASE);g.fill();
      const gr=g.createRadialGradient(x,BASE-262,2,x,BASE-262,130);gr.addColorStop(0,'rgba(255,160,40,.95)');gr.addColorStop(1,'transparent');g.fillStyle=gr;g.fillRect(x-130,BASE-390,260,260);
      g.save();g.strokeStyle='#ff7a1a';g.shadowColor='#ff5a0a';g.shadowBlur=14;g.lineWidth=3;for(let i=0;i<3;i++){let xx=x-40+i*40,y=BASE-258;g.beginPath();g.moveTo(xx,y);for(let k=0;k<7;k++){xx+=(i-1)*14+rn()*8-4;y+=26;g.lineTo(xx,y)}g.stroke()}g.restore();
    }
  },
  pagoda(g,w,rn,o){
    for(let x=150;x<w;x+=430+rn()*160){
      g.fillStyle=o.col;const tiers=4+((rn()*2)|0);let y=BASE,tw=110;
      for(let k=0;k<tiers;k++){g.fillRect(x-tw*.4,y-34,tw*.8,34);g.beginPath();g.moveTo(x-tw*.75,y-34);g.quadraticCurveTo(x-tw*.4,y-30,x-tw*.35,y-50);g.lineTo(x+tw*.35,y-50);g.quadraticCurveTo(x+tw*.4,y-30,x+tw*.75,y-34);g.lineTo(x+tw*.5,y-38);g.lineTo(x-tw*.5,y-38);g.fill();y-=48;tw*=.84}
      g.fillRect(x-2,y-40,4,40);g.fillStyle='rgba(255,190,90,.8)';for(let k=0;k<tiers;k++)g.fillRect(x-5,BASE-48*k-28,10,14);
    }
    for(let x=60;x<w;x+=900){g.fillStyle='#8a1a1a';g.fillRect(x,BASE-150,12,150);g.fillRect(x+110,BASE-150,12,150);g.fillRect(x-14,BASE-160,150,12);g.fillRect(x-6,BASE-136,134,8)}
  },
  trees(g,w,rn,o){
    for(let x=60;x<w;x+=260+rn()*180){
      g.strokeStyle=o.col;g.lineCap='round';g.lineWidth=18;g.beginPath();g.moveTo(x,BASE);g.quadraticCurveTo(x+rn()*40-20,BASE-120,x+rn()*60-30,BASE-210);g.stroke();
      g.lineWidth=8;for(let b=0;b<3;b++){g.beginPath();g.moveTo(x,BASE-90-b*30);g.lineTo(x+(b%2?1:-1)*(70+rn()*40),BASE-180-b*20);g.stroke()}
      for(let i=0;i<46;i++){g.fillStyle=['#ff9ac0','#ffc6dc','#ff7aa8','#ffd9e8'][(rn()*4)|0];g.globalAlpha=.75;g.beginPath();g.arc(x+rn()*200-100,BASE-230+rn()*110,10+rn()*20,0,TAU);g.fill()}
      g.globalAlpha=1;
    }
  },
  arches(g,w,rn,o){
    const s=o.sc||1,aw=120*s,ah=170*s;
    for(let x=0;x<w;x+=aw+30*s){
      g.fillStyle=o.col;g.fillRect(x,BASE-ah-70*s,aw+30*s,ah+70*s);
      g.globalCompositeOperation='destination-out';g.beginPath();g.moveTo(x+14*s,BASE);g.lineTo(x+14*s,BASE-ah*.55);g.arc(x+14*s+aw/2-14*s,BASE-ah*.55,aw/2-14*s,Math.PI,0);g.lineTo(x+aw-14*s,BASE);g.fill();g.globalCompositeOperation='source-over';
      const gr=g.createRadialGradient(x+aw/2,BASE-ah*.4,2,x+aw/2,BASE-ah*.4,aw*.6);gr.addColorStop(0,'rgba(190,90,255,.35)');gr.addColorStop(1,'transparent');g.fillStyle=gr;g.fillRect(x,BASE-ah,aw+30*s,ah);
      g.fillStyle='rgba(255,170,60,.9)';g.beginPath();g.arc(x+aw+15*s,BASE-ah-40*s,4,0,TAU);g.fill();
    }
  }
};
function buildStage(i){
  const s=STG[i],rn=mulberry(101+i*37);
  const sky=mk(W,H,(g)=>{
    const gr=g.createLinearGradient(0,0,0,HORIZON+20);gr.addColorStop(0,s.sky[0]);gr.addColorStop(.6,s.sky[1]);gr.addColorStop(1,s.sky[2]);g.fillStyle=gr;g.fillRect(0,0,W,H);
    if(s.stars)for(let k=0;k<110;k++){g.globalAlpha=rn()*.8;g.fillStyle='#fff';g.fillRect(rn()*W,rn()*260,1+rn()*1.5,1+rn()*1.5)}
    g.globalAlpha=1;
    if(s.aurora)for(let b=0;b<3;b++){const gr2=g.createLinearGradient(0,40+b*30,0,230+b*30);gr2.addColorStop(0,'transparent');gr2.addColorStop(.5,['rgba(80,255,170,.4)','rgba(160,120,255,.35)','rgba(80,200,255,.3)'][b]);gr2.addColorStop(1,'transparent');
      g.fillStyle=gr2;g.beginPath();g.moveTo(0,200);for(let x=0;x<=W;x+=20)g.lineTo(x,90+b*30+Math.sin(x*.01+b*2)*40);g.lineTo(W,300);g.lineTo(0,300);g.fill()}
    if(s.sun){const p=s.sun,rg=g.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.4);rg.addColorStop(0,p.c);rg.addColorStop(.3,p.c+'55');rg.addColorStop(1,'transparent');g.fillStyle=rg;g.fillRect(0,0,W,H);
      g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r*.55,0,TAU);g.fill();
      if(i<2){g.fillStyle=s.sky[1];for(let k=0;k<7;k++)g.fillRect(p.x-p.r,p.y+8+k*11,p.r*2,2+k*.7)}}
  });
  const layers=s.layers.map(([k,type,o])=>({k,c:mk(Math.ceil(W+WORLD*k),HORIZON,(g,w)=>LB[type](g,w,rn,o,s))}));
  return {sky,layers};
}
const stageCache={};
function getStage(i){
  if(stageCache[i])return stageCache[i];
  const ks=Object.keys(stageCache);if(ks.length>=2)delete stageCache[ks[0]];
  return stageCache[i]=buildStage(i);
}
const vignette=mk(W,H,(g)=>{const r=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);r.addColorStop(0,'transparent');r.addColorStop(1,'rgba(0,0,0,.65)');g.fillStyle=r;g.fillRect(0,0,W,H)});
let ambient=[],ambStage=-1,boltT=0;
function initAmbient(i){
  ambStage=i;const p=STG[i].pt;ambient=Array.from({length:p.n},()=>({x:Math.random()*W,y:Math.random()*H,s:rnd(.4,1.4),v:rnd(.3,1),ph:rnd(0,6)}));
}
function drawBG(){
  const s=STG[R.stage],S=getStage(R.stage),off=cam.x-480,z=cam.z;
  if(ambStage!==R.stage)initAmbient(R.stage);
  ctx.drawImage(S.sky,0,0);
  if(s.beam){
    ctx.globalCompositeOperation='lighter';
    for(let b=0;b<3;b++){const bx=140+b*340,a=Math.sin(G.f*.012+b*2)*.5,gr=ctx.createLinearGradient(bx,HORIZON,bx+a*300,0);gr.addColorStop(0,s.beam+'66');gr.addColorStop(1,'transparent');
      ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(bx-10,HORIZON);ctx.lineTo(bx+10,HORIZON);ctx.lineTo(bx+a*300+60,0);ctx.lineTo(bx+a*300-60,0);ctx.fill()}
    ctx.globalCompositeOperation='source-over';
  }
  for(const L of S.layers)ctx.drawImage(L.c,-off*L.k,L.k>.3?6:0);
  if(s.light){
    if(boltT<=0&&Math.random()<.006)boltT=10;
    if(boltT>0){boltT--;ctx.fillStyle='rgba(200,150,255,'+(boltT/10*.35)+')';ctx.fillRect(0,0,W,HORIZON);
      if(boltT>6){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.shadowColor='#c6f';ctx.shadowBlur=18;ctx.beginPath();let x=120+((G.f*37)%700),y=0;ctx.moveTo(x,y);while(y<HORIZON-40){x+=Math.random()*40-20;y+=34;ctx.lineTo(x,y)}ctx.stroke();ctx.shadowBlur=0}}
  }
  // floor
  const fg=ctx.createLinearGradient(0,HORIZON,0,H);fg.addColorStop(0,s.floor[0]);fg.addColorStop(1,s.floor[1]);ctx.fillStyle=fg;ctx.fillRect(0,HORIZON,W,H-HORIZON);
  ctx.save();ctx.strokeStyle=s.line;ctx.lineWidth=1.5;
  if(s.fm==='grid'||s.fm==='tile'){
    ctx.globalAlpha=s.fm==='grid'?.28:.16;
    for(let wx=-200;wx<=WORLD+200;wx+=100){const rx=wx-cam.x;ctx.beginPath();ctx.moveTo(480+rx*.7*z,HORIZON);ctx.lineTo(480+rx*1.45*z,H);ctx.stroke()}
    for(let k=1;k<=9;k++){const y=HORIZON+(H-HORIZON)*Math.pow(k/9,1.7);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  }else if(s.fm==='planks'){
    ctx.globalAlpha=.35;ctx.strokeStyle='#000';
    for(let k=1;k<=12;k++){const y=HORIZON+(H-HORIZON)*Math.pow(k/12,1.5);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    ctx.globalAlpha=.2;for(let wx=-400;wx<=WORLD+400;wx+=170){const rx=wx-cam.x;ctx.beginPath();ctx.moveTo(480+rx*.7*z,HORIZON);ctx.lineTo(480+rx*1.45*z,H);ctx.stroke()}
  }else{ctx.globalAlpha=.1;for(let k=1;k<=6;k++){const y=HORIZON+(H-HORIZON)*Math.pow(k/6,1.8);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
  ctx.restore();
  ctx.save();ctx.shadowColor=s.line;ctx.shadowBlur=18;ctx.strokeStyle=s.line;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,HORIZON);ctx.lineTo(W,HORIZON);ctx.stroke();ctx.restore();
  const mx=480+((F.length?(F[0].x+F[1].x)/2:cam.x)-cam.x)*z;
  ctx.globalCompositeOperation='lighter';
  const sg=ctx.createRadialGradient(mx,GROUND+10,10,mx,GROUND+10,330);sg.addColorStop(0,s.line+'44');sg.addColorStop(1,'transparent');
  ctx.save();ctx.translate(0,GROUND+10);ctx.scale(1,.28);ctx.translate(0,-(GROUND+10));ctx.fillStyle=sg;ctx.fillRect(mx-340,GROUND-1200,680,3000);ctx.restore();
  // ambient particles
  const p=s.pt;ctx.fillStyle=p.c;ctx.strokeStyle=p.c;
  for(const e of ambient){
    if(p.t==='rise'){e.y-=e.v;e.x+=Math.sin((e.y+G.f)*.02)*.3;if(e.y<0){e.y=H;e.x=Math.random()*W}ctx.globalAlpha=.5;ctx.fillRect(e.x,e.y,e.s*2,e.s*2)}
    else if(p.t==='fall'){e.y+=e.v*1.1;e.x+=Math.sin(G.f*.03+e.ph)*.8+.3;if(e.y>H){e.y=-10;e.x=Math.random()*W}ctx.globalAlpha=.8;
      if(p.leaf){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(G.f*.04+e.ph);ctx.beginPath();ctx.ellipse(0,0,4*e.s,2*e.s,0,0,TAU);ctx.fill();ctx.restore()}else ctx.fillRect(e.x,e.y,e.s*2.2,e.s*2.2)}
    else if(p.t==='rain'){e.y+=14*e.v;e.x-=3*e.v;if(e.y>H){e.y=-20;e.x=Math.random()*(W+60)}ctx.globalAlpha=.35;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+3,e.y-12);ctx.stroke()}
    else{e.x+=e.v*1.4;e.y+=Math.sin(G.f*.02+e.ph)*.3;if(e.x>W){e.x=-5;e.y=Math.random()*H}ctx.globalAlpha=.45;ctx.fillRect(e.x,e.y,e.s*2,e.s*2)}
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
