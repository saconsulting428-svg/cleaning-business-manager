/* =========================================================
   Actions
   ========================================================= */
const curJob = () => jobById(route().id);
async function deleteJobPhotos(j) { for (const p of j.photos.before.concat(j.photos.after)) await Photos.del(p); }
let pendingPhoto = null;

const ACT = {
  go: d => { closeSheet(); ui.moreOpen = false; go(d.to); },
  toggleMore: () => { ui.moreOpen = !ui.moreOpen; renderNav(route()); },
  mobileMore: () => openSheet({ key: "more", title: "More", body: `<div class="pick">${[["services", "Services", "Packages, prices and add-ons"], ["customers", "Customers", "Contacts, vehicles and balances"]].concat(MORE).map(([k, l, s]) => `<button class="pick-item" data-act="go" data-to="${k}"><div class="pi-main"><div class="pi-t">${l}</div><div class="pi-s">${s}</div></div>${I.chev}</button>`).join("")}</div>` }),
  closeSheet: () => closeSheet(),
  palette: () => paletteSheet(),
  palGo: d => { closeSheet(); go(d.to); },
  dismissBanner: () => { S.settings.bannerDismissed = true; save(); rerender(); },
  scrollTo: d => { const el = document.getElementById(d.id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: "smooth" }); },

  // Booking wizard
  newBooking: d => { closeSheet(); startWizard({ vehicleId: d.vehicle || null, customerId: d.customer || null, serviceId: d.service || null, date: d.date || today() }); },
  newQuote: d => { closeSheet(); startWizard({ mode: "quote", vehicleId: d.vehicle || null, customerId: d.customer || null }); },
  wizBack: () => { wiz.newCust = wiz.newVeh = false; if (wiz.step > 0) wiz.step--; renderWizard(); },
  wizNext: () => wizAdvance(),
  wizGoto: d => { wiz.step = wizSteps().indexOf(d.s); renderWizard(); },
  wizNewCust: () => { wiz.newCust = true; renderWizard(); const f = $("#wc-name"); if (f) { if (wiz.custQ && !/\d/.test(wiz.custQ)) f.value = wiz.custQ; f.focus(); } },
  wizNewVeh: () => { wiz.newVeh = true; renderWizard(); },
  wizCancelNew: () => { wiz.newCust = wiz.newVeh = false; renderWizard(); },
  wizSaveCust: () => {
    const o = readCustomerFields("wc");
    if (!o.name) { toast("Add the customer's name."); $("#wc-name").focus(); return; }
    const c = Object.assign({ id: uid("c"), createdAt: today(), email: "", notes: "" }, o);
    S.customers.push(c); save();
    wiz.customerId = c.id; wiz.vehicleId = null; wiz.location = c.address || ""; wiz.custQ = "";
    wiz.step = wizSteps().indexOf("vehicle"); wiz.newCust = false; wiz.newVeh = true; renderWizard();
  },
  wizPickCust: d => {
    if (wiz.customerId !== d.id) { wiz.vehicleId = null; const c = cust(d.id); wiz.location = c ? c.address || "" : ""; }
    wiz.customerId = d.id;
    const vs = S.vehicles.filter(v => v.customerId === d.id);
    if (vs.length === 1) { wiz.vehicleId = vs[0].id; wiz.newCust = false; wiz.step = wizSteps().indexOf("service"); renderWizard(); return; }
    wizAdvance();
  },
  wizPickVeh: d => { wiz.vehicleId = d.id; wizAdvance(); },
  wizSaveVeh: () => {
    const o = readVehicleFields("wv");
    if (!o.make || !o.model) { toast("Add at least the make and model."); return; }
    const v = Object.assign({ id: uid("v"), customerId: wiz.customerId, mileage: "", exteriorCond: "", interiorCond: "", notes: "", nextDue: null, createdAt: today() }, o);
    S.vehicles.push(v); save();
    wiz.vehicleId = v.id; wizAdvance();
  },
  wizPickSvc: d => { wiz.serviceId = d.id; wizAdvance(); },
  wizDate: d => { wiz.date = d.d; renderWizard(); },
  wizTime: d => { wiz.time = d.t; renderWizard(); },
  wizAddon: d => { const i = wiz.addonIds.indexOf(d.id); if (i >= 0) wiz.addonIds.splice(i, 1); else wiz.addonIds.push(d.id); renderWizard(); },
  wizSaveBooking: () => {
    const s = svcById(wiz.serviceId), c = cust(wiz.customerId), v = veh(wiz.vehicleId);
    if (!s || !c || !v || !wiz.date || !wiz.time) { toast("Something's missing — check the earlier steps."); return; }
    const j = { id: uid("j"), customerId: c.id, vehicleId: v.id, serviceId: s.id, serviceName: s.name, servicePrice: s.price, serviceDuration: s.duration,
      addons: wizObj().addons.map(a => ({ id: a.id, name: a.name, price: a.price, duration: a.duration || 0 })), discount: num(wiz.discount),
      date: wiz.date, time: wiz.time, status: "booked", location: wiz.location, notes: wiz.notes, payments: [], condition: null, photos: { before: [], after: [] },
      quoteId: wiz.quoteId, completedAt: null, nextRecommended: null, createdAt: today() };
    S.jobs.push(j);
    if (wiz.quoteId) { const q = quoteById(wiz.quoteId); if (q) { q.bookingId = j.id; q.status = "approved"; } }
    save(); closeSheet(); wiz = null;
    toast(`Booked: ${vName(v)} · ${relDay(j.date)} ${fmtTime(j.time)}`);
    rerender();
  },
  wizSaveQuote: d => {
    const s = svcById(wiz.serviceId), c = cust(wiz.customerId), v = veh(wiz.vehicleId);
    if (!s || !c || !v) { toast("Something's missing — check the earlier steps."); return; }
    const base = { customerId: c.id, vehicleId: v.id, serviceId: s.id, serviceName: s.name, servicePrice: s.price, serviceDuration: s.duration,
      addons: wizObj().addons.map(a => ({ id: a.id, name: a.name, price: a.price, duration: a.duration || 0 })), discount: num(wiz.discount), notes: wiz.notes };
    let q;
    if (wiz.editQuoteId && (q = quoteById(wiz.editQuoteId))) {
      Object.assign(q, base, { status: d.st === "sent" ? "sent" : q.status === "approved" ? "approved" : d.st });
    } else {
      q = Object.assign({ id: uid("q"), number: S.settings.nextQuoteNo++, status: d.st, createdAt: today(), bookingId: null }, base);
      S.quotes.push(q);
    }
    save(); closeSheet(); wiz = null; toast(`Quote Q-${q.number} saved`); rerender(); showQuote(q.id);
  },

  // Quotes
  viewQuote: d => showQuote(d.id),
  quoteFilter: d => { ui.quoteFilter = d.f; rerender(); },
  quoteStatus: d => { const q = quoteById(d.id); q.status = d.s; save(); showQuote(q.id); rerender(); toast("Quote marked " + d.s); },
  convertQuote: d => {
    const q = quoteById(d.id); if (!q) return;
    if (!veh(q.vehicleId)) { toast("The vehicle on this quote was deleted."); return; }
    closeSheet();
    const addonIds = q.addons.map(a => a.id).filter(id => addonById(id));
    startWizard({ vehicleId: q.vehicleId, serviceId: svcById(q.serviceId) ? q.serviceId : null, addonIds, discount: q.discount, notes: q.notes, quoteId: q.id });
  },
  editQuote: d => {
    const q = quoteById(d.id); if (!q) return; closeSheet();
    startWizard({ mode: "quote", editQuoteId: q.id, vehicleId: q.vehicleId, customerId: q.customerId, serviceId: svcById(q.serviceId) ? q.serviceId : null, addonIds: q.addons.map(a => a.id).filter(id => addonById(id)), discount: q.discount, notes: q.notes });
  },
  copyQuote: async d => {
    const q = quoteById(d.id); const txt = quoteText(q);
    try { await navigator.clipboard.writeText(txt); toast("Quote copied — paste it into a text or email"); }
    catch (e) { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Quote copied"); } catch (e2) { toast("Couldn't copy on this browser"); } ta.remove(); }
  },
  deleteQuote: async d => {
    if (!await confirmBox({ title: "Delete this quote?", text: "Any booking made from it stays.", ok: "Delete quote", danger: true })) return;
    S.quotes = S.quotes.filter(q => q.id !== d.id); S.jobs.forEach(j => { if (j.quoteId === d.id) j.quoteId = null; });
    save(); closeSheet(); rerender(); toast("Quote deleted");
  },
  openJobFromSheet: d => { closeSheet(); go("job/" + d.id); },

  // Job workflow
  jobStatus: d => {
    const j = curJob(); if (!j) return;
    j.status = d.s;
    if (d.s === "arrived") j.arrivedAt = new Date().toISOString();
    if (d.s === "in_progress" && !j.startedAt) j.startedAt = new Date().toISOString();
    if (d.s !== "completed") j.completedAt = null;
    save(); rerender();
    toast({ arrived: "Marked arrived. Do the condition check, then start.", in_progress: "Detail started", booked: "Booking restored" }[d.s] || "Updated");
  },
  completeJob: d => { ui.nextChoice = 30; completeSheet(d.id); },
  nextChoice: d => { ui.nextChoice = isNaN(+d.n) ? d.n : +d.n; completeSheet(sheet.key.slice(5)); },
  confirmComplete: d => {
    const j = jobById(d.id); if (!j) return;
    j.status = "completed"; j.completedAt = today();
    if (j.date > today()) j.date = today();
    let next = null;
    if (ui.nextChoice === "custom") { const el = $("#next-date"); next = el && el.value ? el.value : null; }
    else if (ui.nextChoice !== "none") next = addDays(today(), ui.nextChoice);
    j.nextRecommended = next;
    const v = veh(j.vehicleId);
    if (v) { if (next) v.nextDue = next; if (j.condition) { if (j.condition.exterior) v.exteriorCond = j.condition.exterior; if (j.condition.interior) v.interiorCond = j.condition.interior; } }
    save(); closeSheet(); rerender();
    if (balanceOf(j) > 0) paySheet(j.id); else toast("Job complete");
  },
  payJob: d => paySheet(d.id),
  payMethod: d => { ui.payMethod = d.m; $$("#pay-methods .chip").forEach(b => b.classList.toggle("on", b.dataset.m === d.m)); },
  savePayment: d => {
    const j = jobById(d.id); if (!j) return;
    const amt = Math.round(num($("#pay-amt").value) * 100) / 100;
    if (amt <= 0) { toast("Enter an amount."); return; }
    j.payments.push({ id: uid("p"), amount: amt, method: ui.payMethod || "Cash", date: $("#pay-date").value || today() });
    save(); closeSheet(); rerender();
    toast(payStatus(j) === "paid" ? `Paid in full · ${money(totalOf(j))}` : `${money(amt, "cents")} recorded · ${money(balanceOf(j), "cents")} left`);
  },
  rmPayment: async d => {
    if (!await confirmBox({ title: "Remove this payment?", text: "Use this if it was entered by mistake.", ok: "Remove", danger: true })) return;
    const j = jobById(d.id); j.payments = j.payments.filter(p => p.id !== d.p); save(); rerender();
  },
  cond: d => {
    const j = curJob(); if (!j) return;
    j.condition = j.condition || { zones: {} };
    j.condition[d.k] = j.condition[d.k] === d.v ? "" : d.v;
    const v = veh(j.vehicleId);
    if (v && d.k === "exterior" && j.condition.exterior) v.exteriorCond = j.condition.exterior;
    if (v && d.k === "interior" && j.condition.interior) v.interiorCond = j.condition.interior;
    save(); rerender();
  },
  zone: d => {
    ui.zone = d.zone; const j = curJob(); if (!j) return;
    const zones = (j.condition && j.condition.zones) || {};
    $("#insp-svg").innerHTML = topViewSVG(zones, ui.zone);
    ZONES.forEach(([k]) => { const c = $("#zc-" + k); if (c) c.classList.toggle("on", k === ui.zone); });
    const ta = $("#zone-note"); ta.value = zones[ui.zone] || ""; ta.placeholder = (ZONES.find(z => z[0] === ui.zone) || ["", ""])[1] + ": scratches, chips, stains, curb rash…";
    ta.focus();
  },
  noteChip: d => {
    const ta = $("#job-notes"); if (!ta) return;
    ta.value = ta.value + (ta.value && !ta.value.endsWith("\n") ? "\n" : "") + d.t;
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    INPUT.jobNotes(ta);
  },
  addPhoto: d => { pendingPhoto = { job: d.job, kind: d.kind }; const f = $("#file-in"); f.value = ""; f.click(); },
  viewPhoto: d => {
    const ro = d.ro === "1";
    openSheet({ key: "ph", title: d.kind === "before" ? "Before" : "After", wide: true,
      body: `<img data-pid="${esc(d.pid)}" alt="${esc(d.kind)} photo" style="width:100%;border-radius:8px;background:#222">`,
      foot: `${!ro ? `<button class="btn danger" data-act="delPhoto" data-job="${d.job}" data-kind="${d.kind}" data-pid="${esc(d.pid)}">Delete photo</button>` : `<button class="btn" data-act="openJobFromSheet" data-id="${d.job}">Open job</button>`}<span class="spacer"></span><button class="btn" data-act="closeSheet">Close</button>` });
  },
  delPhoto: async d => {
    if (!await confirmBox({ title: "Delete this photo?", text: "It will be removed from this device.", ok: "Delete", danger: true })) return;
    const j = jobById(d.job); j.photos[d.kind] = j.photos[d.kind].filter(p => p !== d.pid);
    await Photos.del(d.pid); save(); closeSheet(); rerender(); toast("Photo deleted");
  },
  photoMode: d => { ui.photoMode = d.m; rerender(); },
  jobAddons: d => jobAddonsSheet(d.id),
  toggleJobAddon: d => {
    const j = jobById(d.id), a = addonById(d.a);
    if (j.addons.some(x => x.id === d.a)) j.addons = j.addons.filter(x => x.id !== d.a);
    else j.addons.push({ id: a.id, name: a.name, price: a.price, duration: a.duration || 0 });
    save(); jobAddonsSheet(j.id); rerender();
  },
  rmJobAddon: d => { const j = jobById(d.id); j.addons = j.addons.filter(x => x.id !== d.a); save(); if (sheet && sheet.key === "jadd-" + j.id) jobAddonsSheet(j.id); rerender(); },
  jobNext: d => { const j = jobById(d.id); j.nextRecommended = addDays(j.date, +d.n); const v = veh(j.vehicleId); if (v) v.nextDue = j.nextRecommended; save(); rerender(); toast("Next detail: " + fmtDate(j.nextRecommended, "full")); },
  jobNextCustom: d => { const j = jobById(d.id); nextDueSheet(j.vehicleId); },
  editBooking: d => editBookingSheet(d.id),
  saveBooking: d => {
    const j = jobById(d.id); const date = $("#eb-date").value, time = $("#eb-time").value;
    if (!date || !time) { toast("Pick a date and time."); return; }
    j.date = date; j.time = time; j.location = $("#eb-loc").value.trim();
    const sid = $("#eb-svc").value;
    if (sid && sid !== j.serviceId) { const s = svcById(sid); Object.assign(j, { serviceId: s.id, serviceName: s.name, servicePrice: s.price, serviceDuration: s.duration }); }
    save(); closeSheet(); rerender(); toast("Booking updated");
  },
  cancelJob: async d => {
    if (!await confirmBox({ title: "Cancel this booking?", text: "It stays in the vehicle's history as cancelled. You can restore it later.", ok: "Cancel booking", danger: true })) return;
    jobById(d.id).status = "cancelled"; save(); rerender(); toast("Booking cancelled");
  },
  deleteJob: async d => {
    if (!await confirmBox({ title: "Delete this job for good?", text: "Its photos, notes and payments will be removed too.", ok: "Delete job", danger: true })) return;
    const j = jobById(d.id); await deleteJobPhotos(j);
    S.jobs = S.jobs.filter(x => x.id !== d.id); S.quotes.forEach(q => { if (q.bookingId === d.id) q.bookingId = null; });
    save(); go("bookings"); toast("Job deleted");
  },
  receipt: d => receiptSheet(d.id),
  print: () => window.print(),

  // Vehicles
  vehFilter: d => { ui.vehFilter = d.f; rerender(); },
  vehReset: () => { ui.vehFilter = "all"; ui.vehQuery = ""; rerender(); },
  addVehicle: d => { closeSheet(); vehicleSheet(null, d.customer || null); },
  editVehicle: d => vehicleSheet(d.id),
  pickType: (d, el) => { const wrap = el.closest(".typepick"); $$("button", wrap).forEach(b => b.classList.toggle("on", b === el)); $("#" + wrap.dataset.for).value = d.v; },
  pickColor: (d, el) => { const wrap = el.closest(".swatches"); $$("button", wrap).forEach(b => b.classList.toggle("on", b === el)); $("#" + wrap.dataset.for).value = d.v; },
  saveVehicle: d => {
    const o = readVehicleFields("vf");
    if (!o.make || !o.model) { toast("Add at least the make and model."); return; }
    let owner = $("#vo-owner").value;
    if (owner === "__new") {
      const c = readCustomerFields("vc");
      if (!c.name) { toast("Add the owner's name."); $("#vc-name").focus(); return; }
      const nc = Object.assign({ id: uid("c"), createdAt: today(), email: "", notes: "" }, c); S.customers.push(nc); owner = nc.id;
    }
    let v;
    if (d.id) { v = veh(d.id); const oldOwner = v.customerId; Object.assign(v, o, { customerId: owner }); if (oldOwner !== owner) S.jobs.concat(S.quotes).forEach(x => { if (x.vehicleId === v.id) x.customerId = owner; }); }
    else { v = Object.assign({ id: uid("v"), customerId: owner, nextDue: null, createdAt: today() }, o); S.vehicles.push(v); }
    save(); closeSheet(); toast(d.id ? "Vehicle saved" : "Vehicle added");
    if (!d.id) go("vehicle/" + v.id); else rerender();
  },
  deleteVehicle: async d => {
    const v = veh(d.id); const n = vJobs(v.id).length;
    if (!await confirmBox({ title: `Delete ${vName(v)}?`, text: n ? `This also deletes its ${n} job${n > 1 ? "s" : ""}, photos and quotes.` : "This can't be undone.", ok: "Delete vehicle", danger: true })) return;
    for (const j of vJobs(v.id)) await deleteJobPhotos(j);
    S.jobs = S.jobs.filter(j => j.vehicleId !== v.id); S.quotes = S.quotes.filter(q => q.vehicleId !== v.id); S.vehicles = S.vehicles.filter(x => x.id !== v.id);
    save(); closeSheet(); go("vehicles"); toast("Vehicle deleted");
  },
  saveVehNotes: d => { const v = veh(d.id); v.notes = $("#veh-notes").value; save(); toast("Notes saved"); },
  setNext: d => nextDueSheet(d.id),
  setNextDays: d => { const v = veh(d.id); v.nextDue = d.d || null; save(); closeSheet(); rerender(); toast(d.d ? "Next detail set for " + fmtDate(d.d, "full") : "Next detail cleared"); },
  setNextCustom: d => { const val = $("#nd-date").value; if (!val) { toast("Pick a date."); return; } ACT.setNextDays({ id: d.id, d: val }); },

  // Customers
  addCustomer: () => customerSheet(null),
  editCustomer: d => customerSheet(d.id),
  saveCustomer: d => {
    const o = readCustomerFields("cf");
    if (!o.name) { toast("Add the customer's name."); return; }
    let c;
    if (d.id) { c = cust(d.id); Object.assign(c, o); } else { c = Object.assign({ id: uid("c"), createdAt: today() }, o); S.customers.push(c); }
    save(); closeSheet(); toast(d.id ? "Customer saved" : "Customer added");
    if (!d.id) go("customer/" + c.id); else rerender();
  },
  deleteCustomer: async d => {
    const c = cust(d.id); const vs = S.vehicles.filter(v => v.customerId === c.id);
    if (!await confirmBox({ title: `Delete ${c.name}?`, text: `This also deletes their ${vs.length} vehicle${vs.length === 1 ? "" : "s"}, bookings, photos and quotes.`, ok: "Delete customer", danger: true })) return;
    for (const j of cJobs(c.id)) await deleteJobPhotos(j);
    S.jobs = S.jobs.filter(j => j.customerId !== c.id); S.quotes = S.quotes.filter(q => q.customerId !== c.id);
    S.vehicles = S.vehicles.filter(v => v.customerId !== c.id); S.customers = S.customers.filter(x => x.id !== c.id);
    save(); closeSheet(); go("customers"); toast("Customer deleted");
  },

  // Services
  editService: d => serviceSheet(d.id || null),
  saveService: d => {
    const name = $("#sv-name").value.trim(); if (!name) { toast("Give the service a name."); return; }
    const o = { name, description: $("#sv-desc").value.trim(), price: num($("#sv-price").value), duration: parseInt($("#sv-dur").value) || 60, items: $("#sv-items").value.split("\n").map(x => x.trim()).filter(Boolean) };
    if (d.id) Object.assign(svcById(d.id), o); else S.services.push(Object.assign({ id: uid("s") }, o));
    save(); closeSheet(); rerender(); toast("Service saved");
  },
  deleteService: async d => {
    if (!await confirmBox({ title: "Delete this service?", text: "Past jobs and quotes keep their details and price.", ok: "Delete", danger: true })) return;
    S.services = S.services.filter(s => s.id !== d.id); save(); closeSheet(); rerender(); toast("Service deleted");
  },
  editAddon: d => addonSheet(d.id || null),
  saveAddon: d => {
    const name = $("#ad-name").value.trim(); if (!name) { toast("Give the add-on a name."); return; }
    const o = { name, price: num($("#ad-price").value), duration: parseInt($("#ad-dur").value) || 0 };
    if (d.id) Object.assign(addonById(d.id), o); else S.addons.push(Object.assign({ id: uid("a") }, o));
    save(); closeSheet(); rerender(); toast("Add-on saved");
  },
  deleteAddon: async d => {
    if (!await confirmBox({ title: "Delete this add-on?", text: "Past jobs keep it.", ok: "Delete", danger: true })) return;
    S.addons = S.addons.filter(a => a.id !== d.id); save(); closeSheet(); rerender(); toast("Add-on deleted");
  },

  // Lists
  bookTab: d => { ui.bookTab = d.t; rerender(); },
  payTab: d => { ui.payTab = d.t; rerender(); },
  period: d => { ui.period = d.p; rerender(); },

  // Settings
  saveBiz: () => {
    Object.assign(S.settings, { businessName: $("#sb-name").value.trim() || "My Detailing", phone: $("#sb-phone").value.trim(), email: $("#sb-email").value.trim(), address: $("#sb-addr").value.trim(), currency: $("#sb-cur").value });
    save(); rerender(); toast("Business info saved");
  },
  pmAdd: () => { const v = $("#pm-new").value.trim(); if (!v) return; if (!S.settings.paymentMethods.includes(v)) S.settings.paymentMethods.push(v); save(); rerender(); },
  pmDel: d => { if (S.settings.paymentMethods.length <= 1) { toast("Keep at least one payment method."); return; } S.settings.paymentMethods.splice(+d.i, 1); save(); rerender(); },
  pmMove: d => { const a = S.settings.paymentMethods, i = +d.i; [a[i - 1], a[i]] = [a[i], a[i - 1]]; save(); rerender(); },
  exportData: async () => {
    const photos = {};
    for (const j of S.jobs) for (const p of j.photos.before.concat(j.photos.after)) { if (!p.startsWith("demo:")) { const v = await Photos.get(p); if (v) photos[p] = v; } }
    S.settings.lastBackup = today(); save();
    const blob = new Blob([JSON.stringify({ app: "AutoDetailFlow", version: 1, exportedAt: new Date().toISOString(), data: S, photos })], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `autodetailflow-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    rerender(); toast("Backup downloaded");
  },
  importData: () => { const f = $("#backup-in"); f.value = ""; f.click(); },
  resetDemo: async () => {
    if (!await confirmBox({ title: "Load demo data?", text: "This replaces everything in the app — customers, vehicles, jobs and photos — with the sample business.", ok: "Load demo", danger: true })) return;
    await Photos.clear(); S = buildDemo(); save(); go("today"); toast("Demo data loaded");
  },
  clearAll: async () => {
    if (!await confirmBox({ title: "Clear all data?", text: "Every customer, vehicle, job, quote and photo on this device will be deleted. Export a backup first if you might need it.", ok: "Clear everything", danger: true })) return;
    await Photos.clear(); S = emptyState(); save(); go("today"); toast("All data cleared — you're starting fresh");
  }
};

/* Live inputs (no full re-render so focus stays put) */
let saveT = null;
const debSave = () => { clearTimeout(saveT); saveT = setTimeout(save, 300); };
const INPUT = {
  vehQuery: el => { ui.vehQuery = el.value; $("#veh-grid").innerHTML = vehGrid(); },
  custQuery: el => { ui.custQuery = el.value; $("#cust-list").innerHTML = custList(); },
  palQ: el => { ui.palQ = el.value; $("#pal-res").innerHTML = paletteResults(); },
  wizCustQ: el => { wiz.custQ = el.value; $("#wiz-cust-list").innerHTML = wizCustList(); },
  wizDateIn: el => { if (el.value) { wiz.date = el.value; renderWizard(); } },
  wizTimeIn: el => { wiz.time = el.value || null; const b = $(".sheet-f [data-act='wizNext']"); if (b) b.disabled = !(wiz.date && wiz.time); $$(".slot").forEach(s => s.classList.toggle("on", s.dataset.t === wiz.time)); },
  wizLoc: el => { wiz.location = el.value; },
  wizNotes: el => { wiz.notes = el.value; },
  wizDisc: el => { wiz.discount = num(el.value); $("#wiz-lines").innerHTML = wizLinesHTML(); $("#wiz-total").textContent = money(totalOf(wizObj())); },
  jobDisc: el => { const j = jobById(el.dataset.job); j.discount = num(el.value); debSave(); $("#jadd-total").textContent = money(totalOf(j)); clearTimeout(INPUT._rt); INPUT._rt = setTimeout(() => { const y = $(".sheet-b").scrollTop; rerender(); }, 400); },
  jobNotes: el => { const j = jobById(el.dataset.job); if (!j) return; j.notes = el.value; debSave(); const s = $("#notes-saved"); if (s) s.textContent = "Saved"; },
  zoneNote: el => {
    const j = jobById(el.dataset.job); j.condition = j.condition || { zones: {} }; j.condition.zones = j.condition.zones || {};
    const v = el.value.trim();
    if (v) j.condition.zones[ui.zone] = el.value; else delete j.condition.zones[ui.zone];
    debSave();
    const z = $(`#insp-svg [data-zone="${ui.zone}"]`); if (z) z.classList.toggle("has", !!v);
    const c = $("#zc-" + ui.zone); if (c) c.classList.toggle("has", !!v);
  },
  condDamage: el => { const j = jobById(el.dataset.job); j.condition = j.condition || { zones: {} }; j.condition.damage = el.value; debSave(); },
  cmp: el => { el.parentElement.style.setProperty("--pos", el.value + "%"); },
  nextDate: el => { const p = $("#next-preview"); if (p && el.value) p.innerHTML = `Recommended next detail: <b>${fmtDate(el.value, "full")}</b>`; },
  payAmt: el => { const bal = num(el.dataset.bal), a = num(el.value), o = $("#pay-after"); if (o) o.textContent = a <= 0 ? "—" : a >= bal - 0.001 ? "Paid in full" : "Partial · " + money(bal - a, "cents") + " left"; },
  ownerSel: el => { $("#vo-newcust").hidden = el.value !== "__new"; }
};

/* =========================================================
   Wiring
   ========================================================= */
document.addEventListener("click", e => {
  if (ui.moreOpen && !e.target.closest(".nav-more")) { ui.moreOpen = false; renderNav(route()); }
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  e.stopPropagation();
  fn(el.dataset, el, e);
});
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.input; if (k && INPUT[k]) INPUT[k](e.target, e); });
document.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.input === "ownerSel") INPUT.ownerSel(e.target); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (document.querySelector(".sheet-root[style]")) return; if (sheet) closeSheet(); else if (ui.moreOpen) { ui.moreOpen = false; renderNav(route()); } }
  if (e.key === "/" && !sheet && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); paletteSheet(); }
  if (e.key === "Enter" && e.target.id === "pal-q") { const b = $("#pal-res button"); if (b) b.click(); }
  if (e.key === "Enter" && e.target.id === "pm-new") ACT.pmAdd();
});
window.addEventListener("hashchange", () => { if (sheet) { const s = sheet; sheet = null; $("#sheet-host").innerHTML = ""; document.body.style.overflow = ""; } render(); });
window.addEventListener("storage", e => { if (e.key === KEY && e.newValue) { S = normalize(JSON.parse(e.newValue)); rerender(); } });

$("#file-in").addEventListener("change", async e => {
  const files = Array.from(e.target.files || []);
  if (!files.length || !pendingPhoto) return;
  const j = jobById(pendingPhoto.job); if (!j) return;
  const kind = pendingPhoto.kind;
  toast(files.length > 1 ? `Saving ${files.length} photos…` : "Saving photo…");
  let ok = 0;
  for (const f of files) {
    try { const data = await resizeImage(f); const id = uid("ph"); await Photos.put(id, data); j.photos[kind].push(id); ok++; }
    catch (err) { console.warn(err); }
  }
  save();
  const inComplete = sheet && sheet.key === "done-" + j.id;
  if (inComplete) completeSheet(j.id);
  rerender();
  toast(ok ? `${ok} ${kind} photo${ok > 1 ? "s" : ""} added` : "Couldn't read that image");
});
$("#backup-in").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const txt = await f.text(); const obj = JSON.parse(txt);
    const data = obj && obj.data ? obj.data : obj;
    if (!data || !Array.isArray(data.customers) || !Array.isArray(data.vehicles) || !Array.isArray(data.jobs)) throw new Error("bad");
    const n = `${data.customers.length} customers, ${data.vehicles.length} vehicles, ${data.jobs.length} jobs`;
    if (!await confirmBox({ title: "Restore this backup?", text: `It has ${n}${obj.exportedAt ? ", saved " + fmtDate(obj.exportedAt.slice(0, 10), "year") : ""}. Everything currently in the app will be replaced.`, ok: "Restore backup", danger: true })) return;
    await Photos.clear();
    for (const [id, v] of Object.entries(obj.photos || {})) await Photos.put(id, v);
    S = normalize(data); save(); go("today"); toast("Backup restored");
  } catch (err) { toast("That file isn't an Auto Detail Flow backup."); }
});

/* Boot */
S = load();
if (!localStorage.getItem(KEY)) save();
Photos.open();
render();
})();
</script>
</body>
</html>
