<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181b">
<title>Auto Detail Flow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316181b'/%3E%3Cpath d='M9 22 L17 8 H22 L14 22Z' fill='%23ff5a1f'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#16181b; --ink-2:#1e2125; --ink-3:#2a2e34; --ink-line:#33373d; --ink-text:#ecebe7; --ink-muted:#9a9a95;
  --paper:#f4f2ee; --card:#ffffff; --line:#e3dfd7; --line-2:#cfc9be;
  --text:#18191b; --text-2:#3c3d40; --muted:#6f6c66;
  --accent:#ff5a1f; --accent-ink:#c9400c; --accent-soft:#fff0e7;
  --ok:#1d7f48; --ok-soft:#e5f3ea; --warn:#9a6a0e; --warn-soft:#fbf0d9; --bad:#b8352a; --bad-soft:#fbe9e6; --info:#2f5d9e; --info-soft:#e8eef8;
  --r:10px; --r-sm:7px;
  --shadow:0 1px 0 rgba(20,20,20,.04), 0 1px 3px rgba(20,20,20,.05);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --nav-h:60px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
img{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- Top command bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--ink);color:var(--ink-text);border-bottom:1px solid #000}
.topbar-in{max-width:1180px;margin:0 auto;height:var(--nav-h);display:flex;align-items:center;gap:22px;padding:0 24px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.brand-mark{width:26px;height:26px;border-radius:6px;background:#0d0e10;display:grid;place-items:center;border:1px solid var(--ink-line)}
.brand-word{font-weight:800;letter-spacing:.14em;font-size:13px}
.brand-word b{color:var(--accent);font-weight:800}
.nav{display:flex;gap:2px;height:100%;align-items:stretch;flex:1}
.nav-btn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:none;border:0;color:var(--ink-muted);font-weight:650;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:0 12px;cursor:pointer;position:relative}
.nav-btn:hover{color:var(--ink-text)}
.nav-btn.on{color:#fff}
.nav-btn.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--accent);border-radius:3px 3px 0 0}
.nav-more{position:relative;display:flex}
.more-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:200px;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:var(--r);padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.more-menu button{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;color:var(--ink-text);padding:10px 12px;border-radius:6px;text-align:left;cursor:pointer;font-weight:550}
.more-menu button:hover,.more-menu button.on{background:var(--ink-3)}
.more-menu small{color:var(--ink-muted);font-weight:500}
.top-actions{display:flex;gap:10px;align-items:center}
.cmd{display:flex;align-items:center;gap:8px;background:var(--ink-2);border:1px solid var(--ink-line);color:var(--ink-muted);border-radius:8px;height:38px;padding:0 12px;cursor:pointer;min-width:190px;font-size:14px;white-space:nowrap}
.cmd kbd{margin-left:auto;font-family:inherit;font-size:11px;border:1px solid var(--ink-line);border-radius:4px;padding:1px 6px}
.icon-btn{background:none;border:0;color:var(--ink-text);width:42px;height:42px;display:grid;place-items:center;border-radius:8px;cursor:pointer}

/* ---------- Bottom nav (mobile) ---------- */
.bnav{display:none}

/* ---------- Layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow.acc{color:var(--accent-ink)}
h1.title{font-size:34px;line-height:1.05;letter-spacing:-.025em;font-weight:800;margin:4px 0 0}
.sub{color:var(--muted);margin:6px 0 0;max-width:560px}
h2.sec{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:34px 0 12px;display:flex;align-items:center;gap:10px;color:var(--text-2)}
h2.sec .count{background:var(--ink);color:#fff;border-radius:20px;padding:1px 8px;font-size:11px;letter-spacing:0}
h2.sec .rule{flex:1;height:1px;background:var(--line)}
h2.sec:first-child{margin-top:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.strong{font-weight:700}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.sticky{position:sticky;top:calc(var(--nav-h) + 20px)}
.split > *{min-width:0}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--card);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;letter-spacing:.01em}
.btn:hover{border-color:var(--text-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#f04d12}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(0,0,0,.05)}
.btn.danger{color:var(--bad);border-color:#e8c4bf}
.btn.danger:hover{background:var(--bad-soft)}
.btn.lg{height:56px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:0 22px}
.btn.xl{height:64px;font-size:16px;letter-spacing:.08em;text-transform:uppercase;width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{flex:none}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:700;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.card-b{padding:16px 18px}
.clickable{cursor:pointer;transition:border-color .12s}
.clickable:hover{border-color:var(--line-2)}

/* ---------- Pills / status ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:5px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#efece6;color:var(--text-2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.nodot::before{display:none}
.st-booked{background:#eceae5;color:#4a4a48}
.st-arrived{background:var(--info-soft);color:var(--info)}
.st-in_progress{background:var(--accent-soft);color:var(--accent-ink)}
.st-completed{background:var(--warn-soft);color:var(--warn)}
.st-paid{background:var(--ok-soft);color:var(--ok)}
.st-cancelled{background:#f1efea;color:#8a877f;text-decoration:line-through}
.st-draft{background:#eceae5;color:#4a4a48}
.st-sent{background:var(--info-soft);color:var(--info)}
.st-approved{background:var(--ok-soft);color:var(--ok)}
.st-declined{background:var(--bad-soft);color:var(--bad)}
.st-unpaid{background:var(--bad-soft);color:var(--bad)}
.st-partial{background:var(--warn-soft);color:var(--warn)}
.st-due{background:var(--warn-soft);color:var(--warn)}
.st-overdue{background:var(--bad-soft);color:var(--bad)}
.st-ok{background:#eceae5;color:#4a4a48}
.plate{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1.5px solid currentColor;border-radius:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:700;letter-spacing:.08em}

/* ---------- Today ---------- */
.today-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.today-date{font-size:44px;font-weight:850;letter-spacing:-.035em;line-height:1;margin-top:6px}
.daystrip{display:flex;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.daystrip div{padding:12px 20px;border-right:1px solid var(--line);min-width:130px}
.daystrip div:last-child{border-right:0}
.daystrip b{display:block;font-size:20px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.banner{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:var(--r);background:var(--ink);color:var(--ink-text);margin-bottom:22px;font-size:14px}
.banner .btn{height:34px;font-size:13px}
.banner .btn:not(.pri){background:transparent;color:#fff;border-color:#4a4e55}
.banner b{color:#fff}

.job-card{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.job-card + .job-card{margin-top:12px}
.job-time{background:var(--ink);color:#fff;padding:18px 14px;display:flex;flex-direction:column;justify-content:space-between}
.job-time .t{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
.job-time .ap{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ink-muted);margin-top:4px}
.job-time .bar{height:3px;background:var(--accent);width:28px;border-radius:2px}
.job-card.done .job-time{background:#3a3d42}
.job-card.live .job-time{background:var(--accent)}
.job-card.live .job-time .ap{color:#ffe1d3}
.job-card.live .job-time .bar{background:#fff}
.job-main{padding:16px 20px;display:flex;gap:18px;align-items:center;min-width:0}
.job-car{width:150px;flex:none}
.job-info{min-width:0}
.job-veh{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.job-meta{color:var(--muted);font-size:14px;margin-top:2px}
.job-svc{margin-top:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.job-svc span{color:var(--accent-ink)}
.job-sub{color:var(--muted);font-size:13px;margin-top:2px}
.job-act{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:10px;padding:16px 20px;min-width:200px}
.job-act .btn{min-width:170px}

.mini-list{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.mini{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.mini:hover{border-color:var(--line-2)}
.mini .mc{width:76px;flex:none}
.mini .mi{flex:1;min-width:0}
.mini .mt{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mr{text-align:right;flex:none}

.job-time .pill{display:none}
.vpic{aspect-ratio:3/2;border-radius:6px;overflow:hidden;background:#d8d4cb}
.vpic img{width:100%;height:100%;object-fit:cover}
.vcard-img.has-photo{padding:0;background:#d8d4cb}
.vcard-img.has-photo .vpic{border-radius:0;aspect-ratio:16/10}
.vcard-img .pill{z-index:1}
.hero-photo{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/2;background:#0e0f11;box-shadow:0 18px 40px rgba(0,0,0,.45);margin:4px 0 22px}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.hero-car:has(.hero-photo)::after{display:none}
.hero-ph-btn{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:7px;border:0;background:rgba(14,15,17,.72);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.hero-ph-btn:hover{background:rgba(14,15,17,.9)}
.hero-addph{text-align:center;margin:-4px 0 18px}
.hero-addph .btn{background:transparent;color:#ecebe7;border-color:#4a4e55}
.hero-addph .btn:hover{border-color:#8a8d93}
.jh-main{display:flex;gap:18px;align-items:center;min-width:0}
.jh-pic{width:150px;flex:none;cursor:pointer}
.vpf{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.vpf-img,.vpf-empty{width:180px;aspect-ratio:3/2;border-radius:8px;overflow:hidden;background:#ece9e2;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.vpf-empty{border-style:dashed;padding:14px}
.vpf-img img{width:100%;height:100%;object-fit:cover}
.vpf-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1;min-width:150px}
.vpf-acts .tiny{flex-basis:100%}
/* ---------- Empty ---------- */
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:38px 24px;text-align:center;background:rgba(255,255,255,.5)}
.empty .em-ic{width:120px;margin:0 auto 10px;opacity:.55}
.empty h3{margin:0;font-size:19px;letter-spacing:-.01em}
.empty p{margin:6px auto 16px;color:var(--muted);max-width:380px}
.empty.compact{padding:22px 18px}
.empty.compact p{margin-bottom:10px}

/* ---------- Search / filters ---------- */
.searchbar{position:relative;flex:1;min-width:220px}
.searchbar input{width:100%;height:48px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--card);padding:0 14px 0 42px;font-size:16px}
.searchbar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-weight:650;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .c{font-size:12px;opacity:.65;font-variant-numeric:tabular-nums}
.chip:hover:not(.on){border-color:var(--text-2)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}

/* ---------- Vehicle cards ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.vcard:hover{border-color:var(--line-2)}
.vcard-img{background:linear-gradient(180deg,#eeebe5,#e4e0d8);padding:18px 18px 8px;position:relative}
.vcard-img .pill{position:absolute;top:12px;right:12px}
.vcard-b{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
.vcard-name{font-size:19px;font-weight:800;letter-spacing:-.02em}
.vcard-sub{color:var(--muted);font-size:14px}
.vcard-cust{margin-top:8px;font-weight:600;font-size:14px}
.vcard-dates{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.vcard-dates div + div{border-left:1px solid var(--line);padding-left:12px}
.vcard-dates b{display:block;font-size:15px}

/* ---------- Vehicle hero ---------- */
.hero{background:radial-gradient(120% 140% at 85% 30%,#2b2f35 0%,#1a1c20 55%,#141518 100%);color:var(--ink-text);border-radius:14px;overflow:hidden;position:relative}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:10px;padding:30px 32px 10px;align-items:center}
.hero h1{font-size:46px;line-height:1;letter-spacing:-.035em;margin:8px 0 6px;color:#fff;font-weight:850}
.hero .hsub{font-size:17px;color:#c9c8c3}
.hero .hcust{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero .hcust button{background:none;border:0;color:#fff;font-weight:700;font-size:16px;padding:0;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.3)}
.hero .plate{color:#fff}
.hero-car{position:relative}
.hero-car::after{content:"";position:absolute;left:8%;right:8%;bottom:6%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink-line)}
.hero-stats > div{padding:16px 22px;border-right:1px solid var(--ink-line)}
.hero-stats > div:last-child{border-right:0}
.hero-stats .eyebrow{color:var(--ink-muted)}
.hero-stats b{display:block;font-size:20px;color:#fff;margin-top:3px;letter-spacing:-.01em}
.hero-stats b.acc{color:var(--accent)}
.hero-stats .hs-sub{font-size:12px;color:var(--ink-muted)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero-actions .btn:not(.pri){background:transparent;color:#fff;border-color:#4a4e55}
.hero-actions .btn:not(.pri):hover{border-color:#8a8d93}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:650;cursor:pointer;padding:0;margin-bottom:14px;font-size:14px}
.back:hover{color:var(--text)}

/* ---------- Timeline ---------- */
.tl{position:relative;padding-left:4px}
.tl-item{display:grid;grid-template-columns:72px 18px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;cursor:pointer}
.tl-item:hover .tl-title{color:var(--accent-ink)}
.tl-date{text-align:right;font-weight:750;font-size:14px;line-height:1.2;padding-top:1px}
.tl-date small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.tl-dot{position:relative;height:100%}
.tl-dot::before{content:"";position:absolute;left:5px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2.5px solid var(--ink)}
.tl-dot::after{content:"";position:absolute;left:9px;top:18px;bottom:-16px;width:2px;background:var(--line)}
.tl-item:last-child .tl-dot::after{display:none}
.tl-item.up .tl-dot::before{border-color:var(--accent);background:var(--accent)}
.tl-title{font-weight:750}
.tl-sub{color:var(--muted);font-size:13px}
.tl-amt{text-align:right}
.tl-amt b{display:block;font-variant-numeric:tabular-nums}

/* ---------- Key/value ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.lines{display:grid;gap:0}
.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.line:last-child{border-bottom:0}
.line .l{color:var(--text-2)}
.line .r{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.line.total{border-top:2px solid var(--text);border-bottom:0;padding-top:12px;margin-top:4px;font-size:18px}
.line.total .l,.line.total .r{font-weight:850;color:var(--text)}
.line.minus .r{color:var(--ok)}

/* ---------- Job screen ---------- */
.job-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.job-head h1{font-size:38px;line-height:1.02;letter-spacing:-.03em;margin:4px 0 4px;font-weight:850}
.job-head .jh-svc{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.job-head .jh-total{font-size:34px;font-weight:850;letter-spacing:-.02em;text-align:right;line-height:1}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 18px}
.step{position:relative;padding-top:12px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a4a097}
.step::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:3px;background:#e1ddd5}
.step.done{color:var(--text)}
.step.done::before{background:var(--ink)}
.step.cur{color:var(--accent-ink)}
.step.cur::before{background:var(--accent)}
.actionbar{display:flex;gap:10px;align-items:stretch;margin-bottom:24px}
.actionbar .btn.xl{flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}
.panel-h .hint{color:var(--muted);font-size:13px;margin-left:auto}
.panel-b{padding:16px 18px}
.seg-label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--card)}
.seg button{height:48px;border:0;border-right:1px solid var(--line-2);background:none;font-weight:700;cursor:pointer;font-size:14px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.seg button.on.heavy{background:var(--bad);}
.seg button.on.mod{background:var(--warn)}
.cond-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.inspect{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.inspect svg .zone{cursor:pointer;transition:fill .12s}
.inspect svg .zone:hover{fill:rgba(255,90,31,.18)}
.inspect svg .zone.has{fill:rgba(255,90,31,.32);stroke:var(--accent)}
.inspect svg .zone.sel{stroke:var(--ink);stroke-width:2.5}
.zone-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.zone-tabs .chip{height:34px;font-size:13px}
.zone-tabs .chip.has:not(.on){border-color:var(--accent);color:var(--accent-ink)}
.zone-list{margin-top:10px;display:grid;gap:6px}
.zone-list div{font-size:13px;background:var(--paper);border-radius:6px;padding:7px 10px}
.zone-list b{text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-right:6px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qchips button{height:34px;padding:0 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--paper);font-weight:650;font-size:13px;cursor:pointer}
.qchips button:hover{border-color:var(--text-2)}
.addon-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.addon-row:last-child{border-bottom:0}

/* ---------- Photos ---------- */
.photo-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.photo-col h4{margin:0 0 8px;font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumb{aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:#e6e2da;cursor:pointer;position:relative;border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.add-photo{aspect-ratio:4/3;border-radius:6px;border:1.5px dashed var(--line-2);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-weight:700;font-size:12px;color:var(--text-2)}
.add-photo:hover{border-color:var(--accent);color:var(--accent-ink)}
.cmp{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:#222;--pos:50%;user-select:none;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .cmp-b{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.cmp .cmp-line{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;background:#fff;transform:translateX(-1px);pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.cmp .cmp-knob{position:absolute;top:50%;left:var(--pos);width:42px;height:42px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);display:grid;place-items:center;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.3);color:var(--ink)}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp .tag{position:absolute;top:12px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:850;letter-spacing:.12em;background:rgba(0,0,0,.6);color:#fff;pointer-events:none}
.cmp .tag.l{left:12px}.cmp .tag.r{right:12px;background:var(--accent)}
.ba-stack{display:none}
.photo-pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pair-cap{display:flex;justify-content:space-between;margin-top:8px;font-size:13px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.flabel{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.field label .opt,.flabel .opt{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
.input,.field input,.field select,.field textarea{height:48px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--card);padding:0 12px;font-size:16px;width:100%}
.field textarea,textarea.input{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.45}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus,.searchbar input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.frow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field input,.field select,.field textarea,.input{min-width:0}
.money-in{position:relative}
.money-in span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.money-in input{padding-left:28px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer;position:relative;padding:0}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.typepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.typepick button{border:1px solid var(--line-2);background:var(--card);border-radius:var(--r-sm);padding:6px 4px 6px;cursor:pointer;font-weight:700;font-size:12px;line-height:1.2;min-height:64px}
.typepick button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:#f7f5f1}
.typepick button{display:flex;flex-direction:column;gap:5px;align-items:stretch;padding:4px 4px 6px;text-align:center}
.tp-img{display:block;aspect-ratio:3/2;border-radius:5px;overflow:hidden;background:#ece9e2}
.tp-img img{width:100%;height:100%;object-fit:cover;display:block}
.tp-svg{display:flex;align-items:center;padding:4px 6px}
.tp-svg svg{width:100%;height:auto;display:block}

/* ---------- Sheet / modal ---------- */
.sheet-root{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.sheet-bg{position:absolute;inset:0;background:rgba(14,15,17,.55)}
.sheet{position:relative;background:var(--paper);width:100%;min-width:0;max-width:580px;max-height:calc(100vh - 48px);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .16s ease-out}
.sheet.wide{max-width:760px}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1}
.sheet-h .x{width:40px;height:40px;border-radius:8px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--text-2)}
.sheet-h .x:hover{background:var(--paper)}
.sheet-b{padding:18px 20px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet-f .tot{flex:1}
.sheet-f .tot small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sheet-f .tot b{font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wiz-prog{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:0 20px;background:var(--card)}
.wiz-prog i{height:4px;border-radius:2px;background:#e4e0d8}
.wiz-prog i.on{background:var(--accent)}
.wiz-prog i.done{background:var(--ink)}
.wiz-step{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pick{display:grid;gap:8px}
.pick-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;min-height:64px}
.pick-item:hover{border-color:var(--text-2)}
.pick-item.on{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pick-item .pi-main{flex:1;min-width:0}
.pick-item .pi-t{font-weight:750;font-size:16px}
.pick-item .pi-s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-item .pi-r{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.pick-item .pi-r small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.pick-item .pi-car{width:84px;flex:none}
.pick-add{border-style:dashed;color:var(--accent-ink);font-weight:750;justify-content:center;min-height:56px}
.check{width:26px;height:26px;border-radius:6px;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;color:#fff}
.on > .check{background:var(--accent);border-color:var(--accent)}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dbtn{flex:none;width:64px;height:72px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.dbtn small{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dbtn b{font-size:22px;letter-spacing:-.02em}
.dbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dbtn.on small{color:#c9c8c3}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{height:46px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--card);font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;font-size:14px}
.slot.on{background:var(--accent);border-color:var(--accent);color:#fff}
.slot.busy{background:repeating-linear-gradient(135deg,#efece6 0 6px,#f7f5f1 6px 12px);color:#a19d94}
.slot.busy.on{background:var(--accent);color:#fff}
.confirm-b{padding:22px 22px 8px}
.confirm-b h3{margin:0 0 6px;font-size:19px}
.confirm-b p{margin:0;color:var(--muted)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-weight:650;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

/* ---------- Services ---------- */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative;overflow:hidden}
.svc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink)}
.svc-name{font-size:13px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
.svc-price{font-size:32px;font-weight:850;letter-spacing:-.03em;margin:6px 0 0;font-variant-numeric:tabular-nums}
.svc-dur{color:var(--muted);font-size:13px;font-weight:600}
.svc-desc{color:var(--text-2);font-size:14px;margin:10px 0}
.svc ul{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:5px;font-size:14px}
.svc li{display:flex;gap:8px;align-items:flex-start}
.svc li::before{content:"";width:12px;height:2px;background:var(--accent);margin-top:10px;flex:none}
.svc-foot{margin-top:auto;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.addon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.addon-tile{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.addon-tile:hover{border-color:var(--line-2)}
.addon-tile b{font-variant-numeric:tabular-nums}

/* ---------- Lists (customers, payments, bookings) ---------- */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;min-height:66px}
.li:last-child{border-bottom:0}
.li:hover{background:#fbfaf8}
.li .av{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;letter-spacing:.02em}
.li .lm{flex:1;min-width:0}
.li .lt{font-weight:750;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .ls{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lr{text-align:right;flex:none}
.li .lr b{display:block;font-variant-numeric:tabular-nums}
.li .ltime{width:68px;flex:none;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.li .ltime small{display:block;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.08em}
.day-h{display:flex;align-items:baseline;gap:10px;margin:24px 0 8px}
.day-h b{font-size:15px;font-weight:800}
.day-h span{color:var(--muted);font-size:13px}
.day-h:first-child{margin-top:0}

/* ---------- Reports ---------- */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.stat-row > div{padding:18px 20px;border-right:1px solid var(--line)}
.stat-row > div:last-child{border-right:0}
.stat-row.s3{grid-template-columns:repeat(3,1fr)}
.stat-row b{display:block;font-size:30px;font-weight:850;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.stat-row .hs-sub{font-size:13px;color:var(--muted)}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.bar-row .bl{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bv{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums;text-align:right}
.bar-row .bt{grid-column:1/-1;height:8px;background:#efece6;border-radius:4px;overflow:hidden}
.bar-row .bt i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}

/* ---------- Settings ---------- */
.set-grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.set-nav{display:grid;gap:2px}
.set-nav button{text-align:left;background:none;border:0;padding:10px 12px;border-radius:7px;font-weight:650;cursor:pointer;color:var(--text-2)}
.set-nav button:hover{background:rgba(0,0,0,.04)}
.notice{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);border:1px solid #ffd3bd;color:#6b2a0d;font-size:14px;margin-bottom:16px}
.notice svg{flex:none;margin-top:1px;color:var(--accent-ink)}
.data-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.data-act{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;text-align:left}
.data-act:hover{border-color:var(--text-2)}
.data-act b{font-size:15px}
.data-act span{color:var(--muted);font-size:13px}
.data-act.danger b{color:var(--bad)}
.pm-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pm-row:last-child{border-bottom:0}

/* ---------- Palette ---------- */
.pal-res{display:grid;gap:4px;margin-top:12px}
.pal-res button{display:flex;gap:12px;align-items:center;padding:10px 12px;border:0;background:var(--card);border-radius:8px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--line)}
.pal-res button:hover,.pal-res button.on{border-color:var(--accent)}
.pal-res .pc{width:64px;flex:none}

/* ---------- Receipt ---------- */
.receipt{background:#fff;padding:26px;border-radius:var(--r);border:1px solid var(--line)}
.receipt h2{margin:0;font-size:20px}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;left:0;top:0;width:100%}
  .sheet-root{position:absolute;inset:0 auto auto 0;display:block;padding:0;width:100%}
  .sheet-bg{display:none}
  .sheet,.sheet-b{box-shadow:none;max-height:none!important;height:auto;overflow:visible!important;background:#fff}
  .receipt{border:0}
}

/* ---------- Responsive ---------- */
@media (max-width:1200px){
  .cmd{min-width:0;width:40px;padding:0;justify-content:center}
  .cmd span,.cmd kbd{display:none}
  .topbar-in{gap:14px}
  .nav-btn{padding:0 9px}
}
@media (max-width:1100px){
  .split{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .hero-in{grid-template-columns:1fr;padding:24px 24px 4px}
  .hero-car{max-width:520px;margin:0 auto;width:100%}
  .set-grid{grid-template-columns:1fr}
  .set-nav{display:none}
}
@media (max-width:820px){
  .nav{display:none}
  .topbar-in{padding:0 12px 0 16px;gap:8px}
  .topbar-in .spacer-m{flex:1}
  .top-actions .btn{display:none}
  .cmd{background:none;border:0;min-width:0;padding:0;width:42px;justify-content:center;color:var(--ink-text)}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);border-top:1px solid #000;padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{height:64px;background:none;border:0;color:var(--ink-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.04em;cursor:pointer}
  .bnav button.on{color:#fff}
  .bnav button.on svg{color:var(--accent)}
  .bnav .plus{display:grid;place-items:center}
  .bnav .plus i{width:50px;height:50px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:#fff}
  .wrap{padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
  h1.title{font-size:28px}
  .today-date{font-size:32px}
  .daystrip{width:100%}
  .daystrip div{flex:1;min-width:0;padding:10px 12px}
  .daystrip b{font-size:17px}
  .quick .btn{flex:1;min-width:0;padding:0 10px}
  .job-card{grid-template-columns:minmax(0,1fr)}
  .job-time{flex-direction:row;align-items:center;padding:10px 16px;gap:10px;justify-content:flex-start}
  .job-time .t{font-size:18px}
  .job-time .ap{margin:0}
  .job-time .bar{display:none}
  .job-time .pill{display:inline-flex;margin-left:auto}
  .job-main{padding:14px 16px 4px;gap:12px}
  .job-car{width:96px}
  .job-veh{font-size:19px}
  .job-act{padding:12px 16px 16px;min-width:0;align-items:stretch}
  .job-act .pill{display:none}
  .job-act .btn{width:100%;height:54px}
  .g2,.g3{grid-template-columns:1fr}
  .hero h1{font-size:34px}
  .hero-in{padding:20px 18px 0}
  .hero-stats{grid-template-columns:1fr 1fr}
  .hero-stats > div{padding:12px 16px;border-bottom:1px solid var(--ink-line)}
  .hero-stats > div:nth-child(2n){border-right:0}
  .hero-actions .btn{flex:1}
  .job-head h1{font-size:26px}
  .jh-pic{width:92px}
  .jh-main{gap:12px;align-items:flex-start}
  .hero-photo{margin-bottom:16px}
  .vpf-img,.vpf-empty{width:100%;max-width:none}
  .typepick{grid-template-columns:repeat(3,minmax(0,1fr))}

function isLight(hex) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 150;
}
function vehCar(v, opts = {}) {
  if (v && v.photo && !opts.svgOnly) return `<div class="vpic${opts.flush ? " flush" : ""}">${pimg(v.photo, vFull(v))}</div>`;
  return v ? carSVG(v.type, v.color, opts) : carSVG("Sedan", "#b9b5ac", opts);
}
/* <img> for a stored photo; fills src right away when we already have it, otherwise hydratePhotos() does */
function pimg(id, alt, extra = "") {
  const src = photoSync(id);
  return `<img data-pid="${esc(id)}"${src ? ` src="${src}" data-loaded="1"` : ""} alt="${esc(alt || "")}" ${extra}>`;
}
function photoSync(id) {
  if (!id) return null;
  if (id.startsWith("dv:")) return DEMO_IMG[id.slice(3)] || null;
  if (id.startsWith("demo:")) return demoPhoto(id);
  return Photos.cache.get(id) || null;
}

/* Demo before/after photos, generated as SVG so the file stays standalone */
function demoPhoto(id) {
  const [, type, color, kind] = id.split(":");
  const s = SHAPES[SHAPE_OF[type] || type] || (type === "Truck" ? SHAPES.Pickup : SHAPES.Sedan);
  const hex = colorHex(color);
  const rnd = mulberry(hashStr(id.replace(/:(before|after)$/, "")));
  const before = kind === "before";
  let dirt = "";
  if (before) {
    for (let i = 0; i < 260; i++) {
      const x = 20 + rnd() * 360, y = 20 + Math.pow(rnd(), .6) * 90, r = .4 + rnd() * 1.8;
      dirt += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="${rnd() > .5 ? "#6b5a3e" : "#8a7a5a"}" opacity="${(.25 + rnd() * .5).toFixed(2)}"/>`;
    }
  } else {
    for (let i = 0; i < 5; i++) {
      const x = 60 + rnd() * 280, y = 30 + rnd() * 40, r = 2 + rnd() * 3;
      dirt += `<path d="M${x} ${y - r * 2} L${x + r * .4} ${y} L${x} ${y + r * 2} L${x - r * .4} ${y}Z M${x - r * 2} ${y} L${x} ${y - r * .4} L${x + r * 2} ${y} L${x} ${y + r * .4}Z" fill="#fff" opacity=".85"/>`;
    }
  }
  const wheel = x => `<circle cx="${x}" cy="106" r="${s.r}" fill="#111"/><circle cx="${x}" cy="106" r="${s.r - 8}" fill="${before ? "#6d6a62" : "#a3a8ae"}"/><circle cx="${x}" cy="106" r="${s.r - 11}" fill="${before ? "#4a473f" : "#6a6f75"}"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${before ? "#2e2c28" : "#2a2e34"}"/><stop offset=".62" stop-color="${before ? "#1c1b18" : "#16181c"}"/><stop offset=".62" stop-color="${before ? "#3b3832" : "#33363b"}"/><stop offset="1" stop-color="${before ? "#24221e" : "#1e2024"}"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="${before ? .06 : .42}"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
<linearGradient id="mud" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#5a4a30" stop-opacity="0"/><stop offset="1" stop-color="#5a4a30" stop-opacity=".75"/></linearGradient>
<linearGradient id="streak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cp"><path d="${s.body}"/></clipPath>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
${before ? "" : '<rect x="0" y="0" width="800" height="40" fill="#fff" opacity=".05"/><rect x="120" y="60" width="560" height="6" rx="3" fill="#fff" opacity=".35"/>'}
<ellipse cx="400" cy="512" rx="360" ry="16" fill="#000" opacity=".55"/>
<g transform="translate(0 250) scale(2)">
<path d="${s.body}" fill="${hex}"/>
<path d="${s.body}" fill="url(#gl)"/>
<g clip-path="url(#cp)">${before ? '<rect x="0" y="0" width="400" height="130" fill="#7d7461" opacity=".28"/><rect x="0" y="0" width="400" height="130" fill="url(#mud)"/>' : '<rect x="-40" y="18" width="160" height="90" fill="url(#streak)" transform="skewX(-30)" opacity=".7"/><rect x="190" y="18" width="70" height="90" fill="url(#streak)" transform="skewX(-30)" opacity=".45"/>'}</g>
${s.win.map(w => `<path d="${w}" fill="#1b2026" opacity="${before ? .8 : .95}"/>${before ? `<path d="${w}" fill="#a39a85" opacity=".28"/>` : `<path d="${w}" fill="#cfe0f0" opacity=".1"/>`}`).join("")}
<g clip-path="url(#cp)">${dirt}</g>
${s.wheels.map(wheel).join("")}
${!before ? s.wheels.map(x => `<path d="M${x - 10} 96 A14 14 0 0 1 ${x + 8} 94" stroke="#fff" stroke-width="1.5" fill="none" opacity=".7"/>`).join("") : ""}
${!before ? dirt : ""}
</g>
</svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

    if (raw) { const d = JSON.parse(raw); if (d && d.v) return normalize(d); }

  return d;
}
function normalize(d) {
  const e = emptyState();
  const o = Object.assign({}, e, d);
  o.settings = Object.assign(defaultSettings(), d.settings || {});
  ["customers", "vehicles", "jobs", "quotes"].forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });
  if (!Array.isArray(o.services)) o.services = defaultServices();
  if (!Array.isArray(o.addons)) o.addons = defaultAddons();
  if ((d.v || 1) < 2) o.vehicles.forEach(v => { if (v.type === "Truck") v.type = "Pickup Truck"; if (v.type === "Van" && /sienna|odyssey|pacifica|carnival|quest/i.test(v.model || "")) v.type = "Minivan"; });
  o.v = 2;
  o.jobs.forEach(j => { j.addons = j.addons || []; j.payments = j.payments || []; j.photos = j.photos || { before: [], after: [] }; j.photos.before = j.photos.before || []; j.photos.after = j.photos.after || []; });
  o.quotes.forEach(q => { q.addons = q.addons || []; });
  return o;
}

/* Photo store */
const Photos = {
  db: null, cache: new Map(), ready: null, fallback: false,
  open() {
    if (this.ready) return this.ready;
    this.ready = new Promise(res => {
      try {
        const r = indexedDB.open("autodetailflow-photos", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("photos");
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => { this.fallback = true; res(); };
        r.onblocked = () => { this.fallback = true; res(); };
      } catch (e) { this.fallback = true; res(); }
    });
    return this.ready;
  },
  async tx(mode, fn) {
    await this.open();
    if (this.fallback || !this.db) return null;
    return new Promise((res, rej) => {
      const t = this.db.transaction("photos", mode); const st = t.objectStore("photos");
      const r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
    });
  },
  async get(id) {
    if (id.startsWith("demo:") || id.startsWith("dv:")) return photoSync(id);
    if (this.cache.has(id)) return this.cache.get(id);
    let v = null;
    try { v = this.fallback ? localStorage.getItem("adf.photo." + id) : await this.tx("readonly", st => st.get(id)); }
    catch (e) { v = null; }
    if (this.fallback && !v) v = localStorage.getItem("adf.photo." + id);
    if (v) this.cache.set(id, v);
    return v;
  },
  async put(id, data) {
    this.cache.set(id, data);
    await this.open();
    if (this.fallback) { localStorage.setItem("adf.photo." + id, data); return; }
    await this.tx("readwrite", st => st.put(data, id));
  },
  async del(id) {
    this.cache.delete(id);
    if (!id || isBuiltIn(id)) return;
    await this.open();
    if (this.fallback) { localStorage.removeItem("adf.photo." + id); return; }
    await this.tx("readwrite", st => st.delete(id));
  },
  async clear() {
    this.cache.clear();
    await this.open();
    Object.keys(localStorage).filter(k => k.startsWith("adf.photo.")).forEach(k => localStorage.removeItem(k));
    if (!this.fallback) await this.tx("readwrite", st => st.clear());
  }
};
const isBuiltIn = id => id.startsWith("demo:") || id.startsWith("dv:");
async function hydratePhotos(root = document) {
  for (const img of $$("img[data-pid]", root)) {
    if (img.dataset.loaded) continue;
    img.dataset.loaded = "1";
    const src = await Photos.get(img.dataset.pid);
    if (src) img.src = src; else img.alt = "Photo missing";
  }
}
function resizeImage(file, max = 1400, q = .8) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = () => rej(new Error("Not an image"));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const cust = id => S.customers.find(c => c.id === id);
const veh = id => S.vehicles.find(v => v.id === id);
const jobById = id => S.jobs.find(j => j.id === id);
const quoteById = id => S.quotes.find(q => q.id === id);
const svcById = id => S.services.find(s => s.id === id);
const addonById = id => S.addons.find(a => a.id === id);
const vName = v => v ? `${v.make} ${v.model}` : "Unknown vehicle";
const vFull = v => v ? `${v.year || ""} ${v.make} ${v.model}`.trim() : "Unknown vehicle";

const subtotalOf = x => (Number(x.servicePrice) || 0) + (x.addons || []).reduce((a, b) => a + (Number(b.price) || 0), 0);
const totalOf = x => Math.max(0, subtotalOf(x) - (Number(x.discount) || 0));
const durOf = x => (Number(x.serviceDuration) || 0) + (x.addons || []).reduce((a, b) => a + (Number(b.duration) || 0), 0);
const paidOf = j => (j.payments || []).reduce((a, p) => a + (Number(p.amount) || 0), 0);
const balanceOf = j => Math.max(0, Math.round((totalOf(j) - paidOf(j)) * 100) / 100);
function payStatus(j) { const p = paidOf(j), t = totalOf(j); if (t > 0 && p >= t - 0.001) return "paid"; if (t === 0) return "paid"; return p > 0 ? "partial" : "unpaid"; }
function jobStage(j) { if (j.status === "completed" && payStatus(j) === "paid") return "paid"; return j.status; }
const STAGE_LABEL = { booked: "Booked", arrived: "Arrived", in_progress: "In progress", completed: "Completed", paid: "Paid", cancelled: "Cancelled" };
const isOpen = j => ["booked", "arrived", "in_progress"].includes(j.status);
const jobSort = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);
const vJobs = vId => S.jobs.filter(j => j.vehicleId === vId);
const cJobs = cId => S.jobs.filter(j => j.customerId === cId);
function lastDetail(v) { const c = vJobs(v.id).filter(j => j.status === "completed").sort(jobSort); return c.length ? c[c.length - 1] : null; }
function upcomingFor(v) { const t = today(); const u = vJobs(v.id).filter(j => isOpen(j) && (j.date >= t || j.status !== "booked")).sort(jobSort); return u[0] || null; }
function dueState(v) {
  if (upcomingFor(v)) return "booked";
  if (!v.nextDue) return "none";
  const n = daysBetween(today(), v.nextDue);
  if (n < 0) return "overdue";
  if (n <= 14) return "due";
  return "ok";
}
function custLifetime(c) { return cJobs(c.id).filter(j => j.status === "completed").reduce((a, j) => a + totalOf(j), 0); }
function custBalance(c) { return cJobs(c.id).filter(j => j.status === "completed").reduce((a, j) => a + balanceOf(j), 0); }
function custLastVisit(c) { const d = cJobs(c.id).filter(j => j.status === "completed").map(j => j.date).sort(); return d[d.length - 1] || null; }
function pill(stage, label) { return `<span class="pill st-${stage}">${esc(label || STAGE_LABEL[stage] || stage)}</span>`; }
function svcLine(x) {
  const n = (x.addons || []).length;
  if (!n) return esc(x.serviceName);
  if (n === 1) return esc(x.serviceName) + ` <span>+ ${esc(x.addons[0].name)}</span>`;
  return esc(x.serviceName) + ` <span>+ ${n} add-ons</span>`;
}

function route() {
  const h = (location.hash || "#/today").replace(/^#\/?/, "");
  const [name, id] = h.split("/");
  return { name: name || "today", id: id ? decodeURIComponent(id) : null };
}
function go(to) { if (location.hash === "#/" + to) render(); else location.hash = "#/" + to; }

function renderNav(r) {
  const cur = PARENT[r.name] || r.name;
  const moreOn = MORE.some(m => m[0] === cur);
  $("#nav").innerHTML = NAV.map(([k, l]) => `<button class="nav-btn${cur === k ? " on" : ""}" data-act="go" data-to="${k}">${l}</button>`).join("") +
    `<div class="nav-more"><button class="nav-btn${moreOn ? " on" : ""}" data-act="toggleMore" aria-expanded="${ui.moreOpen}">More ${I.down}</button>
    ${ui.moreOpen ? `<div class="more-menu">${MORE.map(([k, l]) => `<button data-act="go" data-to="${k}" class="${cur === k ? "on" : ""}">${l}</button>`).join("")}</div>` : ""}</div>`;
  const b = [["today", "Today", I.today], ["bookings", "Bookings", I.cal], ["+", "", ""], ["vehicles", "Vehicles", I.car], ["more", "More", I.more]];
  const bOn = k => k === "more" ? (moreOn || cur === "services" || cur === "customers") : cur === k;

let lastRoute = "";
function render(keep) {
  const r = route();
  const key = r.name + "/" + (r.id || "");
  const view = VIEWS[r.name] || VIEWS.today;
  const y = window.scrollY;
  $("#view").innerHTML = view(r.id);
  renderNav(r);
  hydratePhotos($("#view"));
  if (keep || key === lastRoute) window.scrollTo(0, y); else window.scrollTo(0, 0);
  lastRoute = key;
  document.title = (TITLES[r.name] ? TITLES[r.name] + " · " : "") + "Auto Detail Flow";
}

let sheet = null;
function openSheet(o) {

  sheet = o;
  host.innerHTML = `<div class="sheet-root"><div class="sheet-bg" data-act="closeSheet"></div>

function closeSheet() {
  const s = sheet; sheet = null;

}
function confirmBox({ title, text, ok = "Confirm", danger = false }) {
  return new Promise(res => {
    const el = document.createElement("div");
    el.className = "sheet-root"; el.style.zIndex = 160;
    el.innerHTML = `<div class="sheet-bg"></div><div class="sheet" style="max-width:420px"><div class="confirm-b"><h3>${esc(title)}</h3><p>${esc(text || "")}</p></div>
      <div class="sheet-f" style="border:0;background:var(--paper)"><span class="spacer"></span><button class="btn" data-r="0">Cancel</button><button class="btn ${danger ? "danger" : "pri"}" data-r="1">${esc(ok)}</button></div></div>`;
    document.body.appendChild(el);
    const done = v => { el.remove(); res(v); };
    el.addEventListener("click", e => { const b = e.target.closest("[data-r]"); if (b) done(b.dataset.r === "1"); else if (e.target.classList.contains("sheet-bg")) done(false); });
    $("[data-r='1']", el).focus();
  });
}
let toastT = null;
function toast(msg) {
  let t = $(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}

function dueText(v) {
  if (!v.nextDue) return "Not set";
  const n = daysBetween(today(), v.nextDue);

  if (n < 0) return Math.abs(n) + (n === -1 ? " day" : " days") + " overdue";
  return "In " + n + (n === 1 ? " day" : " days");
}

function vehMatches(v, q) {
  if (!q) return true;
  const c = cust(v.customerId);
  const hay = [v.year, v.make, v.model, v.color, v.plate, v.type, c && c.name, c && c.phone].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w) || hay.replace(/\s/g, "").includes(w));
}
function vehFilterFn(f) {
  return v => {
    const s = dueState(v);
    if (f === "due") return s === "due";
    if (f === "booked") return s === "booked";
    if (f === "follow") { if (s === "overdue") return true; if (s === "none") { const l = lastDetail(v); return l && daysBetween(l.date, today()) > 60; } return false; }
    return true;
  };
}
function vehCard(v) {
  const c = cust(v.customerId), l = lastDetail(v), s = dueState(v);

  return `<article class="vcard" data-act="go" data-to="vehicle/${v.id}">

        <div><span class="eyebrow">Next</span><b style="${s === "overdue" ? "color:var(--bad)" : ""}">${v.nextDue ? fmtDate(v.nextDue) : "—"}</b></div>

}

function bookingRow(j) {

  return `<div class="li" data-act="go" data-to="job/${j.id}">

    <div class="lm"><div class="lt">${esc(vName(v))} <span class="muted" style="font-weight:500">· ${esc(c ? c.name : "")}</span></div><div class="ls">${esc(j.serviceName)}${j.addons.length ? " + " + esc(j.addons.map(a => a.name).join(", ")) : ""}</div></div>
    <div class="lr"><b>${money(totalOf(j))}</b>${pill(jobStage(j))}</div></div>`;
}
VIEWS.bookings = function () {
  const t = today();
  let list;
  if (ui.bookTab === "upcoming") list = S.jobs.filter(j => isOpen(j)).sort(jobSort);
  else if (ui.bookTab === "past") list = S.jobs.filter(j => !isOpen(j)).sort(jobSort).reverse();
  else list = S.jobs.slice().sort(jobSort).reverse();
  const groups = [];
  list.forEach(j => { let g = groups[groups.length - 1]; if (!g || g.date !== j.date) { g = { date: j.date, jobs: [] }; groups.push(g); } g.jobs.push(j); });
  const tabs = [["upcoming", "Upcoming", S.jobs.filter(isOpen).length], ["past", "Completed & past", S.jobs.filter(j => !isOpen(j)).length], ["all", "All", S.jobs.length]];
  return `<div class="wrap">
  <div class="page-head"><div><div class="eyebrow">Bookings</div><h1 class="title">Your schedule</h1><p class="sub">Every appointment in order. Tap one to open the job.</p></div>
  <button class="btn pri" data-act="newBooking">+ New Booking</button></div>
  <div class="chips" style="margin-bottom:20px">${tabs.map(([k, l, n]) => `<button class="chip${ui.bookTab === k ? " on" : ""}" data-act="bookTab" data-t="${k}">${l} <span class="c">${n}</span></button>`).join("")}</div>
  ${groups.length ? groups.map(g => {
    const tot = g.jobs.reduce((a, j) => a + (j.status === "cancelled" ? 0 : totalOf(j)), 0);
    const late = g.date < t && g.jobs.some(j => j.status === "booked");
    return `<div class="day-h"><b>${relDay(g.date)}</b><span>${fmtDate(g.date, "year")} · ${g.jobs.length} job${g.jobs.length > 1 ? "s" : ""} · ${money(tot)}</span>${late ? `<span class="pill st-overdue">Past date</span>` : ""}</div><div class="list">${g.jobs.map(bookingRow).join("")}</div>`;
  }).join("") : (ui.bookTab === "upcoming" ? empty("Nothing booked yet", "Your schedule is open. Create your next booking.", `<button class="btn pri" data-act="newBooking">+ New Booking</button>`, { car: true }) : empty("No past jobs yet", "Completed jobs show up here.", "", {}))}
  </div>`;
};

/* =========================================================
   BOOKING / QUOTE WIZARD
   ========================================================= */
let wiz = null;
const STEP_LABEL = { customer: "Customer", vehicle: "Vehicle", service: "Service", when: "Date & time", addons: "Add-ons", review: "Review" };
const wizSteps = () => wiz.mode === "quote" ? ["customer", "vehicle", "service", "addons", "review"] : ["customer", "vehicle", "service", "when", "addons", "review"];
function startWizard(pre = {}) {
  wiz = Object.assign({ mode: "booking", customerId: null, vehicleId: null, serviceId: null, addonIds: [], discount: 0, notes: "", date: today(), time: null, location: "", quoteId: null, editQuoteId: null, newCust: false, newVeh: false, custQ: "", step: null }, pre);
  const steps = wizSteps();
  if (wiz.vehicleId) { const v = veh(wiz.vehicleId); if (v) wiz.customerId = v.customerId; }
  if (wiz.customerId && !wiz.location) { const c = cust(wiz.customerId); if (c) wiz.location = c.address || ""; }
  if (wiz.step == null) {
    wiz.step = 0;
    if (wiz.vehicleId) wiz.step = steps.indexOf(wiz.serviceId ? (wiz.mode === "booking" ? "when" : "review") : "service");
    else if (wiz.customerId) wiz.step = 1;
  }
  if (!S.services.length) { toast("Add a service first — that's what you'll book."); go("services"); return; }
  renderWizard();
}
function wizObj() {
  const s = svcById(wiz.serviceId);
  return { servicePrice: s ? s.price : 0, serviceDuration: s ? s.duration : 0, addons: wiz.addonIds.map(addonById).filter(Boolean), discount: wiz.discount };

VIEWS.payments = function () {
  const t = today(), ms = t.slice(0, 8) + "01";
  const owed = S.jobs.filter(j => j.status === "completed" && balanceOf(j) > 0).sort(jobSort);
  const all = [];
  S.jobs.forEach(j => j.payments.forEach(p => all.push({ p, j })));
  all.sort((a, b) => b.p.date.localeCompare(a.p.date));
  const monthTotal = all.filter(x => x.p.date >= ms && x.p.date <= t).reduce((a, x) => a + Number(x.p.amount), 0);
  const owedTotal = owed.reduce((a, j) => a + balanceOf(j), 0);
  const groups = [];
  all.forEach(x => { const k = x.p.date.slice(0, 7); let g = groups[groups.length - 1]; if (!g || g.k !== k) { g = { k, items: [] }; groups.push(g); } g.items.push(x); });
  return `<div class="wrap">
  <div class="page-head"><div><div class="eyebrow">Payments</div><h1 class="title">Paid and owed</h1><p class="sub">Track what customers paid and who still owes you. No card processing — just a clear record.</p></div></div>
  <div class="stat-row s3" style="margin-bottom:22px">
    <div><span class="eyebrow">Collected this month</span><b>${money(monthTotal)}</b></div>
    <div><span class="eyebrow">Outstanding</span><b style="color:${owedTotal > 0 ? "var(--bad)" : "inherit"}">${money(owedTotal)}</b><span class="hs-sub">${owed.length} job${owed.length === 1 ? "" : "s"}</span></div>
    <div><span class="eyebrow">Payments recorded</span><b>${all.length}</b></div>
  </div>
  <div class="chips" style="margin-bottom:18px"><button class="chip${ui.payTab === "outstanding" ? " on" : ""}" data-act="payTab" data-t="outstanding">Outstanding <span class="c">${owed.length}</span></button><button class="chip${ui.payTab === "log" ? " on" : ""}" data-act="payTab" data-t="log">Payment log <span class="c">${all.length}</span></button></div>
  ${ui.payTab === "outstanding" ? (owed.length ? `<div class="list">${owed.map(j => { const v = veh(j.vehicleId), c = cust(j.customerId);
      return `<div class="li" data-act="go" data-to="job/${j.id}"><div style="width:70px;flex:none">${vehCar(v, { noShadow: true })}</div><div class="lm"><div class="lt">${esc(c ? c.name : "")} <span class="muted" style="font-weight:500">· ${esc(vName(v))}</span></div><div class="ls">${esc(j.serviceName)} · ${fmtDate(j.date)} · paid ${money(paidOf(j))} of ${money(totalOf(j))}</div></div>
      <div class="lr"><b style="color:var(--bad)">${money(balanceOf(j), "cents")}</b>${pill(payStatus(j))}</div><button class="btn sm dark" data-act="payJob" data-id="${j.id}">Record</button></div>`; }).join("")}</div>`
      : empty("Everyone's paid up", "Completed jobs with a balance will show here.", "", {}))
    : (groups.length ? groups.map(g => { const [y, m] = g.k.split("-").map(Number); const tot = g.items.reduce((a, x) => a + Number(x.p.amount), 0);
      return `<div class="day-h"><b>${MONTHS_L[m - 1]} ${y}</b><span>${money(tot)} · ${g.items.length} payment${g.items.length === 1 ? "" : "s"}</span></div><div class="list">${g.items.map(({ p, j }) => { const v = veh(j.vehicleId), c = cust(j.customerId);
        return `<div class="li" data-act="go" data-to="job/${j.id}"><div class="ltime">${fmtDate(p.date).replace(/, \d{4}$/, "")}</div><div class="lm"><div class="lt">${esc(c ? c.name : "")} <span class="muted" style="font-weight:500">· ${esc(vName(v))}</span></div><div class="ls">${esc(j.serviceName)}</div></div><div class="lr"><b>${money(p.amount, "cents")}</b><span class="pill nodot">${esc(p.method)}</span></div></div>`; }).join("")}</div>`; }).join("")
      : empty("No payments yet", "When you record a payment on a job, it's logged here.", "", {}))}
  </div>`;
};

/* =========================================================
   REPORTS
   ========================================================= */
function periodRange(p) {
  const t = parseYmd(today());
  if (p === "week") { const s = new Date(t); s.setDate(t.getDate() - ((t.getDay() + 6) % 7)); const e = new Date(s); e.setDate(s.getDate() + 6); return [ymd(s), ymd(e)]; }
  if (p === "year") return [t.getFullYear() + "-01-01", t.getFullYear() + "-12-31"];
  const e = new Date(t.getFullYear(), t.getMonth() + 1, 0);
  return [ymd(new Date(t.getFullYear(), t.getMonth(), 1)), ymd(e)];
}
function bars(rows, fmt) {
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="bars">${rows.map(r => `<div class="bar-row" title="${esc(r.l)}: ${esc(fmt(r))}"><span class="bl">${esc(r.l)}</span><span class="bv">${fmt(r)}</span><div class="bt"><i style="width:${Math.max(2, r.v / max * 100)}%"></i></div></div>`).join("")}</div>`;
}
VIEWS.reports = function () {
  const [a, b] = periodRange(ui.period);
  const done = S.jobs.filter(j => j.status === "completed" && j.date >= a && j.date <= b);
  const revenue = done.reduce((s, j) => s + totalOf(j), 0);
  let collected = 0; S.jobs.forEach(j => j.payments.forEach(p => { if (p.date >= a && p.date <= b) collected += Number(p.amount) || 0; }));
  const avg = done.length ? revenue / done.length : 0;
  const svc = {}, add = {};
  done.forEach(j => {
    (svc[j.serviceName] = svc[j.serviceName] || { l: j.serviceName, v: 0, n: 0 }); svc[j.serviceName].v += j.servicePrice; svc[j.serviceName].n++;
    j.addons.forEach(x => { (add[x.name] = add[x.name] || { l: x.name, v: 0, n: 0 }); add[x.name].v += x.price; add[x.name].n++; });
  });
  const svcRows = Object.values(svc).sort((x, y) => y.v - x.v);
  const addRows = Object.values(add).sort((x, y) => y.n - x.n || y.v - x.v);
  const custIds = [...new Set(done.map(j => j.customerId))];
  const repeat = custIds.map(id => ({ c: cust(id), n: S.jobs.filter(j => j.customerId === id && j.status === "completed").length })).filter(x => x.c && x.n >= 2).sort((x, y) => y.n - x.n);
  const label = { week: "this week", month: "this month", year: "this year" }[ui.period];
  return `<div class="wrap">
  <div class="page-head"><div><div class="eyebrow">Reports</div><h1 class="title">How business is going</h1><p class="sub">${fmtDate(a, "year")} – ${fmtDate(b, "year")}. Based on completed jobs.</p></div>
  <div class="chips">${[["week", "This Week"], ["month", "This Month"], ["year", "This Year"]].map(([k, l]) => `<button class="chip${ui.period === k ? " on" : ""}" data-act="period" data-p="${k}">${l}</button>`).join("")}</div></div>
  <div class="stat-row">
    <div><span class="eyebrow">Revenue</span><b>${money(revenue)}</b><span class="hs-sub">completed work</span></div>
    <div><span class="eyebrow">Completed jobs</span><b>${done.length}</b><span class="hs-sub">${label}</span></div>
    <div><span class="eyebrow">Average job</span><b>${money(Math.round(avg))}</b><span class="hs-sub">per vehicle</span></div>
    <div><span class="eyebrow">Collected</span><b>${money(collected)}</b><span class="hs-sub">payments received</span></div>
  </div>
  <div class="grid g3" style="margin-top:18px">
    <div class="card"><div class="card-h"><h3>Top services</h3></div><div class="card-b">${svcRows.length ? bars(svcRows, r => money(r.v) + " · " + r.n + "×") : `<p class="muted small" style="margin:0">No completed jobs ${label}.</p>`}</div></div>
    <div class="card"><div class="card-h"><h3>Top add-ons</h3></div><div class="card-b">${addRows.length ? bars(addRows.map(r => Object.assign({}, r, { v: r.n })), r => r.n + "× · " + money(add[r.l].v)) : `<p class="muted small" style="margin:0">No add-ons sold ${label}. Offer one on your next job.</p>`}
      ${done.length ? `<div class="tiny muted" style="margin-top:14px">${Math.round(done.filter(j => j.addons.length).length / done.length * 100)}% of jobs included at least one add-on.</div>` : ""}</div></div>
    <div class="card"><div class="card-h"><h3>Repeat customers</h3><span class="small muted">${custIds.length ? Math.round(repeat.length / custIds.length * 100) + "%" : ""}</span></div><div class="card-b">
      ${repeat.length ? `<div class="lines">${repeat.map(x => `<div class="line" style="cursor:pointer" data-act="go" data-to="customer/${x.c.id}"><span class="l">${esc(x.c.name)}</span><span class="r">${x.n} visits</span></div>`).join("")}</div>` : `<p class="muted small" style="margin:0">No repeat customers among ${label}'s jobs yet. Set a next-detail date after each job to bring them back.</p>`}
      ${custIds.length ? `<div class="tiny muted" style="margin-top:12px">${repeat.length} of ${custIds.length} customer${custIds.length === 1 ? "" : "s"} served ${label} have been back at least twice.</div>` : ""}
    </div></div>
  </div></div>`;
};

const curJob = () => jobById(route().id);
async function deleteJobPhotos(j) {
  // a photo id is only ever attached to one record, but double-check before removing it from the device
  for (const p of j.photos.before.concat(j.photos.after)) {
    const used = S.jobs.some(o => o !== j && (o.photos.before.includes(p) || o.photos.after.includes(p))) || S.vehicles.some(v => v.photo === p);
    if (!used) await Photos.del(p);
  }
}
function allPhotoIds() {
  const ids = new Set();
  S.jobs.forEach(j => j.photos.before.concat(j.photos.after).forEach(p => ids.add(p)));
  S.vehicles.forEach(v => { if (v.photo) ids.add(v.photo); });
  return [...ids].filter(p => !isBuiltIn(p));
}

  palette: () => paletteSheet(),
  palGo: d => { closeSheet(); go(d.to); },
  dismissBanner: () => { S.settings.bannerDismissed = true; save(); rerender(); },
  scrollTo: d => { const el = document.getElementById(d.id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: "smooth" }); },

  // Booking wizard
  newBooking: d => { closeSheet(); startWizard({ vehicleId: d.vehicle || null, customerId: d.customer || null, serviceId: d.service || null, date: d.date || today() }); },
  newQuote: d => { closeSheet(); startWizard({ mode: "quote", vehicleId: d.vehicle || null, customerId: d.customer || null }); },
  wizBack: () => { wiz.newCust = wiz.newVeh = false; if (wiz.step > 0) wiz.step--; renderWizard(); },
  wizNext: () => wizAdvance(),
  wizGoto: d => { wiz.step = wizSteps().indexOf(d.s); renderWizard(); },
