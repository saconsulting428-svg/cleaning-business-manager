<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07030f">
  <meta name="description" content="Neon Ricochet - a neon arcade survival brick-breaker built with Phaser 3.">
  <title>Neon Ricochet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="stat"><span class="label">Score</span><span class="value" id="hud-score">0</span></div>
      <div class="stat"><span class="label">Best</span><span class="value" id="hud-best">0</span></div>
      <div class="stat"><span class="label">Level</span><span class="value" id="hud-level">1</span></div>
      <div class="stat lives"><span class="label">Lives</span><span class="value" id="hud-lives" aria-label="3 lives"></span></div>
      <div class="btns">
        <button id="btn-pause" class="icon-btn" title="Pause (P)" aria-label="Pause" aria-pressed="false"><svg viewBox="0 0 24 24"><path class="i-pause" d="M7 5h3v14H7zM14 5h3v14h-3z"/><path class="i-play" d="M8 5l11 7-11 7z"/></svg></button>
        <button id="btn-restart" class="icon-btn" title="Restart (R)" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
        <button id="btn-mute" class="icon-btn" title="Mute (M)" aria-label="Toggle sound" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="i-wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="i-x" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </header>

    <main id="stage">
      <div id="game"></div>
      <div id="effects" aria-label="Active power-ups"></div>
      <div id="combo"></div>
      <div id="live" class="sr-only" aria-live="polite"></div>
      <div id="toast" role="status"></div>

      <section id="menu" class="overlay home">
        <div class="home-top">
          <button id="btn-settings" class="hex-btn" aria-label="Settings and help" title="Settings &amp; help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5" stroke-dasharray="3.2 2.6" stroke-width="3.2"/></svg></button>
          <div class="pills">
            <div class="pill" title="Coins"><i class="coin-ico"></i><b id="home-coins">0</b></div>
            <div class="pill best" title="Best score in this mode"><span class="star">&#9733;</span><b id="menu-best">0</b></div>
          </div>
        </div>
        <div class="home-main">
          <h1 class="logo" aria-label="Neon Ricochet"><span class="l1">Neon</span><span class="l2">Ricochet</span></h1>
          <p class="slogan">Smash <i></i> Survive <i></i> Shine</p>
          <button id="btn-play" class="play"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><span>Play</span></button>
          <div class="modes">
            <button class="mode-card" data-mode="classic" aria-pressed="true">
              <svg viewBox="0 0 64 40"><rect x="22" y="2" width="20" height="8" rx="2" fill="#ff3d9a"/><rect x="12" y="12" width="20" height="8" rx="2" fill="#a64bff"/><rect x="32" y="12" width="20" height="8" rx="2" fill="#a64bff"/><rect x="2" y="22" width="20" height="8" rx="2" fill="#3b82ff"/><rect x="22" y="22" width="20" height="8" rx="2" fill="#22d3ee"/><rect x="42" y="22" width="20" height="8" rx="2" fill="#3b82ff"/></svg>
              <b>Classic Mode</b><small>Break all the bricks</small>
            </button>
            <button class="mode-card" data-mode="fortress" aria-pressed="false">
              <svg viewBox="0 0 64 40"><path d="M10 4h44v32H10z" fill="#334155" stroke="#94a3b8" stroke-width="2"/><path d="M4 8l6 3-6 3zM4 20l6 3-6 3zM60 8l-6 3 6 3zM60 20l-6 3 6 3zM18 0l3 4h-6zM32 0l3 4h-6zM46 0l3 4h-6z" fill="#cbd5e1"/><rect x="18" y="10" width="28" height="18" rx="2" fill="#0b0220" stroke="#22d3ee" stroke-width="1.5"/><rect x="22" y="14" width="8" height="5" fill="#a855f7"/><rect x="34" y="14" width="8" height="5" fill="#a855f7"/><rect x="26" y="34" width="12" height="4" fill="#0b0220"/></svg>
              <b>Fortress Mode</b><small>One gate. Tough blocks inside.</small>
            </button>
          </div>
          <div class="dock">
            <button class="dock-btn" data-sheet="board"><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0zM4 5h3v3a2 2 0 0 1-3-2zM17 5h3v1a2 2 0 0 1-3 2zM11 14h2v3h3v2H8v-2h3z"/></svg><span>Leaderboard</span></button>
            <button class="dock-btn" data-sheet="ach"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.600 6.100.8-4.500 4.200 1.100 6.100L12 16.800 6.600 19.700l1.100-6.100L3.200 9.400l6.100-.8z"/></svg><span>Achievements</span></button>
            <button class="dock-btn" data-sheet="shop"><svg viewBox="0 0 24 24"><path d="M3 4h3l2.500 10.500h9L20 7H7.500M9 19a1.500 1.500 0 1 0 0 .1M17 19a1.500 1.500 0 1 0 0 .1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Shop</span></button>
            <button class="dock-btn" data-sheet="settings"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span>More</span></button>
          </div>
        </div>
        <div class="home-foot" aria-hidden="true"><i class="h-ball"></i><i class="h-paddle"></i></div>
      </section>

      <section id="sheet" class="overlay hidden">
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
          <header><h2 id="sheet-title"></h2><button id="sheet-close" class="icon-btn" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.500" stroke-linecap="round"/></svg></button></header>
          <div id="sheet-body"></div>
        </div>
      </section>

      <section id="pause" class="overlay hidden">
        <div class="panel">
          <h2>Paused</h2>
          <button id="btn-resume" class="btn primary">Resume</button>
          <button id="btn-pause-restart" class="btn">Restart</button>
          <button id="btn-pause-menu" class="btn ghost">Main menu</button>
        </div>
      </section>

      <section id="gameover" class="overlay hidden">
        <div class="panel">
          <h2 class="over">Game Over</h2>
          <p class="final">Final score<b id="go-score">0</b></p>
          <p id="go-new" class="new-best hidden">&#9733; New best score! &#9733;</p>
          <p class="sub"><span id="go-mode"></span><br>Best <b id="go-best">0</b> &nbsp;&middot;&nbsp; Reached level <b id="go-level">1</b></p>
          <p class="earn"><i class="coin-ico"></i> <b id="go-coins">+0</b> coins earned</p>
          <ul id="go-ach" class="go-ach hidden"></ul>
          <button id="btn-replay" class="btn primary">Play again</button>
          <button id="btn-over-menu" class="btn ghost">Main menu</button>
        </div>
      </section>
    </main>
  </div>
  <noscript><p style="color:#fff;padding:2rem">Neon Ricochet needs JavaScript enabled.</p></noscript>

  <script src="lib/phaser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/gamescene.js"></script>
  <script src="game.js"></script>
</body>
</html>
