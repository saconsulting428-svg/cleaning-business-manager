<div id="app"><nav id="nav"></nav><div><header id="top"></header><main id="main"></main></div><aside id="ctx"></aside></div>
<div id="bnav"></div><div id="modal"></div><div id="toast"></div><div id="print"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=p=>p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const dd=s=>new Date(s+'T12:00');
const addDays=(s,n)=>{const d=dd(s);d.setDate(d.getDate()+n);return iso(d)};
const fmtDate=s=>s?dd(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—';
const fmtDow=s=>dd(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const fmtTime=t=>{if(!t)return'—';const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')};
const tMin=t=>{const[h,m]=(t||'00:00').split(':').map(Number);return h*60+m};
const addMin=(t,m)=>{let x=((tMin(t)+m)%1440+1440)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};

 const base=Date.parse(ev.date+'T00:00:00Z')/60000;return[base+Math.min(s,st),base+Math.max(en,td)]}
function conflicts(ev,ids){const[a,b]=span(ev);const out=[];DB.events.forEach(o=>{if(o.id===ev.id||o.status==='Cancelled')return;const[c,d]=span(o);if(a<d&&c<b)(o.equipIds||[]).filter(x=>ids.includes(x)).forEach(x=>out.push({eq:by('equipment',x),ev:o}))});return out}
const eqEvents=id=>DB.events.filter(e=>(e.equipIds||[]).includes(id)&&!['Cancelled','Completed'].includes(e.status)).sort(byDate);
const eqStatus=q=>{if(q.avail!=='Available')return q.avail;const n=eqEvents(q.id).filter(e=>e.date>=today());return n.length?(n[0].date===today()?'In Use':'Reserved'):'Available'};
const chkPct=ev=>{const l=ev.checklist||[];return l.length?Math.round(l.filter(x=>x.d).length/l.length*100):0};
const boothName=ev=>{const n=(ev.equipIds||[]).map(i=>by('equipment',i)).filter(e=>e&&BOOTHCATS.includes(e.cat)).map(e=>e.name);return n.length?n.join(', '):(pk(ev.packageId)?.boothType||'No booth')};
function issues(ev){if(!ACTIVE.includes(ev.status))return[];const f=fin(ev),L=[],soon=ev.date<=addDays(today(),21);

 if(!DB.clients.length&&!old){toast('Add a client first','err');return clientForm()}
 form(old?'Edit event':'New booking',evFields(),base,v=>{const err=saveEvent(old,v);if(typeof err==='string')return err;go('event/'+err.id)},{wide:1,live:(v)=>{const el=$('#lv');if(el)el.innerHTML=priceBox(v)}})}
function saveEvent(old,v){const ev=Object.assign(old?{}:newEventBase(),old||{},v);
 ['guests','extraHours','travel','discount','custom','deposit'].forEach(k=>{if(v[k]==null||isNaN(v[k]))ev[k]=null});if(ev.taxRate==null)ev.taxRate=+DB.settings.tax||0;
 if(!old&&DB.events.some(e=>e.clientId===ev.clientId&&e.date===ev.date&&e.name.toLowerCase()===ev.name.toLowerCase()))return'An event with this name already exists for this client on that date.';
 if(!ev.deposit&&ev.deposit!==0||ev.deposit==null)ev.deposit=r2(calc(ev).total*(+DB.settings.depositPct||0)/100);
 const cf=conflicts(ev,ev.equipIds||[]);if(cf.length)return`Equipment conflict: ${cf[0].eq.name} is already booked for "${cf[0].ev.name}" at an overlapping time. Remove it from this event first.`;
 const f=fin(ev);if(old&&f.net>f.total+0.004)return`New total (${money(f.total)}) is lower than payments already received (${money(f.net)}). Record a refund first.`;
 if(old)Object.assign(old,ev);else DB.events.push(ev);save();toast('Booking saved');return ev}
function setStatus(id,st){const ev=by('events',id);if(!ev||ev.status===st)return;
 const apply=()=>{ev.status=st;save();render();toast('Status: '+st)};
 if(st==='Completed'&&chkPct(ev)<100)return ask(`The checklist is only ${chkPct(ev)}% complete. Mark the event completed anyway?`,apply,{btn:'Mark completed'});
 if(st==='Cancelled')return ask('Cancel this booking? Equipment is released and it no longer counts as revenue. Recorded payments stay in the books.',apply,{btn:'Cancel booking',danger:1});
 if(!['Cancelled'].includes(st)&&ev.status==='Cancelled'){const cf=conflicts(Object.assign({},ev,{status:st}),ev.equipIds||[]);if(cf.length)return toast('Cannot reopen: equipment conflict with '+cf[0].ev.name,'err')}apply()}

 let body='';

 <div class="card"><h3>Instructions & requirements</h3><p style="margin-top:8px;white-space:pre-wrap">${esc(ev.instructions)||'<span class="mt">No special instructions.</span>'}</p><p style="margin-top:8px;white-space:pre-wrap"><b>Client requirements:</b> ${esc(ev.requirements)||'<span class="mt">None recorded.</span>'}</p></div></div>

 <div class="card"><h3>Client</h3>${c?`<a class="b" href="#/client/${c.id}">${esc(c.name)}</a><div class="mt">${esc(c.email)}<br>${esc(c.phone)}</div>`:'—'}</div>
 <div class="card"><h3>Profitability</h3>${(()=>{const ex=DB.expenses.filter(x=>x.eventId===ev.id).reduce((s,x)=>s+ +x.amount,0);return`<div class="pr"><span>Event total</span><span>${money(f.total)}</span></div><div class="pr"><span>Linked expenses</span><span>−${money(ex)}</span></div><div class="pr tot"><span>Est. profit</span><span>${money(f.total-ex)}</span></div>`})()}</div></div></div>`;

 if(tab==='equipment'){const eq=(ev.equipIds||[]).map(i=>by('equipment',i)).filter(Boolean),sf=(ev.staffIds||[]).map(i=>by('staff',i)).filter(Boolean);

 if(tab==='payments'){const ps=DB.payments.filter(x=>x.eventId===ev.id).sort((a,b)=>a.date.localeCompare(b.date));body=`<div class="card"><div class="ch"><h3>Payments</h3><button class="btn sm pri" data-act="newPay" data-ev="${ev.id}">${ic('plus')}Record payment</button></div>${ps.length?ps.map(payRow).join(''):empty('payments','No payments recorded.')}<p class="mt" style="font-size:12px;margin-top:8px">Additional charges raise the event total; refunds reduce what was received.</p></div>`}

 return`<a href="#/events" class="mt">← All events</a><div class="ph" style="margin-top:8px"><div><h1>${esc(ev.name)}</h1><p class="mt">${esc(ev.type)} · ${fmtDow(ev.date)} · ${esc(c?.name||'No client')}</p></div><div class="acts"><select data-evst="${ev.id}" style="padding:8px;border-radius:9px;border:1px solid var(--ln);background:var(--sf)">${EV_ST.map(s=>`<option${ev.status===s?' selected':''}>${s}</option>`).join('')}</select>${ev.status!=='Completed'&&ev.status!=='Cancelled'?`<button class="btn gd" data-act="complete" data-id="${ev.id}">${ic('check')}Mark completed</button>`:''}<button class="btn" data-act="editEvent" data-id="${ev.id}">${ic('edit')}Edit</button><button class="btn" data-act="printEvent" data-id="${ev.id}">${ic('print')}</button><button class="btn dng" data-act="delEvent" data-id="${ev.id}">${ic('trash')}</button></div></div>
 <div class="fin"><div><small>Total</small><b>${money(f.total)}</b></div><div><small>Paid</small><b>${money(f.net)}</b></div><div><small>Balance</small><b>${money(f.bal)}</b></div><div><small>Deposit</small><b>${money(ev.deposit)}</b><small>${f.depOk?'Received':'Due '+money(f.depDue)}</small></div><div><small>Payment status</small>${bd(f.st)}</div></div>
 <div class="tabs">${T.map(t=>`<a href="#/event/${ev.id}/${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</a>`).join('')}</div>${body}`}
function chkHTML(ev){const l=ev.checklist||[],gs=[...new Set(l.map(x=>x.g))],pc=chkPct(ev);
 return`<div class="ch"><h3>Event-day checklist</h3><b>${l.filter(x=>x.d).length}/${l.length}</b></div><div class="bar" style="margin:8px 0"><i style="width:${pc}%"></i></div>`+gs.map(g=>`<div class="gh">${esc(g)}</div>`+l.filter(x=>x.g===g).map(x=>`<div class="chk ${x.d?'dn':''}"><input type="checkbox" data-act="chkT" data-ev="${ev.id}" data-id="${x.id}"${x.d?' checked':''}><span class="grow">${esc(x.t)}</span><button class="btn sm ghost" data-act="chkEdit" data-ev="${ev.id}" data-id="${x.id}" title="Edit">${ic('edit')}</button><button class="btn sm ghost" data-act="chkDel" data-ev="${ev.id}" data-id="${x.id}" title="Delete">${ic('x')}</button></div>`).join('')).join('')+(l.length?'':empty('checklist','Checklist is empty.'))+`<div class="acts" style="margin-top:14px"><button class="btn sm" data-act="chkAdd" data-ev="${ev.id}">${ic('plus')}Add item</button><button class="btn sm" data-act="chkReset" data-ev="${ev.id}">Reset to template</button>${ev.status!=='Completed'&&ev.status!=='Cancelled'?`<button class="btn sm gd" data-act="complete" data-id="${ev.id}">Mark event completed</button>`:''}</div>`}

function vCalendar(){const c=UI.cal,T=today(),d=dd(c.date);
 let title,cells='';
 if(c.view==='month'){title=d.toLocaleDateString(undefined,{month:'long',year:'numeric'});const f=new Date(d.getFullYear(),d.getMonth(),1);f.setDate(1-f.getDay());
  cells=`<div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="wd">${x}</div>`).join('')}${Array.from({length:42},(_,i)=>{const x=new Date(f);x.setDate(f.getDate()+i);const s=iso(x),es=evOn(s);return`<div class="cd${x.getMonth()!==d.getMonth()?' o':''}${s===T?' td':''}${s===c.sel?' sel':''}" data-act="calSel" data-d="${s}"><span class="n">${x.getDate()}</span><button class="add" data-act="newEvent" data-d="${s}" title="New booking">${ic('plus')}</button>${es.slice(0,3).map(chip).join('')}${es.length>3?`<small class="mt">+${es.length-3} more</small>`:''}<div class="dots">${es.map(e=>`<i style="--c:${SC[e.status]}"></i>`).join('')}</div></div>`}).join('')}</div>`}
 else if(c.view==='week'){const s=new Date(d);s.setDate(d.getDate()-d.getDay());const e2=new Date(s);e2.setDate(s.getDate()+6);title=s.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+e2.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  cells=`<div class="wk">${Array.from({length:7},(_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);const k=iso(x);return`<div class="cd${k===T?' td':''}${k===c.sel?' sel':''}" data-act="calSel" data-d="${k}"><div class="b">${x.toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}</div>${evOn(k).map(chip).join('')||'<small class="mt">—</small>'}</div>`}).join('')}</div>`}
 else{title=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});const es=evOn(c.date),booths=DB.equipment.filter(e=>BOOTHCATS.includes(e.cat)&&e.avail!=='Retired');
  cells=`<div class="card"><div class="ch"><h3>Schedule</h3><button class="btn sm pri" data-act="newEvent" data-d="${c.date}">${ic('plus')}New booking on this date</button></div>${es.length?es.map(e=>`<a class="tcard" style="--c:${SC[e.status]};margin-bottom:10px" href="#/event/${e.id}"><div class="tm">${fmtTime(e.start)}<small>to ${fmtTime(e.end)}</small></div><div class="grow"><div class="b">${esc(e.name)}</div><div class="mt">${esc(cl(e.clientId)?.name||'')} · ${esc(e.venue)}</div><small class="mt">Setup ${fmtTime(e.setup)} · Teardown ${fmtTime(e.teardown)} · ${esc(boothName(e))}</small></div>${bd(e.status)}</a>`).join(''):empty('calendar','No events on this day.')}</div><div class="card" style="margin-top:14px"><h3>Booth availability</h3><div class="flt" style="margin-top:10px">${booths.map(b=>{const used=es.find(e=>e.status!=='Cancelled'&&(e.equipIds||[]).includes(b.id));const un=b.avail==='Maintenance';return`<span class="bd" style="--c:${used?'#B5524F':un?'#C58A2B':'#4E8A6B'}">${esc(b.name)}: ${used?'Booked':un?'Maintenance':'Free'}</span>`}).join('')||'<span class="mt">No booths in inventory.</span>'}</div></div>`}
 const sel=c.view==='day'?'':`<div class="card" style="margin-top:16px"><div class="ch"><h3>${fmtDow(c.sel)}</h3><button class="btn sm pri" data-act="newEvent" data-d="${c.sel}">${ic('plus')}New booking on this date</button></div>${evOn(c.sel).map(e=>`<a class="rw" href="#/event/${e.id}"><div class="grow"><div class="t">${esc(e.name)}</div><div class="mt">${fmtTime(e.setup)} setup · ${fmtTime(e.start)}–${fmtTime(e.end)} · ${esc(e.venue)} · ${esc(cl(e.clientId)?.name||'')}</div><small class="mt">${esc(boothName(e))} · ${money(fin(e).total)}</small></div>${bd(e.status)}</a>`).join('')||empty('calendar','Nothing booked. Use the button above to create a booking.')}</div>`;
 return`<div class="ph"><div><h1>Calendar</h1></div><div class="seg">${['month','week','day'].map(v=>`<button data-act="calView" data-v="${v}" class="${c.view===v?'on':''}">${v}</button>`).join('')}</div></div><div class="ch" style="margin-bottom:10px"><div class="acts"><button class="btn sm" data-act="calNav" data-n="-1">${ic('l')}</button><button class="btn sm" data-act="calNav" data-n="1">${ic('r')}</button><button class="btn sm" data-act="calToday">Today</button></div><h2>${title}</h2></div><div class="lg2">${EV_ST.map(s=>`<span><i style="--c:${SC[s]}"></i>${s}</span>`).join('')}</div>${cells}${sel}`}

 return L.length?L.map(([c,s])=>`<a class="rw" href="#/client/${c.id}"><div class="dt" style="border-radius:50%;width:42px;height:42px"><b style="font-size:16px">${esc(c.name[0])}</b></div><div class="grow"><div class="t ell">${esc(c.name)}</div><div class="mt ell">${esc(c.email)} · ${esc(c.phone)}</div></div><div class="side"><span>${bd(c.type,'#6D3B66')}</span><small class="mt">${s.n} booking${s.n==1?'':'s'} · ${money(s.rev)}${s.bal>0?' · <b style="color:var(--er)">'+money(s.bal)+' due</b>':''}</small></div></a>`).join(''):empty('clients','No clients found.','<br><button class="btn pri" data-act="newClient">Add client</button>')}

 if(v.email&&DB.clients.some(c=>c.id!==id&&c.email.toLowerCase()===v.email.toLowerCase()))return'A client with this email already exists.';

function logoUpload(file){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{const s=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);LOGO=c.toDataURL('image/png');await idb('set','logo',LOGO);render();toast('Logo saved')};im.onerror=()=>toast('Could not read image','err');im.src=r.result};r.readAsDataURL(file)}

function printEvent(id){const ev=by('events',id),c=cl(ev.clientId),f=fin(ev),k=ev.contract;
 printDoc(docHead('Booking Summary')+row2([['Client',(c?.name||'')+' · '+(c?.email||'')+' · '+(c?.phone||'')],['Event',ev.name+' ('+ev.type+')'],['Date',fmtDow(ev.date)+', '+dd(ev.date).getFullYear()],['Event time',fmtTime(ev.start)+' – '+fmtTime(ev.end)],['Setup arrival / teardown',fmtTime(ev.setup)+' / '+fmtTime(ev.teardown)],['Venue',ev.venue+', '+ev.address+' ('+ev.indoor+')'],['Guests',ev.guests??'—'],['Contract',k.status+(k.ref?' · '+k.ref:'')]])+tbl(ev)+`<table><tr><td>Subtotal</td><td style="text-align:right">${money(f.c.sub)}</td></tr><tr><td>Tax</td><td style="text-align:right">${money(f.c.tax)}</td></tr>${f.chg?`<tr><td>Additional charges</td><td style="text-align:right">${money(f.chg)}</td></tr>`:''}<tr><td><b>Total</b></td><td style="text-align:right"><b>${money(f.total)}</b></td></tr><tr><td>Received</td><td style="text-align:right">${money(f.net)}</td></tr><tr><td><b>Balance due</b></td><td style="text-align:right"><b>${money(f.bal)}</b></td></tr></table><h4 style="margin-top:16px">Terms & conditions</h4><p>${esc(DB.settings.terms)}</p><p><i>${esc(DB.settings.cancel)}</i></p><div class="sig"><div>Client signature / date</div><div>Business representative / date</div></div><p style="font-size:11px;margin-top:10px">Signatures above are manual/handwritten acknowledgements.</p></div>`)}

 newEvent:d=>eventForm(null,d.cl?{clientId:d.cl}:d.d?{date:d.d}:null),editEvent:d=>eventForm(d.id),

 csvEvents:()=>csv('events.csv',[['Event','Type','Client','Date','Start','End','Venue','Status','Package','Total','Paid','Balance']].concat(evListData().map(e=>{const f=fin(e);return[e.name,e.type,cl(e.clientId)?.name,e.date,e.start,e.end,e.venue,e.status,pk(e.packageId)?.name,f.total,f.net,f.bal]}))),
 csvRep:()=>{const d=repData();csv('report-events.csv',[['Event','Type','Client','Date','Status','Package','Booth type','Total','Balance']].concat(d.evs.map(e=>{const f=fin(e);return[e.name,e.type,cl(e.clientId)?.name,e.date,e.status,pk(e.packageId)?.name,pk(e.packageId)?.boothType,f.total,f.bal]})))},
 csvEq:()=>csv('equipment.csv',[['Name','Category','Asset ID','Condition','Status','Location','Price','Last maintenance']].concat(DB.equipment.map(e=>[e.name,e.cat,e.assetId,e.cond,eqStatus(e),e.loc,e.price,e.lastMaint]))),
 csvPay:()=>csv('payments.csv',[['Date','Type','Event','Client','Amount','Method','Reference','Notes']].concat(DB.payments.map(p=>[p.date,p.type,by('events',p.eventId)?.name,cl(p.clientId)?.name,p.amount,p.method,p.ref,p.notes]))),
 assignEq:d=>assignEqModal(d.id),unassignEq:d=>{const ev=by('events',d.id);ev.equipIds=ev.equipIds.filter(x=>x!==d.eq);save();render()},

 editContract:d=>contractForm(d.id),signContract:d=>{const k=by('events',d.id).contract;k.status='Signed';k.signed=k.signed||today();if(!k.ref)k.ref='CT-'+(1000+DB.events.findIndex(e=>e.id===d.id));save();render();toast('Contract marked signed')},
 printEvent:d=>printEvent(d.id),printQuote:d=>printQuote(d.id),
 newPay:d=>payForm(null,d.ev),editPay:d=>payForm(d.id),delPay:d=>{const p=by('payments',d.id),er=payCheck(p.eventId,DB.payments.filter(x=>x.eventId===p.eventId&&x.id!==p.id));if(er)return toast('Cannot delete: '+er,'err');ask(`Delete this ${p.type.toLowerCase()} of ${money(p.amount)}?`,()=>{DB.payments=DB.payments.filter(x=>x.id!==p.id);save();render()},{danger:1,btn:'Delete'})},

 calNav:d=>{const c=UI.cal,x=dd(c.date),n=+d.n;if(c.view==='month')x.setMonth(x.getMonth()+n,1);else x.setDate(x.getDate()+n*(c.view==='week'?7:1));c.date=iso(x);if(c.view==='day')c.sel=c.date;render()},
 newClient:()=>clientForm(),editClient:d=>clientForm(d.id),
 delClient:d=>{const c=cl(d.id),ev=DB.events.filter(e=>e.clientId===c.id).length,py=DB.payments.filter(p=>p.clientId===c.id).length,qu=DB.quotes.filter(q=>q.clientId===c.id).length;
  if(ev||py||qu)return ask(`${esc(c.name)} has ${ev} event(s), ${py} payment(s) and ${qu} quote(s) on record, so deleting would orphan financial records. Remove or reassign those records first.`,()=>{},{title:'Cannot delete client',btn:'OK'});
  ask(`Delete client “${esc(c.name)}”?`,()=>{DB.clients=DB.clients.filter(x=>x.id!==c.id);save();go('clients')},{danger:1,btn:'Delete'})},
 newLead:()=>leadForm(),editLead:d=>leadForm(d.id),delLead:d=>ask('Delete this lead?',()=>{DB.leads=DB.leads.filter(l=>l.id!==d.id);save();render()},{danger:1,btn:'Delete'}),convLead:d=>convertLead(d.id),

 newQuote:()=>quoteForm(),editQuote:d=>quoteForm(d.id),delQuote:d=>ask('Delete this quote?',()=>{DB.quotes=DB.quotes.filter(q=>q.id!==d.id);save();render()},{danger:1,btn:'Delete'}),

 newPkg:()=>pkgForm(),editPkg:d=>pkgForm(d.id),dupPkg:d=>{const p=pk(d.id);DB.packages.push({...JSON.parse(JSON.stringify(p)),id:uid('p'),name:p.name+' (Copy)'});save();render();toast('Package duplicated')},
 delPkg:d=>{const n=DB.events.filter(e=>e.packageId===d.id).length+DB.quotes.filter(q=>q.packageId===d.id).length;if(n)return ask(`This package is used by ${n} booking(s)/quote(s). Mark it inactive instead so history stays intact.`,()=>{pk(d.id).active=false;save();render()},{title:'Package in use',btn:'Make inactive'});ask('Delete this package?',()=>{DB.packages=DB.packages.filter(p=>p.id!==d.id);save();render()},{danger:1,btn:'Delete'})},
 newAddon:()=>addonForm(),editAddon:d=>addonForm(d.id),delAddon:d=>{const n=DB.events.filter(e=>(e.addons||[]).some(a=>a.id===d.id)).length+DB.quotes.filter(q=>(q.addons||[]).some(a=>a.id===d.id)).length;if(n)return ask(`Used by ${n} booking(s)/quote(s). Mark inactive instead?`,()=>{by('addons',d.id).active=false;save();render()},{title:'Add-on in use',btn:'Make inactive'});ask('Delete this add-on?',()=>{DB.addons=DB.addons.filter(a=>a.id!==d.id);save();render()},{danger:1,btn:'Delete'})},
 newEq:()=>eqForm(),editEq:d=>eqForm(d.id),maint:d=>maintModal(d.id),logMaint:d=>logMaint(d.id),delMaint:d=>{DB.maint=DB.maint.filter(m=>m.id!==d.id);save();maintModal(d.eq)},
 delEq:d=>{const e=by('equipment',d.id),n=DB.events.filter(x=>(x.equipIds||[]).includes(d.id)&&!['Completed','Cancelled'].includes(x.status)).length;if(n)return ask(`${esc(e.name)} is reserved for ${n} active event(s). Remove it from those events first, or mark it Retired.`,()=>{},{title:'Cannot delete',btn:'OK'});ask(`Delete ${esc(e.name)}?`,()=>{DB.equipment=DB.equipment.filter(x=>x.id!==d.id);DB.events.forEach(x=>x.equipIds=(x.equipIds||[]).filter(i=>i!==d.id));DB.maint=DB.maint.filter(m=>m.eqId!==d.id);save();render()},{danger:1,btn:'Delete'})},
 newStaff:()=>staffForm(),editStaff:d=>staffForm(d.id),delStaff:d=>ask('Delete this team member? They will be removed from event assignments.',()=>{DB.staff=DB.staff.filter(s=>s.id!==d.id);DB.events.forEach(e=>e.staffIds=(e.staffIds||[]).filter(i=>i!==d.id));save();render()},{danger:1,btn:'Delete'}),
 newExp:()=>expForm(),editExp:d=>expForm(d.id),delExp:d=>ask('Delete this expense?',()=>{DB.expenses=DB.expenses.filter(x=>x.id!==d.id);save();render()},{danger:1,btn:'Delete'}),
 rpR:d=>{UI.rp.r=d.r;render()},backup:backup,rmLogo:async()=>{LOGO=null;await idb('del','logo');render()},

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;if(el.tagName!=='INPUT'&&!(el.tagName==='A'&&el.getAttribute('href')&&el.dataset.act==='closeModal'))e.preventDefault();f(el.dataset,el,e);if(el.tagName==='A'&&el.dataset.act==='closeModal'){}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f){const[a,b]=t.dataset.f.split('.');UI[a][b]=t.value;if(RES)$('#res').innerHTML=RES()}if(t.closest('#cfg'))cfgOut()});
document.addEventListener('change',e=>{const t=e.target,D=t.dataset;
 if(D.fr){const[a,b]=D.fr.split('.');if(b)UI[a][b]=t.value;else UI[a]=t.value;render()}
 else if(D.evst)setStatus(D.evst,t.value);
 else if(D.ldst){const l=by('leads',D.ldst);l.status=t.value;save();render()}
 else if(D.evf){by('events',D.id)[D.evf]=t.value;save();toast('Saved')}
 else if(t.id==='logoIn'&&t.files[0])logoUpload(t.files[0]);else if(t.id==='bkIn'&&t.files[0]){restore(t.files[0]);t.value=''}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-sf]');if(f){e.preventDefault();saveSettings(f.dataset.sf,f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
addEventListener('hashchange',()=>{closeModal();render()});
(async()=>{load();LOGO=await idb('get','logo');render()})();
