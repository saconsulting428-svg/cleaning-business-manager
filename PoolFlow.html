<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="description" content="PoolFlow – Pool Service Business Manager. Routes, service visits, water tests, chemicals, equipment and invoices for pool service technicians.">
<title>PoolFlow – Pool Service Business Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='1' y='1' width='38' height='38' rx='11' fill='%230E7490'/%3E%3Cpath d='M20 6s-9 9.6-9 15.6a9 9 0 0 0 18 0C29 15.6 20 6 20 6z' fill='%235EEAD4'/%3E%3C/svg%3E">
<style>
:root{
  --primary:#0E7490;--primary-d:#155E75;--navy:#0F172A;--aqua:#06B6D4;--aqua-l:#CFFAFE;--pool:#38BDF8;--mint:#5EEAD4;
  --ok:#16A34A;--ok-d:#15803D;--warn:#F59E0B;--warn-d:#92400E;--bad:#EF4444;--bad-d:#B91C1C;
  --bg:#F4FBFC;--text:#0F172A;--muted:#475569;--line:#D5ECF0;--line2:#E6F3F5;--card:#fff;
  --round:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  --radius:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);font-size:15px;line-height:1.45}
body.modal-open{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
h1,h2,h3,h4{font-family:var(--round);line-height:1.2}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:#fff;color:var(--navy);padding:10px 14px;border-radius:10px;font-weight:700}
.skip:focus{left:8px}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.mt{margin-top:16px}.mt0{margin-top:0}.mb0{margin-bottom:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.grow{flex:1}
.right{text-align:right}

/* ===== DECK HEADER ===== */
.deck{position:sticky;top:0;z-index:40;color:#fff;background-color:var(--navy);
  background-image:radial-gradient(120% 160% at 88% -50%,rgba(6,182,212,.42),transparent 60%),radial-gradient(60% 140% at 8% 140%,rgba(94,234,212,.20),transparent 60%)}
.deck-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;flex:none}
.brand-mark{width:38px;height:38px;display:block}
.brand b{font-family:var(--round);font-size:20px;letter-spacing:.3px;display:block;line-height:1.1}
.brand small{display:block;color:var(--aqua-l);opacity:.85;font-size:12px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{flex:1;max-width:560px;margin-left:auto;position:relative}
.search>.ic{position:absolute;left:14px;top:11px;color:#9FD3DE;pointer-events:none}
.search input{width:100%;height:42px;border-radius:21px;border:1px solid rgba(207,250,254,.28);background:rgba(255,255,255,.09);color:#fff;padding:0 16px 0 42px;font-size:15px}
.search input::placeholder{color:#A9CCD6}
.search input:focus{outline:none;border-color:var(--aqua);background:rgba(255,255,255,.14);box-shadow:0 0 0 3px rgba(6,182,212,.3)}
.deck-btn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid rgba(207,250,254,.25);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.deck-btn:hover{background:rgba(255,255,255,.16)}
.search-toggle{display:none}
.ncount{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--navy)}
.ncount:empty{display:none}
.tech-chip{display:flex;align-items:center;gap:6px;height:42px;border-radius:21px;padding:0 6px 0 12px;background:rgba(255,255,255,.08);border:1px solid rgba(207,250,254,.25);flex:none}
.tech-chip .ic{width:18px;height:18px;color:var(--mint)}
.tech-chip select{background:transparent;border:0;color:#fff;font-weight:700;font-size:14px;height:40px;max-width:170px;cursor:pointer;padding-right:4px}
.tech-chip select option{color:var(--navy)}
.tech-chip select:focus{outline:none}
.tech-chip:focus-within{box-shadow:0 0 0 3px rgba(6,182,212,.45)}
.nwrap{position:relative}
.dropdown{position:absolute;top:calc(100% + 8px);right:0;background:#fff;color:var(--text);border-radius:16px;box-shadow:0 20px 50px -12px rgba(15,23,42,.45);border:1px solid var(--line);z-index:60;max-height:72vh;overflow:auto}
.search .dropdown{left:0;right:0}
.npanel{width:380px;max-width:calc(100vw - 24px)}
.dd-h{padding:12px 16px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center}
.dd-item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line2)}
.dd-item:hover,.dd-item:focus{background:#F0FAFB;outline:none}
.dd-item b{display:block;font-size:14px}
.dd-item span{font-size:13px;color:var(--muted)}
.dd-group{padding:8px 16px 4px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--primary)}
.ni{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ni .ic{width:18px;height:18px}
.ni-bad{background:#FEE2E2;color:var(--bad-d)}.ni-warn{background:#FEF3C7;color:var(--warn-d)}.ni-info{background:var(--aqua-l);color:var(--primary-d)}.ni-ok{background:#DCFCE7;color:var(--ok-d)}

/* ===== LANE NAVIGATION ===== */
.lanes{background:#fff;position:sticky;top:62px;z-index:39;box-shadow:0 6px 18px -14px rgba(15,23,42,.5)}
.lanes-in{max-width:1440px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.lanes-in::-webkit-scrollbar{display:none}
.lane{display:flex;align-items:center;gap:7px;padding:13px 11px 15px;font-weight:750;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#334155;text-decoration:none;white-space:nowrap;position:relative}
.lane .ic{width:17px;height:17px;color:var(--primary)}
.lane:hover{color:var(--primary)}
.lane[aria-current=page]{color:var(--navy)}
.lane[aria-current=page]::after{content:"";position:absolute;left:50%;bottom:0;width:6px;height:12px;margin-left:-3px;background:var(--navy);border-radius:3px 3px 0 0}
.lane[aria-current=page]::before{content:"";position:absolute;left:10px;right:10px;bottom:10px;height:3px;border-radius:2px;background:var(--navy)}
.rope{height:7px;background-color:#fff;background-image:linear-gradient(90deg,var(--aqua) 0 44%,transparent 44% 50%,var(--navy) 50% 94%,transparent 94%);background-size:34px 5px;background-repeat:repeat-x;background-position:0 1px;border-bottom:1px solid var(--line)}

/* ===== LAYOUT ===== */
main{display:block;outline:none}
.wrap{max-width:1440px;margin:0 auto;padding:22px 20px 48px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:4px 0 18px}
.page-h h1{margin:0;font-size:28px;letter-spacing:.02em}
.page-h .eyebrow{margin:0 0 4px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--primary)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.grid-2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.today-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:13px;color:var(--primary);margin-bottom:8px}
.back .ic{width:16px;height:16px}

/* ===== PANELS ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:0 10px 26px -22px rgba(14,116,144,.55)}
.panel.tight{padding:14px 16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.ph h2,.ph h3{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);font-weight:800;font-family:inherit}
.ph h2::after,.ph h3::after{content:"";display:block;width:56px;height:3px;margin-top:7px;background:linear-gradient(90deg,var(--aqua),var(--mint));border-radius:2px}
.waterline{height:8px;border-radius:4px;margin:-6px 0 14px;background-color:var(--primary);background-image:linear-gradient(45deg,#155E75 25%,transparent 25%,transparent 75%,#155E75 75%),linear-gradient(45deg,#155E75 25%,transparent 25%,transparent 75%,#155E75 75%);background-size:8px 8px;background-position:0 0,4px 4px;opacity:.9}
.empty{text-align:center;padding:28px 14px;color:var(--muted)}
.empty .ic{width:40px;height:40px;color:#9CCFDA;margin-bottom:6px}
.empty b{display:block;color:var(--navy);font-size:16px;margin-bottom:4px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:#F0FAFB;border:1px solid var(--line);font-size:13.5px;color:#1E3A46}
.note .ic{color:var(--primary);margin-top:1px}
.note.safety{background:#FFFBEB;border-color:#FCD34D;color:#78350F}
.note.safety .ic{color:#B45309}
.note.lock{background:#F5F3FF;border-color:#DDD6FE;color:#4C1D95}
.note.lock .ic{color:#6D28D9}
.note.danger{background:#FEF2F2;border-color:#FECACA;color:#7F1D1D}
.note.danger .ic{color:var(--bad-d)}

/* ===== POOL HERO ===== */
.pool-hero{position:relative;overflow:hidden;border-radius:24px;color:#fff;padding:0;
  background:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(155deg,#0E7490 0%,#0891B2 55%,#06B6D4 100%);
  box-shadow:0 18px 40px -26px rgba(14,116,144,.9)}
.pool-hero .coping{height:12px;background-color:#164E63;background-image:linear-gradient(45deg,#0F172A 25%,transparent 25%,transparent 75%,#0F172A 75%),linear-gradient(45deg,#0F172A 25%,transparent 25%,transparent 75%,#0F172A 75%);background-size:12px 12px;background-position:0 0,6px 6px;opacity:.75}
.caustics{position:absolute;inset:12px 0 0 0;width:100%;height:calc(100% - 12px);pointer-events:none}
.hero-in{position:relative;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 28px 30px;flex-wrap:wrap}
.hero-in h1{margin:2px 0 6px;font-size:32px;letter-spacing:.01em}
.hero-in .eyebrow{color:var(--aqua-l);font-size:13px}
.hero-date{margin:0;color:#E0FBFF;font-size:15px}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero-pills span{background:rgba(15,23,42,.28);border:1px solid rgba(207,250,254,.3);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hero-pills b{font-size:17px;margin-right:4px}
.ring{width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%}

/* ===== ROUTE LINE ===== */
.route{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;position:relative}
.stop::before{content:"";position:absolute;left:21.5px;top:0;bottom:0;width:3px;background:repeating-linear-gradient(#B6DDE5 0 6px,transparent 6px 11px)}
.stop.done::before{background:var(--ok)}
.stop:first-child::before{top:50%}
.stop:last-child::before{bottom:50%}
.stop:only-child::before{display:none}
.node{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;background:#fff;border:3px solid #B6DDE5;color:#475569}
.node .ic{width:22px;height:22px}
.stop.done .node{background:var(--ok);border-color:var(--ok);color:#fff}
.stop.active .node{background:var(--aqua);border-color:var(--aqua);color:#fff;animation:ripple 2.2s infinite}
.stop.skipped .node{background:#F1F5F9;border-color:#CBD5E1;color:#94A3B8}
.stop-main{min-width:0}
.stop-main b{display:block;font-size:15.5px;letter-spacing:.01em}
.stop.done .stop-main b{color:#334155}
.stop-main small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-side{display:flex;align-items:center;gap:8px}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(6,182,212,.5)}100%{box-shadow:0 0 0 14px rgba(6,182,212,0)}}

/* stop cards (route screen) */
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.stopcard{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;position:relative;padding-bottom:14px}
.stopcard::before{content:"";position:absolute;left:24.5px;top:0;bottom:0;width:3px;background:repeating-linear-gradient(#B6DDE5 0 6px,transparent 6px 11px)}
.stopcard.done::before{background:var(--ok)}
.stopcard:first-child::before{top:26px}
.stopcard:last-child::before{bottom:auto;height:26px}
.stopcard:only-child::before{display:none}
.stopcard .node{width:52px;height:52px;font-size:18px}
.sc-body{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 10px 24px -22px rgba(14,116,144,.7)}
.stopcard.active .sc-body{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(6,182,212,.18)}
.stopcard.done .sc-body{background:#FBFEFE}
.sc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sc-top h3{margin:0;font-size:17px;text-transform:uppercase;letter-spacing:.05em}
.sc-meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 0;font-size:14px;color:#1E293B}
.sc-meta span{display:inline-flex;align-items:center;gap:6px}
.sc-meta .ic{width:16px;height:16px;color:var(--primary)}
.sc-time{font-weight:800;font-size:16px;color:var(--navy)}
.sc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sc-water{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:6px;width:64px;text-align:center}
.sc-water .drop{width:34px;height:42px}
.tech-group{margin-bottom:18px}
.tech-tag{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:6px 0 12px}
.tech-tag i{width:12px;height:12px;border-radius:50%;display:inline-block}

/* ===== BADGES & DOTS ===== */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#E2E8F0;color:#334155;white-space:nowrap;line-height:1.5}
.b-ok{background:#DCFCE7;color:var(--ok-d)}.b-warn{background:#FEF3C7;color:var(--warn-d)}.b-bad{background:#FEE2E2;color:var(--bad-d)}
.b-aqua{background:var(--aqua-l);color:var(--primary-d)}.b-navy{background:var(--navy);color:#fff}.b-violet{background:#EDE9FE;color:#5B21B6}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:#94A3B8}
.dot-ok{background:var(--ok)}.dot-warn{background:var(--warn)}.dot-bad{background:var(--bad)}.dot-aqua{background:var(--aqua)}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--navy);color:#fff;font-weight:750;cursor:pointer;text-decoration:none;font-size:14px;letter-spacing:.03em;white-space:nowrap;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.15)}
.btn .ic{width:18px;height:18px}
.btn-primary{background:var(--primary)}
.btn-aqua{background:var(--aqua);color:var(--navy)}
.btn-ok{background:var(--ok)}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid #C4E2E9}
.btn-ghost:hover{background:#F0FAFB;filter:none}
.btn-danger{background:#fff;color:var(--bad-d);border:1.5px solid #FECACA}
.btn-danger:hover{background:#FEF2F2;filter:none}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-lg{min-height:56px;font-size:16px;padding:0 24px;border-radius:14px;text-transform:uppercase;letter-spacing:.08em}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1.5px solid #C4E2E9;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--navy);flex:none}
.icon-btn:hover{background:#F0FAFB}
.icon-btn .ic{width:18px;height:18px}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ===== QUICK ACTIONS ===== */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{min-height:86px;border-radius:16px;border:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;padding:14px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;font-size:13px;text-align:left;cursor:pointer;background:var(--aqua-l);color:var(--navy);transition:transform .1s}
.qa button:active{transform:scale(.98)}
.qa button .ic{width:26px;height:26px;color:var(--primary)}
.qa .qa-main{grid-column:1/-1;background:var(--navy);color:#fff;min-height:92px;font-size:17px;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;
  background-image:radial-gradient(120% 200% at 100% 0,rgba(6,182,212,.45),transparent 60%)}
.qa .qa-main .ic{color:var(--mint);width:34px;height:34px}
.qa .qa-main small{display:block;font-size:12.5px;letter-spacing:.04em;text-transform:none;color:#A5F3FC;font-weight:600;margin-top:3px}
.qa .qa-done{background:#DCFCE7}
.qa .qa-done .ic{color:var(--ok-d)}

/* ===== STATUS TILES ===== */
.wcounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wcount{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;background:#F8FDFE;border:1.5px solid var(--line2);text-decoration:none;color:inherit;text-align:center}
.wcount:hover{border-color:var(--aqua)}
.wcount .drop{width:34px;height:42px}
.wcount b{font-size:26px;line-height:1;font-family:var(--round)}
.wcount span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.statline{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line);text-decoration:none;color:inherit;flex-wrap:wrap}
.statline .lbl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:100%}
.statline .pill{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.money-big{font-size:26px;font-weight:800;font-family:var(--round)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--aqua),var(--mint))}
.tile.t-warn::after{background:var(--warn)}.tile.t-bad::after{background:var(--bad)}.tile.t-ok::after{background:var(--ok)}
.tile .tl{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tile .tv{font-size:28px;font-weight:800;font-family:var(--round);margin-top:4px;line-height:1.1}
.tile .ts{font-size:12.5px;color:var(--muted);margin-top:2px}

/* ===== WATER READINGS (test strip) ===== */
.readings{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.reading{border-radius:14px;padding:12px;background:#F8FDFE;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:5px;position:relative}
.reading .rl{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#475569}
.reading .rv{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;font-family:var(--round)}
.reading .rv small{font-size:12px;color:var(--muted);font-weight:700;margin-left:3px}
.reading .rs{font-size:11.5px;font-weight:800;letter-spacing:.12em}
.reading .rt{font-size:11.5px;color:var(--muted)}
.rbar{height:8px;border-radius:4px;position:relative;background:linear-gradient(90deg,#FCA5A5 0 8%,#FDE68A 8% 27%,#86EFAC 27% 73%,#FDE68A 73% 92%,#FCA5A5 92%);margin:3px 0}
.rbar i{position:absolute;top:-4px;width:5px;height:16px;border-radius:3px;background:var(--navy);transform:translateX(-50%);box-shadow:0 0 0 2px #fff}
.reading.lvl-low,.reading.lvl-high{border-color:#FCD34D;background:#FFFBEB}
.lvl-low .rs,.lvl-high .rs{color:var(--warn-d)}
.reading.lvl-crit{border-color:#FCA5A5;background:#FEF2F2}
.lvl-crit .rs{color:var(--bad-d)}
.lvl-normal .rs{color:var(--ok-d)}
.lvl-none .rv{color:#94A3B8}
.lvl-none .rbar i{display:none}
.lvl-none .rs{color:#94A3B8}
.reading input{width:100%;min-height:52px;font-size:24px;font-weight:800;border-radius:12px;border:1.5px solid #C4E2E9;padding:6px 10px;background:#fff;font-family:var(--round)}
.reading input:focus{outline:none;border-color:var(--aqua);box-shadow:0 0 0 3px rgba(6,182,212,.25)}
.reading label{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#475569}
.strip-mini{display:flex;gap:4px;flex-wrap:wrap}
.strip-mini span{font-size:11.5px;font-weight:750;padding:2px 7px;border-radius:7px;background:#ECFDF5;color:var(--ok-d);white-space:nowrap}
.strip-mini span.w{background:#FEF3C7;color:var(--warn-d)}
.strip-mini span.c{background:#FEE2E2;color:var(--bad-d)}

.wstat{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:16px;border:2px solid}
.wstat .drop{width:56px;height:68px}
.wstat .wl{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.wstat b{display:block;font-size:24px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--round)}
.wstat .wsub{font-size:13px}
.ws-balanced{background:#ECFDF5;border-color:#86EFAC;color:var(--ok-d)}
.ws-attention{background:#FFFBEB;border-color:#FCD34D;color:var(--warn-d)}
.ws-critical{background:#FEF2F2;border-color:#FCA5A5;color:var(--bad-d)}
.ws-none{background:#F8FAFC;border-color:#E2E8F0;color:#64748B}

/* ===== STEPPER (visit workflow) ===== */
.stepper{display:flex;list-style:none;padding:0;margin:0 0 18px;overflow-x:auto;scrollbar-width:thin}
.step{flex:1;min-width:84px;position:relative}
.step::before{content:"";position:absolute;top:22px;left:-50%;right:50%;height:3px;background:#C4E2E9}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--ok)}
.step button{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:2px 2px 6px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#64748B;border-radius:10px}
.sn{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:3px solid #C4E2E9;background:#fff;font-weight:800;font-size:15px;color:#475569}
.sn .ic{width:20px;height:20px}
.step.done .sn{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur .sn{background:var(--aqua);border-color:var(--aqua);color:#fff;box-shadow:0 0 0 5px rgba(6,182,212,.2)}
.step.cur button{color:var(--navy)}
.progress-list{list-style:none;margin:0;padding:0;font-family:var(--round)}
.progress-list li{display:flex;align-items:center;gap:10px;padding:7px 0;font-weight:700;font-size:15px;border-bottom:1px dashed var(--line2)}
.progress-list li:last-child{border-bottom:0}
.progress-list .pi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid #C4E2E9;color:#94A3B8;font-size:12px;flex:none}
.progress-list .pi .ic{width:15px;height:15px}
.progress-list li.done .pi{background:var(--ok);border-color:var(--ok);color:#fff}
.progress-list li.cur .pi{background:var(--aqua);border-color:var(--aqua);color:#fff}
.progress-list li.cur{color:var(--primary-d)}
.progress-list li.todo{color:#64748B}
.visit-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.visit-head h1{margin:0;font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.visit-head p{margin:4px 0 0}
.stepbar{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.step-title{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.step-title .sti{width:44px;height:44px;border-radius:14px;background:var(--aqua-l);color:var(--primary);display:grid;place-items:center}
.step-title h2{margin:0;font-size:20px;text-transform:uppercase;letter-spacing:.06em}
.step-sub{margin:0 0 16px;color:var(--muted)}

/* choice chips */
fieldset.choice-set{border:0;padding:0;margin:0 0 18px}
fieldset.choice-set legend{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#334155;margin-bottom:8px;padding:0}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative;display:inline-flex}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice span{display:inline-flex;align-items:center;gap:7px;min-height:48px;padding:0 16px;border-radius:12px;border:2px solid #C4E2E9;background:#fff;font-weight:700;cursor:pointer;user-select:none}
.choice input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
.choice input:focus-visible+span{outline:3px solid var(--aqua);outline-offset:2px}
.choice.c-ok input:checked+span{background:var(--ok);border-color:var(--ok)}
.choice.c-warn input:checked+span{background:var(--warn);border-color:var(--warn);color:var(--navy)}
.choice.c-due input:checked+span{background:#7C3AED;border-color:#7C3AED}
.choice.c-bad input:checked+span{background:var(--bad);border-color:var(--bad)}

/* checklist */
.checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:650;font-size:15px}
.check input{width:26px;height:26px;accent-color:var(--ok);flex:none;cursor:pointer;margin:0}
.check:has(input:checked){background:#F0FDF4;border-color:#86EFAC}
.check:has(input:checked) span{color:#166534}
.field .check{min-height:48px}

/* equipment check card */
.eqcheck{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:#FBFEFE}
.eqcheck h3{margin:0 0 2px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.eqcheck h3 .ic{color:var(--primary)}
.eqcheck .choices{margin:10px 0}

/* ===== FORMS ===== */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field>label,.flabel{font-size:12.5px;font-weight:750;color:#334155;letter-spacing:.02em}
.req{color:var(--bad-d)}
.inp,.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea,.fsel{min-height:46px;border-radius:12px;border:1.5px solid #C4E2E9;background:#fff;padding:10px 12px;font-size:16px;width:100%}
.fsel{width:auto;min-height:42px;padding:8px 10px;font-size:14px;font-weight:600}
.field textarea{min-height:92px;resize:vertical}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus,.fsel:focus{border-color:var(--aqua);outline:none;box-shadow:0 0 0 3px rgba(6,182,212,.25)}
.field .err{color:var(--bad-d);font-size:12.5px;font-weight:650}
.field .err:empty{display:none}
[aria-invalid=true]{border-color:var(--bad)!important;background:#FFF8F8!important}
.help{font-size:12px;color:#64748B}
.form-err{color:var(--bad-d);font-weight:700;margin:12px 0 0}
.form-err:empty{display:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters .inp{max-width:280px;min-height:42px;font-size:15px}
.filters label.sr+select{}
.datenav{display:flex;align-items:center;gap:6px}
.datenav input{min-height:42px;border-radius:12px;border:1.5px solid #C4E2E9;padding:6px 10px;font-weight:700}

/* ===== TABS ===== */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tab{padding:11px 14px;border:0;background:none;font-weight:800;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#64748B;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap;min-height:44px}
.tab:hover{color:var(--primary)}
.tab[aria-selected=true]{color:var(--primary-d);border-color:var(--primary)}

/* ===== TABLES ===== */
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#64748B;font-weight:800;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#F4FBFC}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end}

/* ===== POOL CARDS ===== */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.pcard:hover{box-shadow:0 14px 30px -20px rgba(14,116,144,.8);transform:translateY(-1px)}
.pcard-top{height:78px;position:relative;padding:10px 14px;display:flex;align-items:flex-end;justify-content:space-between;color:#fff;
  background:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(160deg,#0E7490,#22D3EE)}
.pcard-top.indoor{background:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(160deg,#1E3A8A,#38BDF8)}
.pcard-top.spa{background:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(160deg,#0F766E,#5EEAD4)}
.pcard-top svg.wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:22px}
.pcard-top .pt-vol{position:relative;font-weight:800;font-size:13px;letter-spacing:.06em;background:rgba(15,23,42,.35);padding:3px 9px;border-radius:999px}
.pcard-top .drop{position:relative;width:34px;height:42px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.pcard-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard-b h3{margin:0;font-size:16px}
.pcard-b p{margin:0;font-size:13px;color:var(--muted)}
.pcard-f{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.pcard-f b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* definition lists */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 18px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#64748B}
.dl dd{margin:2px 0 0;font-weight:650;overflow-wrap:anywhere}

/* timeline */
.timeline{list-style:none;margin:0;padding:0}
.tl-item{display:grid;grid-template-columns:62px 18px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.tl-date{text-align:center;font-family:var(--round);line-height:1.05;padding-top:2px}
.tl-date b{display:block;font-size:12px;letter-spacing:.12em;color:var(--primary);font-weight:800}
.tl-date span{font-size:24px;font-weight:800}
.tl-mark{position:relative}
.tl-mark::before{content:"";position:absolute;left:7.5px;top:6px;bottom:-22px;width:3px;background:#C4E2E9}
.tl-item:last-child .tl-mark::before{display:none}
.tl-mark i{position:absolute;top:6px;left:0;width:18px;height:18px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px #fff}
.tl-mark i.sk{background:#94A3B8}.tl-mark i.ms{background:var(--bad)}.tl-mark i.ip{background:var(--aqua)}.tl-mark i.sc{background:#fff;border:3px solid #94A3B8}
.tl-body{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.tl-body h4{margin:0;font-size:15px}
.tl-body p{margin:2px 0 0;font-size:13px;color:var(--muted)}

/* hbars */
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hbar .hb-l{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .hb-t{height:14px;border-radius:7px;background:#E6F3F5;overflow:hidden}
.hbar .hb-t i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--primary),var(--aqua))}
.hbar .hb-v{font-weight:800;font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
.stockbar{height:8px;border-radius:4px;background:#E6F3F5;overflow:hidden;min-width:80px}
.stockbar i{display:block;height:100%;background:var(--ok)}
.stockbar i.low{background:var(--bad)}

.chart{width:100%;height:auto;display:block}
.chart text{font-family:"Segoe UI",system-ui,sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* calculator */
.calc-out{border-radius:16px;padding:16px;background:var(--navy);color:#fff;margin-top:14px;background-image:radial-gradient(120% 200% at 100% 0,rgba(6,182,212,.4),transparent 60%)}
.calc-out .co-l{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#A5F3FC}
.calc-out .co-v{font-size:34px;font-weight:800;font-family:var(--round);margin:4px 0}
.calc-out p{margin:4px 0 0;font-size:13px;color:#CFFAFE}
.calc-out.warn{background:#FFFBEB;color:#78350F;background-image:none;border:1.5px solid #FCD34D}
.calc-out.warn .co-l{color:#B45309}
.calc-out.warn p{color:#78350F}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:22px;width:100%;max-width:640px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 30px 70px -20px rgba(15,23,42,.6);overflow:hidden}
.modal.wide{max-width:900px}
.modal-h{padding:14px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.modal-h::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--primary),var(--aqua),var(--mint))}
.modal-h h2{margin:6px 0 0;font-size:18px;letter-spacing:.03em}
.modal-b{padding:18px 20px;overflow:auto;flex:1}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:#FBFEFE}
.modal-form{display:flex;flex-direction:column;min-height:0;flex:1}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toast */
#toast-root{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:650;box-shadow:0 14px 30px -10px rgba(15,23,42,.6);display:flex;gap:10px;align-items:center;animation:fade .2s;pointer-events:auto}
.toast .ic{color:var(--mint)}
.toast.err .ic{color:#FCA5A5}

/* bottom nav */
.bnav{display:none}

/* printable document */
.paper{background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 20px 40px -30px rgba(14,116,144,.8);max-width:900px;margin:0 auto}
.doc{color:#0F172A;font-size:13.5px;max-width:820px;margin:0 auto;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:14px;margin-bottom:6px;border-bottom:4px solid #0E7490;position:relative}
.doc-head::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:4px;background-image:linear-gradient(90deg,#06B6D4 50%,transparent 50%);background-size:16px 4px}
.doc-biz{display:flex;gap:12px;align-items:flex-start}
.doc-biz img{max-width:80px;max-height:64px;object-fit:contain}
.doc-biz b{font-size:18px;font-family:var(--round);display:block}
.doc-biz div{font-size:12.5px;color:#334155}
.doc-title{text-align:right}
.doc-title h1{font-size:20px;letter-spacing:.14em;margin:0 0 4px;color:#0E7490}
.doc-title div{font-size:12.5px;color:#334155}
.doc h3{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#0E7490;border-bottom:1.5px solid #CBE4EA;padding-bottom:5px;margin:22px 0 8px;font-family:inherit}
.doc table{width:100%;border-collapse:collapse}
.doc td,.doc th{padding:6px 8px;border-bottom:1px solid #E2EEF1;text-align:left;vertical-align:top}
.doc th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#64748B}
.doc td.num,.doc th.num{text-align:right;font-variant-numeric:tabular-nums}
.doc .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 28px;margin-top:22px}
.doc .meta div{display:flex;flex-direction:column}
.doc .meta span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#64748B;font-weight:700}
.doc .meta b{font-size:14px}
.doc .cols{columns:2;column-gap:28px}
.doc .cols div{break-inside:avoid;padding:3px 0}
.doc .ck{color:#16A34A;font-weight:800}
.doc .nk{color:#94A3B8}
.doc blockquote{margin:0;padding:10px 14px;border-left:4px solid #06B6D4;background:#F0FAFB;border-radius:0 10px 10px 0;font-style:italic}
.doc .st-normal{color:#15803D;font-weight:800}.doc .st-low,.doc .st-high{color:#B45309;font-weight:800}.doc .st-crit{color:#B91C1C;font-weight:800}
.doc .overall{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:800;letter-spacing:.1em;font-size:12px}
.doc .totals{width:320px;margin-left:auto;margin-top:8px}
.doc .totals td{padding:5px 8px}
.doc .totals tr.grand td{font-size:16px;font-weight:800;border-top:2px solid #0F172A;border-bottom:0}
.doc .stamp{display:inline-block;border:3px solid;border-radius:10px;padding:4px 12px;font-weight:900;letter-spacing:.14em;font-size:16px;transform:rotate(-4deg);margin-top:6px}
.doc .doc-foot{margin-top:28px;padding-top:12px;border-top:1px dashed #CBE4EA;font-size:11.5px;color:#475569}
.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.doc .pagebreak{break-before:page}
#print-root{display:none}


/* today layout areas */
.today-grid{grid-template-areas:"route qa" "route status" "route alerts";grid-template-rows:auto auto 1fr}
.ta-route{grid-area:route}.ta-qa{grid-area:qa}.ta-status{grid-area:status}.ta-alerts{grid-area:alerts}
@media (max-width:1024px){.today-grid{grid-template-areas:"qa" "route" "status" "alerts";grid-template-rows:auto}}
.cv{font-weight:700}.cv-low,.cv-high{color:#B45309;font-weight:800}.cv-crit{color:#B91C1C;font-weight:800}.cv-normal{color:inherit}
.badge .ic{width:14px;height:14px}
.gate{font-weight:800;letter-spacing:.1em}

/* ===== RESPONSIVE ===== */
@media (max-width:1180px){
  .tech-chip select{max-width:120px}
  .brand small{display:none}
}
@media (max-width:1024px){
  .today-grid,.grid-2{grid-template-columns:minmax(0,1fr)}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .lanes{display:none}
  .deck-in{padding:8px 12px;gap:8px;min-height:58px}
  .search{display:none}
  .deck.searching .search{display:block;position:absolute;left:10px;right:10px;top:8px;max-width:none;z-index:2}
  .search-toggle{display:grid;margin-left:auto}
  .tech-chip{padding:0 4px 0 10px}
  .tech-chip select{max-width:96px;font-size:13px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--navy);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px -12px rgba(15,23,42,.6)}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#9FC4CF;text-decoration:none;font-size:10.5px;font-weight:800;letter-spacing:.09em;min-height:54px;justify-content:center;border-radius:12px;text-transform:uppercase}
  .bnav a .ic{width:22px;height:22px}
  .bnav a[aria-current=page]{color:#fff;background:rgba(6,182,212,.25)}
  .bnav a[aria-current=page] .ic{color:var(--mint)}
  .wrap{padding:16px 14px 110px}
  #toast-root{bottom:96px}
  .stepbar.sticky{position:sticky;bottom:74px;background:#fff;margin:18px -20px -18px;padding:12px 16px;border-radius:0 0 18px 18px;box-shadow:0 -10px 20px -14px rgba(15,23,42,.4);z-index:5}
  .btn-sm{min-height:42px}
  .page-h h1{font-size:24px}
}
@media (max-width:640px){
  .fgrid,.fgrid.three,.grid-2e,.grid-3{grid-template-columns:minmax(0,1fr)}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .checklist{grid-template-columns:minmax(0,1fr)}
  .hero-in{padding:18px 18px 26px}
  .hero-in h1{font-size:25px}
  .ring{width:104px;height:104px}
  .panel{padding:16px 14px;border-radius:16px}
  .modal-back{padding:0;align-items:flex-end}
  .modal{border-radius:22px 22px 0 0;max-height:94vh}
  .stopcard{grid-template-columns:40px minmax(0,1fr);gap:10px}
  .stopcard .node{width:40px;height:40px;font-size:15px}
  .stopcard::before{left:18.5px}
  .sc-water{display:none}
  .stop{grid-template-columns:40px minmax(0,1fr) auto;gap:10px}
  .node{width:40px;height:40px}
  .stop::before{left:18.5px}
  .paper{padding:16px;border-radius:14px}
  .doc .meta,.doc .two{grid-template-columns:1fr}
  .doc .cols{columns:1}
  .doc-head{flex-direction:column}
  .doc-title{text-align:left}
  .doc .totals{width:100%}
  .hbar{grid-template-columns:minmax(80px,110px) minmax(0,1fr) auto}
  .tl-item{grid-template-columns:48px 18px minmax(0,1fr);gap:8px}
  .stepbar.sticky{margin:18px -14px -16px}
  .stepbar .btn{white-space:normal;text-align:center}
  .stepbar .btn-lg{flex:1;padding:0 12px;letter-spacing:.03em;font-size:15px}
  .btn-lg{white-space:normal}
}
@media (max-width:480px){
  .tech-chip>.ic{display:none}
  .tech-chip{padding:0 2px 0 8px}
  .tech-chip select{max-width:86px}
  .brand b{font-size:18px}
  .deck-in{gap:6px}
}
@media (max-width:760px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;padding:6px 4px;background:#fff}
  .tbl td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0!important;padding:7px 10px;text-align:right}
  .tbl td::before{content:attr(data-label);font-weight:800;color:#64748B;font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:left;flex:none}
  .tbl td[data-label=""]::before{display:none}
  .tbl td.num{text-align:right}
  .tbl .acts{justify-content:flex-end;width:100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media print{
  #app,#modal-root,#toast-root,.skip{display:none!important}
  #print-root{display:block}
  body{background:#fff;font-size:12px}
  .doc{max-width:none}
  .doc-head::after{display:none}
  @page{margin:12mm}
  .no-print{display:none!important}
  a{color:inherit;text-decoration:none}
}
</style>
</head>

    const a = parseD(s.startDate), b = parseD(date), last = new Date(b.getFullYear(), b.getMonth() + 1, 0).getDate();

}

  const total = r2(sub - disc + tax);

  return { sub, disc, tax, total, paid, balance: r2(total - paid) };
}

  const maintTypeFor = { Pump:'Pump Service', Filter:'Filter Cleaning', Heater:'Heater Service', 'Salt System':'Salt Cell Cleaning', Cleaner:'Inspection', 'Pool Lights':'Inspection', Chlorinator:'Inspection' };

  let ci = 0;

      const prid = cid + 'p' + (pi + 1);
      DB.properties.push({ id:prid, customerId:cid, name:pr[0], address:pr[1], gateCode:pr[2], access:pr[3], parking:pr[4], special:pr[5] });
      pr[6].forEach((pl, li) => {

        const freq = pl[10], off = pl[11];
        let start;
        if (freq === 'weekly') start = addDays(T, off - 63);

        else if (freq === '3weeks') start = addDays(T, off - 63);

        const stype = pl[8] === 'Commercial' ? 'Commercial Pool Service' : pl[1] === 'Spa / Hot Tub' ? 'Spa Service' : freq === 'biweekly' ? 'Biweekly Pool Service' : freq === 'monthly' ? 'Monthly Pool Service' : 'Weekly Pool Service';

          DB.equipmentMaintenance.push({ id:'m_' + eid, equipmentId:eid, poolId:pid, date:last, type:maintTypeFor[d[0]] || 'Inspection', techId:pl[9], notes:d[0] === 'Filter' ? 'Cleaned/backwashed filter; pressure returned to clean baseline.' : 'Routine service and inspection.', nextDate:addDays(last, interval) });
        });

  // equipment situations
  const eqBy = (pid, type) => DB.equipment.find(e => e.poolId === pid && e.type === type);
  const setEq = (pid, type, f) => { const e = eqBy(pid, type); if (e) Object.assign(e, f); };
  setEq('c2p1l1', 'Pump', { status:'Needs Attention', notes:'Pump noisy on startup — bearing wear suspected. Replacement quote sent.' });

  DB.chemicals = [

    { id:'ch2', name:'Muriatic Acid 31.45%', type:'Acid', unit:'gal', qty:9, min:6, supplier:'Gulf Coast Pool Supply', cost:9.5, notes:'Transport in a separate bin from chlorine.', rule:null },
    { id:'ch3', name:'Cal-Hypo Shock 73%', type:'Shock', unit:'lb', qty:18, min:10, supplier:'AquaSource Distributors', cost:3.8, notes:'', rule:null },

    { id:'ch5', name:'Algaecide 60%', type:'Algaecide', unit:'qt', qty:3, min:4, supplier:'AquaSource Distributors', cost:14, notes:'', rule:null },

  const NOTES = ['Pool condition good.','Light leaf debris; skimmed and vacuumed.','Filter pressure slightly elevated — monitor next visit.','Cleaned tile line; minor calcium at the waterline.','Water level a little low — customer advised to top off.','Everything running well. Baskets were full.','Brushed algae-prone corner by the steps.','Pool looks great. Equipment running normally.','Heavy pollen on the surface; extra skimming.','Customer asked about lighting upgrade — sent to office.'];
  function genTest(pool, q) {
    const salt = pool.sanitizer === 'Saltwater';
    const spa = pool.poolType === 'Spa / Hot Tub';
    const t = { ph:r1(rnd(7.3, 7.6)), fc:r1(rnd(1.6, 3.6)), ta:rint(85, 115), ch:rint(220, 380), cya:rint(35, 70), salt:salt ? rint(29, 33) * 100 : '', temp:spa ? rint(100, 102) : pool.location === 'Indoor' ? rint(80, 82) : rint(78, 86) };
    if (q === 'attention') { const w = pick(['fc','ph','ta']); if (w === 'fc') t.fc = r1(rnd(0.6, 0.9)); else if (w === 'ph') t.ph = r1(rnd(7.9, 8.1)); else t.ta = rint(64, 76); }
    if (q === 'critical') { t.ph = 8.4; t.fc = 0.2; }
    return t;
  }
  function genLogs(v, pool, t, comm) {
    const L = [];
    const add = (cid, amt, reason) => { const c = chem(cid); L.push({ id:uid(), visitId:v.id, poolId:pool.id, date:v.date, chemicalId:cid, chemical:c.name, type:c.type, amount:amt, unit:c.unit, reason, notes:'', cost:r2(c.cost * amt) }); };
    const m = comm ? 2.5 : 1;
    if (pool.sanitizer === 'Chlorine') add('ch1', r1(rnd(0.5, 2) * m), t.fc < 1 ? 'Raise chlorine' : 'Maintain chlorine');
    else if (R() < 0.3) add('ch1', 1, 'Raise chlorine');
    if (pool.sanitizer === 'Chlorine' && pool._eq.includes('Chlorinator') && R() < 0.5) add('ch4', rint(1, 3) * (comm ? 2 : 1), 'Chlorinator refill');
    if (pool.sanitizer === 'Saltwater' && R() < 0.2) add('ch6', rint(1, 2), 'Salt level');
    if (t.ph > 7.6) add('ch2', r1(rnd(0.25, 0.75) * m, 2), 'Lower pH');
    if (t.ta < 80) add('ch8', rint(4, 8) * (comm ? 2 : 1), 'Raise alkalinity');
    if (t.fc < 0.5) add('ch3', rint(2, 4), 'Shock / oxidize');
    if (R() < 0.07) add('ch5', 0.25, 'Algae prevention');
    return L;
  }
  DB.pools.forEach(p => { p._eq = eqForPool(p.id).map(e => e.type).join(','); });

  const stage = {}; // pid -> today's status override
  ['c1p1l1','c2p1l1','c3p1l1','c4p1l1'].forEach(pid => stage[pid] = 'completed');
  stage['c5p1l1'] = 'inprogress';
  ['c12p1l1','c12p1l2'].forEach(pid => stage[pid] = 'completed');

  DB.serviceSchedules.forEach(s => {
    const pool = poolById(s.poolId);
    const comm = pool.usage === 'Commercial';
    const dates = [];
    for (let d = addDays(T, -63); d <= T; d = addDays(d, 1)) if (isDue(s, d)) dates.push(d);
    const pastDates = dates.filter(d => d < T);
    dates.forEach((d, di) => {
      const isToday = d === T;
      if (isToday && !stage[pool.id]) return; // remaining stops materialize from the schedule
      const v = newVisit({ id:'v_' + pool.id + '_' + d.replace(/-/g, ''), poolId:pool.id, scheduleId:s.id, techId:s.techId, date:d, time:s.time, serviceType:s.serviceType });
      v.createdAt = d + 'T06:00:00.000Z';
      const lastPast = !isToday && di === pastDates.length - 1;
      // exceptions
      if (pool.id === 'c6p1l1' && !isToday && di === pastDates.length - 2) { v.status = 'skipped'; v.skipReason = 'Gate locked — customer notified by email.'; DB.serviceVisits.push(v); return; }
      if (pool.id === 'c11p1l1' && lastPast) { v.status = 'scheduled'; DB.serviceVisits.push(v); return; }
      const st = isToday ? stage[pool.id] : 'completed';
      v.status = st;
      v.arrival = addT(s.time, rint(-4, 9));
      v.condition = { clarity:'Clear', surface:pick(['Clean','Clean','Light Dirt']), debris:pick(['None','Light','Light','Moderate']), skimmer:pick(['Good','Good','Basket Full']), appearance:pick(['Excellent','Good','Good']) };
      let q = R() < 0.12 ? 'attention' : 'good';
      if (pool.id === 'c6p1l1' && lastPast) q = 'critical';
      if (pool.id === 'c9p2l1' && lastPast) q = 'good_lowta';
      if (pool.id === 'c4p1l1' && isToday) q = 'attention_fc';
      if (pool.id === 'c5p1l1' && isToday) q = 'good';
      let t = genTest(pool, q === 'good_lowta' || q === 'attention_fc' ? 'good' : q);
      if (q === 'good_lowta') t.ta = 68;
      if (q === 'attention_fc') t.fc = 0.8;
      if (pool.id === 'c13p1l1' && di >= pastDates.length - 3) t.cya = rint(92, 105);
      if (q === 'critical') { v.condition.clarity = 'Cloudy'; v.condition.surface = 'Algae Spots'; v.condition.appearance = 'Poor'; }
      const wt = Object.assign({ id:'wt_' + v.id, visitId:v.id, poolId:pool.id, date:d, time:addT(v.arrival, 6), techId:s.techId }, t);
      DB.waterTests.push(wt);
      v.stepsDone = { arrival:true, condition:true, water:true };
      if (st === 'completed') {
        v.completion = addT(v.arrival, rint(comm ? 45 : 26, comm ? 70 : 48));
        v.stepsDone = { arrival:true, condition:true, water:true, cleaning:true, chemicals:true, equipment:true, complete:true };
        const items = DB.settings.checklist.map(l => ({ label:l, done:l === 'Clean filter if required' ? R() < 0.3 : R() > 0.04 }));
        DB.cleaningChecklists.push({ id:'cl_' + v.id, visitId:v.id, items });
        DB.chemicalLogs.push(...genLogs(v, pool, t, comm));
        v.equipmentCheck = eqForPool(pool.id).map(e => ({ equipmentId:e.id, status:isToday || lastPast ? eqStatus(e) : 'OK', notes:(isToday || lastPast) && e.notes ? e.notes : '' }));
        v.notes = q === 'critical' ? 'Water cloudy with algae spots starting on the steps. pH high and chlorine very low — chlorinator feeder was empty. Shocked pool and refilled feeder; recheck on next visit.' : q === 'attention_fc' ? 'Chlorine running low after heavy rain; added chlorine. Recheck next visit.' : pick(NOTES);
      } else {
        v.notes = '';
      }
      DB.serviceVisits.push(v);
    });

  DB.pools.forEach(p => delete p._eq);

  // Invoices: monthly billing for the two previous months + one repair invoice
  let invNo = 1001;
  const firstOf = k => k + '-01';
  const thisMonth = monthKey(T);
  const prev1 = monthKey(addMonths(firstOf(thisMonth), -1));
  const prev2 = monthKey(addMonths(firstOf(thisMonth), -2));
  const payStatus = {
    [prev2]:{ c6:'unpaid', c13:'partial' },

  [prev2, prev1].forEach(mk => {
    const invDate = addMonths(firstOf(mk), 1);
    DB.customers.forEach(c => {
      const pids = DB.pools.filter(p => p.customerId === c.id).map(p => p.id);
      const visits = DB.serviceVisits.filter(v => pids.includes(v.poolId) && v.status === 'completed' && monthKey(v.date) === mk);
      if (!visits.length) return;
      const labor = r2(sum(visits, v => { const s = get('serviceSchedules', v.scheduleId); return s ? s.price : 45; }));
      const chemicals = r2(sum(DB.chemicalLogs.filter(l => visits.some(v => v.id === l.visitId)), l => l.cost) * 1.35);
      const props = DB.properties.filter(p => p.customerId === c.id);
      const inv = { id:'inv' + invNo, number:'INV-' + invNo, customerId:c.id, propertyId:props.length === 1 ? props[0].id : '', poolId:pids.length === 1 ? pids[0] : '', visitIds:visits.map(v => v.id), date:invDate, serviceDate:visits[visits.length - 1].date, dueDate:addDays(invDate, 15), serviceType:'Monthly Pool Service', serviceDesc:'Pool service — ' + plural(visits.length, 'visit') + ' in ' + MONTHS_L[+mk.slice(5) - 1] + ' ' + mk.slice(0, 4) + ' (water testing, cleaning, chemical balancing and equipment checks).', labor, chemicals, additional:0, additionalDesc:'', discount:0, taxRate:0, notes:'Thank you for your business!', createdAt:invDate };
      invNo++;
      DB.invoices.push(inv);
      const total = invTotals(inv).total;
      const mode = (payStatus[mk] || {})[c.id] || (mk === prev2 ? 'paid' : 'unpaid');
      const payDate = d => (d > T ? T : d);
      const method = c.id === 'c5' ? 'Bank Transfer' : pick(['Card','Card','Bank Transfer','Cash','Other']);
      if (mode === 'paid') DB.payments.push({ id:uid(), customerId:c.id, invoiceId:inv.id, amount:total, date:payDate(addDays(invDate, rint(1, 9))), method, reference:method === 'Card' ? 'Card ••' + rint(1000, 9999) : method === 'Bank Transfer' ? 'ACH-' + rint(100000, 999999) : method === 'Other' ? 'Check #' + rint(1000, 2999) : '', notes:'' });
      if (mode === 'partial') DB.payments.push({ id:uid(), customerId:c.id, invoiceId:inv.id, amount:r2(Math.round(total * 0.5)), date:payDate(addDays(invDate, rint(3, 10))), method:'Other', reference:'Check #' + rint(1000, 2999), notes:'Partial payment' });
    });
  });
  const millerVisit = DB.serviceVisits.filter(v => v.poolId === 'c3p1l1' && v.status === 'completed' && v.date < T).sort((a, b) => b.date.localeCompare(a.date))[0];
  DB.invoices.push({ id:'inv' + invNo, number:'INV-' + invNo, customerId:'c3', propertyId:'c3p1', poolId:'c3p1l1', visitIds:millerVisit ? [millerVisit.id] : [], date:addDays(T, -3), serviceDate:millerVisit ? millerVisit.date : addDays(T, -3), dueDate:addDays(T, 12), serviceType:'Equipment Repair', serviceDesc:'Heater diagnostic — ignition fault (error IF). Inspected igniter, flame sensor and gas valve; igniter replacement recommended.', labor:0, chemicals:0, additional:95, additionalDesc:'Heater diagnostic service call', discount:0, taxRate:0, notes:'Parts quote to follow.', createdAt:addDays(T, -3) });
  invNo++;

function deletePoolCascade(pid) {
  const vids = new Set(DB.serviceVisits.filter(v => v.poolId === pid).map(v => v.id));
  const eids = new Set(DB.equipment.filter(e => e.poolId === pid).map(e => e.id));
  DB.pools = DB.pools.filter(p => p.id !== pid);
  DB.serviceSchedules = DB.serviceSchedules.filter(s => s.poolId !== pid);
  DB.serviceVisits = DB.serviceVisits.filter(v => !vids.has(v.id));
  DB.waterTests = DB.waterTests.filter(t => t.poolId !== pid && !vids.has(t.visitId));
  DB.cleaningChecklists = DB.cleaningChecklists.filter(c => !vids.has(c.visitId));
  DB.chemicalLogs = DB.chemicalLogs.filter(l => !vids.has(l.visitId) && l.poolId !== pid);
  DB.equipment = DB.equipment.filter(e => !eids.has(e.id));
  DB.equipmentMaintenance = DB.equipmentMaintenance.filter(m => !eids.has(m.equipmentId));
  DB.invoices.forEach(i => { if (i.poolId === pid) i.poolId = ''; i.visitIds = (i.visitIds || []).filter(x => !vids.has(x)); });
}

const STEP_SAVE = {
  arrival(v, f) {
    const fields = ARRIVAL_FIELDS(), vals = readForm(f, fields);
    if (!validateForm(f, fields, vals)) return true;
    if (v.completion && timeMin(vals.arrival) > timeMin(v.completion)) return 'Arrival time cannot be after the completion time (' + fmtTime(v.completion) + ').';
    Object.assign(v, vals);
    if (['scheduled','enroute','arrived'].includes(v.status)) v.status = 'inprogress';
    ensureChecklist(v);
    return '';
  },
  condition(v, f) {
    const cond = {}; const missing = [];
    CONDITION.forEach(([k, label]) => { const val = f.elements[k] ? f.elements[k].value : ''; if (!val) missing.push(label); cond[k] = val; });
    if (missing.length) return 'Please select: ' + missing.join(', ') + '.';
    cond.notes = f.elements.condNotes.value.trim();
    v.condition = cond; return '';
  },
  water(v, f, p) {
    const t = testForVisit(v.id), vals = {}; let any = false;
    for (const k of waterKeys(p, t)) {
      const el = f.elements[k]; if (!el) continue;
      if (el.value.trim() === '') { vals[k] = ''; continue; }
      const n = Number(el.value);
      if (isNaN(n)) { el.focus(); return PARAM[k].label + ' must be a number.'; }
      if (k === 'ph' && (n < 0 || n > 14)) { el.focus(); return 'pH must be between 0 and 14.'; }
      if (k === 'temp' && (n < -10 || n > 130)) { el.focus(); return 'Water temperature looks out of range.'; }
      if (k !== 'temp' && n < 0) { el.focus(); return PARAM[k].label + ' cannot be negative.'; }
      vals[k] = n; if (BALANCE_KEYS.includes(k)) any = true;
    }
    if (!any) return 'Enter at least one water chemistry reading (pH, chlorine, alkalinity, calcium, CYA or salt).';
    const time = f.elements.testTime.value || nowTime();
    if (t) Object.assign(t, vals, { time, techId:v.techId, date:v.date });
    else DB.waterTests.push(Object.assign({ id:uid(), visitId:v.id, poolId:v.poolId, date:v.date, time, techId:v.techId }, vals));
    save('waterTests');
    const ws = waterStatus(testForVisit(v.id));
    toast('Water test saved — ' + WLABEL[ws]);
    return '';
  },
  cleaning() { return ''; },
  chemicals() { return ''; },
  equipment(v, f, p) {
    const eqs = eqForPool(p.id);
    v.equipmentCheck = eqs.map(e => {
      const st = (f.elements['eq_' + e.id] && f.elements['eq_' + e.id].value) || eqStatus(e);
      const notes = f.elements['eqn_' + e.id] ? f.elements['eqn_' + e.id].value.trim() : '';
      e.status = st; e.notes = notes;
      return { equipmentId:e.id, status:st, notes };
    });
    save('equipment');
    return '';
  },
  complete(v, f) {
    const fields = COMPLETE_FIELDS(), vals = readForm(f, fields);
    if (!validateForm(f, fields, vals)) return true;
    if (v.arrival && timeMin(vals.completion) < timeMin(v.arrival)) return 'Completion time cannot be before the arrival time (' + fmtTime(v.arrival) + ').';
    v.completion = vals.completion; v.notes = vals.notes;
    return '';
  },
};
function saveStep(id, key) {
  const v = get('serviceVisits', id); if (!v) return;
  const f = $('#stepform') || document.createElement('form');
  const p = poolById(v.poolId);
  const err = STEP_SAVE[key](v, f, p);
  const box = $('#stepErr');
  if (err) { if (box && typeof err === 'string') box.textContent = err; return; }
  if (box) box.textContent = '';
  v.stepsDone = v.stepsDone || {}; v.stepsDone[key] = true;
  if (['scheduled','enroute','arrived'].includes(v.status)) v.status = 'inprogress';
  save('serviceVisits');
  const idx = STEPS.findIndex(s => s[0] === key);
  if (key === 'complete') { toast('Visit updated'); rerender(); return; }

/* ---------- CHEMICAL CALCULATOR (user label rules only) ---------- */
function ruleText(c) { const r = c.rule; const u = PARAM[r.param].key === 'temp' ? '' : PARAM[r.param].unit; return `${fmtNum(r.amount)} ${r.unit} per ${fmtNum(r.perVolume, 0)} ${volUnit()} ${r.direction === 'lower' ? 'lowers' : 'raises'} ${PARAM[r.param].label} by ${fmtNum(r.change)}${u ? ' ' + u : ''}`; }
function calcHTML(pre) {
  pre = pre || {};
  const prods = DB.chemicals.filter(hasRule);
  if (!prods.length) return safetyNote(SAFETY_PLAN) + emptyState('calc', 'No label dosage rules configured yet', 'The calculator only uses dosage rules that you copy from each product\'s label. Add a label rule to a chemical to enable calculations.', `<a class="btn btn-primary mt" href="#/chemicals" data-act="gotoRules">${icon('beaker')}Configure label rules</a>`);
  const p = pre.poolId ? poolById(pre.poolId) : null;
  return `<form id="calcForm" data-input="calc" data-change="calc" novalidate>
    <div class="fgrid">
      <div class="field full"><label for="cx_chem">Chemical product (with label rule)</label><select id="cx_chem" name="chem"><option value="">Choose product</option>${prods.map(c => `<option value="${c.id}">${esc(c.name)} — ${esc(PARAM[c.rule.param].short)} ${c.rule.direction === 'lower' ? '↓' : '↑'}</option>`).join('')}</select><span class="help" id="cx_rule"></span></div>
      <div class="field"><label for="cx_pool">Pool (optional)</label><select id="cx_pool" name="pool"><option value="">— Enter volume manually —</option>${optsHTML(poolOptions(), pre.poolId || '')}</select></div>
      <div class="field"><label for="cx_vol">Pool volume (${volUnit()})</label><input id="cx_vol" name="volume" type="number" min="1" step="any" inputmode="decimal" value="${p ? p.volume : ''}"></div>
      <div class="field"><label for="cx_cur">Current reading <span id="cx_pl1"></span></label><input id="cx_cur" name="current" type="number" step="any" inputmode="decimal"></div>
      <div class="field"><label for="cx_tgt">Target reading <span id="cx_pl2"></span></label><input id="cx_tgt" name="target" type="number" step="any" inputmode="decimal"><span class="help" id="cx_range"></span></div>
    </div>
    <div class="calc-out warn" id="calcOut" aria-live="polite"><span class="co-l">Waiting for inputs</span><p>Choose a product, then enter pool volume, current reading and target reading.</p></div>
  </form><div class="mt">${safetyNote(SAFETY_MSG)}</div><p class="small muted">${esc(SAFETY_PLAN)}</p>`;
}
function computeCalc(form, target) {
  const el = n => form.elements[n];
  if (target && target.name === 'pool') { const p = poolById(el('pool').value); if (p) el('volume').value = p.volume; }
  const c = get('chemicals', el('chem').value), out = $('#calcOut');
  if (!c || !hasRule(c)) { out.className = 'calc-out warn'; out.innerHTML = '<span class="co-l">Waiting for inputs</span><p>Choose a product with a configured label rule.</p>'; $('#cx_rule').textContent = ''; return; }
  const r = c.rule, pk = r.param;
  $('#cx_rule').textContent = 'Label rule: ' + ruleText(c) + (r.labelRef ? ' (' + r.labelRef + ')' : '');
  $('#cx_pl1').textContent = '(' + PARAM[pk].short + ')'; $('#cx_pl2').textContent = '(' + PARAM[pk].short + ')';
  const rg = DB.settings.ranges[pk]; $('#cx_range').textContent = rg && hasVal(rg.min) ? 'Your target range: ' + fmtNum(rg.min) + '–' + fmtNum(rg.max) : '';
  if (target && target.name === 'chem') {
    const wf = $('#stepform') && $('#stepform').elements[pk];
    if (wf && wf.value !== '' && el('current').value === '') el('current').value = wf.value;
  }
  const vol = +el('volume').value, cur = el('current').value, tgt = el('target').value;
  if (!(vol > 0) || cur === '' || tgt === '' || isNaN(+cur) || isNaN(+tgt)) { out.className = 'calc-out warn'; out.innerHTML = '<span class="co-l">Waiting for inputs</span><p>Enter pool volume, current reading and target reading.</p>'; return; }
  const delta = +tgt - +cur;
  if (Math.abs(delta) < 1e-9) { out.className = 'calc-out warn'; out.innerHTML = '<span class="co-l">No adjustment</span><p>Current reading already equals the target.</p>'; return; }
  const dir = delta > 0 ? 'raise' : 'lower';
  if (dir !== r.direction) { out.className = 'calc-out warn'; out.innerHTML = `<span class="co-l">Product does not match</span><p>This product's label rule is set to <b>${r.direction}</b> ${esc(PARAM[pk].label)}, but your target requires you to <b>${dir}</b> it. Choose a different product.</p>`; return; }
  const amount = r.amount * (vol / r.perVolume) * (Math.abs(delta) / r.change);
  const over = hasVal(r.maxPerApp) && +r.maxPerApp > 0 && amount > +r.maxPerApp;
  out.className = 'calc-out';
  out.innerHTML = `<span class="co-l">Calculated from your label rule</span><div class="co-v">${fmtNum(amount, 2)} ${esc(r.unit)}</div><p>${esc(c.name)} · ${dir} ${esc(PARAM[pk].label)} by ${fmtNum(Math.abs(delta), 2)} in ${fmtNum(vol, 0)} ${volUnit()}</p><p>Rule used: ${esc(ruleText(c))}${r.labelRef ? ' · ' + esc(r.labelRef) : ''}</p>${over ? `<p style="color:#FDE68A"><b>Exceeds the per-application maximum you entered (${fmtNum(r.maxPerApp)} ${esc(r.unit)}).</b> Follow the label for split applications.</p>` : ''}<p><b>Planning aid only — not a guaranteed safe amount.</b> ${esc(SAFETY_MSG)}</p>`;
}
INP.calc = (f, e) => computeCalc(f, e.target);
CHG.calc = (f, e) => computeCalc(f, e.target);

  const out = {}, errs = [];
  PARAMS.forEach(p => {
    const g = n => { const v = f.elements[p.key + '_' + n].value.trim(); return v === '' ? '' : Number(v); };
    const r = { critLow:g('critLow'), min:g('min'), max:g('max'), critHigh:g('critHigh') };
    ['critLow','min','max','critHigh'].forEach(k => { if (r[k] !== '' && isNaN(r[k])) errs.push(p.label + ': enter numbers only.'); });
    if (r.min === '' || r.max === '') errs.push(p.label + ': Min and Max are required.');
    else if (+r.min >= +r.max) errs.push(p.label + ': Min must be less than Max.');
    if (r.critLow !== '' && r.min !== '' && +r.critLow > +r.min) errs.push(p.label + ': Critical low must be at or below Min.');
    if (r.critHigh !== '' && r.max !== '' && +r.critHigh < +r.max) errs.push(p.label + ': Critical high must be at or above Max.');
    out[p.key] = r;
  });
  if (errs.length) { $('#rangeErr').textContent = errs.join(' '); return; }
  DB.settings.ranges = out; save('settings'); toast('Water target ranges saved'); rerender();
};
ACT.resetRanges = () => confirmDialog('Restore default ranges?', 'Replace your water target ranges with the PoolFlow defaults?', () => { DB.settings.ranges = defaultRanges(); save('settings'); toast('Default ranges restored'); rerender(); }, { yes:'Restore' });
CHG.logoFile = el => {

};

function staffForm(s) {
  const isNew = !s;
  formModal({ title:isNew ? 'Add Technician' : 'Edit Technician', fields:[
    { name:'name', label:'Full name', required:true, autocomplete:'name' },
    { name:'role', label:'Role', placeholder:'e.g. Service Technician' },

    values:s ? Object.assign({}, s) : { role:'Service Technician', color:'#0E7490', active:true }, submit:isNew ? 'Add technician' : 'Save',
    onSubmit:vals => { if (DB.staff.some(x => x.name.toLowerCase() === vals.name.toLowerCase() && (!s || x.id !== s.id))) return 'A technician with this name already exists.'; const rec = Object.assign(s || { id:uid() }, vals); if (isNew) DB.staff.push(rec); save('staff'); toast(isNew ? 'Technician added' : 'Technician saved'); rerender(); } });
}
ACT.addStaff = () => staffForm(null);

ACT.deleteStaff = d => {
  const s = staffById(d.id);
  const used = DB.serviceVisits.some(v => v.techId === s.id) || DB.serviceSchedules.some(x => x.techId === s.id) || DB.pools.some(p => p.techId === s.id);
  if (used) return confirmDialog('Deactivate technician?', `<b>${esc(s.name)}</b> has service history or assigned pools, so they can't be deleted. Mark them inactive instead?`, () => { s.active = false; save('staff'); toast(s.name + ' marked inactive'); rerender(); }, { yes:'Mark inactive' });
  confirmDialog('Remove technician?', `Remove <b>${esc(s.name)}</b>?`, () => { DB.staff = DB.staff.filter(x => x.id !== s.id); if (DB.settings.currentTechId === s.id) DB.settings.currentTechId = 'all'; save('staff', 'settings'); toast('Technician removed'); rerender(); }, { yes:'Remove', danger:true });
};
ACT.moveCheck = d => { const a = DB.settings.checklist, i = +d.i, j = i + (+d.dir); if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; save('settings'); rerender(); };

SUB.addDefaultCheck = f => { const v = f.elements.task.value.trim(); if (!v) { toast('Type a task name first.', 'err'); return; } if (DB.settings.checklist.some(x => x.toLowerCase() === v.toLowerCase())) { toast('That task already exists.', 'err'); return; } DB.settings.checklist.push(v); save('settings'); toast('Task added'); rerender(); const n = $('#ndc'); if (n) n.focus(); };

function exportData() {
  const data = {}; KEYS.forEach(k => { data[k] = DB[k]; });
  const payload = { app:'PoolFlow', version:1, exportedAt:new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'PoolFlow-Backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  DB.settings.lastExport = new Date().toISOString(); save('settings');
  toast('Backup downloaded: ' + a.download);
}
ACT.exportData = () => { exportData(); rerender(); };
function validateBackup(obj) {
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('The file does not contain a PoolFlow backup.');
  if (obj.app && obj.app !== 'PoolFlow') throw new Error('This backup was created by a different application (' + obj.app + ').');
  const data = obj.data && typeof obj.data === 'object' && !Array.isArray(obj.data) ? obj.data : obj;
  ['customers','properties','pools','serviceVisits'].forEach(k => { if (!Array.isArray(data[k])) throw new Error('Missing or invalid "' + k + '" list.'); });
  KEYS.forEach(k => {
    if (k === 'settings') { if (data.settings != null && (typeof data.settings !== 'object' || Array.isArray(data.settings))) throw new Error('"settings" must be an object.'); return; }
    if (data[k] == null) data[k] = [];
    if (!Array.isArray(data[k])) throw new Error('"' + k + '" must be a list.');
    const seen = new Set();
    data[k].forEach((it, i) => {
      if (!it || typeof it !== 'object' || typeof it.id !== 'string' || !it.id) throw new Error(k + ' item #' + (i + 1) + ' is missing an id.');
      if (seen.has(it.id)) throw new Error(k + ' contains a duplicate id (' + it.id + ').');
      seen.add(it.id);
    });
  });
  const ids = k => new Set(data[k].map(x => x.id));
  const cs = ids('customers'), ps = ids('properties'), pl = ids('pools'), iv = ids('invoices');
  data.customers.forEach(c => { if (typeof c.name !== 'string' || !c.name) throw new Error('A customer is missing a name.'); });
  data.properties.forEach(p => { if (!cs.has(p.customerId)) throw new Error('Property "' + (p.name || p.id) + '" references a missing customer.'); });
  data.pools.forEach(p => { if (!ps.has(p.propertyId) || !cs.has(p.customerId)) throw new Error('Pool "' + (p.name || p.id) + '" references a missing property or customer.'); });
  data.serviceSchedules.forEach(s => { if (!pl.has(s.poolId)) throw new Error('A recurring service references a missing pool.'); if (!isDateStr(s.startDate)) throw new Error('A recurring service has an invalid start date.'); });
  data.serviceVisits.forEach(v => { if (!pl.has(v.poolId)) throw new Error('A service visit references a missing pool.'); if (!isDateStr(v.date)) throw new Error('A service visit has an invalid date.'); if (!VISIT_STATUS[v.status]) throw new Error('A service visit has an unknown status.'); });
  data.waterTests.forEach(t => { if (!isDateStr(t.date)) throw new Error('A water test has an invalid date.'); });
  data.invoices.forEach(i => { if (!cs.has(i.customerId)) throw new Error('Invoice ' + (i.number || i.id) + ' references a missing customer.'); if (!i.number) throw new Error('An invoice is missing its number.'); });
  data.payments.forEach(p => { if (!iv.has(p.invoiceId)) throw new Error('A payment references a missing invoice.'); if (!(+p.amount > 0)) throw new Error('A payment has an invalid amount.'); });
  return data;
}
CHG.importFile = el => {
  const f = el.files && el.files[0]; if (!f) return;
  if (f.size > 25 * 1024 * 1024) { toast('That file is too large to be a PoolFlow backup.', 'err'); el.value = ''; return; }
  const r = new FileReader();
  r.onload = () => {
    el.value = '';
    let obj, data;
    try { obj = JSON.parse(r.result); } catch (e) { toast('Import failed: the file is not valid JSON.', 'err'); return; }
    try { data = validateBackup(obj); } catch (e) { toast('Import failed: ' + e.message, 'err'); return; }
    confirmDialog('Import backup?', `<p style="margin-top:0">Backup${obj.exportedAt ? ' from <b>' + esc(fmtDate(String(obj.exportedAt).slice(0, 10))) + '</b>' : ''} contains ${plural(data.customers.length, 'customer')}, ${plural(data.pools.length, 'pool')}, ${plural(data.serviceVisits.length, 'service visit')} and ${plural(data.invoices.length, 'invoice')}.</p><p><b>All current data in this browser will be replaced.</b></p>`, () => {
      KEYS.forEach(k => { DB[k] = k === 'settings' ? mergeSettings(data.settings) : data[k]; });
      saveAll(); toast('Backup imported successfully'); lastPath = ''; go('#/today');
    }, { yes:'Replace my data', danger:true });
  };
  r.onerror = () => toast('Could not read that file.', 'err');
  r.readAsText(f);
};
ACT.resetData = () => confirmDialog('Reset to initial data?', 'All current data will be replaced with the initial BlueWave Pool Care business data. Export a backup first if you need it.', () => { seedData(); saveAll(); toast('Data reset'); lastPath = ''; go('#/today'); }, { yes:'Reset data', danger:true });
ACT.clearData = () => confirmDialog('Clear all data?', 'This permanently deletes every customer, pool, visit, invoice and setting stored in this browser.', () => {
  KEYS.forEach(k => { DB[k] = k === 'settings' ? defaultSettings() : []; });
  DB.settings.business.name = 'My Pool Service'; DB.settings.business.phone = ''; DB.settings.business.email = ''; DB.settings.business.address = '';
  saveAll(); toast('All data cleared'); UI.setTab = 'business'; lastPath = ''; go('#/settings');
}, { yes:'Clear everything', danger:true });
