name: One Tap Thief – Android build

on:
  workflow_dispatch:
  push:
    paths: ['one-tap-thief/**', '.github/workflows/one-tap-thief-android.yml']

defaults:
  run:
    working-directory: one-tap-thief

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Validate levels + solve every level with the bot
        run: npm test
      - name: Build web assets + sync Capacitor
        run: npm run android:sync
      - name: Debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Release AAB (signed when keystore secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            printf 'storeFile=../release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          else
            echo "No keystore secrets: building an UNSIGNED release AAB."
          fi
          cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: one-tap-thief-android
          path: |
            one-tap-thief/android/app/build/outputs/apk/debug/*.apk
            one-tap-thief/android/app/build/outputs/bundle/release/*.aab
