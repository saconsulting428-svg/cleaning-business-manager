    <div><button type="button" class="btn sm" data-add-item style="margin-top:6px">${icon('plus')}Add line</button></div></div>`;
}
function itemRow(it = {}, withService) {
  return `<tr class="item-row">
    ${withService ? `<td><select data-i="serviceId">${state.settings.services.map(s => `<option value="${s.id}" ${s.id === it.serviceId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></td>` : ''}
    <td><input data-i="description" value="${esc(it.description || '')}" placeholder="Description"></td>
    <td><input data-i="qty" type="number" min="0" step="1" value="${it.qty ?? 1}"></td>
    <td><input data-i="price" type="number" min="0" step="0.01" value="${it.price ?? ''}" inputmode="decimal"></td>
    <td class="amt num">$0</td>
    <td><button type="button" class="btn sm icon ghost" data-rm-item aria-label="Remove line">${icon('x')}</button></td>
  </tr>`;
}
function bindItemsEditor(form, withService, onChange) {
  const body = $('.items-body', form);
  const recalc = () => { $$('.item-row', body).forEach(r => { const q = Number($('[data-i=qty]', r).value) || 0, p = Number($('[data-i=price]', r).value) || 0; $('.amt', r).textContent = money2(q * p); }); onChange && onChange(); };
  $('[data-add-item]', form).addEventListener('click', () => {
    const s = state.settings.services[0];
    body.insertAdjacentHTML('beforeend', itemRow(withService ? { serviceId: s?.id, description: s?.name, price: s?.price } : {}, withService));
    recalc();
  });
  body.addEventListener('click', (e) => { if (e.target.closest('[data-rm-item]')) { if ($$('.item-row', body).length > 1) e.target.closest('tr').remove(); else toast('At least one line is needed', 'error'); recalc(); } });
  body.addEventListener('input', recalc);
  body.addEventListener('change', (e) => {
    if (e.target.matches('[data-i=serviceId]')) {
      const s = svcById(e.target.value), r = e.target.closest('tr');
      if (s) { $('[data-i=price]', r).value = s.price; const d = $('[data-i=description]', r); if (!d.value || state.settings.services.some(x => x.name === d.value)) d.value = s.name; }
      recalc();
    }
  });
  recalc();
  return () => $$('.item-row', body).map(r => {
    const o = { description: $('[data-i=description]', r).value.trim(), qty: Number($('[data-i=qty]', r).value) || 0, price: round2($('[data-i=price]', r).value) };
    if (withService) o.serviceId = $('[data-i=serviceId]', r).value;
    return o;
  }).filter(o => o.description || o.price);
}

/* =========================================================
   WORKFLOW OPERATIONS
   ========================================================= */
function setJobStatus(id, status) {
  const j = byId('jobs', id);
  if (!j || j.status === status) return;
  j.status = status;
  if (status === 'Completed') j.completedAt = today();
  save(); render();
  const p = byId('properties', j.propertyId);
  const rec = p?.recurring;
  const hasFuture = p && hasLaterVisit(p.id, j);
  if (status === 'Completed' && rec && !hasFuture) toast(`${p.name} completed`, 'ok', { label: `Schedule next (${fmtDate(rec.nextDate)})`, fn: () => scheduleNext(p.id) }, 7000);
  else if (status === 'Completed' && !jobInvoice(j.id)) toast('Job completed', 'ok', { label: 'Create invoice', fn: () => invoiceFromJob(j.id) }, 6000);
  else toast(`Marked ${status.toLowerCase()}`);
}
function scheduleNext(propertyId) {
  const p = byId('properties', propertyId);
  const r = p?.recurring;
  if (!r) return;
  let date = r.nextDate || today();
  if (date < today()) date = today();
  const existing = jobsForProperty(p.id).find(j => j.date === date && j.status !== 'Cancelled');
  let job = existing;
  if (!existing) {
    const s = svcById(r.serviceId);
    job = {
      id: uid('job'), number: nextNumber('job'), customerId: p.customerId, propertyId: p.id, serviceId: r.serviceId, serviceLabel: '',
      date, time: r.time || state.settings.jobs.defaultTime, duration: s?.duration || state.settings.jobs.defaultDuration,
      crewIds: (r.crewIds || []).filter(id => byId('crew', id)), price: r.price, status: 'Scheduled', notes: '', photos: {}, createdAt: today()
    };
    state.jobs.push(job);
  }
  r.nextDate = advanceDate(date, r.frequency, r.customDays) || date;
  save(); render();
  toast(existing ? `Already booked for ${relDay(date)} — plan moved to ${fmtDate(r.nextDate)}` : `Visit scheduled: ${fmtDateLong(date)}`, 'ok', { label: 'View job', fn: () => openDrawer('job', job.id) }, 6000);
}
function invoiceFromJob(jobId) {
  const j = byId('jobs', jobId);
  if (!j) return;
  const existing = jobInvoice(jobId);
  if (existing) { openDrawer('invoice', existing.id); return; }
  const st = state.settings;
  const inv = {
    id: uid('inv'), number: nextNumber('invoice'), customerId: j.customerId, propertyId: j.propertyId, jobId: j.id,
    date: today(), dueDate: addDays(today(), Number(st.invoice.terms) || 0), isDraft: false, notes: 'Thank you for your business!',
    items: [{ description: `${jobService(j)} — ${propName(j.propertyId)} (${fmtDate(j.date)})`, qty: 1, price: j.price }], payments: []
  };
  state.invoices.push(inv);
  save(); render();
  openDrawer('invoice', inv.id);
  toast(`Invoice ${inv.number} created`);
}
function convertQuote(id) {
  const q = byId('quotes', id);
  if (!q) return;
  if (q.jobId && byId('jobs', q.jobId)) { openDrawer('job', q.jobId); return; }
  const p = byId('properties', q.propertyId);
  const first = q.items[0] || {};
  // next occurrence of the preferred day, or tomorrow
  let date = addDays(today(), 1);
  if (p?.preferredDay) { const want = DAYS.indexOf(p.preferredDay); for (let i = 1; i <= 7; i++) { const d = addDays(today(), i); if (parseISO(d).getDay() === want) { date = d; break; } } }
  const label = q.items.length > 1 ? q.items.map(i => svcById(i.serviceId)?.name || i.description).join(' + ') : '';
  jobForm(null, {
    fromQuote: q.id, customerId: q.customerId, propertyId: q.propertyId, serviceId: first.serviceId || state.settings.services[0]?.id,
    serviceLabel: label.slice(0, 60), price: quoteTotal(q), date,
    notes: `From quote ${q.number}:\n` + q.items.map(i => `• ${i.description}${i.qty !== 1 ? ' × ' + i.qty : ''}`).join('\n') + (q.notes ? `\n\n${q.notes}` : '')
  });
}

/* ---- deletes ---- */
async function deleteJob(id) {
  const j = byId('jobs', id);
  if (!j || !await confirmDialog({ title: 'Delete this job?', text: `<b>${esc(j.number)}</b> — ${esc(propName(j.propertyId))} on ${fmtDate(j.date)} will be permanently removed, including any photos.` })) return;
  state.jobs = state.jobs.filter(x => x.id !== id);
  state.invoices.forEach(i => { if (i.jobId === id) i.jobId = null; });
  state.quotes.forEach(q => { if (q.jobId === id) q.jobId = null; });
  closeDrawer(); save(); render(); toast('Job deleted');
}
async function deleteProperty(id) {
  const p = byId('properties', id);
  const n = jobsForProperty(id).length;
  if (!p || !await confirmDialog({ title: 'Delete this property?', text: `<b>${esc(p.name)}</b> will be removed${n ? ` along with its <b>${n} job${n > 1 ? 's' : ''}</b>` : ''}. Invoices and quotes are kept. This cannot be undone.` })) return;
  const jobIds = jobsForProperty(id).map(j => j.id);
  state.jobs = state.jobs.filter(j => j.propertyId !== id);
  state.invoices.forEach(i => { if (jobIds.includes(i.jobId)) i.jobId = null; });
  state.quotes.forEach(q => { if (jobIds.includes(q.jobId)) q.jobId = null; });
  state.properties = state.properties.filter(x => x.id !== id);
  closeDrawer(); save(); render(); toast('Property deleted');
}
async function deleteCustomer(id) {
  const c = byId('customers', id);
  if (!c) return;
  const counts = ['properties', 'jobs', 'quotes', 'invoices'].map(k => [k, state[k].filter(x => x.customerId === id).length]).filter(([, n]) => n);
  const what = counts.map(([k, n]) => `${n} ${n === 1 ? k.replace(/ies$/, 'y').replace(/s$/, '') : k}`).join(', ');
  if (!await confirmDialog({ title: 'Delete this customer?', text: `<b>${esc(c.name)}</b> will be permanently removed${what ? `, together with <b>${what}</b>` : ''}. Consider exporting a backup first.` })) return;
  ['properties', 'jobs', 'quotes', 'invoices'].forEach(k => { state[k] = state[k].filter(x => x.customerId !== id); });
  state.customers = state.customers.filter(x => x.id !== id);
  closeDrawer(); save(); render(); toast('Customer deleted');
}
async function deleteQuote(id) {
  const q = byId('quotes', id);
  if (!q || !await confirmDialog({ title: 'Delete this quote?', text: `Quote <b>${esc(q.number)}</b> for ${esc(custName(q.customerId))} (${money2(quoteTotal(q))}) will be removed.` })) return;
  state.quotes = state.quotes.filter(x => x.id !== id);
  closeDrawer(); save(); render(); toast('Quote deleted');
}
async function deleteInvoice(id) {
  const inv = byId('invoices', id);
  if (!inv || !await confirmDialog({ title: 'Delete this invoice?', text: `Invoice <b>${esc(inv.number)}</b> (${money2(invTotal(inv))})${inv.payments.length ? ' and its recorded payments' : ''} will be removed. Revenue reports will change.` })) return;
  state.invoices = state.invoices.filter(x => x.id !== id);
  closeDrawer(); save(); render(); toast('Invoice deleted');
}
async function deleteCrew(id) {
  const c = byId('crew', id);
  const n = state.jobs.filter(j => j.crewIds.includes(id) && j.status === 'Scheduled').length;
  if (!c || !await confirmDialog({ title: 'Remove crew member?', text: `<b>${esc(c.name)}</b> will be removed from the team${n ? ` and unassigned from <b>${n} scheduled job${n > 1 ? 's' : ''}</b>` : ''}.`, confirmLabel: 'Remove' })) return;
  state.crew = state.crew.filter(x => x.id !== id);
  state.jobs.forEach(j => { j.crewIds = j.crewIds.filter(x => x !== id); });
  state.properties.forEach(p => { if (p.recurring) p.recurring.crewIds = (p.recurring.crewIds || []).filter(x => x !== id); });
  save(); render(); toast('Crew member removed');
}

function compressImage(file, maxDim = 960, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function viewPhoto(jobId, slot) {
  const j = byId('jobs', jobId);
  const src = j?.photos?.[slot];

function searchAll(qs) {
  const q = qs.trim().toLowerCase();
  if (!q) return [];
  const has = (...f) => f.some(x => String(x ?? '').toLowerCase().includes(q));
  const groups = [
    { label: 'Customers', icon: 'user', items: state.customers.filter(c => has(c.name, c.phone, c.email, c.address)).map(c => ({ t: c.name, s: [c.phone, c.address].filter(Boolean).join(' · '), act: 'openCustomer', id: c.id })) },
    { label: 'Properties', icon: 'house', items: state.properties.filter(p => has(p.name, p.address, p.grass, custName(p.customerId))).map(p => ({ t: p.name, s: `${p.address} · ${custName(p.customerId)}`, act: 'openProperty', id: p.id })) },
    { label: 'Jobs', icon: 'mower', items: state.jobs.filter(j => has(j.number, jobService(j), propName(j.propertyId), custName(j.customerId), j.status, crewNames(j.crewIds))).sort(jobSort).reverse().map(j => ({ t: `${propName(j.propertyId)} · ${jobService(j)}`, s: `${j.number} · ${fmtDate(j.date)} · ${j.status}`, act: 'openJob', id: j.id })) },
    { label: 'Quotes', icon: 'quote', items: state.quotes.filter(x => has(x.number, custName(x.customerId), propName(x.propertyId), x.status, ...x.items.map(i => i.description))).map(x => ({ t: `${x.number} · ${custName(x.customerId)}`, s: `${money2(quoteTotal(x))} · ${x.status}`, act: 'openQuote', id: x.id })) },
    { label: 'Invoices', icon: 'invoice', items: state.invoices.filter(i => has(i.number, custName(i.customerId), propName(i.propertyId), invStatus(i))).map(i => ({ t: `${i.number} · ${custName(i.customerId)}`, s: `${money2(invTotal(i))} · ${invStatus(i)}`, act: 'openInvoice', id: i.id })) }
  ];
  return groups.filter(g => g.items.length);
}

function exportData() {

  a.href = URL.createObjectURL(blob);
  a.download = `lawnflow-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);

}
function importFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { toast('That file is not valid JSON.', 'error'); return; }
    if (!data || typeof data !== 'object' || !Array.isArray(data.customers) || !Array.isArray(data.jobs)) { toast('This does not look like a LawnFlow backup.', 'error'); return; }
    if (!await confirmDialog({ title: 'Restore this backup?', text: `The backup contains <b>${data.customers.length} customers</b>, <b>${(data.properties || []).length} properties</b> and <b>${data.jobs.length} jobs</b>. Your current data will be <b>replaced</b>.`, confirmLabel: 'Replace & restore' })) return;
    state = normalizeState(data);
    closeDrawer(); save(); render(); toast('Backup restored');
  };
  reader.readAsText(file);
}

function setSetting(path, raw) {
  const [grp, key] = path.split('.');
  const numeric = ['defaultDuration', 'terms', 'nextNumber'];
  let val = numeric.includes(key) ? Math.max(0, parseInt(raw, 10) || 0) : raw;
  if (key === 'name' && !String(val).trim()) { toast('Business name cannot be empty', 'error'); render(); return; }
  if (key === 'nextNumber' && val < 1) val = 1;
  state.settings[grp][key] = val;
  save(); renderNav(); toast('Settings saved');
}

/* =========================================================
   TOASTS
   ========================================================= */
function toast(msg, kind = 'ok', action = null, ms = 3200) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'error' ? 'error' : '');
  el.setAttribute('role', 'status');
  el.innerHTML = `<span class="ti">${icon(kind === 'error' ? 'x' : 'check')}</span><span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;
  if (action) $('button', el).addEventListener('click', () => { el.remove(); action.fn(); });
  $('#toasts').appendChild(el);
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
  setTimeout(() => el.remove(), ms);
}

/* =========================================================
   ACTIONS — every [data-act] click is routed here
   ========================================================= */
const ACTIONS = {
  // navigation & panels
  openMore, closeMore,
  closeDrawer,
  openJob: (id) => openDrawer('job', id),
  openProperty: (id) => openDrawer('property', id),
  openCustomer: (id) => openDrawer('customer', id),
  openQuote: (id) => openDrawer('quote', id),
  openInvoice: (id) => openDrawer('invoice', id),
  gotoInvoices: (f) => { ui.invoiceFilter = f; go('invoices'); },
  gotoQuotes: (f) => { ui.quoteFilter = f; go('quotes'); },
  gotoJobs: (f) => { ui.jobFilter = f; ui.jobView = 'list'; go('jobs'); },
  gotoProps: (f) => { ui.propFilter = f; go('properties'); },
  scrollTo: (id) => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }),
  // filters & views
  jobFilter: (id) => { ui.jobFilter = id; render(); },
  jobView: (id) => { ui.jobView = id; render(); },
  calNav: (n) => { const base = ui.calMonth ? parseISO(ui.calMonth) : new Date(); ui.calMonth = Number(n) === 0 ? null : toISO(new Date(base.getFullYear(), base.getMonth() + Number(n), 1)); render(); },
  calDay: (iso) => jobForm(null, { date: iso }),
  propFilter: (id) => { ui.propFilter = id; render(); },
  custSort: (id) => { ui.customerSort = id; render(); },
  quoteFilter: (id) => { ui.quoteFilter = id; render(); },
  invoiceFilter: (id) => { ui.invoiceFilter = id; render(); },
  // creation
  newJob: (_, el) => jobForm(null, el?.dataset.date ? { date: el.dataset.date } : {}),
  newJobFor: (pid) => { const p = byId('properties', pid); jobForm(null, { customerId: p.customerId, propertyId: pid }); setTimeout(() => $('[name=propertyId]')?.dispatchEvent(new Event('change')), 0); },
  newJobForCustomer: (cid) => { jobForm(null, { customerId: cid }); setTimeout(() => { const s = $('[name=propertyId]'); if (s?.value) s.dispatchEvent(new Event('change')); }, 0); },
  newCustomer: () => customerForm(),
  newProperty: () => propertyForm(),
  newPropertyFor: (cid) => propertyForm(null, { customerId: cid }),
  newQuote: () => quoteForm(),
  newQuoteFor: (cid) => quoteForm(null, { customerId: cid }),
  newInvoice: () => invoiceForm(),
  newCrew: () => crewForm(),
  // editing
  editJob: (id) => jobForm(byId('jobs', id)),
  editProperty: (id) => propertyForm(byId('properties', id)),
  editCustomer: (id) => customerForm(byId('customers', id)),
  editQuote: (id) => quoteForm(byId('quotes', id)),
  editInvoice: (id) => invoiceForm(byId('invoices', id)),
  editCrew: (id) => crewForm(byId('crew', id)),
  // workflow
  setStatus: (id, el) => setJobStatus(id, el.dataset.status),
  scheduleNext, invoiceFromJob, convertQuote,
  setQuoteStatus: (id, el) => { const q = byId('quotes', id); q.status = el.dataset.status; save(); render(); toast(`Quote marked ${q.status.toLowerCase()}`); },
  issueInvoice: (id) => { const i = byId('invoices', id); i.isDraft = false; save(); render(); toast(`${i.number} marked as sent`); },
  recordPayment: (id) => paymentForm(byId('invoices', id)),
  deletePayment: async (id, el) => {
    const inv = byId('invoices', id);
    const p = inv.payments.find(x => x.id === el.dataset.pay);
    if (!p || !await confirmDialog({ title: 'Delete payment?', text: `Remove the ${money2(p.amount)} payment from ${fmtDate(p.date)}?` })) return;
    inv.payments = inv.payments.filter(x => x !== p); save(); render(); toast('Payment removed');
  },
  // deletes
  deleteJob, deleteProperty, deleteCustomer, deleteQuote, deleteInvoice, deleteCrew,
  // photos
  pickPhoto: (id, el) => pickPhoto(id, el.dataset.slot),
  viewPhoto: (id, el) => viewPhoto(id, el.dataset.slot),
  removePhoto: async (id, el) => {
    if (!await confirmDialog({ title: 'Remove photo?', text: `The ${el.dataset.slot} photo will be deleted from this job.`, confirmLabel: 'Remove' })) return;
    const j = byId('jobs', id); delete j.photos[el.dataset.slot]; save(); render(); toast('Photo removed');
  },
  // printing
  printQuote: (id) => printDoc(quoteDoc(byId('quotes', id))),
  printInvoice: (id) => printDoc(invoiceDoc(byId('invoices', id))),
  printJob: (id) => printDoc(jobDoc(byId('jobs', id))),
  // settings
  pickLogo: () => { photoTarget = { logo: true }; const fp = $('#filePicker'); fp.value = ''; fp.removeAttribute('capture'); fp.click(); },
  removeLogo: () => { state.settings.business.logo = ''; save(); render(); toast('Logo removed'); },
  addService: () => {
    const s = state.settings.services;
    s.push({ id: uid('svc'), name: 'New service', price: 50, duration: state.settings.jobs.defaultDuration, color: SERVICE_COLORS[s.length % SERVICE_COLORS.length] });
    save(); render();
    const inputs = $$('[data-svc][data-field=name]'); const last = inputs[inputs.length - 1]; last?.focus(); last?.select();
  },
  deleteService: async (id) => {
    const s = svcById(id);
    if (state.settings.services.length <= 1) { toast('Keep at least one service', 'error'); return; }
    const used = state.jobs.filter(j => j.serviceId === id).length;
    if (!await confirmDialog({ title: 'Delete service?', text: `<b>${esc(s.name)}</b> will be removed from your service list.${used ? ` ${used} existing job${used > 1 ? 's keep' : ' keeps'} the name.` : ''}` })) return;
    state.jobs.forEach(j => { if (j.serviceId === id && !j.serviceLabel) j.serviceLabel = s.name; });
    state.settings.services = state.settings.services.filter(x => x.id !== id);
    save(); render(); toast('Service deleted');
  },
  exportData,
  importData: () => { const ip = $('#importPicker'); ip.value = ''; ip.click(); },
  resetDemo, clearData, resetApp
};

/* =========================================================
   EVENT WIRING & INIT
   ========================================================= */
function bindEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act], a[href], button[type=submit], [data-close]');
    if (!el || !el.dataset.act) return; // plain links/buttons keep native behaviour
    const fn = ACTIONS[el.dataset.act];
    if (!fn) return;
    e.preventDefault();
    if (el.hasAttribute('data-search')) { closeSearch(); $('#searchInput').value = ''; $('#searchInput').blur(); }
    if (['newJob', 'newCustomer', 'newProperty', 'newQuote', 'newInvoice', 'newCrew'].includes(el.dataset.act)) closeMore();
    fn(el.dataset.id, el, e);
  });
  $('#scrim').addEventListener('click', () => { closeMore(); closeDrawer(); });
  window.addEventListener('hashchange', onHash);

  // search
  const si = $('#searchInput');
  si.addEventListener('input', debounce(renderSearch, 90));
  si.addEventListener('focus', renderSearch);
  si.addEventListener('keydown', (e) => {
    const items = $$('#searchResults .sr-item');
    let i = items.findIndex(x => x.classList.contains('focus'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); items[i]?.classList.remove('focus');
      i = e.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
      items[i]?.classList.add('focus'); items[i]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') { (items[i] || items[0])?.click(); }
    else if (e.key === 'Escape') { si.value = ''; closeSearch(); si.blur(); }
  });
  document.addEventListener('mousedown', (e) => { if (!e.target.closest('#searchBox')) closeSearch(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if ($('#modalRoot').children.length) closeModal();
      else if (ui.drawer) closeDrawer();
      else closeMore();
    }
    if (e.key === '/' && !e.target.closest('input,textarea,select') && !$('#modalRoot').children.length) { e.preventDefault(); si.focus(); }
  });

  // settings inputs (delegated)
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.setting) setSetting(t.dataset.setting, t.value);
    if (t.dataset.svc) {
      const s = svcById(t.dataset.svc); if (!s) return;
      if (t.dataset.field === 'name') { if (!t.value.trim()) { toast('Service name cannot be empty', 'error'); t.value = s.name; return; } s.name = t.value.trim(); }
      else s[t.dataset.field] = Math.max(0, Number(t.value) || 0);
      save(); toast('Service saved');
    }
  });

  // file pickers
  $('#filePicker').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !photoTarget) return;
    try {
      if (photoTarget.logo) {
        state.settings.business.logo = await compressImage(file, 320, 0.85);
        if (save()) toast('Logo updated');
      } else {
        const j = byId('jobs', photoTarget.jobId);
        if (!j) return;
        const prev = j.photos[photoTarget.slot];
        j.photos[photoTarget.slot] = await compressImage(file);
        if (save()) toast(`${photoTarget.slot === 'before' ? 'Before' : 'After'} photo saved`);
        else { if (prev) j.photos[photoTarget.slot] = prev; else delete j.photos[photoTarget.slot]; }
      }
      render();
    } catch (err) { toast('Could not read that image', 'error'); }
    photoTarget = null;
  });
  $('#importPicker').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) importFile(f); });

  // keep "today" fresh if the app stays open past midnight
  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
}

function init() {
  $('#brandMark').innerHTML = logoMark(26);
  $('#brandMarkM').innerHTML = logoMark(22);
  $('#fab').innerHTML = icon('plus');
  $('#fab').dataset.act = 'newJob';
  load();
  bindEvents();
  onHash();
}
init();
</script>
