function renderSearch(q){
  const box=$('#search-results'); q=q.trim().toLowerCase();
  if(q.length<2){ box.hidden=true; box.innerHTML=''; return; }
  const has=s=>String(s||'').toLowerCase().includes(q);
  const groups=[];
  const kids=db.children.filter(c=>has(cname(c))).slice(0,8);
  if(kids.length) groups.push(['Children',kids.map(c=>({go:`#/child/${c.id}`,av:avatar(c,'sm'),t:cname(c),s:`${roomName(c.classroomId)} · ${STATUS_META[childStatus(c)].label}`}))]);
  const pars=[...db.parents,...db.authorizedPickups.filter(a=>!db.parents.some(p=>p.childId===a.childId&&p.name===a.name))].filter(p=>has(p.name)||has(p.phone)||has(p.email)).slice(0,8);
  if(pars.length) groups.push(['Parents & pickup contacts',pars.map(p=>({go:`#/child/${p.childId}`,av:`<span class="av sm c-lav">${esc(initials(p.name))}</span>`,t:p.name,s:`${p.relationship} of ${cname(child(p.childId))}${p.phone?' · '+p.phone:''}`}))]);
  const rooms=db.classrooms.filter(r=>has(r.name)||has(r.ageGroup));
  if(rooms.length) groups.push(['Classrooms',rooms.map(r=>({go:`#/classrooms`,av:`<span class="av sm c-${esc(r.color)}">${esc(initials(r.name))}</span>`,t:r.name+' Room',s:`${r.ageGroup} · ${presentInRoom(r.id).length}/${r.capacity} present`}))]);
  const st=db.staff.filter(s=>has(s.name)||has(s.role));
  if(st.length) groups.push(['Staff',st.map(s=>({go:`#/classrooms/staff`,av:staffAvatar(s),t:s.name,s:`${s.role} · ${roomName(s.classroomId)}`}))]);
  const inc=db.incidents.filter(i=>has(i.type)||has(i.what)||has(cname(child(i.childId)))).slice(0,6);
  if(inc.length) groups.push(['Incidents',inc.map(i=>({act:'view-incident',id:i.id,av:'<span class="av sm c-coral">🩹</span>',t:`${i.type} – ${cname(child(i.childId))}`,s:`${fmtDate(i.date)} · ${i.status}`}))]);
  const pays=db.payments.filter(p=>has(p.reference)||has(p.parentName)||has(cname(child(p.childId)))||has(String(p.amount))).slice(0,6);
  if(pays.length) groups.push(['Payments',pays.map(p=>({go:`#/billing/payments`,av:'<span class="av sm c-yellow">$</span>',t:`${money(p.amount)} – ${cname(child(p.childId))}`,s:`${fmtDate(p.date)} · ${p.method}${p.reference?' · '+p.reference:''}`}))]);
  box.innerHTML=groups.length?groups.map(([g,items])=>`<div class="sr-group">${esc(g)}</div>${items.map(it=>`<button type="button" class="sr-item" role="option" ${it.go?`data-act="go" data-href="${esc(it.go)}"`:`data-act="${it.act}" data-id="${esc(it.id)}"`}>${it.av}<span><b>${esc(it.t)}</b><small>${esc(it.s)}</small></span></button>`).join('')}`).join('')
    :`<div class="empty" style="margin:6px">No matches for “${esc(q)}”</div>`;
  box.hidden=false;
  $$('.sr-item',box).forEach((b,i,all)=>b.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'){e.preventDefault();(all[i+1]||all[0]).focus();} if(e.key==='ArrowUp'){e.preventDefault(); if(i===0) $('#gsearch').focus(); else all[i-1].focus();} if(e.key==='Escape'){closeSearch();$('#gsearch').focus();} }));
}

/* ---------------- notifications ---------------- */
function notifications(){
  const T=todayStr(), N=mins(nowTime()), s=db.settings, list=[];
  const openM=mins(s.openTime), closeM=mins(s.closeTime), wd=dow(T), weekday=wd>0&&wd<6;
  if(weekday && N>=openM && N<closeM){
    activeChildren().filter(c=>childStatus(c)==='expected').forEach(c=>list.push({tone:'var(--bg2)',em:'⏰',title:`${c.first} ${c.last} not yet checked in`,text:`Expected in ${roomName(c.classroomId)} today`,act:'checkin',id:c.id}));
  }
  db.classrooms.forEach(r=>{ const o=roomOcc(r); if(o.level!=='ok') list.push({tone:o.level==='full'?'var(--red-soft)':'var(--yellow-soft)',em:o.level==='full'?'🚫':'⚠️',title:`${r.name} Room ${o.level==='full'?'at capacity':'near capacity'}`,text:`${o.present} of ${o.cap} spaces in use`,go:'#/classrooms'});
    const x=roomRatio(r); if(x.attention) list.push({tone:'var(--yellow-soft)',em:'⚠️',title:`Staffing Attention · ${r.name}`,text:`${x.kids} children, ${x.staff} staff on duty (threshold ${x.threshold} per staff)`,go:'#/classrooms/staffing'}); });
  presentRecs().forEach(a=>{ const c=child(a.childId); if(!c||!c.usualPickup) return; const p=mins(c.usualPickup);
    if(p>=N && p<=N+45) list.push({tone:'var(--peach-soft)',em:'🚗',title:`Upcoming pickup · ${cname(c)}`,text:`Usual pickup ${fmtTime(c.usualPickup)} from ${roomName(a.classroomId)}`,go:`#/pickup/${c.id}`}); });
  const red=presentRecs().map(a=>child(a.childId)).filter(c=>c&&hasRedAlert(c.id));
  if(red.length) list.push({tone:'var(--red-soft)',em:'🔴',title:`${red.length} ${red.length===1?'child':'children'} with allergy / medication alerts present`,text:red.map(c=>`${c.first} (${healthAlerts(c.id).filter(x=>x.level==='red').map(x=>x.short).join(', ')})`).join(' · '),go:'#/reports/health'});
  activeChildren().forEach(c=>{ const acc=account(c.id); if(acc.status==='Overdue') list.push({tone:'var(--red-soft)',em:'💳',title:`Overdue tuition · ${cname(c)}`,text:`${money(acc.overdue)} overdue · balance ${money(acc.balance)}`,go:'#/billing'}); });
  db.incidents.filter(i=>i.followUp&&i.status!=='Closed').forEach(i=>list.push({tone:'var(--coral-soft)',em:'🩹',title:`Incident follow-up · ${cname(child(i.childId))}`,text:`${i.type} on ${fmtDate(i.date)} · ${i.status}`,act:'view-incident',id:i.id}));
  db.incidents.filter(i=>!i.parentNotified&&i.status!=='Closed').forEach(i=>list.push({tone:'var(--coral-soft)',em:'📞',title:`Parent not yet notified · ${cname(child(i.childId))}`,text:`${i.type} on ${fmtDate(i.date)}`,act:'view-incident',id:i.id}));
  if(N>=closeM-120){
    const missing=db.children.filter(c=>{ const st=childStatus(c); if(st!=='present'&&st!=='out') return false;
      const hasMeal=db.meals.some(m=>m.childId===c.id&&m.date===T), hasMood=db.dailyCare.some(x=>x.childId===c.id&&x.date===T&&x.type==='mood'); return !hasMeal||!hasMood; });
    if(missing.length) list.push({tone:'var(--lav-soft)',em:'📝',title:`Daily report incomplete for ${missing.length} ${missing.length===1?'child':'children'}`,text:missing.slice(0,6).map(c=>c.first).join(', ')+(missing.length>6?'…':'')+' – meal or mood not logged',go:'#/care'});
  }
  return list;
}
function renderNotifPanel(){
  const list=notifications(), p=$('#notif-panel');
  p.innerHTML=`<h3>Notifications <span class="chip">${list.length}</span></h3>${list.length?list.map(n=>`<button type="button" class="notif" ${n.go?`data-act="go" data-href="${esc(n.go)}"`:`data-act="${n.act}" data-id="${esc(n.id)}"`}><span class="ndot" style="background:${n.tone}" aria-hidden="true">${n.em}</span><span><b>${esc(n.title)}</b><small>${esc(n.text)}</small></span></button>`).join(''):'<div class="empty"><span class="big">🌤️</span>All clear right now.</div>'}`;
}

function childCards(){
  const q=ui.childQ.trim().toLowerCase();
  let list=db.children.slice().sort(sortByName);
  if(ui.childStatus==='withdrawn') list=list.filter(c=>c.status!=='Enrolled'); else list=list.filter(c=>c.status==='Enrolled');
  if(q) list=list.filter(c=>cname(c).toLowerCase().includes(q) || db.parents.some(p=>p.childId===c.id&&p.name.toLowerCase().includes(q)));
  if(ui.childRoom) list=list.filter(c=>c.classroomId===ui.childRoom);
  if(['present','expected','out'].includes(ui.childStatus)) list=list.filter(c=>childStatus(c)===ui.childStatus);
  if(ui.childStatus==='alerts') list=list.filter(c=>healthAlerts(c.id).some(a=>a.level!=='green'));
  if(!list.length) return `<div class="empty" style="grid-column:1/-1"><span class="big">🧸</span>No children match these filters.</div>`;
  return list.map(c=>{
    const st=c.status==='Enrolled'?childStatus(c):'off'; const al=healthAlerts(c.id);
    return `<button type="button" class="kid-card" data-act="go" data-href="#/child/${c.id}" aria-label="Open profile for ${esc(cname(c))}">

function contactForm(kind,childId,rec){
  const meta=CONTACT_META[kind]; const r=rec||{};
  formModal({title:(rec?'Edit ':'Add ')+meta.title,fields:meta.fields(r),submit:rec?'Save changes':'Add',
    danger:rec?{label:'Remove',onClick:()=>confirmBox({title:'Remove contact?',message:`Remove <b>${esc(r.name)}</b> from this child's ${meta.title} list?`,danger:true,okLabel:'Remove',onOk:()=>{ db[kind]=db[kind].filter(x=>x.id!==r.id); saveData(); closeModal(); toast('Contact removed'); render(); }})}:null,
    onSave(d){
      const alsoPickup=d.alsoPickup; delete d.alsoPickup;
      if(kind==='parents' && d.primary) db.parents.forEach(p=>{ if(p.childId===childId) p.primary=false; });
      if(rec) Object.assign(rec,d);
      else { db[kind].push({id:uid(kind.slice(0,2)),childId,...d});
        if(kind==='parents'&&alsoPickup&&!db.authorizedPickups.some(a=>a.childId===childId&&a.name.toLowerCase()===d.name.toLowerCase()))
          db.authorizedPickups.push({id:uid('ap'),childId,name:d.name,relationship:d.relationship,phone:d.phone,authorized:true,notes:''}); }
      saveData(); toast(rec?'Contact updated':'Contact added'); render();
    }});
}

let wiz=null;
const WIZ_STEPS=['Child','Parent / Guardian','Emergency','Authorized pickup','Health','Classroom','Tuition plan','Review'];
function startEnrollment(prefill){
  if(!db.classrooms.length){ toast('Add a classroom in Settings before enrolling a child.','warn'); return; }

      {type:'section',label:'Another person (optional)'},{name:'x2_name',label:'Full name',value:d.x2_name},{name:'x2_rel',label:'Relationship',value:d.x2_rel,validate:(v,x)=>x.x2_name&&!v?'Relationship is required.':''},{name:'x2_phone',label:'Phone',type:'tel',value:d.x2_phone},
      {name:'x2_auth',label:'Authorized',type:'checkbox',value:d.x2_auth},{name:'x2_notes',label:'Notes',value:d.x2_notes,full:true}];
    case 4: return [{name:'allergies',label:'Allergies',value:d.allergies,full:true,placeholder:'Leave blank if no known allergies'},{name:'dietary',label:'Dietary restrictions',value:d.dietary,full:true},

function renderWizard(){
  const s=wiz.step, d=wiz.data;
  const steps=`<ol class="steps" aria-label="Enrollment steps" style="list-style:none;padding:0">${WIZ_STEPS.map((l,i)=>`<li class="step ${i<s?'done':''} ${i===s?'cur':''}" ${i===s?'aria-current="step"':''}><div class="n">${i<s?'✓':i+1}</div>STEP ${i+1}<br>${l}</li>`).join('')}</ol>`;
  let body='';
  if(s===5){
    const age=ageMonths(d.dob);
    body=`<p class="muted" style="margin-top:0">Choose a classroom for <b>${esc(d.first)}</b> (${esc(ageText(d.dob))}).</p><div class="room-choice" role="radiogroup" aria-label="Classroom">${db.classrooms.map(r=>{ const n=enrolledIn(r.id).length, full=n>=r.capacity;
      return `<input type="radio" name="classroomId" id="wr_${r.id}" value="${r.id}" ${d.classroomId===r.id?'checked':''}><label for="wr_${r.id}"><div class="row"><span class="av sm c-${esc(r.color)}">${esc(initials(r.name))}</span><div class="grow"><b>${esc(r.name)} Room</b><div class="tiny muted">${esc(r.ageGroup)} · ${esc(r.ages||'')}</div></div>${ring(Math.min(100,n/r.capacity*100),48,full?'#EF4444':n/r.capacity>=.85?'#F59E0B':'#10B981',`${n}/${r.capacity}`)}</div>
        <div class="tiny" style="margin-top:6px">${full?'<span class="chip red">Enrollment full — child can still be added</span>':`<span class="chip green">${r.capacity-n} ${r.capacity-n===1?'space':'spaces'} available</span>`} <span class="muted">Staff: ${roomAssigned(r.id).map(x=>esc(x.name.split(' ')[0])).join(', ')||'none assigned'}</span></div></label>`; }).join('')}</div>
      <div class="err" id="wiz-room-err" role="alert"></div>`;
  } else if(s===7){
    const p=planBy(d.planId), r=room(d.classroomId);
    const sec=(t,step,html)=>`<div class="review-sec"><div class="row"><h4 class="grow">${t}</h4><button type="button" class="link-btn" data-act="wiz-goto" data-step="${step}">Edit</button></div>${html}</div>`;
    body=`<div class="grid g2" style="gap:10px">
      ${sec('Child',0,`<b>${esc(d.first)} ${esc(d.last)}</b><div class="small">${esc(fmtDate(d.dob))} (${esc(ageText(d.dob))}) · ${esc(d.gender)}</div><div class="small">Starts ${esc(fmtDate(d.enrollDate))} · ${d.schedule.slice().sort().map(x=>DAY_SHORT[x]).join(' ')}${d.usualPickup?' · pickup '+fmtTime(d.usualPickup):''}</div>`)}
      ${sec('Parent / guardian',1,`<div class="small"><b>${esc(d.p1_name)}</b> (${esc(d.p1_rel)}) · ${esc(d.p1_phone)}${d.p1_email?' · '+esc(d.p1_email):''}</div>${d.p2_name?`<div class="small"><b>${esc(d.p2_name)}</b> (${esc(d.p2_rel)}) · ${esc(d.p2_phone)}</div>`:''}`)}
      ${sec('Emergency contacts',2,`<div class="small">${esc(d.e1_name)} (${esc(d.e1_rel)}) · ${esc(d.e1_phone)}</div>${d.e2_name?`<div class="small">${esc(d.e2_name)} (${esc(d.e2_rel)}) · ${esc(d.e2_phone)}</div>`:''}`)}
      ${sec('Authorized pickup',3,[[d.p1_name,d.p1_pickup],[d.p2_name,d.p2_pickup],[d.x1_name,d.x1_auth],[d.x2_name,d.x2_auth]].filter(x=>x[0]).map(([n,a])=>`<div class="small">${esc(n)} ${a?'<span class="chip green">AUTHORIZED ✓</span>':'<span class="chip red">NOT AUTHORIZED ✕</span>'}</div>`).join(''))}
      ${sec('Health',4,`<div class="small">${d.allergies?'🔴 Allergies: '+esc(d.allergies):'🟢 No known allergies'}</div>${d.dietary?`<div class="small">🟡 ${esc(d.dietary)}</div>`:''}${d.medication?`<div class="small">🔴 Medication: ${esc(d.medication)}</div>`:''}<div class="small">Immunizations: ${esc(d.immunization)}</div>`)}
      ${sec('Classroom',5,`<b>${esc(r?r.name+' Room':'—')}</b><div class="small">${esc(r?r.ageGroup+' · '+(r.ages||''):'')}</div>`)}
      ${sec('Tuition plan',6,`<b>${esc(p?p.name:'—')}</b><div class="small">${money(d.rate)}${p&&p.kind==='daily'?'/day':''} · ${esc(d.frequency)} · first bill ${esc(fmtDate(d.nextDue))}${Number(d.discount)?' · '+d.discount+'% discount':''}</div>`)}
    </div>`;
  } else body=formHTML(wizFields(s),'wform');
  setModalBody(`${steps}<div id="wiz-step">${body}</div>`,
    `${s>0?`<button type="button" class="btn" data-act="wiz-back">${ic('left')} Back</button>`:''}<span class="grow"></span><button type="button" class="btn" data-act="close-modal">Cancel</button>
     ${s<7?`<button type="button" class="btn primary" data-act="wiz-next">Next: ${WIZ_STEPS[s+1]} ${ic('right')}</button>`:`<button type="button" class="btn green" data-act="wiz-finish">${ic('check')} Complete enrollment</button>`}`);
  if(s===6) wirePlanRate($('#wiz-step'));
  const f=$('#wform'); if(f) f.addEventListener('submit',e=>{ e.preventDefault(); wizNext(); });
  focusFirst($('#modal-root .modal'));
  const t=$('#modal-root .modal-body'); if(t) t.scrollTop=0;
}
function wizCollect(){
  const s=wiz.step;
  if(s===5){ const r=$('[name="classroomId"]:checked'); if(!r){ $('#wiz-room-err').textContent='Please choose a classroom.'; return false; } wiz.data.classroomId=r.value; return true; }
  if(s===7) return true;
  const fields=wizFields(s), form=$('#wform'), data=readForm(form,fields);
  if(!validateForm(form,fields,data)) return false;
  Object.assign(wiz.data,data); return true;
}
function wizNext(){
  if(!wizCollect()) return;
  if(wiz.step===4 && !wiz.data.classroomId){ // suggest a room by age
    const m=ageMonths(wiz.data.dob); const guess=m<24?0:m<36?1:m<48?2:3; const r=db.classrooms[Math.min(guess,db.classrooms.length-1)]; if(r) wiz.data.classroomId=r.id; }
  if(wiz.step===5 && !wiz.data.planId){ const p=db.tuitionPlans[0]; if(p){ wiz.data.planId=p.id; wiz.data.rate=p.rate; wiz.data.frequency=p.frequency; } }
  wiz.step=Math.min(7,wiz.step+1); renderWizard();
}
function wizFinish(){
  const d=wiz.data, id=uid('c');
  if(!d.first||!d.p1_name||!d.e1_name||!d.classroomId||!d.planId){ toast('Some required steps are incomplete.','error'); return; }
  db.children.push({id,first:d.first,last:d.last,dob:d.dob,gender:d.gender,enrollDate:d.enrollDate,classroomId:d.classroomId,status:'Enrolled',schedule:d.schedule,usualPickup:d.usualPickup||'',color:d.color,photo:'',
    billing:{planId:d.planId,rate:Number(d.rate)||0,frequency:d.frequency,nextDue:d.nextDue,discount:Number(d.discount)||0,lateFee:Number(d.lateFee)||0}});
  [[1,true],[2,false]].forEach(([n,prim])=>{ const nm=d[`p${n}_name`]; if(!nm) return;
    db.parents.push({id:uid('p'),childId:id,name:nm,relationship:d[`p${n}_rel`],phone:d[`p${n}_phone`],email:d[`p${n}_email`]||'',primary:prim});
    db.authorizedPickups.push({id:uid('ap'),childId:id,name:nm,relationship:d[`p${n}_rel`],phone:d[`p${n}_phone`],authorized:!!d[`p${n}_pickup`],notes:prim?'Primary contact':''}); });
  [1,2].forEach(n=>{ if(d[`e${n}_name`]) db.guardians.push({id:uid('g'),childId:id,name:d[`e${n}_name`],relationship:d[`e${n}_rel`],phone:d[`e${n}_phone`]}); });
  [1,2].forEach(n=>{ if(d[`x${n}_name`]) db.authorizedPickups.push({id:uid('ap'),childId:id,name:d[`x${n}_name`],relationship:d[`x${n}_rel`],phone:d[`x${n}_phone`]||'',authorized:!!d[`x${n}_auth`],notes:d[`x${n}_notes`]||''}); });
  db.healthRecords.push({id:uid('h'),childId:id,allergies:d.allergies||'',dietary:d.dietary||'',medication:d.medication||'',notes:d.notes||'',immunization:d.immunization,immunizationDate:d.immunizationDate||''});
  db.enrollments.push({id:uid('e'),childId:id,date:todayStr(),startDate:d.enrollDate,classroomId:d.classroomId,planId:d.planId,staffId:curStaffId(),notes:''});
  if(d.waitlistId){ const w=byId('waitlist',d.waitlistId); if(w) w.status='Enrolled'; }
  saveData(); wiz=null; closeModal();
  toast(`${d.first} ${d.last} is enrolled 🎉`);
  navigate('#/child/'+id);
}

/* ---------------- WAITLIST ---------------- */
function viewWaitlist(){
  const rows=db.waitlist.slice().sort((a,b)=>{ const st=['Waiting','Contacted','Enrolled','Removed']; const pr=['High','Normal','Low'];
    return st.indexOf(a.status)-st.indexOf(b.status) || pr.indexOf(a.priority)-pr.indexOf(b.priority) || (a.requestedStart||'').localeCompare(b.requestedStart||''); });
  return `<div class="grid g4" style="margin-bottom:16px">${db.classrooms.map(r=>{ const n=enrolledIn(r.id).length, av=Math.max(0,r.capacity-n), wl=db.waitlist.filter(w=>w.preferredClassroomId===r.id&&(w.status==='Waiting'||w.status==='Contacted')).length;
    return `<div class="card row" style="gap:14px">${ring(Math.min(100,n/r.capacity*100),60,av?'#10B981':'#EF4444',`${n}/${r.capacity}`)}<div><b>${esc(r.name)}</b><div class="small muted">${esc(r.ages||r.ageGroup)}</div><div class="small"><b style="color:${av?'var(--mint-strong)':'var(--red)'}">${av} available</b> · ${wl} waiting</div></div></div>`; }).join('')}</div>
  <div class="card"><div class="card-head"><h2>Waitlist</h2><button type="button" class="btn primary sm" data-act="add-waitlist">${ic('plus')} Add to waitlist</button></div>
  ${rows.length?`<div class="table-wrap"><table class="t"><thead><tr><th>Child</th><th>Age</th><th>Parent</th><th>Phone</th><th>Requested start</th><th>Preferred room</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.map(w=>`<tr><td><b>${esc(w.childName)}</b>${w.notes?`<div class="tiny muted">${esc(w.notes)}</div>`:''}</td><td>${esc(ageText(w.dob))}</td><td>${esc(w.parent)}</td><td>${esc(w.phone)}</td><td>${esc(fmtDate(w.requestedStart))}</td><td>${esc(roomName(w.preferredClassroomId))}</td>
    <td><span class="chip ${w.priority==='High'?'red':w.priority==='Low'?'gray':'blue'}">${esc(w.priority)}</span></td>
    <td><select class="input" style="height:36px" data-change="wl-status" data-id="${w.id}" aria-label="Status for ${esc(w.childName)}">${optionsHTML(WAIT_STATUS,w.status)}</select></td>
    <td><div class="row" style="flex-wrap:nowrap;gap:4px">${w.status!=='Enrolled'&&w.status!=='Removed'?`<button type="button" class="btn xs green" data-act="wl-enroll" data-id="${w.id}">Enroll</button>`:''}<button type="button" class="btn xs" data-act="edit-waitlist" data-id="${w.id}" aria-label="Edit">${ic('edit')}</button></div></td></tr>`).join('')}
  </tbody></table></div>`:'<div class="empty">The waitlist is empty.</div>'}</div>`;
}
function waitlistForm(w){
  const r=w||{};
  formModal({title:w?'Edit waitlist entry':'Add to waitlist',fields:[
    {name:'childName',label:'Child name',required:true,value:r.childName},{name:'dob',label:'Date of birth',type:'date',required:true,value:r.dob},
    {name:'parent',label:'Parent / guardian',required:true,value:r.parent},{name:'phone',label:'Phone',type:'tel',required:true,value:r.phone},
    {name:'requestedStart',label:'Requested start date',type:'date',required:true,value:r.requestedStart},
    {name:'preferredClassroomId',label:'Preferred classroom',type:'select',placeholder:'No preference',options:db.classrooms.map(x=>[x.id,x.name]),value:r.preferredClassroomId},
    {name:'priority',label:'Priority',type:'select',options:PRIORITIES,value:r.priority||'Normal'},{name:'status',label:'Status',type:'select',options:WAIT_STATUS,value:r.status||'Waiting'},
    {name:'notes',label:'Notes',type:'textarea',full:true,value:r.notes}],
    danger:w?{label:'Delete',onClick:()=>confirmBox({title:'Delete waitlist entry?',message:`Delete <b>${esc(r.childName)}</b> from the waitlist permanently?`,danger:true,okLabel:'Delete',onOk:()=>{ db.waitlist=db.waitlist.filter(x=>x.id!==r.id); saveData(); closeModal(); render(); toast('Entry deleted'); }})}:null,
    onSave(d){ if(w) Object.assign(w,d); else db.waitlist.push({id:uid('w'),added:todayStr(),...d}); saveData(); toast(w?'Waitlist updated':'Added to waitlist'); render(); }});
}

/* ---------------- CLASSROOMS ---------------- */
function viewClassrooms(sub){
  sub=sub||'rooms';
  const head=viewHead('Rooms & team','Classrooms',`${db.classrooms.length} classrooms · ${onDutyStaff().length} staff on duty now`,
    sub==='staff'?`<button type="button" class="btn primary" data-act="add-staff">${ic('plus')} Add staff member</button>`:`<button type="button" class="btn primary" data-act="add-room">${ic('plus')} Add classroom</button>`);
  const tabs=subtabs('classrooms',[['rooms','Classroom board'],['staff','Staff'],['staffing','Staffing & child count']],sub);
  if(sub==='staff') return head+tabs+viewStaff();
  if(sub==='staffing') return head+tabs+viewStaffing();
  return head+tabs+`<div class="rooms-grid">${db.classrooms.map(r=>{
    const o=roomOcc(r), x=roomRatio(r), T=todayStr();
    const pres=presentInRoom(r.id).map(a=>child(a.childId)).filter(Boolean);
    const enr=enrolledIn(r.id), exp=enr.filter(c=>isExpected(c,T)).length, out=enr.filter(c=>childStatus(c)==='out').length;
    return `<article class="room-card ${esc(r.color)}" aria-labelledby="rh-${r.id}">
      <div class="rc-top">${ring(o.pct,92,occColor(o.level),`${o.present} / ${o.cap}`,'PRESENT')}
        <div class="grow"><h2 id="rh-${r.id}">${esc(r.name)} Room</h2><div class="b muted">${esc(r.ageGroup)} · ${esc(r.ages||'')}</div>
        <div class="row" style="margin-top:6px;gap:6px">${o.level==='full'?'<span class="chip red">At capacity</span>':o.level==='near'?'<span class="chip yellow">Near capacity</span>':'<span class="chip green">Space available</span>'}<span class="chip">${enr.length} enrolled</span></div></div>
        <button type="button" class="btn xs" data-act="edit-room" data-id="${r.id}" aria-label="Edit ${esc(r.name)}">${ic('edit')}</button></div>
      <div class="rc-body">
        <div><div class="tiny b faint" style="letter-spacing:.08em;margin-bottom:6px">CHILDREN HERE NOW</div>
          <div class="name-dots">${pres.map(c=>`<button type="button" class="name-dot" data-act="child-quick" data-id="${c.id}" style="cursor:pointer"><span class="dot green"></span>${esc(c.first)}${hasRedAlert(c.id)?' 🔴':''}${napNow(c.id)?' 😴':''}</button>`).join('')||'<span class="muted small">No children present</span>'}</div></div>
        <div class="row small" style="gap:14px"><span>Expected <b>${exp}</b></span><span>Present <b>${o.present}</b></span><span>Picked up <b>${out}</b></span></div>
        <div><div class="tiny b faint" style="letter-spacing:.08em;margin-bottom:6px">STAFF</div>
          <div class="name-dots">${roomAssigned(r.id).map(s=>`<span class="name-dot">${isOnDuty(s.id)?'<span class="dot green"></span>':'<span class="dot gray"></span>'}${esc(s.name)} <span class="tiny muted">${esc(s.role)}</span></span>`).join('')||'<span class="muted small">No staff assigned</span>'}</div></div>
        <div class="ratio-box ${x.attention?'warn':''}">${x.attention?'⚠ <b>Staffing Attention</b> ·':'👥'} ${x.kids} children · ${x.staff} staff on duty · ${esc(ratioText(x))} <span class="grow"></span><span class="tiny">Threshold ${x.threshold||'—'}</span></div>
        <label class="field"><span class="flabel">Current activity</span><select data-change="room-activity" data-id="${r.id}" class="input">${optionsHTML(['Circle time','Sensory play','Art & crafts','Story time','Outdoor play','Music & movement','Learning centers','Free play','Lunch','Nap / quiet time','Snack','Clean up',r.activity].filter((v,i,a)=>v&&a.indexOf(v)===i),r.activity)}</select></label>
      </div></article>`; }).join('')||'<div class="empty">No classrooms yet.</div>'}</div>`;
}
function roomForm(r){
  const x=r||{};
  const staffOpts=db.staff.filter(s=>s.status!=='Inactive').map(s=>[s.id,`${esc(s.name)} <span class="tiny muted">${esc(s.role)}${s.classroomId&&s.classroomId!==x.id?' · '+esc(roomName(s.classroomId)):''}</span>`]);
  formModal({title:r?`Edit ${esc(r.name)} Room`:'Add classroom',size:'wide',fields:[
    {name:'name',label:'Room name',required:true,value:x.name,placeholder:'e.g. Sunflower'},{name:'ageGroup',label:'Age group',required:true,value:x.ageGroup,placeholder:'e.g. Toddlers'},
    {name:'ages',label:'Ages',value:x.ages,placeholder:'e.g. Ages 1–2'},{name:'capacity',label:'Capacity (children)',type:'number',required:true,min:1,maxv:200,value:x.capacity},
    {name:'threshold',label:'Configured classroom staffing threshold',type:'number',required:true,min:1,maxv:50,value:x.threshold,hint:'Children per staff member before “Staffing Attention” shows. Set this to match your own licensing rules.'},
    {name:'color',label:'Room color',type:'select',options:ROOM_COLORS.map(c=>[c,c[0].toUpperCase()+c.slice(1)]),value:x.color||ROOM_COLORS[db.classrooms.length%ROOM_COLORS.length]},
    {name:'activity',label:'Current activity',value:x.activity,placeholder:'e.g. Circle time'},
    {name:'staffIds',label:'Assigned staff',type:'multi',options:staffOpts,value:db.staff.filter(s=>x.id&&s.classroomId===x.id).map(s=>s.id),full:true,hint:'Selecting a staff member moves them into this room.'}],
    danger:r?{label:'Delete room',onClick:()=>{ const n=db.children.filter(c=>c.classroomId===r.id&&c.status==='Enrolled').length;
      if(n){ toast(`Move the ${n} enrolled ${n===1?'child':'children'} to another room first.`,'error'); return; }
      confirmBox({title:'Delete classroom?',message:`Delete the <b>${esc(r.name)}</b> room? Staff assigned to it will become unassigned.`,danger:true,okLabel:'Delete',onOk:()=>{ db.classrooms=db.classrooms.filter(c=>c.id!==r.id); db.staff.forEach(s=>{ if(s.classroomId===r.id) s.classroomId=''; }); saveData(); closeModal(); render(); toast('Classroom deleted'); }}); }}:null,
    onSave(d){
      const {staffIds,...rest}=d; rest.capacity=Number(rest.capacity); rest.threshold=Number(rest.threshold);
      if(db.classrooms.some(c=>c.name.toLowerCase()===rest.name.toLowerCase()&&c.id!==x.id)) return 'Another classroom already uses that name.';
      let rid=x.id;
      if(r) Object.assign(r,rest); else { rid=uid('r'); db.classrooms.push({id:rid,...rest}); }
      db.staff.forEach(s=>{ if(staffIds.includes(s.id)) s.classroomId=rid; else if(s.classroomId===rid) s.classroomId=''; });
      saveData(); toast(r?'Classroom updated':'Classroom added'); render(); }});
}

  const list=db.staff.slice().sort((a,b)=>(isOnDuty(b.id)-isOnDuty(a.id))||a.name.localeCompare(b.name));
  return `<div class="kids-grid">${list.map(s=>{ const on=staffOnDutyRec(s.id), sup=s.classroomId?presentInRoom(s.classroomId).length:0;
    const todayRec=db.staffAttendance.filter(r=>r.staffId===s.id&&r.date===todayStr()).sort((a,b)=>a.in.localeCompare(b.in)).pop();
    return `<article class="staff-card">
      <div class="row">${staffAvatar(s,'')}<div class="grow"><b>${esc(s.name)}</b><div class="small muted">${esc(s.role)} · since ${esc(fmtDate(s.start,{month:'short',year:'numeric'}))}</div></div>
        <button type="button" class="btn xs" data-act="edit-staff" data-id="${s.id}" aria-label="Edit ${esc(s.name)}">${ic('edit')}</button></div>
      <div class="row" style="gap:6px">${on?`<span class="chip green"><span class="dot green"></span> Working · since ${fmtTime(on.in)}</span>`:todayRec&&todayRec.out?`<span class="chip gray">Clocked out ${fmtTime(todayRec.out)}</span>`:'<span class="chip gray">Not on shift</span>'}
        ${s.status!=='Active'?`<span class="chip yellow">${esc(s.status)}</span>`:''}</div>
      <div class="meta small"><div>🏠 <b>${esc(roomName(s.classroomId))}</b></div><div>👶 Supervising <b>${on?sup:0}</b> ${on&&sup===1?'child':'children'} now</div>
        <div class="muted">${ic('phone')} ${esc(s.phone||'—')}</div><div class="muted">${ic('mail')} ${esc(s.email||'—')}</div></div>
      ${s.status==='Active'?(on?`<button type="button" class="btn" data-act="clock-out" data-id="${s.id}">${ic('logout')} Clock out</button>`:`<button type="button" class="btn green" data-act="clock-in" data-id="${s.id}">${ic('login')} Clock in</button>`):''}
    </article>`; }).join('')||'<div class="empty">No staff yet.</div>'}</div>`;
}

function viewStaffing(){
  return `<div class="safety">${ic('shield')}<div>Staffing thresholds are set by you for each classroom. DayCareFlow does not apply any legal ratios — configure each room to match the rules that apply to your center.</div></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Classroom</th><th class="num">Children present</th><th class="num">Staff on duty</th><th>Staff</th><th class="num">Current ratio</th><th>Configured threshold</th><th>Status</th></tr></thead><tbody>

/* ---------------- ATTENDANCE ---------------- */

      const hrs=r&&r.out?((mins(r.out)-mins(r.in))/60).toFixed(1):'';
      return `<tr><td><div class="row">${staffAvatar(s)}<b>${esc(s.name)}</b></div></td><td>${esc(s.role)}</td><td>${esc(roomName(s.classroomId))}</td><td>${r?fmtTime(r.in):'—'}</td><td>${r?(r.out?fmtTime(r.out):'<span class="chip green">On shift</span>'):'—'}</td><td>${hrs}</td>
        <td>${isToday&&s.status==='Active'?(isOnDuty(s.id)?`<button type="button" class="btn xs" data-act="clock-out" data-id="${s.id}">Clock out</button>`:`<button type="button" class="btn xs green" data-act="clock-in" data-id="${s.id}">Clock in</button>`):''}${r?` <button type="button" class="btn xs ghost" data-act="edit-staff-att" data-id="${r.id}" aria-label="Edit times">${ic('edit')}</button>`:''}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  }
  const kids=db.children.filter(c=>c.status==='Enrolled'||attRecs(c.id,date).length).sort((a,b)=>roomName(a.classroomId).localeCompare(roomName(b.classroomId))||sortByName(a,b));
  const rows=kids.map(c=>{ const st=childStatus(c,date); if(st==='off'&&!attRecs(c.id,date).length) return null; return [c,st]; }).filter(Boolean);
  const cnt=k=>rows.filter(r=>r[1]===k).length;
  return head+tabs+bar+`
  <div class="row" style="margin-bottom:12px;gap:8px"><span class="chip green">🟢 Present ${cnt('present')}</span><span class="chip peach">🏠 Checked out ${cnt('out')}</span><span class="chip gray">⚪ Not arrived ${cnt('expected')}</span><span class="chip lav">🟣 Absent ${cnt('absent')}</span></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Child</th><th>Classroom</th><th>Status</th><th>Check in</th><th>Check out</th><th>Picked up by</th><th>Staff</th><th></th></tr></thead><tbody>
  ${rows.map(([c,st])=>{ const recs=attRecs(c.id,date).filter(a=>!a.absent), a=recs[recs.length-1], ab=attRecs(c.id,date).find(x=>x.absent);
    const late=a&&mins(a.inTime)>mins(db.settings.lateAfter), early=a&&a.outTime&&mins(a.outTime)<mins(db.settings.earlyBefore);
    return `<tr><td><div class="row" style="flex-wrap:nowrap"><button type="button" class="kid" style="background:none;padding:0;width:auto" data-act="go" data-href="#/child/${c.id}">${avatar(c,'sm')}<span class="kn">${esc(cname(c))}</span></button>${flagsHTML(c.id)}</div></td>
      <td>${esc(roomName(a?a.classroomId:c.classroomId))}</td><td><span class="chip ${STATUS_META[st].chip}">${STATUS_META[st].label}</span>${ab&&ab.absenceReason?`<div class="tiny muted">${esc(ab.absenceReason)}</div>`:''}</td>
      <td>${a?fmtTime(a.inTime):'—'}${late?' <span class="chip yellow">Late</span>':''}</td><td>${a&&a.outTime?fmtTime(a.outTime):'—'}${early?' <span class="chip lav">Early</span>':''}</td>
      <td class="small">${a&&a.pickupName?esc(a.pickupName)+(a.pickupRelationship?` <span class="muted">(${esc(a.pickupRelationship)})</span>`:''):''}${a&&a.pickupAuthorized===false?' <span class="chip red">Override</span>':''}</td>
      <td class="small">${a?esc(staffName(a.inStaffId).split(' ')[0])+(a.outStaffId?' / '+esc(staffName(a.outStaffId).split(' ')[0]):''):''}</td>
      <td><div class="row" style="flex-wrap:nowrap;gap:4px">
        ${isToday&&st==='present'?`<button type="button" class="btn xs green" data-act="checkout" data-id="${c.id}">Check out</button>`:''}
        ${isToday&&(st==='expected'||st==='out')?`<button type="button" class="btn xs green" data-act="checkin" data-id="${c.id}">Check in</button>`:''}
        ${!isToday&&!a&&!ab?`<button type="button" class="btn xs" data-act="add-att" data-id="${c.id}">Add record</button>`:''}
        ${st==='expected'?`<button type="button" class="btn xs" data-act="mark-absent" data-id="${c.id}">Absent</button>`:''}
        ${ab?`<button type="button" class="btn xs" data-act="undo-absent" data-id="${ab.id}">Undo absent</button>`:''}
        ${a?`<button type="button" class="btn xs ghost" data-act="edit-att" data-id="${a.id}" aria-label="Edit attendance times">${ic('edit')}</button>`:''}
      </div></td></tr>`; }).join('')||`<tr><td colspan="8"><div class="empty">No children scheduled on this date.</div></td></tr>`}
  </tbody></table></div>`;
}
function attForm(rec,childId,date){
  const r=rec||{inTime:'',outTime:'',classroomId:(child(childId)||{}).classroomId};
  const c=child(rec?rec.childId:childId);
  formModal({title:`${rec?'Edit':'Add'} attendance · ${esc(cname(c))}`,intro:`<p class="muted small" style="margin-top:0">${esc(fmtDateLong(rec?rec.date:date))}. Use this to correct times entered at the door.</p>`,fields:[
    {name:'inTime',label:'Check-in time',type:'time',required:true,value:r.inTime},{name:'outTime',label:'Check-out time',type:'time',value:r.outTime,validate:(v,d)=>v&&v<=d.inTime?'Check-out must be after check-in.':''},
    {name:'classroomId',label:'Classroom',type:'select',options:db.classrooms.map(x=>[x.id,x.name]),value:r.classroomId},
    {name:'pickupName',label:'Picked up by',value:r.pickupName},{name:'pickupRelationship',label:'Relationship',value:r.pickupRelationship},
    {name:'overrideNote',label:'Note',value:r.overrideNote,full:true}],
    danger:rec?{label:'Delete record',onClick:()=>confirmBox({title:'Delete attendance record?',message:'This removes the check-in and check-out for this day.',danger:true,okLabel:'Delete',onOk:()=>{ db.attendance=db.attendance.filter(x=>x.id!==rec.id); saveData(); closeModal(); render(); updateHeader(); toast('Attendance record deleted'); }})}:null,
    onSave(d){
      if(rec){ if(!d.outTime && rec.outTime && presentRecs(rec.date).some(x=>x.childId===rec.childId&&x.id!==rec.id)) return 'This child already has an open check-in for that day.';
        Object.assign(rec,d); if(d.outTime&&!rec.outStaffId) rec.outStaffId=curStaffId(); if(d.pickupName&&rec.pickupAuthorized==null) rec.pickupAuthorized=isAuthorizedName(rec.childId,d.pickupName); }
      else db.attendance.push({id:uid('a'),childId,date,inStaffId:curStaffId(),outStaffId:d.outTime?curStaffId():'',pickupAuthorized:d.pickupName?isAuthorizedName(childId,d.pickupName):null,...d});
      saveData(); updateHeader(); toast('Attendance saved'); render(); }});
}
function isAuthorizedName(cid,name){ return db.authorizedPickups.some(p=>p.childId===cid&&p.authorized&&p.name.trim().toLowerCase()===String(name).trim().toLowerCase()); }

/* ---------------- CHECK-IN ---------------- */
let ci=null;
function openCheckIn(preId){
  if(!activeChildren().length){ toast('Enroll a child first.','warn'); return; }
  const pre=preId&&child(preId);
  if(pre && childStatus(pre)==='present'){ toast(`${cname(pre)} is already checked in.`,'warn'); return; }
  ci={sel:pre?pre.id:'',q:''};
  openModal({title:'Check in child',size:'xwide',body:`<div class="ci-layout"><div>
      <label class="sr-only" for="ci-q">Search child name</label>
      <div class="search-box" style="width:100%">${ic('search')}<input id="ci-q" type="search" placeholder="Search child name..." autocomplete="off" ${pre?'':'autofocus'}></div>
      <div class="ci-list" id="ci-list" role="listbox" aria-label="Children not checked in"></div></div>
      <div id="ci-detail" aria-live="polite"></div></div>`,
    onMount(){ $('#ci-q').addEventListener('input',e=>{ ci.q=e.target.value; renderCiList(); });
      $('#ci-q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const f=$('#ci-list .ci-kid'); if(f){ e.preventDefault(); f.click(); } } }); }});
  renderCiList(); renderCiDetail();
}
function ciCandidates(){
  const q=ci.q.trim().toLowerCase();
  return activeChildren().filter(c=>childStatus(c)!=='present').filter(c=>!q||cname(c).toLowerCase().includes(q))
    .sort((a,b)=>(childStatus(b)==='expected')-(childStatus(a)==='expected')||sortByName(a,b));
}
function renderCiList(){
  const l=ciCandidates(), box=$('#ci-list'); if(!box) return;
  box.innerHTML=l.length?l.map(c=>{ const st=childStatus(c); return `<button type="button" class="ci-kid" role="option" data-act="ci-pick" data-id="${c.id}" aria-pressed="${ci.sel===c.id}" aria-selected="${ci.sel===c.id}">${avatar(c,'sm')}<span class="grow"><b>${esc(cname(c))}</b><small>${esc(roomName(c.classroomId))} · ${st==='expected'?'Expected today':st==='out'?'Picked up '+fmtTime(lastAtt(c.id).outTime):st==='absent'?'Marked absent':'Not scheduled today'}</small></span>${flagsHTML(c.id)}</button>`; }).join('')
    :'<div class="empty small">Everyone matching is already checked in.</div>';
}
function renderCiDetail(){
  const box=$('#ci-detail'); if(!box) return;
  const c=child(ci.sel);
  if(!c){ box.innerHTML=`<div class="ci-detail empty" style="min-height:300px;display:grid;place-items:center"><div><span class="big">👋</span>Select a child to check in.</div></div>`; return; }
  const par=db.parents.filter(p=>p.childId===c.id), picks=db.authorizedPickups.filter(p=>p.childId===c.id);
  box.innerHTML=`<div class="ci-detail pop-in">
    <div class="row" style="gap:14px">${avatar(c,'lg')}<div class="grow"><div class="b" style="font-size:20px">${esc(cname(c))}</div><div class="muted small">${esc(ageText(c.dob))} · usual pickup ${c.usualPickup?fmtTime(c.usualPickup):'—'}</div></div></div>
    <div class="grid" style="gap:6px;margin:12px 0">${alertsHTML(c.id)}</div>
    <div class="grid g2" style="gap:10px">
      <div class="field"><label for="ci-room">Classroom</label><select id="ci-room">${db.classrooms.map(r=>{ const o=roomOcc(r); return `<option value="${r.id}" ${r.id===c.classroomId?'selected':''}>${esc(r.name)} · ${o.present}/${o.cap} here${o.level==='full'?' (full)':''}</option>`; }).join('')}</select></div>
      <div class="field"><label for="ci-time">Time</label><input type="time" id="ci-time" value="${nowTime()}"></div>
      <div class="field"><label for="ci-staff">Checked in by</label><select id="ci-staff">${db.staff.filter(s=>s.status!=='Inactive').map(s=>`<option value="${s.id}" ${s.id===curStaffId()?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="ci-date">Date</label><input type="text" id="ci-date" value="${esc(fmtDate(todayStr()))}" readonly></div>
    </div>
    <div class="grid g2" style="gap:10px;margin-top:12px">
      <div><div class="tiny b faint" style="letter-spacing:.08em;margin-bottom:6px">PARENT / GUARDIAN</div>${par.map(p=>`<div class="small"><b>${esc(p.name)}</b> (${esc(p.relationship)})<br><span class="muted">${esc(p.phone)}</span></div>`).join('')||'<span class="muted small">None recorded</span>'}</div>
      <div><div class="tiny b faint" style="letter-spacing:.08em;margin-bottom:6px">AUTHORIZED PICKUP</div>${picks.map(p=>`<div class="small">${p.authorized?'<span style="color:var(--mint-strong)">✓</span>':'<span style="color:var(--red)">✕</span>'} ${esc(p.name)} <span class="muted">(${esc(p.relationship)})</span></div>`).join('')||'<span class="muted small">None recorded</span>'}</div>
    </div>
    <button type="button" class="btn green" style="width:100%;min-height:58px;font-size:17px;margin-top:16px" data-act="ci-confirm">${ic('check')} CHECK IN ${esc(c.first.toUpperCase())}</button>
  </div>`;
}
function doCheckIn(force){
  const c=child(ci.sel); if(!c) return;
  if(childStatus(c)==='present'){ toast('Already checked in','warn'); return; }
  const rid=$('#ci-room').value, t=$('#ci-time').value, sid=$('#ci-staff').value;
  if(!isTime(t)){ toast('Enter a valid time.','error'); return; }
  const r=room(rid);
  if(!force && r && roomOcc(r).level==='full'){ confirmBox({title:'Classroom at capacity',message:`<b>${esc(r.name)} Room</b> already has ${roomOcc(r).present} of ${r.capacity} children. Check ${esc(c.first)} in anyway?`,okLabel:'Check in anyway',onOk:()=>doCheckIn(true)}); return; }
  const T=todayStr();
  db.attendance.filter(a=>a.childId===c.id&&a.date===T&&a.absent).forEach(a=>{ db.attendance.splice(db.attendance.indexOf(a),1); });
  db.attendance.push({id:uid('a'),childId:c.id,date:T,classroomId:rid,inTime:t,inStaffId:sid,outTime:'',outStaffId:'',pickupName:'',pickupRelationship:'',pickupAuthorized:null,overrideNote:''});
  saveData();
  const x=r?roomRatio(r):null;
  setModalBody(`<div class="success-burst"><div class="tick">${ic('check')}</div><h2>${esc(c.first)} is checked in!</h2><p class="muted">${esc(r?r.name+' Room':'')} · ${fmtTime(t)} · by ${esc(staffName(sid))}</p>
    <p><span class="chip green">PRESENT</span></p>${hasRedAlert(c.id)?`<div class="grid" style="max-width:460px;margin:10px auto;gap:6px">${alertsHTML(c.id,true)}</div>`:''}
    ${x&&x.attention?`<div class="room-warn amber" style="justify-content:center">⚠ Staffing Attention in ${esc(r.name)}: ${esc(ratioText(x))}</div>`:''}
    <div class="row" style="justify-content:center;margin-top:16px"><button type="button" class="btn primary" data-act="checkin">${ic('plus')} Check in another child</button><button type="button" class="btn" data-act="close-modal">Done</button></div></div>`);
  toast(`${cname(c)} checked in`);
  render(); updateHeader();
  const el=$(`#room-${rid}`); if(el) el.classList.add('flash');
}

/* ---------------- PICKUP / CHECK-OUT ---------------- */
function viewPickup(preId){
  if(preId && child(preId) && ui.pickupChild!==preId){ ui.pickupChild=preId; ui.pickupPerson=''; }
  const pres=presentRecs().map(a=>({a,c:child(a.childId)})).filter(x=>x.c).sort((x,y)=>(x.c.usualPickup||'99').localeCompare(y.c.usualPickup||'99')||sortByName(x.c,y.c));
  if(ui.pickupChild && !pres.some(x=>x.c.id===ui.pickupChild) && !ui.pickupDone) { ui.pickupChild=''; ui.pickupPerson=''; }
  const q=(ui.pickupQ||'').toLowerCase();
  const shown=pres.filter(x=>!q||cname(x.c).toLowerCase().includes(q));
  return viewHead('Safe release','Pickup',`${pres.length} ${pres.length===1?'child':'children'} currently at the center · sorted by usual pickup time`,'')+`
  <div class="pickup-layout">
    <section class="card" aria-labelledby="pk-list-h"><div class="pk-side-inner"><div class="card-head"><h2 id="pk-list-h">CHECK OUT CHILD</h2></div>
      <div class="search-box" style="width:100%;margin-bottom:10px">${ic('search')}<input id="pk-q" type="search" placeholder="Search child name..." value="${esc(ui.pickupQ||'')}" aria-label="Search children present"></div>
      <div class="ci-list" id="pk-list">${shown.map(({a,c})=>{ const due=c.usualPickup&&mins(c.usualPickup)<=mins(nowTime())+30;
        return `<button type="button" class="ci-kid" data-act="pk-pick" data-id="${c.id}" aria-pressed="${ui.pickupChild===c.id}">${avatar(c,'sm')}<span class="grow"><b>${esc(cname(c))}</b><small>${esc(roomName(a.classroomId))} · in ${fmtTime(a.inTime)}</small></span><span class="chip ${due?'peach':'gray'}">${c.usualPickup?fmtTime(c.usualPickup):'—'}</span></button>`; }).join('')||'<div class="empty small">No children are checked in right now.</div>'}</div></div>
    </section>
    <section class="card" id="pk-panel" aria-live="polite">${pickupPanel()}</section>
  </div>`;
}
function pickupPanel(){

  else if(p||other) verdict=`<div class="danger-panel" role="alert"><h3>${ic('alert')} ${other?'PERSON NOT ON PICKUP LIST':`${esc(p.name.toUpperCase())} IS NOT AUTHORIZED`}</h3>

    ${other?`<div class="grid g2" style="gap:8px"><div class="field"><label for="pk-oname">Person's full name</label><input id="pk-oname" type="text"></div><div class="field"><label for="pk-orel">Relationship</label><input id="pk-orel" type="text"></div></div>`:''}

  return `<div class="row" style="gap:14px;margin-bottom:10px">${avatar(c,'lg')}<div class="grow"><div class="eyebrow">Checking out</div><div class="b" style="font-size:22px">${esc(cname(c))}</div><div class="small muted">${esc(roomName(a?a.classroomId:c.classroomId))} · checked in ${a?fmtTime(a.inTime):'—'}</div></div></div>

    ${picks.map(x=>`<button type="button" class="pick-person ${x.authorized?'ok':'no'}" data-act="pk-person" data-id="${x.id}" aria-pressed="${sel===x.id}"><span class="av sm ${x.authorized?'c-mint':'c-coral'}">${esc(initials(x.name))}</span><span><b>${esc(x.name)}</b><br><span class="small muted">${esc(x.relationship)}${x.notes?' · '+esc(x.notes):''}</span></span><span class="st ${x.authorized?'ok':'no'}">${x.authorized?'AUTHORIZED ✓':'NOT AUTHORIZED ✕'}</span></button>`).join('')||'<div class="empty small">No pickup contacts on file for this child.</div>'}

      <div class="field"><label for="pk-staff">Released by</label><select id="pk-staff">${db.staff.filter(s=>s.status!=='Inactive').map(s=>`<option value="${s.id}" ${s.id===curStaffId()?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div></div>
      <div class="row" style="margin-top:14px">${p&&p.authorized?`<button type="button" class="btn green grow" style="min-height:56px;font-size:16px" data-act="pk-confirm">${ic('check')} CONFIRM PICKUP &amp; CHECK OUT</button>`
        :`<button type="button" class="btn grow" style="min-height:56px" data-act="pk-cancel">${ic('x')} Do not release</button><button type="button" class="btn danger grow" style="min-height:56px" data-act="pk-override">${ic('alert')} Release with override</button>`}</div>`:''}`;
}
function doCheckOut(override){
  const c=child(ui.pickupChild); if(!c) return;
  const a=lastAtt(c.id); if(!a||a.outTime){ toast('This child is not checked in.','error'); return; }
  const t=$('#pk-time').value, sid=$('#pk-staff').value;
  if(!isTime(t)){ toast('Enter a valid pickup time.','error'); return; }
  if(t<a.inTime){ toast('Pickup time is before the check-in time.','error'); return; }
  let name,rel,note='';
  if(!override){ const p=byId('authorizedPickups',ui.pickupPerson); if(!p||!p.authorized) return;
    if(!$('#pk-idok').checked){ toast('Confirm the pickup person’s identity first.','warn'); $('#pk-idok').focus(); return; }
    name=p.name; rel=p.relationship; }
  else {
    const p=byId('authorizedPickups',ui.pickupPerson);
    name=p?p.name:($('#pk-oname')&&$('#pk-oname').value.trim()); rel=p?p.relationship:($('#pk-orel')&&$('#pk-orel').value.trim());
    note=$('#pk-onote').value.trim();
    if(!name){ toast('Enter the name of the person picking up.','error'); $('#pk-oname').focus(); return; }
    if(!note){ toast('Record who approved this release.','error'); $('#pk-onote').focus(); return; }
    if(!$('#pk-oconf').checked){ toast('Tick the confirmation box to release with override.','error'); $('#pk-oconf').focus(); return; }
  }
  const finish=()=>{
    Object.assign(a,{outTime:t,outStaffId:sid,pickupName:name,pickupRelationship:rel||'',pickupAuthorized:!override,overrideNote:note});
    const n=napNow(c.id); if(n) n.end=t>n.start?t:n.start;
    saveData(); ui.pickupDone={cid:c.id,name:cname(c),person:name,rel,time:t,staff:sid,override}; ui.pickupPerson='';
    toast(`${cname(c)} checked out${override?' (override recorded)':''}`); render(); updateHeader();
  };
  if(override) confirmBox({title:'Release with override?',message:`<div class="danger-panel" style="margin:0"><b>${esc(name)}</b> is not an authorized pickup for <b>${esc(cname(c))}</b>.<br>Approval: “${esc(note)}”.<br><br>This release and your name will be recorded.</div>`,danger:true,okLabel:'Yes, release child',onOk:finish});
  else finish();
}

function careDate(){ return ui.careDate||todayStr(); }
function careKids(date){
  const T=todayStr();
  let list=db.children.filter(c=>attRecs(c.id,date).some(a=>!a.absent) || (date===T && c.status==='Enrolled' && childStatus(c)==='present'));

  const rank=c=>{ const s=childStatus(c,date); return s==='present'?0:1; };
  return list.sort((a,b)=>rank(a)-rank(b)||sortByName(a,b));
}

function timelineHTML(cid,date,compact){
  const ev=careEvents(cid,date);
  if(!ev.length) return `<div class="empty small">Nothing logged ${date===todayStr()?'yet today':'on this day'}.</div>`;
  const periods=[['MORNING','🌅','var(--yellow-soft)',0,660],['MIDDAY','☀️','var(--sky-soft)',660,900],['AFTERNOON','🌇','var(--peach-soft)',900,1440]];
  return `<div class="timeline">${periods.map(([label,em,bg,from,to])=>{ const items=ev.filter(e=>{ const m=mins(e.t)||0; return m>=from&&m<to; }); if(!items.length) return '';
    return `<div class="tl-period"><h4><span class="pill" style="background:${bg}">${em} ${label}</span></h4>${items.map(e=>`<div class="tl-item"><div class="tm">${fmtTime(e.t)}</div><div class="tic" style="background:${e.bg}" aria-hidden="true">${e.ic}</div>
      <div class="tbody"><b>${esc(e.title)}</b>${e.text?`<p>${esc(e.text)}</p>`:''}${e.rec&&e.rec.staffId&&!compact?`<p class="tiny">by ${esc(staffName(e.rec.staffId))}</p>`:''}</div>
      <div class="tact no-print">${!compact&&e.coll&&e.coll!=='incidents'?`<button type="button" class="btn xs ghost" data-act="del-care" data-coll="${e.coll}" data-id="${e.rec.id}" aria-label="Delete ${esc(e.title)}">${ic('trash')}</button>`:''}${!compact&&e.kind==='nap'&&!e.rec.end?`<button type="button" class="btn xs" data-act="end-nap" data-id="${e.rec.id}">End nap</button>`:''}${e.coll==='incidents'?`<button type="button" class="btn xs" data-act="view-incident" data-id="${e.rec.id}">View</button>`:''}</div></div>`).join('')}</div>`; }).join('')}</div>`;
}

    onSave(d){ db.charges.push({id:uid('ch'),kind:'manual',...d,amount:round2(d.amount)}); saveData(); toast('Charge added'); render(); updateHeader(); }});

function runBilling(){
  const T=todayStr(), terms=Number(db.settings.paymentTermsDays)||7;
  const due=activeChildren().filter(c=>c.billing&&isDate(c.billing.nextDue)&&c.billing.nextDue<=T);
  if(!due.length){ toast('No tuition is due today. Next billing dates are all in the future.','warn'); return; }
  confirmBox({title:'Run tuition billing',message:`<p>Create tuition charges for <b>${due.length}</b> ${due.length===1?'child':'children'} whose next billing date is today or earlier?</p><div class="small muted">${due.map(c=>`${esc(cname(c))} – ${money(chargeAmountFor(c))} (${esc(fmtDate(c.billing.nextDue))})`).join('<br>')}</div>`,okLabel:'Create charges',onOk:()=>{
    let n=0;
    due.forEach(c=>{ const b=c.billing, p=planBy(b.planId); let guard=0;
      while(b.nextDue<=T && guard++<24){ const amt=chargeAmountFor(c);
        if(amt>0){ db.charges.push({id:uid('ch'),childId:c.id,date:b.nextDue,dueDate:addDays(b.nextDue,terms),amount:amt,kind:'tuition',
          description:`${p?p.name:'Tuition'} – ${b.frequency==='Monthly'?fmtDate(b.nextDue,{month:'long',year:'numeric'}):'period from '+fmtDate(b.nextDue,{month:'short',day:'numeric'})}`}); n++; }
        b.nextDue = b.frequency==='Monthly'?addMonths(b.nextDue,1):addDays(b.nextDue,b.frequency==='Bi-weekly'?14:7); } });
    saveData(); toast(`${n} tuition ${n===1?'charge':'charges'} created`); render(); updateHeader(); }});
}

function attendanceStats(from,to){
  const T=todayStr(), days=schoolDays(from,to), per=[], absences=[], late=[], early=[];
  days.forEach(d=>{
    const recs=db.attendance.filter(a=>a.date===d&&!a.absent&&a.inTime);
    const kids=new Set(recs.map(a=>a.childId));
    const exp=db.children.filter(c=>isExpected(c,d)||(c.status!=='Enrolled'&&(c.schedule||[]).includes(dow(d))&&kids.has(c.id)));
    let abs=0;
    exp.forEach(c=>{ if(kids.has(c.id)) return; if(d<T||(d===T&&attRecs(c.id,d).some(a=>a.absent))){ abs++; const ab=attRecs(c.id,d).find(a=>a.absent); absences.push({c,d,reason:ab?ab.absenceReason:'No check-in recorded'}); } });
    recs.forEach(a=>{ const c=child(a.childId); if(!c) return; if(mins(a.inTime)>mins(db.settings.lateAfter)) late.push({c,d,t:a.inTime}); if(a.outTime&&mins(a.outTime)<mins(db.settings.earlyBefore)) early.push({c,d,t:a.outTime,by:a.pickupName}); });
    per.push({d,exp:exp.length,att:kids.size,abs});
  });
  return {days,per,absences,late,early};
}

/* ---------------- export / import ---------------- */
function exportData(){
  const payload={app:APP_ID,version:DATA_VERSION,exportedAt:new Date().toISOString(),data:db};
  const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`DayCareFlow-Backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast('Backup exported');
}
function validateImport(obj){
  if(!obj||typeof obj!=='object') return 'The file is not a DayCareFlow backup.';
  const data=obj.app===APP_ID&&obj.data?obj.data:obj;
  if(obj.app && obj.app!==APP_ID) return `This backup belongs to another app (“${String(obj.app).slice(0,40)}”).`;
  if(!isValidData(data)) return 'The backup is missing required sections (settings, children, classrooms, staff, attendance).';
  for(const k of KEYS){ if(data[k]!==undefined && !Array.isArray(data[k])) return `The “${k}” section in the backup is not valid.`; }
  if(data.children.some(c=>!c||typeof c.id!=='string'||typeof c.first!=='string')) return 'Some child records in the backup are damaged.';
  if(data.classrooms.some(r=>!r||typeof r.id!=='string'||typeof r.name!=='string')) return 'Some classroom records in the backup are damaged.';
  return data;
}
function handleImportFile(file){
  const st=$('#import-status');
  const show=(msg,ok)=>{ if(st) st.innerHTML=`<div class="${ok?'health-alert green':'form-error'}">${esc(msg)}</div>`; toast(msg,ok?'success':'error'); };
  if(!file) return;
  if(file.size>20*1024*1024) return show('That file is too large to be a DayCareFlow backup.',false);
  const fr=new FileReader();
  fr.onload=()=>{
    let obj; try{ obj=JSON.parse(fr.result); }catch(e){ return show('Import failed: the file is not valid JSON.',false); }
    const res=validateImport(obj);
    if(typeof res==='string') return show('Import failed: '+res,false);
    confirmBox({title:'Replace current data?',message:`<p>This backup has <b>${res.children.length}</b> children, <b>${res.staff.length}</b> staff and <b>${res.attendance.length}</b> attendance records${obj.exportedAt?` (exported ${esc(new Date(obj.exportedAt).toLocaleString())})`:''}.</p><p>Importing replaces all data currently in this browser. Export a backup first if you might need it.</p>`,okLabel:'Import backup',danger:true,
      onOk:()=>{ db=normalize(res); saveData(); buildHeader(); render(); show(`Import successful: ${db.children.length} children and ${db.attendance.length} attendance records restored.`,true); }});
  };
  fr.onerror=()=>show('Import failed: the file could not be read.',false);
  fr.readAsText(file);
}

  'reset-empty':()=>confirmBox({title:'Erase everything?',message:'This permanently erases ALL children, staff, classrooms, attendance, care and billing records from this browser. Export a backup first if you might need it.',danger:true,okLabel:'Erase everything',onOk:()=>{ const keep={name:db.settings.name,address:db.settings.address,phone:db.settings.phone,email:db.settings.email}; db=blankData(); Object.assign(db.settings,keep,{currentStaffId:''}); saveData(); buildHeader(); render(); toast('All data erased'); }})
};

/* =====================================================================
   ROUTER & INIT
   ===================================================================== */
/* Routing works through the URL hash when the browser allows it, and falls back to an
   in-memory route inside sandboxed previews where changing the URL is blocked. */
let memRoute=null;
function curHash(){ if(memRoute!=null) return memRoute; try{ return location.hash||''; }catch(e){ return ''; } }
function navigate(h){ memRoute=h; try{ if(location.hash!==h) location.hash=h; }catch(e){} onRoute(); }
function parseRoute(){ const h=curHash().replace(/^#\/?/,''); const [view,sub]=h.split('/'); return {view:view||'today',sub:sub||''}; }
function render(){
  const r=parseRoute(), main=$('#main');
  const act=document.activeElement, keepId=act&&act.id&&main.contains(act)?act.id:null;
  const selS=keepId&&act.selectionStart!=null?[act.selectionStart,act.selectionEnd]:null;
  afterRender.length=0;
  let html='';
  try{
    switch(r.view){
      case 'today': html=viewToday(); break;
      case 'children': html=viewChildren(r.sub); break;
      case 'child': html=viewChild(r.sub); break;
      case 'classrooms': html=viewClassrooms(r.sub); break;
      case 'attendance': html=viewAttendance(r.sub); break;
      case 'care': html=viewCare(r.sub); break;
      case 'pickup': html=viewPickup(r.sub); break;
      case 'billing': html=viewBilling(r.sub); break;
      case 'reports': html=viewReports(r.sub); break;
      case 'settings': html=viewSettings(r.sub); break;
      default: html=viewToday();
    }
  }catch(err){ console.error(err); html=`<div class="empty"><span class="big">⚠️</span>Something went wrong showing this page: ${esc(err.message)}. <a href="#/today">Go to Today</a></div>`; }
  main.innerHTML=html;
  updateNavActive(r.view);
  afterRender.forEach(fn=>fn());
  if(keepId){ const el=document.getElementById(keepId); if(el){ el.focus({preventScroll:true}); if(selS&&el.setSelectionRange){ try{ el.setSelectionRange(selS[0],selS[1]); }catch(e){} } } }
}
let lastView='';
window.addEventListener('hashchange',()=>{ let h=''; try{ h=location.hash; }catch(e){} if(h===memRoute) return; memRoute=h; onRoute(); });
function onRoute(){
  const r=parseRoute();
  if(r.view!=='pickup'){ ui.pickupDone=null; }
  closeSearch(); $('#notif-panel').hidden=true;
  render();
  if(r.view!==lastView){ window.scrollTo(0,0); lastView=r.view; }
  $('#main').focus({preventScroll:true});
}
document.addEventListener('click',e=>{
  const link=e.target.closest('a[href^="#/"]');
  if(link && !link.dataset.act && !e.defaultPrevented && !e.ctrlKey && !e.metaKey){ e.preventDefault(); navigate(link.getAttribute('href')); }
  const el=e.target.closest('[data-act]');
  if(!e.target.closest('#notif-panel')&&!e.target.closest('#notif-btn')&&(!el||el.dataset.act!=='toggle-notifs')){ const p=$('#notif-panel'); if(p&&!p.hidden){ p.hidden=true; $('#notif-btn').setAttribute('aria-expanded','false'); } }
  if(!e.target.closest('#search-wrap')) { const sr=$('#search-results'); if(sr&&!sr.hidden) closeSearch(); else $('#search-wrap')&&$('#search-wrap').classList.remove('open'); }
  if(!el) return;
  const fn=ACTIONS[el.dataset.act]; if(!fn) return;
  if(el.tagName==='A'){ e.preventDefault(); if(el.dataset.act==='close-modal-nav'){ closeModal(); navigate(el.getAttribute('href')); return; } }
  try{ fn(el.dataset,el,e); }catch(err){ console.error(err); toast('Something went wrong: '+err.message,'error'); }
});
const INPUT_HANDLERS={
  'child-q':v=>{ ui.childQ=v; const l=$('#child-list'); if(l) l.innerHTML=childCards(); },
  'pk-q':v=>{ ui.pickupQ=v; render(); },
  'notes-q':v=>{ ui.notesQ=v; render(); },
  'bill-q':v=>{ ui.billQ=v; render(); }
};
const CHANGE_HANDLERS={
  'child-room':v=>{ ui.childRoom=v; const l=$('#child-list'); if(l) l.innerHTML=childCards(); },
  'child-status':v=>{ ui.childStatus=v; const l=$('#child-list'); if(l) l.innerHTML=childCards(); },
  'att-date':v=>{ if(isDate(v)){ ui.attDate=v===todayStr()?'':v; render(); } },
  'care-date':v=>{ if(isDate(v)){ ui.careDate=v===todayStr()?'':v; render(); } },
  'care-room':v=>{ ui.careRoom=v; render(); },
  'inc-status':v=>{ ui.incStatus=v; render(); },
  'bill-status':v=>{ ui.billStatus=v; render(); },
  'rep-from':v=>{ if(isDate(v)){ ui.repFrom=v; render(); } },
  'rep-to':v=>{ if(isDate(v)){ ui.repTo=v; render(); } },
  'rep-child':v=>{ ui.repChild=v; render(); },
  'rep-dchild':v=>{ ui.repDailyChild=v; render(); },
  'rep-ddate':v=>{ if(isDate(v)){ ui.repDate=v; render(); } }
};
document.addEventListener('input',e=>{ const h=INPUT_HANDLERS[e.target.id]; if(h) h(e.target.value); });
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='import-file'){ handleImportFile(t.files&&t.files[0]); return; }
  const h=CHANGE_HANDLERS[t.id]; if(h){ h(t.value); return; }
  const dc=t.dataset&&t.dataset.change;
  if(dc==='wl-status'){ const w=byId('waitlist',t.dataset.id); if(w){ w.status=t.value; saveData(); toast(`${w.childName}: ${t.value}`); render(); } }
  else if(dc==='room-activity'){ const r=room(t.dataset.id); if(r){ r.activity=t.value; saveData(); toast(`${r.name}: ${t.value}`); } }
  else if(dc==='room-threshold'){ const r=room(t.dataset.id), v=Number(t.value); if(r&&v>=1&&v<=50){ r.threshold=v; saveData(); toast(`${r.name} threshold set to ${v} per staff`); render(); updateHeader(); } else toast('Enter a threshold between 1 and 50.','error'); }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if($('#confirm-root').innerHTML){ $('#cf-no')&&$('#cf-no').click(); return; }
  if($('#modal-root').innerHTML){ wiz=null; closeModal(); return; }
  const p=$('#notif-panel'); if(p&&!p.hidden){ p.hidden=true; $('#notif-btn').focus(); }
});
document.addEventListener('keydown',e=>{ // simple focus trap inside dialogs
  if(e.key!=='Tab') return;
  const root=$('#confirm-root').innerHTML?$('#confirm-root'):$('#modal-root').innerHTML?$('#modal-root'):null; if(!root) return;
  const f=$$('button:not([disabled]),[href],input:not([disabled]):not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])',root).filter(x=>x.offsetParent!==null||x.type==='radio'||x.type==='checkbox');
  if(!f.length) return; const first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  else if(!root.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
});
let lastDay=null;
setInterval(()=>{
  updateHeader();
  const r=parseRoute(), busy=$('#modal-root').innerHTML||$('#confirm-root').innerHTML||(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));
  if(!busy && (r.view==='today'||r.view==='classrooms'||lastDay!==todayStr())) render();
  lastDay=todayStr();
},60000);
window.addEventListener('storage',e=>{ if(e.key===LS_KEY&&e.newValue){ try{ const d=JSON.parse(e.newValue); if(isValidData(d)){ db=normalize(d); updateHeader(); if(!$('#modal-root').innerHTML) render(); } }catch(err){} } });

function init(){
  loadData();
  lastDay=todayStr();
  buildHeader();
  let h=''; try{ h=location.hash; }catch(e){}
  memRoute=h||'#/today';
  if(!h){ try{ history.replaceState(null,'','#/today'); }catch(e){} }
  lastView=parseRoute().view;
  render();
}
init();
</script>
</body>
