<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="DayCareFlow – Childcare &amp; Daycare Operations Manager. Works offline, data stored in this browser.">
<meta name="theme-color" content="#FFFDF7">
<title>DayCareFlow – Childcare &amp; Daycare Operations</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='44' cy='18' r='11' fill='%23FDE68A'/%3E%3Cpath d='M8 32 30 14l22 18v24H8z' fill='%23F97368'/%3E%3Crect x='24' y='40' width='12' height='16' rx='3' fill='%23E0F2FE'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFFDF7; --bg2:#FFF8EC; --card:#FFFFFF;
  --peach:#FDBA9A; --peach-soft:#FFEDE3;
  --coral:#F97368; --coral-strong:#C9443A; --coral-soft:#FEE4E1;
  --sky:#7DD3FC; --sky-soft:#E0F2FE; --sky-strong:#0369A1;
  --mint:#A7F3D0; --mint-soft:#ECFDF5; --mint-strong:#047857;
  --yellow:#FDE68A; --yellow-soft:#FEF9E7; --amber-strong:#92400E;
  --lav:#DDD6FE; --lav-soft:#F3F0FF; --lav-strong:#5B21B6;
  --ink:#334155; --ink-soft:#5B6B80; --ink-faint:#8A97A8;
  --line:#EFE4D2; --line-strong:#E2D3BB;
  --red:#B42318; --red-soft:#FEECEB;
  --radius:20px; --radius-sm:12px;
  --shadow:0 1px 0 rgba(120,90,50,.06), 0 6px 20px -8px rgba(120,90,50,.18);
  --shadow-lg:0 20px 50px -12px rgba(80,60,30,.35);
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100vh;
  background-image:radial-gradient(circle at 8% 0%,rgba(253,186,154,.18),transparent 32%),radial-gradient(circle at 96% 8%,rgba(125,211,252,.16),transparent 30%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sky-strong)}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
:focus-visible{outline:3px solid var(--sky-strong);outline-offset:2px;border-radius:8px}
main:focus,main:focus-visible{outline:none}
.skip-link{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:200}
.skip-link:focus{top:10px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Header ---------- */
.topbar{max-width:1440px;margin:0 auto;padding:14px 20px 0}
.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:12px 16px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{width:46px;height:46px;border-radius:14px;background:var(--peach-soft);display:grid;place-items:center;overflow:hidden;flex:none}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-name{font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand-name span{color:var(--coral-strong)}
.brand-sub{font-size:12px;color:var(--ink-soft);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.center-id{text-align:center;min-width:0}
.center-id .cname{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center-id .cdate{font-size:13px;color:var(--ink-soft);display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.live-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--mint-soft);color:var(--mint-strong);font-weight:700;font-size:12px;border:1px solid var(--mint)}
.live-pill.closed{background:var(--bg2);color:var(--ink-soft);border-color:var(--line-strong)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#10B981;box-shadow:0 0 0 0 rgba(16,185,129,.5);animation:pulse 2.2s infinite}
.live-pill.closed .live-dot{background:var(--ink-faint);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.head-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--bg2)}
.badge-count{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--coral-strong);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.search-wrap{position:relative}
.search-box{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);width:250px}
.search-box input{border:0;background:transparent;outline:none;width:100%;min-width:0}
.search-box:focus-within{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-soft)}
.search-results{position:absolute;right:0;top:52px;width:380px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:8px;z-index:60}
.sr-group{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);padding:8px 10px 4px}
.sr-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:12px}
.sr-item:hover,.sr-item:focus{background:var(--bg2)}
.sr-item small{display:block;color:var(--ink-soft)}
.shift-select{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 10px;max-width:170px;font-weight:600}
.shift-wrap{display:flex;flex-direction:column;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint)}

/* notifications panel */
.notif-panel{position:absolute;right:0;top:52px;width:390px;max-height:72vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:10px;z-index:60}
.notif-panel h3{font-size:15px;padding:6px 8px 10px}
.notif{display:flex;gap:10px;padding:10px;border-radius:14px;align-items:flex-start;width:100%;text-align:left;border:0;background:none}
.notif:hover{background:var(--bg2)}
.notif .ndot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:16px}
.notif b{display:block;font-size:14px}
.notif small{color:var(--ink-soft)}

/* ---------- Nav ---------- */
.navbar{position:sticky;top:0;z-index:40;max-width:1440px;margin:0 auto;padding:12px 20px 6px;background:linear-gradient(var(--bg) 75%,rgba(255,253,247,0))}
.nav-inner{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nav-item{display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--ink);text-decoration:none;transition:transform .12s,background .15s;min-height:48px}
.nav-item .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--bg2)}
.nav-item:hover{transform:translateY(-1px)}
.nav-item[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.nav-item[aria-current="page"] .ic{background:rgba(255,255,255,.16)}
.nav-item[data-c="peach"] .ic{background:var(--peach-soft);color:#9A3412}
.nav-item[data-c="sky"] .ic{background:var(--sky-soft);color:var(--sky-strong)}
.nav-item[data-c="mint"] .ic{background:var(--mint-soft);color:var(--mint-strong)}
.nav-item[data-c="yellow"] .ic{background:var(--yellow-soft);color:var(--amber-strong)}
.nav-item[data-c="lav"] .ic{background:var(--lav-soft);color:var(--lav-strong)}
.nav-item[data-c="coral"] .ic{background:var(--coral-soft);color:var(--coral-strong)}
.nav-item[aria-current="page"] .ic{background:rgba(255,255,255,.16)!important;color:#fff!important}
.bottom-nav{display:none}

/* ---------- Layout ---------- */
main{max-width:1440px;margin:0 auto;padding:10px 20px 60px}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:10px 0 18px}
.view-head h1{font-size:30px;font-weight:900;letter-spacing:-.03em}
.view-head p{margin:4px 0 0;color:var(--ink-soft)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--coral-strong)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{font-size:18px;font-weight:800}
.card h3{font-size:15px;font-weight:800}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.small{font-size:13px}
.tiny{font-size:12px}
.b{font-weight:800}
.empty{padding:28px 16px;text-align:center;color:var(--ink-soft);border:2px dashed var(--line);border-radius:16px;background:var(--bg)}
.empty .big{font-size:34px;display:block;margin-bottom:6px}
hr.sep{border:0;border-top:1px dashed var(--line-strong);margin:14px 0}

/* sub tabs */
.subtabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:16px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.subtab{border:0;background:none;padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;white-space:nowrap;color:var(--ink-soft);min-height:44px}
.subtab[aria-selected="true"]{background:var(--yellow);color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;border:1px solid var(--line-strong);background:#fff;font-weight:800;font-size:14px;color:var(--ink);text-decoration:none;transition:transform .1s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--coral-strong);border-color:var(--coral-strong);color:#fff}
.btn.primary:hover{background:#B53A31}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#1E293B}
.btn.green{background:var(--mint-strong);border-color:var(--mint-strong);color:#fff}
.btn.green:hover{background:#065F46}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bg2)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:11px}
.btn.xs{min-height:30px;padding:4px 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link-btn{border:0;background:none;color:var(--sky-strong);font-weight:700;padding:4px;text-decoration:underline;text-underline-offset:3px}

/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--bg2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip.green{background:var(--mint-soft);color:var(--mint-strong);border-color:var(--mint)}
.chip.red{background:var(--red-soft);color:var(--red);border-color:#F9C6C1}
.chip.yellow{background:var(--yellow-soft);color:var(--amber-strong);border-color:var(--yellow)}
.chip.blue{background:var(--sky-soft);color:var(--sky-strong);border-color:#BAE6FD}
.chip.lav{background:var(--lav-soft);color:var(--lav-strong);border-color:var(--lav)}
.chip.gray{background:#F4F1EC;color:var(--ink-soft);border-color:var(--line)}
.chip.peach{background:var(--peach-soft);color:#9A3412;border-color:var(--peach)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.green{background:#10B981}.dot.gray{background:#CBD5E1}.dot.blue{background:#38BDF8}.dot.red{background:#EF4444}.dot.amber{background:#F59E0B}

/* avatar */
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;color:var(--ink);flex:none;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.av.xs{width:26px;height:26px;font-size:10px;border-width:2px}
.av.sm{width:34px;height:34px;font-size:12px;border-width:2px}
.av.lg{width:84px;height:84px;font-size:28px;border-width:4px}
.av.xl{width:110px;height:110px;font-size:36px;border-width:5px}
.c-peach{background:var(--peach)}.c-sky{background:var(--sky)}.c-mint{background:var(--mint)}.c-yellow{background:var(--yellow)}.c-lav{background:var(--lav)}.c-coral{background:#FCA5A5}

/* ---------- TODAY ---------- */
.hello{display:grid;grid-template-columns:1.1fr 1.6fr;gap:16px;margin:8px 0 16px}
.hello-card{border-radius:28px;padding:24px;background:var(--peach-soft);border:1px solid #FBD5C2;position:relative;overflow:hidden}
.hello-card h1{font-size:34px;font-weight:900;letter-spacing:-.03em}
.hello-card .cn{font-size:20px;font-weight:800;margin-top:6px}
.hello-card .dt{color:var(--ink-soft);font-weight:700;margin-top:2px}
.hello-card .open-tag{margin-top:16px;display:inline-flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 14px;font-weight:800;border:1px solid #FBD5C2}
.hello-card .deco{position:absolute;right:-14px;bottom:-18px;opacity:.95;width:150px}
.status-card{border-radius:28px;padding:22px;background:var(--sky-soft);border:1px solid #BAE6FD;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.here-big{text-align:center;padding:10px 14px;background:#fff;border-radius:24px;border:1px solid #BAE6FD;min-width:200px}
.here-big .lbl{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--sky-strong)}
.here-big .num{font-size:66px;font-weight:900;line-height:1;letter-spacing:-.04em;margin:6px 0 0}
.here-big .unit{font-weight:800;color:var(--ink-soft)}
.here-sub{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.counter{background:#fff;border-radius:20px;padding:14px 12px;border:1px solid #BAE6FD;text-align:left;position:relative;overflow:hidden}
.counter .k{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.counter .v{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.counter .bar{height:6px;border-radius:6px;background:var(--bg2);margin-top:8px;overflow:hidden}
.counter .bar i{display:block;height:100%;border-radius:6px}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:22px;border:1px solid var(--line);background:#fff;font-weight:900;font-size:14px;letter-spacing:.03em;text-align:left;min-height:104px;box-shadow:var(--shadow);transition:transform .12s}
.qa:hover{transform:translateY(-2px)}
.qa .qi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.qa .qi svg{width:22px;height:22px}
.qa small{font-weight:600;color:var(--ink-soft);letter-spacing:0;font-size:12px}
.qa.in{background:var(--mint-soft);border-color:var(--mint)} .qa.in .qi{background:var(--mint);color:#065F46}
.qa.out{background:var(--peach-soft);border-color:var(--peach)} .qa.out .qi{background:var(--peach);color:#7C2D12}
.qa.note .qi{background:var(--lav);color:var(--lav-strong)}
.qa.inc .qi{background:var(--coral-soft);color:var(--coral-strong)}
.qa.meal .qi{background:var(--yellow);color:var(--amber-strong)}
.qa.nap .qi{background:var(--sky-soft);color:var(--sky-strong)}
.today-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:stretch}
.today-side{display:flex;flex-direction:column;gap:16px;min-height:0}
.today-side .feed-card{flex:1;display:flex;flex-direction:column;min-height:260px}
.today-side .feed-card .feed{flex:1 1 0;min-height:0;overflow-y:auto;padding-right:4px}

/* attendance board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.room-col{border-radius:22px;background:#fff;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.room-sign{padding:14px 16px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px dashed rgba(0,0,0,.08)}
.room-sign h3{font-size:16px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.room-sign .ag{font-size:13px;font-weight:700;color:var(--ink-soft)}
.room-col.peach .room-sign{background:var(--peach-soft)}
.room-col.sky .room-sign{background:var(--sky-soft)}
.room-col.mint .room-sign{background:var(--mint-soft)}
.room-col.yellow .room-sign{background:var(--yellow-soft)}
.room-col.lav .room-sign{background:var(--lav-soft)}
.room-col.coral .room-sign{background:var(--coral-soft)}
.room-body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.room-warn{margin:10px 10px 0;padding:8px 12px;border-radius:12px;font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center}
.room-warn.amber{background:var(--yellow-soft);color:var(--amber-strong);border:1px solid var(--yellow)}
.room-warn.red{background:var(--red-soft);color:var(--red);border:1px solid #F9C6C1}
.kid{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;border:1px solid transparent;background:var(--bg);width:100%;text-align:left}
.kid:hover{border-color:var(--line-strong);background:#fff}
.kid .kn{font-weight:800;font-size:14px;line-height:1.2}
.kid .ks{font-size:12px;color:var(--ink-soft);display:flex;gap:6px;align-items:center;white-space:nowrap}
.kid.off{opacity:.62}
.kid .kbody{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.kid .kn{display:block}
.kid .flags{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:3px}
.flag{font-size:11px;font-weight:900;padding:2px 7px;border-radius:8px;white-space:nowrap}
.flag.red{background:var(--red-soft);color:var(--red)}
.flag.yellow{background:var(--yellow-soft);color:var(--amber-strong)}
.flag.nap{background:var(--sky-soft);color:var(--sky-strong)}
.room-foot{padding:10px 14px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.pop-in{animation:popin .45s ease}
@keyframes popin{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(16,185,129,.0)}25%{box-shadow:0 0 0 4px rgba(16,185,129,.35)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

/* feed */
.feed{display:flex;flex-direction:column;gap:2px}
.feed-item{display:flex;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:13px}
.feed-item:last-child{border-bottom:0}
.feed-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px}
.alert-row{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--bg);margin-bottom:6px;width:100%;border:0;text-align:left}
.alert-row:hover{background:var(--bg2)}

/* ring */
.ring{position:relative;display:inline-grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .rl{position:absolute;text-align:center;font-weight:900;line-height:1}
.ring .rl small{display:block;font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.05em;margin-top:2px}

/* ---------- CHILDREN ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.input,.toolbar select,.toolbar input{height:44px;border:1px solid var(--line-strong);border-radius:13px;background:#fff;padding:0 12px;min-width:0}
.toolbar .input.search{flex:1;min-width:200px;max-width:380px}
.kids-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.kid-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;box-shadow:var(--shadow);transition:transform .12s;width:100%}
.kid-card:hover{transform:translateY(-2px)}
.kid-card .top{display:flex;gap:12px;align-items:center}
.kid-card .nm{font-weight:900;font-size:16px}
.kid-card .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.kid-card .meta div{background:var(--bg);border-radius:10px;padding:6px 9px}
.kid-card .meta span{display:block;color:var(--ink-faint);font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.kid-card .meta b{font-size:13px}
.kid-card .tagrow{display:flex;gap:6px;flex-wrap:wrap}

/* profile */
.profile-hero{display:flex;gap:20px;align-items:center;padding:22px;border-radius:28px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);margin-bottom:16px;flex-wrap:wrap}
.profile-hero h1{font-size:28px;font-weight:900;letter-spacing:-.02em}
.alert-banner{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.health-alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:14px;font-weight:700;font-size:14px}
.health-alert.red{background:var(--red-soft);color:var(--red);border:1px solid #F9C6C1}
.health-alert.yellow{background:var(--yellow-soft);color:var(--amber-strong);border:1px solid var(--yellow)}
.health-alert.green{background:var(--mint-soft);color:var(--mint-strong);border:1px solid var(--mint)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--ink-soft);font-weight:700}
.kv dd{margin:0;font-weight:700}
.contact{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--bg);margin-bottom:8px}
.contact .ct-main{flex:1;min-width:0}
.contact b{display:block}
.contact small{color:var(--ink-soft)}

/* ---------- CLASSROOMS ---------- */
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.room-card{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.room-card .rc-top{padding:18px;display:flex;gap:16px;align-items:center}
.room-card.peach .rc-top{background:var(--peach-soft)}.room-card.sky .rc-top{background:var(--sky-soft)}.room-card.mint .rc-top{background:var(--mint-soft)}.room-card.yellow .rc-top{background:var(--yellow-soft)}.room-card.lav .rc-top{background:var(--lav-soft)}.room-card.coral .rc-top{background:var(--coral-soft)}
.room-card h2{font-size:20px;font-weight:900;letter-spacing:.02em;text-transform:uppercase}
.room-card .rc-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.name-dots{display:flex;flex-wrap:wrap;gap:6px}
.name-dot{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:13px;font-weight:700}
.ratio-box{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg);font-size:13px}
.ratio-box.warn{background:var(--yellow-soft);border:1px solid var(--yellow);color:var(--amber-strong)}
.staff-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);background:var(--bg2);padding:10px 12px;font-weight:900;white-space:nowrap}
table.t td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:#FFFCF5}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- DAILY CARE ---------- */
.care-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:stretch}
.side-card{padding:12px}
.care-side>.care-list{position:sticky;top:92px;max-height:calc(100vh - 124px)}
.care-list{display:flex;flex-direction:column;gap:6px;overflow:auto;padding-right:4px}
.care-kid{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;text-align:left;width:100%}
.care-kid[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.care-kid[aria-pressed="true"] small{color:#CBD5E1}
.care-kid small{display:block;color:var(--ink-soft);font-size:12px}
.care-actions{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:14px}
.care-actions .btn{flex-direction:column;min-height:74px;gap:4px;font-size:12px;letter-spacing:.03em}
.timeline{position:relative;padding-left:4px}
.tl-period{margin:4px 0 12px}
.tl-period h4{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.tl-period h4 .pill{padding:4px 10px;border-radius:999px}
.tl-item{display:grid;grid-template-columns:76px 38px 1fr auto;gap:10px;align-items:start;padding:8px 0;position:relative}
.tl-item .tm{font-size:12px;font-weight:800;color:var(--ink-soft);padding-top:9px;text-align:right}
.tl-item .tic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;position:relative;z-index:1}
.tl-item .tbody{background:var(--bg);border-radius:14px;padding:9px 12px;border:1px solid var(--line)}
.tl-item .tbody b{font-size:14px}
.tl-item .tbody p{margin:2px 0 0;font-size:13px;color:var(--ink-soft)}
.tl-item::before{content:"";position:absolute;left:104px;top:0;bottom:0;width:2px;background:var(--line)}
.mood-pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mood-pick label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:2px solid var(--line);border-radius:16px;cursor:pointer;font-weight:800;font-size:13px;background:#fff}
.mood-pick label .em{font-size:28px}
.mood-pick input{position:absolute;opacity:0;pointer-events:none}
.mood-pick input:checked+label,.mood-pick label:has(input:checked){border-color:var(--sky-strong);background:var(--sky-soft)}
.mood-pick input:focus-visible+label{outline:3px solid var(--sky-strong)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:10px 14px;border:2px solid var(--line);border-radius:13px;font-weight:800;font-size:14px;cursor:pointer;background:#fff;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.seg input:checked+label{border-color:var(--ink);background:var(--ink);color:#fff}
.seg input:focus-visible+label{outline:3px solid var(--sky-strong)}
.kid-picker{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.kid-picker input{position:absolute;opacity:0;pointer-events:none}
.kid-picker label{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer}
.kid-picker input:checked+label{border-color:var(--mint-strong);background:var(--mint-soft)}
.kid-picker input:focus-visible+label{outline:3px solid var(--sky-strong)}

/* ---------- PICKUP ---------- */
.pickup-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:stretch}
.pk-side-inner{position:sticky;top:92px}
.pk-side-inner .ci-list{max-height:calc(100vh - 250px)}
.pick-person{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;border:2px solid var(--line);background:#fff;width:100%;text-align:left;margin-bottom:8px}
.pick-person:hover{border-color:var(--line-strong)}
.pick-person[aria-pressed="true"].ok{border-color:var(--mint-strong);background:var(--mint-soft)}
.pick-person[aria-pressed="true"].no{border-color:var(--red);background:var(--red-soft)}
.pick-person .st{margin-left:auto;font-weight:900;font-size:13px;letter-spacing:.04em}
.pick-person .st.ok{color:var(--mint-strong)}
.pick-person .st.no{color:var(--red)}
.danger-panel{border:2px solid var(--red);background:var(--red-soft);color:#7A1A12;border-radius:18px;padding:16px;margin:10px 0}
.danger-panel h3{color:var(--red);font-size:17px;display:flex;gap:8px;align-items:center}
.ok-panel{border:2px solid var(--mint-strong);background:var(--mint-soft);border-radius:18px;padding:16px;margin:10px 0}

/* ---------- Forms / Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(51,65,85,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:100;overflow-y:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:26px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:rise .2s ease;display:flex;flex-direction:column;max-height:none}
.modal.wide{max-width:860px}
.modal.xwide{max-width:1040px}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:20px;font-weight:900}
.modal-body{padding:20px 22px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--bg);border-radius:0 0 26px 26px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field>label,.field .flabel{font-size:13px;font-weight:800;color:var(--ink)}
.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;background:#fff;min-height:44px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sky-strong);box-shadow:0 0 0 3px var(--sky-soft)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red);background:#FFF8F7}
.field small{color:var(--ink-soft);font-size:12px}
.err{color:var(--red);font-size:12px;font-weight:700;min-height:0}
.check{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;cursor:pointer;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--mint-strong)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label{width:48px;height:44px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;cursor:pointer;background:#fff}
.days input:checked+label{background:var(--sky-soft);border-color:var(--sky-strong);color:var(--sky-strong)}
.days input:focus-visible+label{outline:3px solid var(--sky-strong)}
.form-section{grid-column:1/-1;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--coral-strong);margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.form-section:first-child{border-top:0;padding-top:0;margin-top:0}
.form-error{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:12px;font-weight:700;font-size:14px;margin-bottom:12px}

/* wizard */
.steps{display:flex;gap:4px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:84px;text-align:center;font-size:11px;font-weight:800;color:var(--ink-faint);letter-spacing:.03em}
.step .n{width:30px;height:30px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;background:var(--bg2);border:2px solid var(--line);font-size:13px;color:var(--ink-soft)}
.step.done .n{background:var(--mint);border-color:var(--mint-strong);color:#065F46}
.step.cur{color:var(--ink)}
.step.cur .n{background:var(--coral-strong);border-color:var(--coral-strong);color:#fff}
.room-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.room-choice input{position:absolute;opacity:0;pointer-events:none}
.room-choice label{display:block;padding:14px;border-radius:18px;border:2px solid var(--line);cursor:pointer;background:#fff}
.room-choice input:checked+label{border-color:var(--ink);box-shadow:0 0 0 3px var(--sky-soft)}
.room-choice input:focus-visible+label{outline:3px solid var(--sky-strong)}
.review-sec{background:var(--bg);border-radius:16px;padding:14px;margin-bottom:10px}
.review-sec h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral-strong);margin-bottom:6px}

/* check-in */
.ci-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
.ci-list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;margin-top:10px;padding-right:4px}
.ci-kid{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:#fff;width:100%;text-align:left}
.ci-kid[aria-pressed="true"]{border-color:var(--mint-strong);background:var(--mint-soft)}
.ci-kid small{display:block;color:var(--ink-soft);font-size:12px}
.ci-detail{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:18px}
.success-burst{text-align:center;padding:26px 10px}
.success-burst .tick{width:86px;height:86px;border-radius:50%;background:var(--mint);display:grid;place-items:center;margin:0 auto 12px;animation:popin .5s ease}
.success-burst .tick svg{width:44px;height:44px;stroke:#065F46;stroke-width:3}
.success-burst.out .tick{background:var(--peach)}
.success-burst.out .tick svg{stroke:#7C2D12}

/* toast */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:150;max-width:min(380px,calc(100vw - 36px))}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:16px;box-shadow:var(--shadow-lg);font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;animation:rise .25s ease}
.toast.success{background:#065F46}
.toast.error{background:var(--red)}
.toast.warn{background:#92400E}

/* charts */
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding:10px 4px 0;border-bottom:2px solid var(--line)}
.bars .bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars .bv{font-size:12px;font-weight:900}
.bars .bb{width:100%;max-width:54px;border-radius:10px 10px 4px 4px;background:var(--sky);min-height:3px;transition:height .4s}
.bars-lbl{display:flex;gap:10px;padding:6px 4px 0}
.bars-lbl span{flex:1;text-align:center;font-size:11px;font-weight:800;color:var(--ink-soft);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.hbar .track{height:14px;background:var(--bg2);border-radius:8px;overflow:hidden}
.hbar .fill{height:100%;border-radius:8px}
.stat{background:var(--bg);border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
.stat .k{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.stat .v{font-size:26px;font-weight:900;letter-spacing:-.02em}

/* daily report */
.dr{max-width:720px;margin:0 auto;background:#fff;border-radius:26px;border:1px solid var(--line);overflow:hidden}
.dr-head{background:var(--yellow-soft);padding:24px;text-align:center;border-bottom:2px dashed var(--yellow)}
.dr-head h2{font-size:30px;font-weight:900;letter-spacing:.04em}
.dr-sec{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:14px 24px;border-bottom:1px dashed var(--line);align-items:start}
.dr-sec .h{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--coral-strong);padding-top:3px}
.dr-note{background:var(--lav-soft);border-radius:16px;padding:14px;font-style:italic}

/* settings */
.set-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:stretch}
.set-side{padding:10px}
.set-nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:92px}
.set-nav a{display:flex;align-items:center;text-decoration:none;border:1px solid transparent;padding:12px 14px;border-radius:12px;font-weight:800;color:var(--ink-soft);min-height:44px}
.set-nav a[aria-current="page"]{background:var(--yellow);color:var(--ink)}
.safety{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:var(--sky-soft);border:1px solid #BAE6FD;color:#0C4A6E;font-weight:700;margin-bottom:14px}

#print-area{display:none}
.print-only{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .quick{grid-template-columns:repeat(3,minmax(0,1fr))}
  .today-grid{grid-template-columns:1fr}
  .hello{grid-template-columns:1fr}
  .care-actions{grid-template-columns:repeat(3,minmax(0,1fr))}
  .nav-item{padding:9px 12px}
  .nav-item .lbl{font-size:12px}
}
@media (max-width:980px){
  .header{grid-template-columns:auto 1fr auto}
  .search-box{width:180px}
  .shift-wrap{display:none}
  .ci-layout,.pickup-layout,.care-layout{grid-template-columns:1fr}
  .care-list{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}
  .care-side>.care-list{position:static;max-height:none}
  .pk-side-inner{position:static}
  .pk-side-inner .ci-list{max-height:none}
  .today-side .feed-card .feed{flex:none;max-height:360px}
  .care-kid{min-width:190px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .set-grid{grid-template-columns:1fr}
  .set-nav{position:static;flex-direction:row;overflow-x:auto}
  .set-nav a{white-space:nowrap}
  .nav-item .ic{display:none}
}
@media (max-width:760px){
  body{font-size:15px;padding-bottom:84px}
  .topbar{padding:10px 12px 0}
  .header{grid-template-columns:1fr auto;padding:10px 12px;border-radius:20px;gap:8px}
  .center-id{display:none}
  .brand-logo{width:40px;height:40px}
  .brand-name{font-size:17px}
  .search-box{width:44px;padding:0;justify-content:center;border-radius:14px}
  .search-box input{position:absolute;opacity:0;width:1px}
  .search-wrap.open .search-box{position:fixed;left:12px;right:12px;top:12px;width:auto;z-index:70;background:#fff;padding:0 12px;justify-content:flex-start;box-shadow:var(--shadow-lg)}
  .search-wrap.open .search-box input{position:static;opacity:1;width:100%}
  .search-results{position:fixed;left:12px;right:12px;top:64px;width:auto}
  .notif-panel{position:fixed;left:12px;right:12px;top:70px;width:auto}
  .navbar{display:none}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -12px rgba(80,60,30,.25)}
  .bottom-nav a,.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;font-size:11px;font-weight:900;letter-spacing:.05em;color:var(--ink-soft);text-decoration:none;border:0;background:none;min-height:54px;justify-content:center}
  .bottom-nav [aria-current="page"]{color:var(--ink);background:var(--yellow-soft)}
  .bottom-nav svg.i{width:22px;height:22px}
  main{padding:6px 12px 40px;display:flex;flex-direction:column}
  main>.quick{order:-1;margin-top:4px}
  .hello-card .deco{display:none}
  .view-head h1{font-size:25px}
  .hello-card h1{font-size:27px}
  .hello-card .deco{width:110px}
  .status-card{grid-template-columns:1fr;padding:14px;gap:12px}
  .here-big .num{font-size:54px}
  .counters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .qa{min-height:84px;padding:12px;flex-direction:row;align-items:center}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .room-choice{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
  .modal-back{padding:0;align-items:flex-end}
  .modal{border-radius:24px 24px 0 0;max-height:94vh;overflow:auto}

<script>
'use strict';
/* =====================================================================
   DayCareFlow – Childcare & Daycare Operations Manager

   ===================================================================== */

const LS_KEY = 'daycareflow.data.v1';

// Collections kept in storage. "guardians" holds each child's emergency contacts;
// "parents" holds parents / legal guardians; "charges" holds issued tuition charges.
const KEYS = ['children','parents','guardians','authorizedPickups','classrooms','staff','staffAttendance','attendance',

const DEFAULTS = {

  currency:'USD', billingFrequency:'Weekly', lateFee:25, paymentTermsDays:7,
  nearCapacityPct:85, lateAfter:'09:30', earlyBefore:'15:00', currentStaffId:'s1'
};

const MOODS = {
  happy:{e:'😊',l:'Happy'}, good:{e:'🙂',l:'Good'}, okay:{e:'😐',l:'Okay'}, upset:{e:'😟',l:'Upset'}, tired:{e:'😴',l:'Tired'}
};
const MEALS = ['Breakfast','Morning snack','Lunch','Afternoon snack'];
const MEAL_STATUS = ['Ate well','Ate some','Did not eat'];
const ACTIVITY_TYPES = ['Art','Reading','Outdoor Play','Music','Learning','Free Play','Group Activity','Other'];
const ACT_EMOJI = {'Art':'🎨','Reading':'📚','Outdoor Play':'🌳','Music':'🎵','Learning':'🔤','Free Play':'🧸','Group Activity':'🤝','Other':'⭐'};
const INCIDENT_TYPES = ['Minor Injury','Fall','Behavior','Illness','Other'];
const INCIDENT_STATUS = ['Open','Reviewed','Closed'];
const STAFF_ROLES = ['Teacher','Assistant','Director','Administrator'];
const STAFF_STATUS = ['Active','On leave','Inactive'];
const ROOM_COLORS = ['peach','sky','mint','yellow','lav','coral'];
const IMMUNIZATION = ['Up to date','Due soon','Overdue','Exempt / on file'];
const PAY_METHODS = ['Cash','Card','Bank Transfer','Other'];
const FREQUENCIES = ['Weekly','Bi-weekly','Monthly'];
const WAIT_STATUS = ['Waiting','Contacted','Enrolled','Removed'];
const PRIORITIES = ['High','Normal','Low'];
const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const CURRENCIES = ['USD','CAD','EUR','GBP','AUD','NZD','ZAR','INR','MXN','PHP'];

/* ---------------- helpers ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => dstr(new Date());
const nowTime = () => { const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const parseD = s => { const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return dstr(d); };
const addMonths = (s,n) => { const d=parseD(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return dstr(d); };
const dow = s => parseD(s).getDay();
const mins = t => { if(!t) return null; const [h,m]=String(t).split(':').map(Number); return h*60+(m||0); };
const toTime = m => pad(Math.floor(m/60)%24)+':'+pad(m%60);
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'');
const isTime = s => /^\d{2}:\d{2}$/.test(s||'');
function fmtTime(t){ if(!t) return ''; let [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${pad(m)} ${ap}`; }
function fmtDur(m){ if(m==null||isNaN(m)) return ''; if(m<60) return `${m}m`; return `${Math.floor(m/60)}h ${pad(m%60)}m`.replace(/ 0(\d)m/,' $1m'); }
function fmtDate(s, opts){ if(!isDate(s)) return s||''; return parseD(s).toLocaleDateString(undefined, opts||{month:'short',day:'numeric',year:'numeric'}); }
const fmtDateLong = s => fmtDate(s,{weekday:'long',month:'long',day:'numeric'});
const fmtDateShort = s => fmtDate(s,{weekday:'short',month:'short',day:'numeric'});
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(p){ return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){
  const v = Number(n)||0;
  try { return new Intl.NumberFormat(undefined,{style:'currency',currency:(db&&db.settings.currency)||'USD'}).format(v); }
  catch(e){ return '$'+v.toFixed(2); }
}
function ageText(dob, at){
  if(!isDate(dob)) return '';
  const a=parseD(dob), b=parseD(at||todayStr());
  let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()); if(b.getDate()<a.getDate()) m--;
  if(m<0) return '—';
  if(m<24) return `${m} mo`;
  const y=Math.floor(m/12), r=m%12; return r?`${y} yrs ${r} mo`:`${y} yrs`;
}
function ageMonths(dob){ if(!isDate(dob)) return 0; const a=parseD(dob), b=new Date();
  let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()); if(b.getDate()<a.getDate()) m--; return m; }
function initials(name){ return String(name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function greeting(){ const h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening'; }
function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function mondayOf(s){ return addDays(s, -((dow(s)+6)%7)); }
function weekdaysBetween(from,to){ const out=[]; let d=from; while(d<=to){ out.push(d); d=addDays(d,1); } return out; }

/* ---------------- storage ---------------- */
let db = null;

function blankData(){ const d={settings:{...DEFAULTS}}; KEYS.forEach(k=>d[k]=[]); return d; }
function isValidData(d){
  if(!d || typeof d!=='object' || Array.isArray(d)) return false;
  if(!d.settings || typeof d.settings!=='object') return false;
  const required=['children','classrooms','staff','attendance'];
  return required.every(k=>Array.isArray(d[k]));
}
function normalize(d){
  const out=blankData();
  out.settings={...DEFAULTS,...(d.settings||{})};
  KEYS.forEach(k=>{ if(Array.isArray(d[k])) out[k]=d[k].filter(x=>x&&typeof x==='object'); });
  out.children.forEach(c=>{ if(!Array.isArray(c.schedule)) c.schedule=[1,2,3,4,5]; if(!c.billing) c.billing=null; if(!c.color) c.color='peach'; });
  return out;
}
function loadData(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ const d=JSON.parse(raw); if(isValidData(d)){ db=normalize(d); return; } }
  }catch(e){ console.warn('Stored data could not be read', e); }
  db=seedData(); saveData(true);
}
let storageWarned=false;
function saveData(silent){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }
  catch(e){ if(!silent||!storageWarned){ storageWarned=true; toast('Could not save to browser storage. Export a backup now.','error'); } }
}

/* ---------------- starting records ---------------- */
function seedData(){
  const R=rng(20260930);
  const pick=a=>a[Math.floor(R()*a.length)];
  const T=todayStr(), NOW=mins(nowTime());
  const d=blankData();
  const phone=()=>`(555) ${200+Math.floor(R()*780)}-${1000+Math.floor(R()*8999)}`;
  const domains=['brightmail.com','homebase.net','familynet.org','mailhub.co','pinemail.com'];
  const email=n=>n.toLowerCase().replace(/[^a-z ]/g,'').trim().replace(/\s+/g,'.')+'@'+pick(domains);

  d.classrooms=[
    {id:'r1',name:'Sunflower',ageGroup:'Toddlers',ages:'Ages 1–2',capacity:7,color:'peach',threshold:4,activity:'Sensory play'},
    {id:'r2',name:'Rainbow',ageGroup:'Twos',ages:'Ages 2–3',capacity:10,color:'sky',threshold:4,activity:'Circle time'},
    {id:'r3',name:'Butterflies',ageGroup:'Preschool',ages:'Ages 3–4',capacity:10,color:'mint',threshold:8,activity:'Art & crafts'},
    {id:'r4',name:'Little Stars',ageGroup:'Pre-K',ages:'Ages 4–5',capacity:12,color:'yellow',threshold:10,activity:'Learning centers'}
  ];
  d.staff=[
    {id:'s1',name:'Linda Brooks',role:'Director',classroomId:'',start:'2017-08-14',status:'Active'},
    {id:'s2',name:'Sarah Mitchell',role:'Teacher',classroomId:'r1',start:'2019-03-04',status:'Active'},
    {id:'s3',name:'Emily Carter',role:'Assistant',classroomId:'r1',start:'2023-01-09',status:'Active'},
    {id:'s4',name:'Jessica Nguyen',role:'Teacher',classroomId:'r2',start:'2020-06-15',status:'Active'},
    {id:'s5',name:'Priya Patel',role:'Teacher',classroomId:'r3',start:'2021-09-01',status:'Active'},
    {id:'s6',name:'Daniel Ortiz',role:'Teacher',classroomId:'r4',start:'2022-02-21',status:'Active'}
  ].map(s=>({...s,phone:phone(),email:s.name.toLowerCase().split(' ')[0]+'@happykidsdaycare.com'}));
  d.tuitionPlans=[
    {id:'tp1',name:'Full Time Weekly',kind:'flat',rate:285,frequency:'Weekly',description:'5 days per week, 8:00 AM – 6:00 PM'},
    {id:'tp2',name:'Full Time Monthly',kind:'flat',rate:1150,frequency:'Monthly',description:'5 days per week, billed on the 1st'},
    {id:'tp3',name:'Part Time (3 days)',kind:'flat',rate:185,frequency:'Weekly',description:'3 scheduled days per week'},
    {id:'tp4',name:'Daily',kind:'daily',rate:68,frequency:'Weekly',description:'Per scheduled day, billed weekly'},
    {id:'tp5',name:'Custom',kind:'flat',rate:0,frequency:'Monthly',description:'Custom arrangement set per child'}
  ];
  const FT=[1,2,3,4,5], MWF=[1,3,5], MTW=[1,2,3], TTH=[2,4];
  const none={allergies:'',dietary:'',notes:'',medication:'',immunization:'Up to date'};
  // first,last,gender,room,ageMonths,schedule,usualPickup,parents,extraPickups,emergency,health,plan,discount
  const defs=[
    ['Emma','Johnson','Female','r1',22,FT,'16:30',[['Sarah Johnson','Mother'],['David Johnson','Father']],[['Linda Johnson','Grandmother',true,''],['Mike Smith','Uncle',false,'Not on approved list — parent must call ahead']],[['Linda Johnson','Grandmother']],none,'tp1',0],
    ['Noah','Smith','Male','r1',20,FT,'17:00',[['Rachel Smith','Mother'],['Kevin Smith','Father']],[],[['Tom Harper','Family friend']],{...none,allergies:'Peanuts and tree nuts (severe)',medication:'EpiPen Jr. stored in Sunflower medical kit',notes:'On any exposure: give EpiPen, call 911, then parents.'},'tp2',0],
    ['Liam','Brown','Male','r1',18,FT,'16:45',[['Ashley Brown','Mother']],[['Chris Brown','Father',true,''],['Joe Brown','Grandfather',true,'Picks up on Thursdays']],[['Chris Brown','Father']],{...none,dietary:'Lactose-free milk only'},'tp1',0],
    ['Ava','Garcia','Female','r1',24,MWF,'15:30',[['Maria Garcia','Mother'],['Luis Garcia','Father']],[],[['Rosa Delgado','Aunt']],{...none,immunization:'Due soon'},'tp3',0],
    ['Mia','Thompson','Female','r1',15,FT,'17:15',[['Jennifer Thompson','Mother']],[['Olivia Park','Nanny',true,'Photo ID on file']],[['Mark Thompson','Grandfather']],{...none,notes:'Eczema — apply provided cream after handwashing.'},'tp1',10],
    ['Jack','Wilson','Male','r1',26,FT,'16:00',[['Megan Wilson','Mother'],['Ryan Wilson','Father']],[],[['Carol Wilson','Grandmother']],none,'tp1',0],
    ['Lucas','Martinez','Male','r1',13,FT,'17:30',[['Ana Martinez','Mother'],['Diego Martinez','Father']],[],[['Elena Ruiz','Aunt']],{...none,dietary:'Soft / mashed foods only'},'tp2',0],
    ['Sophia','Lee','Female','r2',34,FT,'16:30',[['Grace Lee','Mother'],['Daniel Lee','Father']],[],[['Min Park','Grandmother']],{...none,dietary:'Dairy-free'},'tp1',0],
    ['Oliver','Davis','Male','r2',30,FT,'17:00',[['Hannah Davis','Mother']],[['Greg Davis','Grandfather',true,'']],[['Greg Davis','Grandfather']],{...none,medication:'Albuterol inhaler for asthma — as needed, see action plan in file'},'tp1',0],
    ['Isabella','Clark','Female','r2',36,MTW,'15:00',[['Nicole Clark','Mother'],['James Clark','Father']],[],[['Paula Reyes','Neighbor']],none,'tp4',0],
    ['Elijah','Robinson','Male','r2',29,FT,'16:15',[['Tanya Robinson','Mother'],['Marcus Robinson','Father']],[['Keisha Robinson','Aunt',true,'']],[['Keisha Robinson','Aunt']],{...none,immunization:'Overdue'},'tp1',0],
    ['Amelia','Walker','Female','r2',32,FT,'17:45',[['Laura Walker','Mother']],[['Ben Walker','Father',true,'Court order on file: Fridays only'],['Jason Miller','Mother\'s partner',false,'Not authorized — do not release']],[['Susan Walker','Grandmother']],none,'tp2',0],
    ['Harper','Young','Female','r3',44,FT,'16:30',[['Kimberly Young','Mother'],['Steven Young','Father']],[],[['Anne Young','Grandmother']],{...none,allergies:'Eggs (mild — hives)'},'tp1',0],
    ['James','Hall','Male','r3',41,MWF,'15:15',[['Emily Hall','Mother']],[['Robert Hall','Father',true,'']],[['Robert Hall','Father']],none,'tp3',0],
    ['Charlotte','King','Female','r3',47,FT,'17:00',[['Victoria King','Mother'],['Andrew King','Father']],[],[['Helen King','Grandmother']],none,'tp2',5],
    ['Benjamin','Wright','Male','r3',42,FT,'16:45',[['Samantha Wright','Mother']],[['Tyler Wright','Brother (19)',true,'']],[['Tyler Wright','Brother']],{...none,dietary:'Vegetarian'},'tp1',0],
    ['Evelyn','Scott','Female','r4',58,FT,'16:30',[['Rebecca Scott','Mother'],['Paul Scott','Father']],[],[['Diane Scott','Grandmother']],none,'tp1',0],
    ['Henry','Adams','Male','r4',55,FT,'17:15',[['Christina Adams','Mother']],[['Mark Adams','Father',true,'']],[['Mark Adams','Father']],{...none,allergies:'Shellfish'},'tp1',0],
    ['Aria','Nelson','Female','r4',60,MWF,'15:30',[['Jasmine Nelson','Mother']],[['Andre Nelson','Uncle',true,'']],[['Andre Nelson','Uncle']],none,'tp3',0],
    ['Mateo','Rivera','Male','r4',53,TTH,'15:45',[['Sofia Rivera','Mother'],['Carlos Rivera','Father']],[],[['Lucia Rivera','Grandmother']],none,'tp4',0]
  ];
  const notArrivedToday=['c6','c10','c18'];
  const colors=['peach','sky','mint','yellow','lav','coral'];
  const roomStaff={r1:'s2',r2:'s4',r3:'s5',r4:'s6'};
  const plan=id=>d.tuitionPlans.find(p=>p.id===id);

  defs.forEach((x,i)=>{
    const [first,last,gender,room,ageM,schedule,pickupT,parents,extra,emerg,health,planId,discount]=x;
    const id='c'+(i+1);
    const dob=addDays(addMonths(T,-ageM),-Math.floor(R()*25));
    let enroll=addMonths(T,-(2+Math.floor(R()*14))); const minE=addDays(dob,80); if(enroll<minE) enroll=minE;
    const p=plan(planId);
    const nextDue = p.frequency==='Monthly' ? addMonths(T.slice(0,8)+'01',1) : addDays(mondayOf(T),7);
    d.children.push({id,first,last,dob,gender,enrollDate:enroll,classroomId:room,status:'Enrolled',schedule,usualPickup:pickupT,color:colors[i%colors.length],photo:'',

    parents.forEach(([n,rel],j)=>{
      const ph=phone();

    emerg.forEach(([n,rel])=>d.guardians.push({id:uid('g'),childId:id,name:n,relationship:rel,phone:phone()}));
    d.healthRecords.push({id:uid('h'),childId:id,...health,immunizationDate:addMonths(T,-(1+Math.floor(R()*8)))});
    d.enrollments.push({id:uid('e'),childId:id,date:enroll,startDate:enroll,classroomId:room,planId,staffId:'s1',notes:'Enrollment packet complete'});

  const moodsW=['happy','happy','happy','good','good','good','okay','tired','upset'];
  const notesPool=['Enjoyed story time today.','Needed extra rest after lunch.','Participated well in outdoor activity.','Shared toys nicely with friends.',

  const mealS=()=>{const r=R(); return r<.62?'Ate well':r<.9?'Ate some':'Did not eat';};
  const authPick=cid=>{ const l=d.authorizedPickups.filter(a=>a.childId===cid&&a.authorized); return l[Math.floor(R()*l.length)]; };

  // staff attendance + child attendance/care, past 14 days and today
  for(let back=14; back>=0; back--){
    const day=addDays(T,-back); const wd=dow(day); if(wd===0||wd===6) continue;
    const isToday=back===0;
    d.staff.forEach((s,k)=>{
      const inT=toTime(mins('07:40')+k*5+Math.floor(R()*8));

      let outT=toTime(mins('16:00')+Math.floor(R()*110));

      const outM = done?pickM:NOW;
      const ok = m => m>inM && m<outM && (!isToday || m<=NOW);
      const tag=(o)=>({id:uid('x'),childId:c.id,date:day,staffId,...o});
      if(ok(mins('08:45'))) d.meals.push(tag({time:'08:45',meal:'Breakfast',status:mealS(),notes:''}));

      if(ok(mins('11:45'))) d.meals.push(tag({time:'11:45',meal:'Lunch',status:mealS(),notes:''}));
      if(ok(mins('15:15'))) d.meals.push(tag({time:'15:15',meal:'Afternoon snack',status:mealS(),notes:''}));
      const ns=mins('12:35')+Math.floor(R()*25), ne=ns+45+Math.floor(R()*55);
      if(ok(ns)) d.naps.push(tag({start:toTime(ns),end:(isToday&&ne>NOW)?'':toTime(Math.min(ne,outM)),notes:''}));
      const a1=pick(['Art','Music','Learning','Reading']), a2=pick(['Outdoor Play','Free Play','Group Activity']);
      if(ok(mins('09:40'))) d.activities.push(tag({time:'09:40',type:a1,notes:actNotes[a1]}));
      if(ok(mins('10:30'))) d.activities.push(tag({time:'10:30',type:a2,notes:actNotes[a2]}));
      if(ok(mins('15:45'))) d.activities.push(tag({time:'15:45',type:'Reading',notes:'Afternoon story circle'}));
      if(ok(mins('09:05'))) d.dailyCare.push(tag({time:'09:05',type:'mood',mood:pick(moodsW),note:''}));
      if(ok(mins('15:30'))){
        d.dailyCare.push(tag({time:'15:30',type:'mood',mood:pick(moodsW),note:''}));
        if(R()<.55) d.dailyCare.push(tag({time:'15:35',type:'note',mood:'',note:pick(notesPool)}));
      }
    });
  }
  if(NOW>=mins('10:15')){
    const e=d.attendance.find(a=>a.childId==='c1'&&a.date===T);
    if(e) d.dailyCare.push({id:uid('x'),childId:'c1',date:T,staffId:'s2',time:'10:15',type:'note',mood:'',note:'Emma loved the sensory bins this morning and shared scoops with Noah.'});
  }

  // incidents
  const lastWD=back=>{ let x=addDays(T,-back); while(dow(x)===0||dow(x)===6) x=addDays(x,-1); return x; };
  d.incidents.push(
    {id:uid('i'),childId:'c16',date:lastWD(9),time:'10:40',classroomId:'r3',staffIds:['s5'],type:'Minor Injury',what:'Scraped left knee on the playground path while running.',action:'Cleaned with water, applied bandage and ice pack for 5 minutes.',parentNotified:true,notifiedTime:'11:05',followUp:false,status:'Closed',createdBy:'s5'},
    {id:uid('i'),childId:'c6',date:lastWD(4),time:'14:10',classroomId:'r1',staffIds:['s2','s3'],type:'Behavior',what:'Bit a classmate on the arm during a disagreement over a toy. Skin not broken.',action:'Separated children, comforted both, redirected Jack to calm corner. Both families informed.',parentNotified:true,notifiedTime:'14:40',followUp:false,status:'Reviewed',createdBy:'s2'},
    {id:uid('i'),childId:'c9',date:lastWD(2),time:'13:20',classroomId:'r2',staffIds:['s4'],type:'Illness',what:'Woke from nap coughing and wheezing; temperature 100.8°F.',action:'Inhaler given per action plan, child rested in quiet area; parent picked up at 2:05 PM.',parentNotified:true,notifiedTime:'13:30',followUp:true,status:'Open',createdBy:'s4'}
  );

  // waitlist
  d.waitlist.push(
    {id:uid('w'),childName:'Zoe Carter',dob:addMonths(T,-16),parent:'Brianna Carter',phone:phone(),requestedStart:addMonths(T,1),preferredClassroomId:'r1',priority:'High',notes:'Sibling of former student',status:'Waiting',added:addDays(T,-20)},
    {id:uid('w'),childName:'Ethan Brooks',dob:addMonths(T,-40),parent:'Michelle Brooks',phone:phone(),requestedStart:addDays(T,14),preferredClassroomId:'r3',priority:'Normal',notes:'Needs full time, Mon–Fri',status:'Contacted',added:addDays(T,-12)},
    {id:uid('w'),childName:'Layla Hassan',dob:addMonths(T,-28),parent:'Omar Hassan',phone:phone(),requestedStart:addMonths(T,2),preferredClassroomId:'r2',priority:'Normal',notes:'Part time — Tue/Thu preferred',status:'Waiting',added:addDays(T,-6)},
    {id:uid('w'),childName:'Owen Foster',dob:addMonths(T,-9),parent:'Kate Foster',phone:phone(),requestedStart:addMonths(T,4),preferredClassroomId:'r1',priority:'Low',notes:'Will turn 1 before start date',status:'Waiting',added:addDays(T,-2)}
  );

  // tuition charges & payments
  const overdueKids=['c11','c19'], pendingKids=['c3','c8','c14','c17'];
  const terms=DEFAULTS.paymentTermsDays;
  d.children.forEach(c=>{
    const b=c.billing, p=plan(b.planId);
    let dates=[];
    if(b.frequency==='Monthly'){ const first=T.slice(0,8)+'01'; dates=[addMonths(first,-2),addMonths(first,-1),first]; }
    else { const m=mondayOf(T); dates=[addDays(m,-21),addDays(m,-14),addDays(m,-7),m]; }
    dates=dates.filter(x=>x>=c.enrollDate && x<=T);
    dates.forEach((dt,idx)=>{
      const base=p.kind==='daily'? b.rate*c.schedule.length : b.rate;
      const amount=Math.round(base*(1-(b.discount||0)/100)*100)/100;
      const ch={id:uid('ch'),childId:c.id,date:dt,dueDate:addDays(dt,terms),amount,description:`${p.name} tuition – ${b.frequency==='Monthly'?fmtDate(dt,{month:'long',year:'numeric'}):'week of '+fmtDate(dt,{month:'short',day:'numeric'})}`,kind:'tuition'};
      d.charges.push(ch);
      const isLast=idx===dates.length-1, isSecondLast=idx===dates.length-2;
      let paid=true;
      if(overdueKids.includes(c.id) && (isLast||isSecondLast)) paid=false;
      if(pendingKids.includes(c.id) && isLast) paid=false;
      if(isLast && ch.dueDate>T && R()<.35) paid=false;
      if(paid){
        let pd=addDays(dt,Math.floor(R()*4)); if(pd>T) pd=T;
        const par=d.parents.find(x=>x.childId===c.id);
        d.payments.push({id:uid('pay'),childId:c.id,date:pd,parentName:par?par.name:'',amount,method:pick(['Card','Card','Bank Transfer','Bank Transfer','Cash']),reference:'R-'+(10000+Math.floor(R()*89999)),notes:''});
      }
    });
    if(overdueKids.includes(c.id)){ // late fee on the oldest unpaid charge
      const unpaid=d.charges.filter(x=>x.childId===c.id).slice(-2)[0];
      if(unpaid && unpaid.dueDate<T) d.charges.push({id:uid('ch'),childId:c.id,date:addDays(unpaid.dueDate,1),dueDate:addDays(unpaid.dueDate,1),amount:b.lateFee,description:'Late fee',kind:'late'});
    }
  });
  return d;
}

const byId = (k,id) => db[k].find(x=>x.id===id);

const room = id => byId('classrooms',id);
const staffBy = id => byId('staff',id);
const cname = c => c ? `${c.first} ${c.last}` : 'Unknown child';
const staffName = id => (staffBy(id)||{}).name || '—';
const roomName = id => (room(id)||{}).name || 'Unassigned';
const currentStaff = () => staffBy(db.settings.currentStaffId) || db.staff.find(s=>s.status==='Active') || db.staff[0] || null;
const curStaffId = () => (currentStaff()||{}).id || '';
const activeChildren = () => db.children.filter(c=>c.status==='Enrolled');
const sortByName = (a,b) => cname(a).localeCompare(cname(b));
const round2 = n => Math.round((Number(n)||0)*100)/100;
const sum = (arr,f) => arr.reduce((t,x)=>t+(Number(f?f(x):x)||0),0);

function attRecs(cid,date){ return db.attendance.filter(a=>a.childId===cid&&a.date===date); }
function lastAtt(cid,date){ date=date||todayStr();
  const l=attRecs(cid,date).filter(a=>!a.absent&&a.inTime).sort((a,b)=>a.inTime.localeCompare(b.inTime)); return l[l.length-1]||null; }
function firstAtt(cid,date){ const l=attRecs(cid,date).filter(a=>!a.absent&&a.inTime).sort((a,b)=>a.inTime.localeCompare(b.inTime)); return l[0]||null; }
function isExpected(c,date){ date=date||todayStr(); return c.status==='Enrolled' && (c.schedule||[]).includes(dow(date)) && (c.enrollDate||'')<=date; }
function childStatus(c,date){ date=date||todayStr();
  const a=lastAtt(c.id,date); if(a) return a.outTime?'out':'present';
  if(attRecs(c.id,date).some(x=>x.absent)) return 'absent';
  return isExpected(c,date)?'expected':'off'; }
const STATUS_META = {
  present:{label:'Present',chip:'green',dot:'green',em:'🟢'},
  out:{label:'Checked out',chip:'peach',dot:'amber',em:'🏠'},
  expected:{label:'Not arrived',chip:'gray',dot:'gray',em:'⚪'},
  absent:{label:'Absent',chip:'lav',dot:'blue',em:'🟣'},
  off:{label:'Not scheduled',chip:'gray',dot:'gray',em:'·'}
};
function presentRecs(date){ date=date||todayStr(); return db.attendance.filter(a=>a.date===date&&!a.absent&&a.inTime&&!a.outTime&&child(a.childId)); }
function presentInRoom(rid){ return presentRecs().filter(a=>a.classroomId===rid); }
function staffOnDutyRec(sid,date){ date=date||todayStr(); return db.staffAttendance.find(r=>r.staffId===sid&&r.date===date&&r.in&&!r.out)||null; }
const isOnDuty = sid => !!staffOnDutyRec(sid);
const onDutyStaff = () => db.staff.filter(s=>isOnDuty(s.id));
const roomAssigned = rid => db.staff.filter(s=>s.classroomId===rid&&s.status==='Active');
const roomOnDuty = rid => roomAssigned(rid).filter(s=>isOnDuty(s.id));
function roomOcc(r){ const present=presentInRoom(r.id).length, cap=Number(r.capacity)||0; const pct=cap?present/cap*100:0;
  const near=Number(db.settings.nearCapacityPct)||85;
  return {present,cap,pct,level: cap&&present>=cap?'full':pct>=near?'near':'ok'}; }
function roomRatio(r){ const kids=presentInRoom(r.id).length, staff=roomOnDuty(r.id).length, th=Number(r.threshold)||0;
  const ratio=staff?kids/staff:(kids?Infinity:0);
  return {kids,staff,ratio,threshold:th,attention: kids>0 && (staff===0 || (th>0 && ratio>th))}; }
const ratioText = x => x.staff? (Math.round(x.ratio*10)/10)+' children / staff' : (x.kids? 'No staff on duty':'—');
const enrolledIn = rid => activeChildren().filter(c=>c.classroomId===rid);

/* health */
function health(cid){ return db.healthRecords.find(h=>h.childId===cid) || {allergies:'',dietary:'',notes:'',medication:'',immunization:''}; }
function healthAlerts(cid){
  const h=health(cid), out=[];
  if(h.allergies) out.push({level:'red',short:'Allergy',text:`Allergy: ${h.allergies}`});
  if(h.medication) out.push({level:'red',short:'Medication',text:`Medication: ${h.medication}`});
  if(h.dietary) out.push({level:'yellow',short:'Diet',text:`Dietary restriction: ${h.dietary}`});
  if(h.notes) out.push({level:'yellow',short:'Health note',text:`Health note: ${h.notes}`});
  if(!h.allergies&&!h.medication&&!h.dietary) out.push({level:'green',short:'No known allergy',text:'No known allergies'});
  return out;
}
const hasRedAlert = cid => healthAlerts(cid).some(a=>a.level==='red');
function alertsHTML(cid, compact){
  return healthAlerts(cid).filter(a=>!compact||a.level!=='green').map(a=>{
    const em=a.level==='red'?'🔴':a.level==='yellow'?'🟡':'🟢';
    return `<div class="health-alert ${a.level}" role="note"><span aria-hidden="true">${em}</span><span>${esc(a.text)}</span></div>`;
  }).join('');
}
function flagsHTML(cid){
  const h=health(cid); let s='';
  if(h.allergies) s+=`<span class="flag red" title="${esc(h.allergies)}">ALLERGY</span>`;
  if(h.medication) s+=`<span class="flag red" title="${esc(h.medication)}">MED</span>`;
  if(h.dietary) s+=`<span class="flag yellow" title="${esc(h.dietary)}">DIET</span>`;
  if(h.notes) s+=`<span class="flag yellow" title="${esc(h.notes)}">NOTE</span>`;
  return s;
}
function immunChip(v){ const m={'Up to date':'green','Due soon':'yellow','Overdue':'red'}; return v?`<span class="chip ${m[v]||'gray'}">${esc(v)}</span>`:'<span class="chip gray">Not recorded</span>'; }

/* billing */
function planBy(id){ return byId('tuitionPlans',id); }
function chargeAmountFor(c){ const b=c.billing; if(!b) return 0; const p=planBy(b.planId);
  const base=(p&&p.kind==='daily')? Number(b.rate)*(c.schedule||[]).length : Number(b.rate);
  return round2(base*(1-(Number(b.discount)||0)/100)); }
function account(cid){
  const T=todayStr();
  const charges=db.charges.filter(x=>x.childId===cid).sort((a,b)=>a.date.localeCompare(b.date));
  const pays=db.payments.filter(x=>x.childId===cid);
  const paid=round2(sum(pays,p=>p.amount));
  let remaining=paid;
  const rows=charges.map(ch=>{ const cover=Math.min(remaining,Number(ch.amount)); remaining=round2(remaining-cover);
    const open=round2(Number(ch.amount)-cover); const st=open<=0.004?'Paid':(ch.dueDate<T?'Overdue':'Pending'); return {...ch,open,st}; });
  const billed=round2(sum(charges,c=>c.amount));
  const balance=round2(billed-paid);
  const overdue=round2(sum(rows.filter(r=>r.st==='Overdue'),r=>r.open));
  const status= balance<=0.004?'Paid': overdue>0?'Overdue':'Pending';
  return {rows,billed,paid,balance,overdue,status,pays};
}

  });
  db.meals.filter(m=>m.childId===cid&&m.date===date).forEach(m=>ev.push({t:m.time,kind:'meal',ic:'🍎',bg:'var(--yellow-soft)',title:`${m.meal} · ${m.status}`,text:m.notes,rec:m,coll:'meals'}));
  db.naps.filter(n=>n.childId===cid&&n.date===date).forEach(n=>{ const d=n.end?mins(n.end)-mins(n.start):null;
    ev.push({t:n.start,kind:'nap',ic:'😴',bg:'var(--sky-soft)',title:n.end?`Nap · ${fmtTime(n.start)} – ${fmtTime(n.end)} · ${fmtDur(d)}`:`Napping since ${fmtTime(n.start)}`,text:n.notes,rec:n,coll:'naps'}); });
  db.activities.filter(a=>a.childId===cid&&a.date===date).forEach(a=>ev.push({t:a.time,kind:'activity',ic:ACT_EMOJI[a.type]||'⭐',bg:'var(--lav-soft)',title:a.type,text:a.notes,rec:a,coll:'activities'}));
  db.dailyCare.filter(x=>x.childId===cid&&x.date===date).forEach(x=>{
    if(x.type==='mood'){ const m=MOODS[x.mood]||MOODS.okay; ev.push({t:x.time,kind:'mood',ic:m.e,bg:'#FFF7ED',title:`Mood · ${m.l}`,text:x.note,rec:x,coll:'dailyCare'}); }
    else ev.push({t:x.time,kind:'note',ic:'📝',bg:'var(--coral-soft)',title:'Teacher note',text:x.note,rec:x,coll:'dailyCare'});

  db.incidents.filter(i=>i.childId===cid&&i.date===date).forEach(i=>ev.push({t:i.time,kind:'incident',ic:'🩹',bg:'var(--red-soft)',title:`Incident · ${i.type}`,text:i.what,rec:i,coll:'incidents'}));
  return ev.sort((a,b)=>(a.t||'').localeCompare(b.t||''));
}

/* ---------------- form builder ---------------- */
function optionsHTML(opts,val){ return opts.map(o=>{ const [v,l]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(l)}</option>`; }).join(''); }
function fieldHTML(f){
  if(f.type==='section') return `<div class="form-section">${esc(f.label)}</div>`;
  if(f.type==='html') return `<div class="field full">${f.html}</div>`;
  const id='f_'+f.name, v=f.value??'', req=f.required?'required aria-required="true"':'';
  const lbl=`${esc(f.label)}${f.required?' <span aria-hidden="true" style="color:var(--red)">*</span>':''}`;
  let input='';
  const common=`id="${id}" name="${esc(f.name)}" ${req} aria-describedby="err_${id}${f.hint?' hint_'+id:''}" ${f.readonly?'readonly':''}`;
  switch(f.type){
    case 'select': input=`<select ${common}>${f.placeholder?`<option value="">${esc(f.placeholder)}</option>`:''}${optionsHTML(f.options||[],v)}</select>`; break;
    case 'textarea': input=`<textarea ${common} rows="${f.rows||3}" placeholder="${esc(f.placeholder||'')}" maxlength="${f.max||2000}">${esc(v)}</textarea>`; break;
    case 'checkbox': return `<div class="field ${f.full?'full':''}"><label class="check"><input type="checkbox" id="${id}" name="${esc(f.name)}" ${v?'checked':''}> ${esc(f.label)}</label>${f.hint?`<small id="hint_${id}">${esc(f.hint)}</small>`:''}<div class="err" id="err_${id}"></div></div>`;
    case 'days': input=`<div class="days" role="group" aria-label="${esc(f.label)}">${[1,2,3,4,5,6,0].map(d=>`<input type="checkbox" id="${id}_${d}" name="${esc(f.name)}" value="${d}" ${(v||[]).includes(d)?'checked':''}><label for="${id}_${d}">${DAY_SHORT[d]}</label>`).join('')}</div>`;
      return `<div class="field ${f.full?'full':''}"><span class="flabel">${lbl}</span>${input}<div class="err" id="err_${id}"></div></div>`;
    case 'multi': input=`<div class="kid-picker" role="group" aria-label="${esc(f.label)}">${(f.options||[]).map(([ov,ol],k)=>`<input type="checkbox" id="${id}_${k}" name="${esc(f.name)}" value="${esc(ov)}" ${(v||[]).includes(ov)?'checked':''}><label for="${id}_${k}">${ol}</label>`).join('')||'<span class="muted small">None available</span>'}</div>`;
      return `<div class="field ${f.full?'full':''}"><span class="flabel">${lbl}</span>${input}${f.hint?`<small>${esc(f.hint)}</small>`:''}<div class="err" id="err_${id}"></div></div>`;
    case 'seg': input=`<div class="seg" role="radiogroup" aria-label="${esc(f.label)}">${(f.options||[]).map((o,k)=>{ const [ov,ol]=Array.isArray(o)?o:[o,o]; return `<input type="radio" id="${id}_${k}" name="${esc(f.name)}" value="${esc(ov)}" ${String(ov)===String(v)?'checked':''}><label for="${id}_${k}">${ol}</label>`; }).join('')}</div>`;
      return `<div class="field ${f.full?'full':''}"><span class="flabel">${lbl}</span>${input}<div class="err" id="err_${id}"></div></div>`;
    case 'mood': input=`<div class="mood-pick" role="radiogroup" aria-label="${esc(f.label)}">${Object.entries(MOODS).map(([k,m])=>`<label><input type="radio" name="${esc(f.name)}" value="${k}" ${k===v?'checked':''}><span class="em" aria-hidden="true">${m.e}</span>${m.l}</label>`).join('')}</div>`;
      return `<div class="field full"><span class="flabel">${lbl}</span>${input}<div class="err" id="err_${id}"></div></div>`;
    case 'image': input=`<input type="file" accept="image/*" ${common}>${v?`<div class="row" style="margin-top:6px"><img src="${esc(v)}" alt="Current image" style="width:56px;height:56px;border-radius:12px;object-fit:cover"><label class="check"><input type="checkbox" name="${esc(f.name)}__remove"> Remove current image</label></div>`:''}`; break;
    default: input=`<input type="${f.type||'text'}" ${common} value="${esc(v)}" placeholder="${esc(f.placeholder||'')}" ${f.min!=null?`min="${f.min}"`:''} ${f.maxv!=null?`max="${f.maxv}"`:''} ${f.step?`step="${f.step}"`:''} ${f.type==='text'||!f.type?`maxlength="${f.max||160}"`:''} ${f.autocomplete?`autocomplete="${f.autocomplete}"`:'autocomplete="off"'}>`;
  }
  return `<div class="field ${f.full?'full':''}"><label for="${id}">${lbl}</label>${input}${f.hint?`<small id="hint_${id}">${esc(f.hint)}</small>`:''}<div class="err" id="err_${id}"></div></div>`;
}
function formHTML(fields,id){ return `<form id="${id||'mform'}" class="form-grid" novalidate>${fields.map(fieldHTML).join('')}</form>`; }
function readForm(form,fields){
  const out={};
  fields.forEach(f=>{
    if(!f.name||f.type==='section'||f.type==='html') return;
    const els=$$(`[name="${CSS.escape(f.name)}"]`,form);
    if(f.type==='checkbox') out[f.name]=!!(els[0]&&els[0].checked);
    else if(f.type==='days') out[f.name]=els.filter(e=>e.checked).map(e=>Number(e.value));
    else if(f.type==='multi') out[f.name]=els.filter(e=>e.checked).map(e=>e.value);
    else if(f.type==='seg'||f.type==='mood'){ const c=els.find(e=>e.checked); out[f.name]=c?c.value:''; }
    else if(f.type==='number'){ const s=(els[0]&&els[0].value.trim())||''; out[f.name]=s===''?'':Number(s); }
    else if(f.type==='image'){ out[f.name]=els[0]&&els[0].files&&els[0].files[0]||null; const rm=$(`[name="${CSS.escape(f.name)}__remove"]`,form); out[f.name+'__remove']=!!(rm&&rm.checked); }
    else out[f.name]=els[0]?String(els[0].value).trim():'';
  });
  return out;
}
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const PHONE_RE=/^[0-9+()\-.\s]{7,20}$/;
function validateForm(form,fields,data){
  let firstBad=null; let ok=true;
  fields.forEach(f=>{
    if(!f.name||f.type==='section'||f.type==='html') return;
    const id='f_'+f.name, errEl=$('#err_'+CSS.escape(id),form); let msg='';
    const v=data[f.name];
    const empty = v===''||v==null||(Array.isArray(v)&&!v.length);
    if(f.required && empty) msg=f.type==='days'||f.type==='multi'?`Select at least one option.`:`${f.label} is required.`;
    else if(!empty && f.type==='email' && !EMAIL_RE.test(v)) msg='Enter a valid email address.';
    else if(!empty && f.type==='tel' && !PHONE_RE.test(v)) msg='Enter a valid phone number.';
    else if(!empty && f.type==='number' && (isNaN(v) || (f.min!=null&&v<f.min) || (f.maxv!=null&&v>f.maxv))) msg=`Enter a number${f.min!=null?' ≥ '+f.min:''}${f.maxv!=null?' and ≤ '+f.maxv:''}.`;
    else if(!empty && f.type==='date' && !isDate(v)) msg='Enter a valid date.';
    else if(!empty && f.type==='time' && !isTime(v)) msg='Enter a valid time.';
    if(!msg && f.validate) msg=f.validate(v,data)||'';
    const wrap=errEl&&errEl.closest('.field');
    if(errEl) errEl.textContent=msg;
    if(wrap) wrap.classList.toggle('invalid',!!msg);
    const inp=$('#'+CSS.escape(id),form)||$(`[name="${CSS.escape(f.name)}"]`,form);
    if(inp) inp.setAttribute('aria-invalid',msg?'true':'false');
    if(msg){ ok=false; if(!firstBad) firstBad=inp; }
  });
  if(firstBad) firstBad.focus();
  return ok;
}
function formModal({title,fields,submit,size,intro,onSave,danger}){
  openModal({title,size,body:`${intro||''}<div id="form-error" class="form-error" role="alert" hidden></div>${formHTML(fields)}`,
    foot:`${danger?`<button type="button" class="btn danger" id="mf-danger" style="margin-right:auto">${ic('trash')} ${esc(danger.label)}</button>`:''}<button type="button" class="btn" data-act="close-modal">Cancel</button><button type="submit" form="mform" class="btn primary">${esc(submit||'Save')}</button>`,
    onMount(m){
      const form=$('#mform',m);
      form.addEventListener('submit',async e=>{ e.preventDefault(); const data=readForm(form,fields);
        if(!validateForm(form,fields,data)) return;
        let res; try{ res=await onSave(data); }catch(err){ console.error(err); res='Something went wrong: '+err.message; }
        if(typeof res==='string'){ const fe=$('#form-error'); fe.textContent=res; fe.hidden=false; return; }
        if(res!==false) closeModal(); });
      if(danger) $('#mf-danger',m).onclick=danger.onClick;
    }});
}
function readImage(file,maxSize){
  return new Promise((resolve,reject)=>{
    if(!file) return resolve('');
    if(!/^image\//.test(file.type)) return reject(new Error('Please choose an image file.'));
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,(maxSize||200)/Math.max(img.width,img.height));
        const cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); resolve(cv.toDataURL('image/jpeg',.82)); };
      img.onerror=()=>reject(new Error('That image could not be read.')); img.src=fr.result; };
    fr.onerror=()=>reject(new Error('That file could not be read.')); fr.readAsDataURL(file);
  });
}
