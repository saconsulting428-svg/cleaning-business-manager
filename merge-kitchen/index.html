<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3B2314" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%94%3C/text%3E%3C/svg%3E" />
    <title>Merge Kitchen: Chef Empire</title>
    <style>
      /* #3B2314 mirrors theme.ink so there is no white flash before JS boots. */
      html, body { margin: 0; height: 100%; background: #3B2314; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      /* Safe-area aware shell: the canvas lives in #game, inside the padded #app */
      #app { box-sizing: border-box; position: fixed; inset: 0; display: flex;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      #game { flex: 1; min-width: 0; min-height: 0; }
      #game canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="app"><div id="game"></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
