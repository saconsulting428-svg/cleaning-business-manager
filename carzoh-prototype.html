    footer:`<button class="btn primary" ${!d.agree||clash||S.ui.sending?'disabled':''} onclick="sendRequest()">${S.ui.sending?'<span class="spin"></span> Sending':'Send request · '+rs(b.total)}</button>`});
});
function openDraftDates(){
  S.ui.dd = {start:S.draft.start, days:S.draft.days};
  openDates();
  // re-point apply button to the draft
  const orig = S.ui.sheetFn; S.ui.sheetFn = () => orig().replace(/S\.filters\.start=S\.ui\.dd\.start;S\.filters\.days=S\.ui\.dd\.days;/,'S.draft.start=S.ui.dd.start;S.draft.days=S.ui.dd.days;'); renderSheet();
}
function sendRequest(){
  if(!needNet()) return;
  S.ui.sending = true; rerender();
  later(()=>{
    const b = calc({...draftBooking(), id:genId(), state:'requested', created:now(), photosOut:{}, photosIn:{}, loc:{consent:false,on:false,last:null}, log:[], ratedByMe:false, extensions:0});
    delete b.agree; S.bookings.unshift(b); S.chats[b.id] = [{from:'sys', text:'Request sent. Chat with the owner here — phone numbers stay hidden.', t:now()}];
    notify('Request sent', `Waiting for ${ownerOf(car(b.carId)).first} to accept.`, 'renter', '#/booking/'+b.id);
    S.draft = null; replace('#/request-sent/'+b.id);
  }, 900);
}
route('request-sent', (id)=>{
  const b=bkg(id), c=car(b.carId), o=ownerOf(c);
  return page({hd:false, body:`<div class="state" style="padding-top:90px"><div class="ill" style="background:var(--teal-soft);width:110px;height:110px">${ic('send','xl')}</div><div class="h1">Request sent</div><p class="p muted">${o.first} usually responds ${o.resp}. We'll notify you as soon as they accept.</p>
    <div class="card" style="width:100%;text-align:left"><div class="row"><div class="mini-car carbg">${carImg(c)}</div><div class="grow"><div style="font-weight:600">${c.make} ${c.model}</div><div class="small muted">${fmtDT(b.start)}</div><div class="small muted">Rental ID ${b.id}</div></div></div></div>
    <div class="hint soft" style="margin-top:14px;text-align:left">${ic('info','sm')}<span>Nothing to pay now. You'll pay ${rs(b.total)} to ${o.first} at handover.</span></div></div>`,
    footer:`<button class="btn primary" onclick="replace('#/booking/${b.id}')">View booking</button><button class="btn ghost" onclick="go('#/home')">Back to home</button>`, cleanFt:true});
});

/* =========================================================
   10. TRIPS + BOOKING DETAIL
   ========================================================= */
const UPCOMING=['requested','confirmed','handover','review_condition'], PAST=['completed','declined','cancelled','disputed'];
function bookingRow(b, persp){
  const c=car(b.carId); const who = persp==='owner' ? renterOf(b).first : ownerOf(c).first;
  return `<button class="card tight row" style="width:100%;text-align:left;margin-bottom:10px" onclick="go('#/booking/${b.id}')"><div class="mini-car carbg">${carImg(c)}</div><div class="grow" style="min-width:0"><div style="font-weight:600" class="ell">${c.make} ${c.model}</div><div class="small muted ell">${fmtDate(b.start)} · ${b.type==='self'?b.days+' day'+(b.days>1?'s':''):'With driver'} · ${persp==='owner'?'Renter':'Owner'} ${who}</div><div style="margin-top:6px">${stateBadge(b.state)}</div></div>${ic('chev','sm')}</button>`;
}
route('trips', (tab='upcoming')=>{
  const mine = S.bookings.filter(b=>b.renter==='me');
  const lists = {upcoming:mine.filter(b=>UPCOMING.includes(b.state)), active:mine.filter(b=>b.state==='active'), past:mine.filter(b=>PAST.includes(b.state))};
  const L = lists[tab];
  let content;
  if(isLoading('trips', 500)) content = `<div class="sk" style="height:86px;margin-bottom:10px"></div>`.repeat(3);
  else content = L.length ? L.sort((a,b)=>tab==='past'?b.start-a.start:a.start-b.start).map(b=>bookingRow(b,'renter')).join('') :
    tab==='upcoming' ? stateBox('trips','No upcoming trips','Find a verified car and send your first request. Rs. 0 renter fee.','',`<button class="btn primary" onclick="go('#/search')">Find a car</button>`)
    : tab==='active' ? stateBox('key','No active trip','When you receive a car, your live trip shows here.') : stateBox('clock','No past trips yet','Completed, declined and cancelled trips appear here.');
  return page({title:'Trips', body:`<div class="seg" style="margin-bottom:16px">${[['upcoming','Upcoming'],['active','Active'],['past','Past']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="replace('#/trips/${k}')">${l}${lists[k].length?` (${lists[k].length})`:''}</button>`).join('')}</div>${content}`, nav:navBar('trips')});
});

function partyCard(b, persp){
  const c=car(b.carId);
  if(persp==='renter'){ const o=ownerOf(c); return `<div class="card tight row"><div class="avatar">${o.first[0]}</div><div class="grow"><div style="font-weight:600">${o.first} ${o.last[0]}. <span class="badge" style="margin-left:4px">${ic('shield','xs')} Verified</span></div><div class="small muted">${stars(o.rating)} · ${o.trips} rentals</div></div></div>${contactRow(b)}`; }
  return protectedRenter(b);
}
function contactRow(b){ return `<div class="btn-row" style="margin-top:10px"><button class="btn sm soft" onclick="go('#/chat/${b.id}')">${ic('chat','sm')} Chat</button><button class="btn sm soft" onclick="maskedCall('${b.id}')">${ic('phone','sm')} Call</button></div>`; }
function protectedRenter(b, full){
  const r = renterOf(b);
  if(full) return idCard(b);
  return `<div class="card tight"><div class="row"><div class="avatar cop">${r.first[0]}</div><div class="grow"><div style="font-weight:600">${r.first} <span class="muted small" style="font-weight:400">· surname hidden</span></div><div class="small muted">${stars(r.rating)} · ${r.rentals} completed rentals</div></div></div>
    <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">${verifiedBadges()}</div>
    <div class="hint" style="margin-top:10px;font-size:13px">${ic('eyeoff','sm')}<span>Full name and photo are shown only at handover and during the trip. CNIC images are never shared.</span></div></div>${contactRow(b)}`;
}
function tripKV(b){
  const c=car(b.carId);
  return `<div class="card"><div class="kv"><span class="k">Rental ID</span><b>${b.id}</b></div><div class="kv"><span class="k">Type</span><span style="text-align:right">${typeLabel(b)}</span></div><div class="kv"><span class="k">Start</span><span>${fmtDT(b.start)}</span></div><div class="kv"><span class="k">${b.type==='self'?'Return':'Ends'}</span><span>${fmtDT(b.end)}</span></div><div class="kv"><span class="k">Pickup</span><span style="text-align:right">${b.pickup==='owner'?c.area:'Delivery (arranged in chat)'}</span></div><div class="kv"><span class="k">Payment at handover</span><span>${PAY[b.pay]}</span></div></div>`;
}
function priceCard(b, persp){
  if(persp==='owner') return `<div class="card"><div class="kv"><span class="k">Renter pays you at handover</span><span class="money">${rs(b.total)}</span></div><div class="kv"><span class="k">Carzoh commission (10%)</span><span class="money">− ${rs(b.commission)}</span></div><div class="kv tot"><span>You earn</span><span class="money">${rs(b.net)}</span></div><div class="small muted" style="margin-top:6px">Commission is deducted from your Commission Wallet when the rental completes.</div></div>`;
  return `<div class="card"><div class="kv"><span class="k">${b.type==='self'?'Rental':'Driver package'}</span><span class="money">${rs(b.total)}</span></div><div class="kv"><span class="k">Renter fee</span><span style="color:var(--teal);font-weight:600">Rs. 0</span></div><div class="kv"><span class="k">Deposit</span><span style="color:var(--teal);font-weight:600">None</span></div><div class="kv tot"><span>Pay owner at handover</span><span class="money">${rs(b.total)}</span></div></div>`;
}
function bookingHeader(b){
  const c=car(b.carId);
  return `<div class="row" style="margin-bottom:14px"><div class="mini-car carbg" style="width:92px;height:64px">${carImg(c)}</div><div class="grow"><div class="h3" style="margin:0">${c.make} ${c.model}</div><div class="small muted">${c.year} · ${c.area}</div><div style="margin-top:6px">${stateBadge(b.state)}</div></div></div>`;
}
route('booking', (id)=>{
  const b=bkg(id); if(!b) return page({back:true, title:'Booking', body:stateBox('trips','Booking not found','It may have been removed.','err')});
  const persp = b.renter==='me' ? 'renter' : 'owner';
  if(persp==='owner' && b.state==='requested') return R['o/request'](id);
  if(b.state==='active') return R['active'](id);
  b.unread=false;
  const c=car(b.carId), o=ownerOf(c), r=renterOf(b);
  let top='', footer='';
  const demoBtn = (label, fn) => `<div class="demo-box"><div class="t">${ic('info','xs')} Demo · other side</div><button class="btn sm soft" style="width:100%" onclick="${fn}">${label}</button></div>`;
  if(persp==='renter'){
    switch(b.state){
      case 'requested': top = `<div class="card warn"><div class="row">${ic('clock')}<div class="grow"><div class="h3">Waiting for ${o.first}</div><div class="small">Owners usually reply ${o.resp}. If there's no reply in 12 hours, the request expires and nothing is charged.</div></div></div></div>${demoBtn('Simulate: owner accepts',`demo.ownerRespond('${b.id}',true)`)}`; footer=`<button class="btn danger" onclick="cancelBooking('${b.id}')">Cancel request</button>`; break;
      case 'declined': top = `<div class="card err"><div class="row">${ic('x')}<div class="grow"><div class="h3">${o.first} couldn't accept</div><div class="small">${b.declineReason||'The car isn’t available for these dates.'} Nothing was charged.</div></div></div></div>`; footer=`<button class="btn primary" onclick="S.filters.area='Any area';go('#/search')">Find similar cars</button>`; break;
      case 'confirmed': top = `<div class="card soft"><div class="row">${ic('check')}<div class="grow"><div class="h3">Booking confirmed</div><div class="small">Pickup ${fmtDT(b.start)} at ${b.pickup==='owner'?c.area:'your delivery spot'}. Exact location is in chat.</div></div></div></div>
          <div class="sec">At pickup</div><div class="card sand small" style="line-height:1.7">1. Tap <b>I've arrived</b> when you reach the car<br>2. ${o.first} checks your ID and takes 7 photos<br>3. You review the photos and pay ${o.first} ${rs(b.total)} by ${PAY[b.pay]}<br>4. Tap <b>Vehicle received</b> and drive</div>
          <button class="link" onclick="cancelBooking('${b.id}')" style="color:var(--error)">Cancel booking</button>`; footer=`<button class="btn primary" onclick="arrived('${b.id}')">${ic('pin','sm')} I've arrived</button>`; break;
      case 'handover': top = `<div class="card soft"><div class="row"><span class="spin tl"></span><div class="grow"><div class="h3">${o.first} is doing handover checks</div><div class="small">ID check and 7 car photos. Stay with the car — you'll review everything next.</div></div></div></div>${demoBtn('Simulate: owner completes handover',`demo.ownerHandover('${b.id}')`)}`; break;
      case 'review_condition': top = `<div class="card warn"><div class="row">${ic('camera')}<div class="grow"><div class="h3">Review the car's condition</div><div class="small">${o.first} uploaded 7 photos, mileage and fuel. Check them against the car before you pay.</div></div></div></div>`; footer=`<button class="btn primary" onclick="go('#/review-condition/${b.id}')">Review condition</button>`; break;
      case 'completed': top = `<div class="card soft"><div class="row">${ic('check')}<div class="grow"><div class="h3">Trip completed</div><div class="small">Returned ${fmtDT(b.returnedAt||b.end)}${b.kmDriven?` · ${b.kmDriven} km driven`:''}</div></div></div></div>`; footer = b.ratedByMe?'':`<button class="btn primary" onclick="go('#/rate/${b.id}')">Rate ${o.first}</button>`; break;
      case 'cancelled': top = `<div class="card sand"><div class="h3">Cancelled</div><div class="small muted">${b.cancelNote||'You cancelled this booking. Nothing was charged.'}</div></div>`; break;
      case 'disputed': top = `<div class="card err"><div class="row">${ic('flag')}<div class="grow"><div class="h3">Damage reported</div><div class="small">Carzoh support is reviewing before/after photos from both sides. We'll mediate; Carzoh doesn't pay for damage.</div></div></div></div><button class="btn sm soft" style="width:100%;margin-top:10px" onclick="go('#/dispute/${b.id}')">View dispute</button>`; break;
    }
  } else {
    switch(b.state){
      case 'confirmed': top = `<div class="card soft"><div class="row">${ic('clock')}<div class="grow"><div class="h3">Handover ${fmtDT(b.start)}</div><div class="small">${r.first} will tap "I've arrived" at the car. Then verify identity and take 7 photos.</div></div></div></div>${demoBtn('Simulate: renter arrived',`arrived('${b.id}')`)}`; footer=`<button class="btn danger" onclick="cancelBooking('${b.id}')">Cancel booking</button>`; break;
      case 'handover': top = `<div class="card warn"><div class="row">${ic('pin')}<div class="grow"><div class="h3">${r.first} has arrived</div><div class="small">Verify their identity before handing over the keys.</div></div></div></div>`; footer=`<button class="btn primary" onclick="go('#/handover/${b.id}')">Verify renter & start handover</button>`; break;
      case 'review_condition': top = `<div class="card soft"><div class="row"><span class="spin tl"></span><div class="grow"><div class="h3">Waiting for ${r.first}</div><div class="small">They're reviewing your photos and paying ${rs(b.total)} by ${PAY[b.pay]}. Don't hand over keys until you've received payment.</div></div></div></div>${demoBtn('Simulate: renter confirms & pays',`received('${b.id}')`)}`; break;
      case 'completed': top = `<div class="card soft"><div class="row">${ic('check')}<div class="grow"><div class="h3">Rental completed</div><div class="small">Commission ${rs(b.commission)} deducted from your wallet. ${r.first}'s identity is hidden again.</div></div></div></div>`; footer = b.ratedByMe?'':`<button class="btn primary" onclick="go('#/rate/${b.id}')">Rate ${r.first}</button>`; break;
      case 'declined': top = `<div class="card sand"><div class="h3">You declined this request</div><div class="small muted">${b.declineReason||''}</div></div>`; break;
      case 'cancelled': top = `<div class="card sand"><div class="h3">Cancelled</div><div class="small muted">${b.cancelNote||''}</div></div>`; break;
      case 'disputed': top = `<div class="card err"><div class="h3">Dispute open</div><div class="small">Support is reviewing photos from both sides.</div></div><button class="btn sm soft" style="width:100%;margin-top:10px" onclick="go('#/dispute/${b.id}')">View dispute</button>`; break;
    }
  }
  const showFull = persp==='owner' && ['handover','review_condition'].includes(b.state);
  return page({back:true, backTo: persp==='owner'?'#/o/requests':'#/trips', title:'Booking '+b.id, body:`${bookingHeader(b)}${top}
    <div class="sec">${persp==='renter'?'Owner':'Renter'}</div>${persp==='renter'?partyCard(b,'renter'):(showFull?idCard(b,true)+contactRow(b):protectedRenter(b))}
    <div class="sec">Trip</div>${tripKV(b)}
    <div class="sec">Price</div>${priceCard(b, persp)}
    ${b.state==='completed'||b.state==='disputed'?`<div class="sec">Handover records</div><button class="card tight row" style="width:100%" onclick="go('#/compare/${b.id}')">${ic('camera')}<span class="grow" style="text-align:left">Before / after photos</span>${ic('chev','sm')}</button>`:''}
    <button class="link" onclick="go('#/support/new/${b.id}')">${ic('help','sm')} Get help with this booking</button>`, footer});
});

/* =========================================================
   11. STATE TRANSITIONS
   ========================================================= */
function accept(id){
  const b=bkg(id); if(!needNet()) return false;
  if(b.owner==='me' && !canAccept(b)){ openTopup(shortfall(b)); return false; }
  b.state='confirmed'; b.acceptedAt=now();
  notify('Booking confirmed', `${b.owner==='me'?'You':ownerOf(car(b.carId)).first} accepted ${b.id}. Pickup ${fmtDT(b.start)}.`, b.renter==='me'?'renter':'owner', '#/booking/'+b.id);
  if(b.renter==='me') b.unread=true;
  // decline other overlapping requests on same car
  return true;
}
function decline(id, reason){ const b=bkg(id); b.state='declined'; b.declineReason=reason; notify('Request declined', `${b.id}: ${reason}`, b.renter==='me'?'renter':'owner', '#/booking/'+b.id); }
function cancelBooking(id){
  const b=bkg(id), persp=b.renter==='me'?'renter':'owner';
  confirmSheet(b.state==='requested'?'Cancel request?':'Cancel booking?', persp==='renter' ? (b.state==='requested'?'The owner will be told you no longer need the car. Nothing is charged.':'Free cancellation up to 6 hours before pickup. Frequent late cancellations lower your trust level.') : 'Cancelling confirmed bookings affects your owner rating. The renter will be notified right away.', b.state==='requested'?'Cancel request':'Cancel booking', ()=>{ if(!needNet()) return; b.state='cancelled'; b.cancelNote = persp==='renter'?'You cancelled. Nothing was charged.':'You cancelled this booking.'; notify('Booking cancelled', b.id+' was cancelled.', persp, '#/booking/'+b.id); toast('Booking cancelled'); rerender(); }, true);
}
function arrived(id){ const b=bkg(id); if(!needNet()) return; b.state='handover'; b.arrivedAt=now(); notify('Renter has arrived', `${renterOf(b).first} is at the pickup point for ${b.id}.`, 'owner', '#/booking/'+b.id); toast(b.renter==='me'?`${ownerOf(car(b.carId)).first} has been notified`:'Renter arrived'); rerender(); }
function handedOver(id){ const b=bkg(id); b.state='review_condition'; b.handedAt=now(); notify('Review car condition', `${ownerOf(car(b.carId)).first} uploaded handover photos for ${b.id}.`, 'renter', '#/review-condition/'+b.id); }
function received(id){ const b=bkg(id); if(!needNet()) return; b.state='active'; b.startedAt=now(); b.paid=true; notify('Trip started', `${b.id} is now active. Return by ${fmtDT(b.end)}.`, 'any', '#/active/'+b.id); toast('Vehicle received. Trip started.'); if(CUR.name==='booking') rerender(); }
function completeRental(id){
  const b=bkg(id); b.state='completed'; b.returnedAt=now();
  if(b.owner==='me'){ S.wallet.balance -= b.commission; S.wallet.history.unshift({t:now(), type:'commission', amt:-b.commission, note:`Commission · ${b.id} · ${car(b.carId).model}`}); S.earnings.gross += b.total; S.earnings.commission += b.commission; }
  if(b.renter==='me'){ S.user.rentals++; }
  b.loc.on=false;
  notify('Rental completed', `${b.id} is complete.${b.owner==='me'?` Commission ${rs(b.commission)} deducted from wallet.`:''}`, 'any', '#/booking/'+b.id);
}
function maskedCall(id){
  const b=bkg(id), persp=b.renter==='me'?'renter':'owner'; const name = persp==='renter'?ownerOf(car(b.carId)).first:renterOf(b).first;
  S.ui.call='connecting';
  openSheet(()=>`<div class="center" style="padding:16px 0 8px"><div class="avatar lg" style="margin:0 auto 12px">${name[0]}</div><div class="h2">${S.ui.call==='connecting'?'Connecting…':'Calling '+name}</div><div class="muted small" style="margin-bottom:14px">via Carzoh masked line · ${b.id}</div><div class="hint soft" style="text-align:left;margin-bottom:16px">${ic('lock','sm')}<span>Neither of you sees the other's number. Calls work only while the booking is open.</span></div><button class="btn danger" onclick="closeSheet()">${ic('phone','sm')} End call</button></div>`);
  later(()=>{ if(S.ui.sheetFn){ S.ui.call='ringing'; renderSheet(); } }, 1200);
}

/* =========================================================
   12. HANDOVER (owner identity check, photos, renter review)
   ========================================================= */
function idCard(b, compact){
  const r=renterOf(b);
  const wm = Array.from({length:40},()=>`<span>${b.id}</span>`).join('');
  return `<div class="idcard"><div class="wmark">${wm}</div><div style="padding:16px;position:relative">
    <div class="row" style="align-items:flex-start;gap:14px"><div class="face" style="width:${compact?84:110}px;height:${compact?98:128}px;margin:0">${facePortrait(r.first)}</div>
    <div class="grow"><div class="small muted">Full name</div><div class="h2" style="margin:0 0 4px">${r.first} ${r.last}</div><div class="small">${stars(r.rating)} · ${r.rentals} rentals</div><div class="row" style="flex-wrap:wrap;gap:4px;margin-top:8px"><span class="badge">${ic('shield','xs')} CNIC verified</span><span class="badge">${ic('id','xs')} Licence</span></div></div></div>
    <div class="row small" style="margin-top:12px;gap:8px;color:var(--muted)">${ic('eyeoff','sm')}<span>Screenshots are blocked · Rental ID ${b.id}</span></div></div></div>`;
}
route('handover', (id)=>{
  const b=bkg(id), r=renterOf(b);
  if(b.state!=='handover') return R.booking(id);
  return page({back:true, backTo:'#/booking/'+id, title:'Verify renter', body:`
    <div class="small muted" style="margin-bottom:8px">Step 1 of 2 · Identity check</div>
    ${idCard(b)}
    <div class="hint soft" style="margin-top:12px">${ic('shield','sm')}<span>Carzoh verified ${r.first}'s CNIC with NADRA and matched it to their selfie. You won't see CNIC images.</span></div>
    <div class="sec">Face match check</div>
    <div class="card sand"><div class="h3">Is the person in front of you ${r.first}?</div><div class="small muted">Compare their face with the photo above. Ask them to remove sunglasses or mask.</div>
    <div class="col" style="margin-top:12px"><div class="radio ${b.faceMatch===true?'on':''}" onclick="bkg('${id}').faceMatch=true;rerender()"><span class="rd"></span>Yes, it's the same person</div><div class="radio ${b.faceMatch===false?'on':''}" onclick="bkg('${id}').faceMatch=false;rerender()"><span class="rd"></span>No, it doesn't match</div></div></div>
    ${b.faceMatch===false?`<div class="hint err" style="margin-top:12px">${ic('alert','sm')}<div><b>Don't hand over the car.</b> Cancel the handover and report it. Carzoh support will contact both of you.</div></div>`:''}`,
    footer: b.faceMatch===false ? `<button class="btn danger" onclick="faceMismatch('${id}')">Cancel handover & report</button>` : `<button class="btn primary" ${b.faceMatch?'':'disabled'} onclick="go('#/photos/${id}/out')">Continue to car photos</button>`});
});
function faceMismatch(id){ const b=bkg(id); b.state='cancelled'; b.cancelNote='Handover stopped: renter did not match their verified photo. Reported to support.'; S.tickets.unshift({id:'T-'+(1100+S.tickets.length), subject:'Identity mismatch at handover · '+id, status:'Open', t:now(), booking:id}); toast('Reported to Carzoh support'); go('#/booking/'+id); }

const FUEL = ['E','1/4','1/2','3/4','F'];
route('photos', (id, phase='out')=>{
  const b=bkg(id), c=car(b.carId), P = phase==='out'?b.photosOut:b.photosIn;
  const mk = phase==='out'?'mileageOut':'mileageIn', fk = phase==='out'?'fuelOut':'fuelIn';
  const done = SLOTS.filter(([k])=>P[k]).length;
  const milErr = phase==='in' && b[mk] && b.mileageOut && +b[mk] < +b.mileageOut ? `Must be at least ${b.mileageOut} km (handover reading)` : '';
  const ready = done===7 && b[mk] && b[fk] && !milErr;
  window.__shot = (k) => pickPhoto(u=>{ P[k]=u; rerender(); });
  window.__fillAll = () => { SLOTS.forEach(([k])=>{ if(!P[k]) P[k]=samplePhoto({...c, odo: phase==='out'?c.odo:c.odo+ (b.days*120)}, k); }); if(!b[mk]) b[mk] = phase==='out'?c.odo:c.odo+b.days*120+37; if(!b[fk]) b[fk] = phase==='out'?'3/4':'1/2'; rerender(); };
  return page({back:true, backTo: phase==='out'?'#/handover/'+id:'#/active/'+id, title: phase==='out'?'Handover photos':'Return photos', body:`
    <div class="small muted" style="margin-bottom:8px">${phase==='out'?'Step 2 of 2 · ':''}${done} of 7 photos</div>
    <div class="steps-bar">${SLOTS.map(([k])=>`<i class="${P[k]?'on':''}"></i>`).join('')}</div>
    <p class="p small muted">Walk around the car in daylight. Capture scratches and dents up close. These photos protect both of you.</p>
    <div class="pgrid">${SLOTS.map(([k,l])=>`<button class="pslot ${P[k]?'done':''}" onclick="__shot('${k}')">${P[k]?`<img src="${P[k]}" alt="${l}"><span class="ok">${ic('check','xs')}</span><span class="cap">${l}</span>`:`${ic('camera')}<span>${l}</span>`}</button>`).join('')}<button class="pslot" style="border-style:solid;background:#fff" onclick="__fillAll()">${ic('grid')}<span>Fill with samples<br>(demo)</span></button></div>
    <div class="sec">Odometer & fuel</div>
    <div class="fld"><label class="lbl" for="mil">Mileage (km)</label><input id="mil" class="inp ${milErr?'err':''}" inputmode="numeric" placeholder="${phase==='in'&&b.mileageOut?'At least '+b.mileageOut:'e.g. '+c.odo}" value="${b[mk]||''}" onchange="bkg('${id}').${mk}=this.value.replace(/\\D/g,'');rerender()">${milErr?`<div class="err-t">${ic('alert','xs')} ${milErr}</div>`:''}</div>
    <label class="lbl">Fuel level</label><div class="fuel">${FUEL.map(f=>`<button class="${b[fk]===f?'on':''}" onclick="bkg('${id}').${fk}='${f}';rerender()">${f}</button>`).join('')}</div>
    ${phase==='out'?`<div class="hint" style="margin-top:16px">${ic('info','sm')}<span>After you tap "Vehicle handed over", ${renterOf(b).first} reviews these photos and pays you ${rs(b.total)} by ${PAY[b.pay]}.</span></div>`:''}`,
    footer: phase==='out' ? `<button class="btn primary" ${ready?'':'disabled'} onclick="handedOver('${id}');go('#/booking/${id}')">${ic('key','sm')} Vehicle handed over</button>` : `<button class="btn primary" ${ready?'':'disabled'} onclick="go('#/compare/${id}')">Compare with handover</button>`});
});

route('review-condition', (id)=>{
  const b=bkg(id), c=car(b.carId), o=ownerOf(c);
  if(b.state!=='review_condition') return R.booking(id);
  const step = S.ui.rcStep || 1;
  if(step===1) return page({back:true, backTo:'#/booking/'+id, title:'Review condition', body:`
    <div class="small muted" style="margin-bottom:8px">Step 1 of 2 · Compare these with the car in front of you</div>
    <div class="pgrid">${SLOTS.map(([k,l])=>`<div class="pslot done" style="cursor:default">${b.photosOut[k]?`<img src="${b.photosOut[k]}" alt="${l}">`:''}<span class="cap">${l}</span></div>`).join('')}</div>
    <div class="card sand" style="margin-top:12px"><div class="kv"><span class="k">Mileage at handover</span><b>${(+b.mileageOut).toLocaleString()} km</b></div><div class="kv"><span class="k">Fuel</span><b>${b.fuelOut}</b></div></div>
    ${b.preNote?`<div class="hint warn" style="margin-top:12px">${ic('flag','sm')}<span>Your note: "${esc(b.preNote)}" — saved to the handover record.</span></div>`:''}
    <button class="link" onclick="preNote('${id}')">${ic('flag','sm')} Something's not right? Add a note before driving</button>`,
    footer:`<button class="btn primary" onclick="S.ui.rcStep=2;rerender()">Condition matches</button>`});
  const paidOk = S.ui.paid;
  return page({back:false, title:'Pay & receive', right:`<button class="link" onclick="S.ui.rcStep=1;rerender()">Back</button>`, body:`
    <div class="small muted" style="margin-bottom:8px">Step 2 of 2 · Pay the owner directly</div>
    <div class="gcard"><div class="small muted">Pay ${o.first} now</div><div style="font-size:32px;font-weight:700" class="money">${rs(b.total)}</div><div class="small muted">Renter fee Rs. 0 · no deposit · Carzoh doesn't collect this</div></div>
    <div class="sec">Payment method</div>
    ${Object.entries(PAY).map(([k,l])=>`<div class="radio ${b.pay===k?'on':''}" onclick="bkg('${id}').pay='${k}';rerender()"><span class="rd"></span>${ic(PAY_IC[k],'sm')}<span class="grow">${l}</span></div>`).join('')}
    ${b.pay!=='cash'?`<div class="hint small" style="margin-bottom:8px">${ic('info','sm')}<span>${o.first} will show you their ${PAY[b.pay]} account in person. Never send money before you're at the car.</span></div>`:''}
    <label class="check"><input type="checkbox" ${paidOk?'checked':''} onchange="S.ui.paid=this.checked;rerender()"><span class="bx"></span><span>I've paid ${o.first} ${rs(b.total)} by ${PAY[b.pay]} and I have the keys</span></label>`,
    footer:`<button class="btn primary" ${paidOk?'':'disabled'} onclick="received('${id}');go('#/active/${id}')">${ic('key','sm')} Vehicle received</button>`});
});
function preNote(id){
  openSheet(()=>`${sheetHead('Add a note')}<p class="small muted">Describe anything missing from the photos (e.g. a scratch on the rear bumper). It's saved with timestamps to the handover record and shared with the owner.</p><textarea id="pn" class="inp" placeholder="What did you notice?">${esc(bkg(id).preNote||'')}</textarea><div class="gap16"></div><button class="btn primary" onclick="bkg('${id}').preNote=$('#pn').value.trim();closeSheet();toast('Note saved to handover record');rerender()">Save note</button>`);
}

/* =========================================================
   13. ACTIVE TRIP (renter + owner views)
   ========================================================= */
function mapSVG(on){
  return `<svg viewBox="0 0 330 170" preserveAspectRatio="xMidYMid slice"><rect width="330" height="170" fill="#EAF1EE"/>
  <path d="M0 120 C80 100 120 140 200 110 S300 60 330 70" stroke="#fff" stroke-width="14" fill="none"/><path d="M60 0 L90 170" stroke="#fff" stroke-width="10"/><path d="M220 0 L190 170" stroke="#fff" stroke-width="8"/><path d="M0 40 L330 55" stroke="#fff" stroke-width="7"/>
  <rect x="110" y="62" width="50" height="34" rx="6" fill="#D6E6DF"/><rect x="240" y="88" width="60" height="40" rx="6" fill="#D6E6DF"/><rect x="18" y="58" width="34" height="44" rx="6" fill="#D6E6DF"/>
  <text x="235" y="40" font-family="Outfit,sans-serif" font-size="11" fill="#6A7774">Gulberg III</text><text x="10" y="150" font-family="Outfit,sans-serif" font-size="11" fill="#6A7774">Model Town</text>
  ${on?`<circle cx="168" cy="112" r="22" fill="#0F5C57" opacity=".15"/><circle cx="168" cy="112" r="8" fill="#0F5C57" stroke="#fff" stroke-width="3"/>`:`<rect width="330" height="170" fill="rgba(255,255,255,.55)"/>`}</svg>`;
}
route('active', (id)=>{
  const b=bkg(id); if(!b) return R.notfound();
  if(b.state!=='active') return R.booking(id);
  const c=car(b.carId), persp=b.renter==='me'?'renter':'owner', o=ownerOf(c), r=renterOf(b);
  const left = b.end - now(), late = left<0;
  every(()=>{ const el=$('#cd'); if(el){ const l=b.end-now(); el.textContent = dur(Math.abs(l)); } }, 1000);
  const locCard = persp==='renter'
    ? (!b.loc.consent ? `<div class="card warn"><div class="row" style="align-items:flex-start">${ic('pin')}<div class="grow"><div class="h3">Share your location during this trip?</div><div class="small">${o.first} sees your phone's last shared location only while this trip is active. It stops automatically when the trip ends.</div></div></div><button class="btn sm secondary" style="width:100%;margin-top:12px" onclick="locConsent('${id}')">Review & allow</button></div>`
      : `<div class="card"><div class="row sb"><div><div class="h3" style="margin:0">Location sharing</div><div class="small muted">${b.loc.on?'Last shared '+ago(b.loc.last):'Off · '+o.first+' is notified'}</div></div><button class="toggle ${b.loc.on?'on':''}" aria-label="Location sharing" onclick="toggleLoc('${id}')"></button></div><div class="map" style="margin-top:12px">${mapSVG(b.loc.on)}</div><div class="small muted" style="margin-top:8px">Your phone's location, shared only during this trip.</div></div>`)
    : `<div class="card"><div class="row sb"><div><div class="h3" style="margin:0">Renter location</div><div class="small muted">${!b.loc.consent?'Renter hasn’t enabled sharing yet':b.loc.on?'From renter’s phone · last shared '+ago(b.loc.last):'Sharing turned off by renter · last seen '+(b.loc.last?ago(b.loc.last):'never')}</div></div>${b.loc.on?`<span class="badge ok">Live</span>`:`<span class="badge sand">Off</span>`}</div><div class="map" style="margin-top:12px">${mapSVG(b.loc.on)}</div>${b.loc.on && now()-b.loc.last>30*60000?`<div class="hint warn small" style="margin-top:8px">${ic('alert','sm')}<span>No update for ${ago(b.loc.last).replace(' ago','')}. The renter's phone may be offline.</span></div>`:''}</div>`;
  const act = (icn,l,fn,cls='') => `<button class="card tight ${cls}" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;font-size:14px;font-weight:500;min-height:84px;justify-content:center" onclick="${fn}">${ic(icn)}${l}</button>`;
  return page({back:true, backTo: persp==='renter'?'#/trips/active':'#/o/home', title:'Trip '+b.id, body:`
    ${late?`<div class="hint err" style="margin-bottom:12px">${ic('alert','sm')}<div><b>${persp==='renter'?'You’re late':'Trip ended '+dur(-left)+' ago. '+r.first+' is late.'}</b><br>${persp==='renter'?'Return now or request an extension. '+o.first+' has been notified.':'Contact the renter. If you can’t reach them, contact support.'}</div></div>`:''}
    <div class="gcard"><div class="row sb"><span class="small muted">${late?'Overdue by':'Time left'}</span><span class="badge white">${ic('key','xs')} On trip</span></div><div class="count" id="cd" style="margin:6px 0 4px">${dur(Math.abs(left))}</div><div class="small muted">${b.type==='self'?'Return':'Ends'} ${fmtDT(b.end)} · ${c.make} ${c.model}</div></div>
    <div class="sec">${persp==='renter'?'Owner':'Renter (visible during trip)'}</div>
    ${persp==='renter'?`<div class="card tight row"><div class="avatar">${o.first[0]}</div><div class="grow"><b>${o.first} ${o.last[0]}.</b><div class="small muted">${c.area}</div></div></div>`:idCard(b,true)}
    <div class="sec">Location</div>${locCard}
    <div class="sec">Quick actions</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${persp==='renter'?act('plus','Extend',`openExtend('${id}')`):act('flag','Report',`go('#/support/new/${id}')`)}${act('chat','Chat',`go('#/chat/${id}')`)}${act('phone','Call',`maskedCall('${id}')`)}${act('sos','Emergency',`openEmergency('${id}')`)}${persp==='renter'?act('alert','Accident',`go('#/accident/${id}')`):act('help','Support',`go('#/support')`)}${act('file','Details',`openTripDetails('${id}')`)}</div>
    <div class="gap16"></div>`,
    footer: `<button class="btn primary" onclick="go('#/photos/${id}/in')">${persp==='renter'?'Return car':'Receive car back'}</button>`});
});
function openTripDetails(id){ const b=bkg(id); openSheet(()=>`${sheetHead('Trip details')}${tripKV(b)}<div class="gap8"></div>${priceCard(b, b.renter==='me'?'renter':'owner')}`); }
function locConsent(id){
  openSheet(()=>`${sheetHead('Share location during trip')}<div class="col small" style="gap:12px;margin-bottom:16px">
    <div class="row" style="align-items:flex-start">${ic('mobile','sm')}<span>Uses <b>your phone's location</b>, only while this trip is active.</span></div>
    <div class="row" style="align-items:flex-start">${ic('eye','sm')}<span>The owner sees your last shared location and time. Nobody else.</span></div>
    <div class="row" style="align-items:flex-start">${ic('clock','sm')}<span>Stops automatically when you return the car. You can pause it, and the owner is told.</span></div></div>
    <button class="btn primary" onclick="const b=bkg('${id}');b.loc.consent=true;b.loc.on=true;b.loc.last=now();closeSheet();toast('Location sharing on');rerender()">Allow while on trip</button><button class="btn ghost" onclick="closeSheet()">Not now</button>`);
}
function toggleLoc(id){ const b=bkg(id); b.loc.on=!b.loc.on; if(b.loc.on) b.loc.last=now(); toast(b.loc.on?'Location sharing on':'Location sharing paused. Owner notified.'); rerender(); }
function openExtend(id){
  const b=bkg(id), c=car(b.carId); S.ui.ext = S.ui.ext || 1;
  openSheet(()=>{ const n=S.ui.ext; const unit = b.type==='self'?'day':'hr'; const price = b.type==='self'? c.price*n : c.driver.extra*n; const newEnd = b.end + (b.type==='self'?n*DAY:n*HOUR); const clash = overlaps(b.carId, b.end, newEnd, b.id);
    return `${sheetHead('Extend trip')}<div class="row sb"><span>Add ${unit}s</span><div class="stepper"><button ${n<=1?'disabled':''} onclick="S.ui.ext--;renderSheet()">−</button><span>${n} ${unit}${n>1?'s':''}</span><button onclick="S.ui.ext++;renderSheet()">+</button></div></div>
    <div class="card sand" style="margin-top:14px"><div class="kv"><span class="k">New return</span><b>${fmtDT(newEnd)}</b></div><div class="kv"><span class="k">Extra to pay owner</span><b class="money">${rs(price)}</b></div><div class="kv"><span class="k">Renter fee</span><b style="color:var(--teal)">Rs. 0</b></div></div>
    ${clash?`<div class="hint err" style="margin-top:12px">${ic('alert','sm')}<span>The car is booked right after your trip. Return on time.</span></div>`:''}
    <div class="gap16"></div><button class="btn primary" ${clash||S.ui.extSending?'disabled':''} onclick="sendExtend('${id}')">${S.ui.extSending?'<span class="spin"></span> Waiting for owner':'Request extension'}</button>`; });
}
function sendExtend(id){ if(!needNet()) return; const b=bkg(id); S.ui.extSending=true; renderSheet(); later(()=>{ const n=S.ui.ext; if(b.type==='self'){ b.days+=n; } else { b.extraHrs+=n; } calc(b); b.extensions++; S.ui.extSending=false; S.ui.ext=1; closeSheet(); toast(`${ownerOf(car(b.carId)).first} approved. New return ${fmtDT(b.end)}`); rerender(); }, 1400); }
function openEmergency(id){
  openSheet(()=>`${sheetHead('Emergency')}<p class="small muted" style="margin-top:0">If anyone is hurt, call 1122 first.</p>
    <a class="list-item" href="tel:15" style="text-decoration:none;color:inherit"><div class="ico" style="color:var(--error);background:var(--error-soft)">${ic('shield')}</div><div class="grow"><b>Police · 15</b><div class="small muted">Theft, threat or road incident</div></div>${ic('phone','sm')}</a>
    <a class="list-item" href="tel:1122" style="text-decoration:none;color:inherit"><div class="ico" style="color:var(--error);background:var(--error-soft)">${ic('sos')}</div><div class="grow"><b>Rescue · 1122</b><div class="small muted">Injury, fire or medical help</div></div>${ic('phone','sm')}</a>
    <button class="list-item" onclick="closeSheet();toast('Connecting to Carzoh support…')"><div class="ico">${ic('help')}</div><div class="grow"><b>Carzoh support</b><div class="small muted">24/7 in-app call · shares Rental ID ${id}</div></div>${ic('chev','sm')}</button>
    <button class="list-item" onclick="closeSheet();go('#/accident/${id}')"><div class="ico">${ic('alert')}</div><div class="grow"><b>Report an accident</b><div class="small muted">Document what happened with photos</div></div>${ic('chev','sm')}</button>`);
}
route('accident', (id)=>{
  const b=bkg(id); const u=S.ui; u.acc = u.acc || {type:'', desc:'', photos:[], safe:false};
  window.__accShot = () => pickPhoto(x=>{ S.ui.acc.photos.push(x); rerender(); });
  return page({back:true, backTo:'#/active/'+id, title:'Report accident', body:`
    <div class="hint err">${ic('sos','sm')}<div><b>Safety first.</b> If anyone is injured call <a href="tel:1122">1122</a>. For police call <a href="tel:15">15</a>.</div></div>
    <label class="check"><input type="checkbox" ${u.acc.safe?'checked':''} onchange="S.ui.acc.safe=this.checked;rerender()"><span class="bx"></span><span>I'm safe and the car is parked in a safe place</span></label>
    <label class="lbl" style="margin-top:8px">What happened?</label>
    <div class="chips" style="flex-wrap:wrap;margin-bottom:14px">${['Minor scratch/dent','Collision with vehicle','Breakdown','Flat tyre','Theft or break-in','Other'].map(t=>`<button class="chip ${u.acc.type===t?'on':''}" onclick="S.ui.acc.type='${t}';rerender()">${t}</button>`).join('')}</div>
    <div class="fld"><label class="lbl">Details</label><textarea class="inp" placeholder="Where and how did it happen?" oninput="S.ui.acc.desc=this.value">${esc(u.acc.desc)}</textarea></div>
    <label class="lbl">Photos</label><div class="pgrid">${u.acc.photos.map(p=>`<div class="pslot done"><img src="${p}"></div>`).join('')}<button class="pslot" onclick="__accShot()">${ic('camera')}<span>Add photo</span></button><button class="pslot" onclick="S.ui.acc.photos.push(samplePhoto(car(bkg('${id}').carId),'left'));rerender()">${ic('grid')}<span>Sample (demo)</span></button></div>
    <div class="hint" style="margin-top:14px">${ic('info','sm')}<span>Carzoh records this report and helps both sides resolve it. Carzoh doesn't pay for damage or repairs; settlement is between owner and renter.</span></div>`,
    footer:`<button class="btn primary" ${u.acc.safe&&u.acc.type?'':'disabled'} onclick="submitAccident('${id}')">Notify owner & support</button>`});
});
function submitAccident(id){ if(!needNet()) return; const a=S.ui.acc; S.tickets.unshift({id:'T-'+(1100+S.tickets.length), subject:`Accident report · ${a.type} · ${id}`, status:'Open', t:now(), booking:id}); notify('Accident reported', `${a.type} on ${id}. Support will call you shortly.`, 'any', '#/support'); toast('Owner and Carzoh support notified'); go('#/active/'+id); }

/* =========================================================
   14. RETURN: COMPARE, COMPLETE, DISPUTE, RATE
   ========================================================= */
route('compare', (id)=>{
  const b=bkg(id), c=car(b.carId); const fin = ['completed','disputed'].includes(b.state);
  const km = b.mileageIn && b.mileageOut ? b.mileageIn - b.mileageOut : 0;
  const fuelDrop = FUEL.indexOf(b.fuelIn) < FUEL.indexOf(b.fuelOut);
  const choice = S.ui.dmg;
  return page({back:true, backTo: fin?'#/booking/'+id:'#/photos/'+id+'/in', title: fin?'Before / after':'Compare condition', body:`
    <div class="card sand"><div class="kv"><span class="k">Distance driven</span><b>${km.toLocaleString()} km</b></div><div class="kv"><span class="k">Fuel</span><b>${b.fuelOut||'–'} → ${b.fuelIn||'–'}</b></div>${fuelDrop?`<div class="hint warn small" style="margin-top:6px">${ic('fuel','sm')}<span>Fuel is lower than at handover. Settle the top-up in person.</span></div>`:''}</div>
    <div class="sec">Photos</div><div class="cmp-h"><span>Handover</span><span>Return</span></div>
    ${SLOTS.map(([k,l])=>`<div class="small" style="font-weight:600;margin-bottom:4px">${l}</div><div class="cmp"><div class="pslot done">${b.photosOut[k]?`<img src="${b.photosOut[k]}">`:''}</div><div class="pslot done">${b.photosIn[k]?`<img src="${b.photosIn[k]}">`:''}</div></div>`).join('')}
    ${fin?'':`<div class="sec">Any new damage?</div>
    <div class="radio ${choice==='no'?'on':''}" onclick="S.ui.dmg='no';rerender()"><span class="rd"></span><div><b>No new damage</b><div class="small muted">Complete the rental</div></div></div>
    <div class="radio ${choice==='yes'?'on':''}" onclick="S.ui.dmg='yes';rerender()"><span class="rd"></span><div><b>Report damage</b><div class="small muted">Opens a dispute with photos from both sides</div></div></div>
    ${choice==='yes'?`<div class="fld" style="margin-top:8px"><label class="lbl">Where is the damage?</label><div class="chips" style="flex-wrap:wrap">${SLOTS.map(([k,l])=>`<button class="chip ${(S.ui.dslots||[]).includes(k)?'on':''}" onclick="S.ui.dslots=(S.ui.dslots||[]);S.ui.dslots.includes('${k}')?S.ui.dslots.splice(S.ui.dslots.indexOf('${k}'),1):S.ui.dslots.push('${k}');rerender()">${l}</button>`).join('')}</div></div><div class="fld"><label class="lbl">Describe it</label><textarea class="inp" id="dd" placeholder="e.g. New dent on rear left door">${esc(S.ui.ddesc||'')}</textarea></div><div class="hint small">${ic('info','sm')}<span>Carzoh support mediates using timestamped photos. Carzoh doesn't pay for repairs.</span></div>`:''}`}`,
    footer: fin ? '' : choice==='yes' ? `<button class="btn primary" ${(S.ui.dslots||[]).length?'':'disabled'} onclick="S.ui.ddesc=$('#dd').value;openDispute('${id}')">Open dispute</button>` : `<button class="btn primary" ${choice==='no'?'':'disabled'} onclick="if(needNet()){completeRental('${id}');go('#/complete/${id}')}">Complete rental</button>`});
});
function openDispute(id){
  if(!needNet()) return; const b=bkg(id); b.state='disputed'; b.returnedAt=now(); b.loc.on=false;
  b.dispute = {slots:[...S.ui.dslots], desc:S.ui.ddesc||'', opened:now(), status:'Under review', by: b.renter==='me'?'renter':'owner'};
  S.tickets.unshift({id:'T-'+(1100+S.tickets.length), subject:'Damage dispute · '+id, status:'Under review', t:now(), booking:id});
  notify('Dispute opened', `Support is reviewing ${id}. Expect a call within 24 hours.`, 'any', '#/dispute/'+id);
  go('#/dispute/'+id);
}
route('complete', (id)=>{
  const b=bkg(id), persp=b.renter==='me'?'renter':'owner', other = persp==='renter'?ownerOf(car(b.carId)).first:renterOf(b).first;
  return page({hd:false, body:`<div class="state" style="padding-top:70px"><div class="ill" style="background:var(--teal-soft);width:110px;height:110px">${ic('check','xl')}</div><div class="h1">Rental complete</div><p class="p muted">${persp==='owner'?'Thanks for sharing your car.':'Thanks for driving with Carzoh.'}</p></div>
    <div class="card">${persp==='owner'?`<div class="kv"><span class="k">You received</span><b class="money">${rs(b.total)}</b></div><div class="kv"><span class="k">Commission deducted</span><b class="money">− ${rs(b.commission)}</b></div><div class="kv"><span class="k">Wallet balance now</span><b class="money">${rs(S.wallet.balance)}</b></div>`:`<div class="kv"><span class="k">Paid to ${other}</span><b class="money">${rs(b.total)}</b></div><div class="kv"><span class="k">Renter fee</span><b style="color:var(--teal)">Rs. 0</b></div><div class="kv"><span class="k">Completed rentals</span><b>${S.user.rentals}</b></div>`}</div>
    <div class="hint soft" style="margin-top:12px">${ic('eyeoff','sm')}<span>${persp==='owner'?`${other}'s full name and photo are hidden again.`:'Your full name and photo are hidden from the owner again.'} Location sharing has stopped.</span></div>`,
    footer:`<button class="btn primary" onclick="replace('#/rate/${id}')">Rate ${other}</button><button class="btn ghost" onclick="go(homePath())">Later</button>`, cleanFt:true});
});
route('rate', (id)=>{
  const b=bkg(id), persp=b.renter==='me'?'renter':'owner', other = persp==='renter'?ownerOf(car(b.carId)).first:renterOf(b).first;
  const u=S.ui; u.rs = u.rs||0; u.tags = u.tags||new Set();
  const tags = persp==='renter' ? ['On time','Car as described','Clean','Friendly','Smooth handover'] : ['On time','Careful driver','Returned clean','Good communication','Same fuel level'];
  if(b.ratedByMe) return page({back:true, title:'Rate', body:stateBox('star','Thanks for rating','Your review helps everyone rent with confidence.','',`<button class="btn primary" onclick="go(homePath())">Done</button>`)});
  return page({back:true, backTo:'#/booking/'+id, title:'Rate '+other, body:`<div class="center" style="padding:10px 0 4px"><div class="avatar lg" style="margin:0 auto 10px">${other[0]}</div><div class="h2">How was ${persp==='renter'?'your trip with '+other:other+' as a renter'}?</div><div class="small muted">Both sides rate each other. Reviews appear after both submit or in 7 days.</div></div>
    <div class="stars" style="margin:14px 0">${[1,2,3,4,5].map(i=>`<button class="${i<=u.rs?'on':''}" aria-label="${i} stars" onclick="S.ui.rs=${i};rerender()">${ic('star')}</button>`).join('')}</div>
    <div class="chips" style="flex-wrap:wrap;justify-content:center;margin-bottom:16px">${tags.map(t=>`<button class="chip ${u.tags.has(t)?'on':''}" onclick="S.ui.tags.has('${t}')?S.ui.tags.delete('${t}'):S.ui.tags.add('${t}');rerender()">${t}</button>`).join('')}</div>
    <textarea class="inp" id="rv" placeholder="Share more (optional)" oninput="S.ui.rvt=this.value">${esc(u.rvt||'')}</textarea>`,
    footer:`<button class="btn primary" ${u.rs?'':'disabled'} onclick="submitRating('${id}')">Submit rating</button>`});
});
function submitRating(id){ const b=bkg(id), u=S.ui; b.ratedByMe=true; const persp=b.renter==='me'?'renter':'owner'; const other = persp==='renter'?ownerOf(car(b.carId)).first+'’s '+car(b.carId).model:renterOf(b).first+' (renter)';
  S.reviews.byMe.unshift({to:other, r:u.rs, t:(u.rvt||[...u.tags].join(', ')||'No comment'), d:MON[new Date(now()).getMonth()]+' 2026'});
  if(persp==='renter') S.reviews.aboutMe.unshift({by:ownerOf(car(b.carId)).first+' (owner)', r:5, t:'Careful driver, returned on time.', d:MON[new Date(now()).getMonth()]+' 2026'});
  toast('Thanks! Rating submitted'); go(persp==='owner'?'#/o/home':'#/trips/past'); }

/* =========================================================
   15. INBOX, CHAT, NOTIFICATIONS, REVIEWS, SUPPORT, DISPUTE
   ========================================================= */
function maskText(t){
  const e = esc(t);
  return e.replace(/(\+?\d[\d\s-]{6,}\d)/g, m=>`<span class="blurred">${m}</span>`).replace(/([\w.]+@[\w.]+\.\w+)/g, m=>`<span class="blurred">${m}</span>`);
}
function hasContact(t){ return /\+?\d[\d\s-]{6,}\d/.test(t) || /[\w.]+@[\w.]+\.\w+/.test(t) || /whats\s?app/i.test(t); }
route('inbox', ()=>{
  const persp = S.role; const list = S.bookings.filter(b=> S.chats[b.id] && (persp==='renter'? b.renter==='me' : b.owner==='me'));
  let content;
  if(isLoading('inbox', 450)) content = `<div class="sk" style="height:64px;margin-bottom:10px"></div>`.repeat(3);
  else content = list.length ? list.map(b=>{ const c=car(b.carId); const msgs=S.chats[b.id]; const last=msgs[msgs.length-1]; const who = persp==='renter'?ownerOf(c).first+' '+ownerOf(c).last[0]+'.':renterOf(b).first;
    return `<button class="list-item" onclick="go('#/chat/${b.id}')"><div class="avatar ${persp==='owner'?'cop':''}">${who[0]}</div><div class="grow" style="min-width:0"><div class="row sb"><b class="ell">${who}</b><span class="small muted">${ago(last.t)}</span></div><div class="small muted ell">${c.make} ${c.model} · ${b.id}</div><div class="small ell">${last.from==='me'?'You: ':''}${maskText(last.text)}</div></div></button>`; }).join('')
    : stateBox('chat','No messages yet','Chats open when you send or receive a booking request.');
  return page({title:'Inbox', body:`<div class="hint soft small" style="margin-bottom:8px">${ic('lock','sm')}<span>Phone numbers are hidden. Chat and calls stay inside Carzoh.</span></div>${content}`, nav: navBar(S.role==='owner'?'':'inbox'), right:`<button class="icon-btn" onclick="go('#/notifications')">${ic('bell')}</button>`});
});
route('chat', (id)=>{
  const b=bkg(id); const c=car(b.carId); const persp = b.renter==='me'?'renter':'owner'; const who = persp==='renter'?ownerOf(c).first:renterOf(b).first;
  const msgs = S.chats[id] || (S.chats[id]=[]);
  after(()=>{ const bd=$('#view .bd'); bd.scrollTop = bd.scrollHeight; const inp=$('#ci'); inp && inp.addEventListener('keydown', e=>{ if(e.key==='Enter') sendMsg(id); }); });
  const closed = ['completed','cancelled','declined'].includes(b.state);
  return `<div class="pg"><div class="hd"><button class="icon-btn" onclick="back('#/inbox')">${ic('back')}</button><div class="avatar ${persp==='owner'?'cop':''}" style="width:40px;height:40px;font-size:16px">${who[0]}</div><div class="grow" style="min-width:0"><div style="font-weight:600">${who}</div><div class="small muted ell">${c.model} · ${b.id}</div></div><button class="icon-btn" onclick="maskedCall('${id}')" aria-label="Call">${ic('phone')}</button></div>

  let b = S.bookings.find(pred); if(b) return b.id;

  b = calc({id:genId(), carId:c.id, renter: persp==='renter'?'me':'bilal', owner: persp==='renter'?c.owner:'me', type:'self', days:2, start: state==='requested'||state==='confirmed'||state==='declined'||state==='cancelled' ? now()+DAY : now()-HOUR*2, pay:'cash', state, created:now()-HOUR, photosOut:{}, photosIn:{}, extraHrs:0, loc:{consent:false,on:false,last:null}, log:[], ratedByMe:false, extensions:0, renterFee:0, pickup:'owner'});
  if(['review_condition','active','completed','disputed'].includes(state)){ SLOTS.forEach(([k])=>b.photosOut[k]=samplePhoto(c,k)); b.mileageOut=c.odo; b.fuelOut='3/4'; b.faceMatch=true; }

  if(state==='declined') b.declineReason='Not available on these dates';

  return b.id;
}

  <div class="grp"><b>Role</b><div class="dbtns"><button class="${S.role==='renter'?'on':''}" onclick="demo.role('renter')">Renter</button><button class="${S.role==='owner'?'on':''}" onclick="demo.role('owner')">Owner</button></div></div>
  <div class="grp"><b>KYC (you)</b><div class="dbtns"><button onclick="demo.kyc('verified')">Approve</button><button onclick="demo.kyc('rejected')">Reject</button><button onclick="demo.kyc('pending')">Set pending</button><button onclick="S.user.kyc.status='none';rerender()">Unverified</button></div></div>
  <div class="grp"><b>Car verification</b><div class="dbtns"><button onclick="demo.car(null,true)">Approve latest car</button><button onclick="demo.car(null,false)">Reject latest car</button></div></div>
  <div class="grp"><b>Latest request (owner side)</b><div class="dbtns"><button onclick="demo.latestRequest(true)">Accept</button><button onclick="demo.latestRequest(false)">Decline</button></div></div>
  <div class="grp"><b>Time</b><div class="dbtns"><button onclick="demo.time(HOUR)">+1 hr</button><button onclick="demo.time(DAY)">+1 day</button><button onclick="demo.time(-S.offset)">Reset time</button></div></div>
  <div class="grp"><b>Network</b><div class="dbtns"><button class="${S.offline?'on':''}" onclick="demo.offline()">${S.offline?'Offline (tap to go online)':'Go offline'}</button></div></div>
  <div class="grp"><b>Wallet balance</b><div class="row" style="gap:6px"><input class="inp" id="dw" inputmode="numeric" value="${S.wallet.balance}"><button class="btn sm soft" style="min-height:40px" onclick="demo.wallet($('#dw').value)">Set</button></div></div>
  <div class="grp"><b>Renter trust level</b><div class="dbtns"><button class="${!isTrusted()?'on':''}" onclick="demo.trust(false)">New (1 rental)</button><button class="${isTrusted()?'on':''}" onclick="demo.trust(true)">Trusted (5, 4.8)</button></div></div>
  <div class="grp"><b>Jump to screen</b><div class="jump">${JUMPS.map(([g,items],gi)=>`<div class="jg">${g}</div>${items.map(([l],ii)=>`<button onclick="jump(${gi},${ii})">${l}</button>`).join('')}`).join('')}</div></div>
  <div class="grp"><div class="dbtns"><button onclick="demo.reset()" style="color:var(--error)">Reset everything</button><button onclick="go('#/admin')">Open admin</button></div></div>`;
}
function jump(g,i){ closeSheet(true); if(document.body.classList.contains('mobile')) closeDemo(); JUMPS[g][1][i][1](); }

/* =========================================================
   21. BOOT
   ========================================================= */
seed();
checkMobile();
if(!location.hash.startsWith('#/')) { try{ history.replaceState(null,'','#/splash'); }catch(e){ location.hash='#/splash'; } }
render();
setInterval(()=>{ const t=$('#sbTime'); if(t) t.textContent = fmtTime(now()).replace(/ (am|pm)/,''); }, 15000);
</script>
</body>
</html>
