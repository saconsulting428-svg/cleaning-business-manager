<div class="stage" id="app-stage">
  <aside class="stage-side">

      <div><b>GAARI</b><span lang="ur">گاڑی</span></div>
    </div>
    <h1 class="ss-title">Pakistan’s trusted car rental marketplace.</h1>
    <p class="ss-sub">Apni car se kamao. Kisi ki bhi car rent karo. Verified people, verified cars, a digital handover and Rs. 0 platform fee for renters.</p>

      <main id="screen" class="screen" aria-live="polite"></main>
      <nav id="bottomnav" class="bottomnav" aria-label="Main"></nav>
    </div>
  </div>
</div>

<div id="admin-root" hidden></div>

<button id="demo-fab" class="demo-fab" aria-label="Open demo controls"><span>DEMO MODE</span><b>renter</b></button>
